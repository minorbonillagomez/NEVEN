name: NEVEN Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The CMake project lives in src/; the workflow runs from the repository root.
  SOURCE_DIR: src
  BUILD_DIR: src/Build

jobs:
  # --- Unit Tests (no R/Julia needed) ---
  unit-tests:
    name: Unit Tests (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Release]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Configure CMake
      run: cmake -S ${{ env.SOURCE_DIR }} -B ${{ env.BUILD_DIR }} -A x64 -DBUILD_TESTS=ON -DSKIP_LANGUAGE_TARGETS=ON

    - name: Build Core + Tests
      run: |
        cmake --build ${{ env.BUILD_DIR }} --config ${{ matrix.config }} --target NEVEN_Core --parallel
        cmake --build ${{ env.BUILD_DIR }} --config ${{ matrix.config }} --target rj2xcl_tests --parallel
        cmake --build ${{ env.BUILD_DIR }} --config ${{ matrix.config }} --target mock_engine_backend --parallel

    - name: Run Unit Tests
      working-directory: ${{ env.BUILD_DIR }}
      run: |
        ctest --output-on-failure -C ${{ matrix.config }} --timeout 120

    - name: Test Results Summary
      if: always()
      run: |
        echo "::notice::NEVEN unit tests completed for ${{ matrix.config }}"

  # --- Owned build (runs on master only) ---
  # Builds every target NEVEN itself owns. The language engines (R, Julia,
  # Python) are deliberately absent: NEVEN provides the connections to all
  # three, and the user chooses which ones to install. Installing them in CI
  # would assert that they ship with NEVEN, which is the opposite of the
  # intended contract. The engine bridges (ControlR, ControlJulia,
  # ControlPython) are therefore not built here; their compilation against the
  # real SDKs belongs to a job that declares which engine it is testing.
  owned-build:
    name: Build NEVEN targets (Release)
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: unit-tests

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Configure CMake
      run: cmake -S ${{ env.SOURCE_DIR }} -B ${{ env.BUILD_DIR }} -A x64 -DSKIP_LANGUAGE_TARGETS=ON

    - name: Build
      run: cmake --build ${{ env.BUILD_DIR }} --config Release --parallel

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NEVEN-${{ github.sha }}
        path: |
          ${{ env.BUILD_DIR }}/Core/Release/NEVEN64.dll
          ${{ env.BUILD_DIR }}/Ribbon/Release/NEVENRibbon.dll
        retention-days: 30
