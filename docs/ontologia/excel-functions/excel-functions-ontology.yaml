# ============================================================================
# FUNCIONES FINANCIERAS (~55 funciones)
# ============================================================================

funciones_financieras:
  - id: VA
    nombre: VA
    nombre_en: PV
    descripcion: "Devuelve el valor actual de una inversión."
    sintaxis: "=VA(tasa, nper, pago, [vf], [tipo])"
    parametros:
      - nombre: "tasa"
        tipo: numeric
        requerido: true
        descripcion: "Tasa de interés por período"
      - nombre: "nper"
        tipo: integer
        requerido: true
        descripcion: "Número total de períodos"
      - nombre: "pago"
        tipo: numeric
        requerido: true
        descripcion: "Pago por período"
      - nombre: "vf"
        tipo: numeric
        requerido: false
        descripcion: "Valor futuro"
      - nombre: "tipo"
        tipo: integer
        requerido: false
        descripcion: "0=final, 1=inicio de período"
    retorna: numeric
    categoria: financieras
    relacionadas: [VF, VNA, PAGO]
    complejidad: intermedia
    version: "1.0"

  - id: VF
    nombre: VF
    nombre_en: FV
    descripcion: "Devuelve el valor futuro de una inversión."
    sintaxis: "=VF(tasa, nper, pago, [va], [tipo])"
    parametros:
      - nombre: "tasa"
        tipo: numeric
        requerido: true
        descripcion: "Tasa de interés por período"
      - nombre: "nper"
        tipo: integer
        requerido: true
        descripcion: "Número de períodos"
      - nombre: "pago"
        tipo: numeric
        requerido: true
        descripcion: "Pago por período"
      - nombre: "va"
        tipo: numeric
        requerido: false
        descripcion: "Valor actual"
      - nombre: "tipo"
        tipo: integer
        requerido: false
        descripcion: "0=final, 1=inicio"
    retorna: numeric
    categoria: financieras
    relacionadas: [VA, VNA, VF.PLAN]
    complejidad: intermedia
    version: "1.0"

  - id: VNA
    nombre: VNA
    nombre_en: NPV
    descripcion: "Devuelve el valor neto actual de una inversión basándose en flujos de caja periódicos."
    sintaxis: "=VNA(tasa, valor1, [valor2], ...)"
    parametros:
      - nombre: "tasa"
        tipo: numeric
        requerido: true
        descripcion: "Tasa de descuento"
      - nombre: "valor1"
        tipo: numeric
        requerido: true
        descripcion: "Primer flujo de caja"
    retorna: numeric
    categoria: financieras
    relacionadas: [TIR, VA, VNA.NO.PER]
