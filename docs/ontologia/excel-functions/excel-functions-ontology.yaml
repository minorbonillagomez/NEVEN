# ============================================================================
# FUNCIONES DE BÚSQUEDA Y REFERENCIA (~36 funciones)
# ============================================================================

funciones_busqueda_referencia:
  - id: BUSCARV
    nombre: BUSCARV
    nombre_en: VLOOKUP
    descripcion: "Busca un valor en la primera columna de una tabla y devuelve un valor de otra columna de la misma fila."
    sintaxis: "=BUSCARV(valor_buscado, matriz_buscar_en, indicador_columnas, [ordenado])"
    parametros:
      - nombre: "valor_buscado"
        tipo: any
        requerido: true
        descripcion: "El valor que desea buscar"
      - nombre: "matriz_buscar_en"
        tipo: range
        requerido: true
        descripcion: "La tabla de datos donde buscar"
      - nombre: "indicador_columnas"
        tipo: integer
        requerido: true
        descripcion: "Número de columna de la que devolver el valor"
      - nombre: "ordenado"
        tipo: boolean
        requerido: false
        descripcion: "TRUE para coincidencia aproximada, FALSE para exacta"
    retorna: any
