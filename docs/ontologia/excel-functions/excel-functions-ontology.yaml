# ============================================================================

funciones_cubos:
  - id: MIEMBROCUBO
    nombre: MIEMBROCUBO
    nombre_en: CUBEMEMBER
    descripcion: "Devuelve un miembro o tupla de un cubo."
    sintaxis: "=MIEMBROCUBO(conexión, expresión_miembro, [título])"
    parametros:
      - nombre: "conexión"
        tipo: text
        requerido: true
        descripcion: "Nombre de la conexión al cubo"
      - nombre: "expresión_miembro"
        tipo: text
        requerido: true
        descripcion: "Expresión MDX del miembro"
      - nombre: "título"
        tipo: text
        requerido: false
        descripcion: "Título a mostrar en la celda"
    retorna: any
    categoria: cubos
    relacionadas: [VALORCUBO, MIEMBROKPICUBO]
    complejidad: avanzada
    version: "2007"

  - id: VALORCUBO
    nombre: VALORCUBO
    nombre_en: CUBEVALUE
    descripcion: "Devuelve un valor agregado de un cubo."
    sintaxis: "=VALORCUBO(conexión, [expresión_miembro1], ...)"
    parametros:
      - nombre: "conexión"
        tipo: text
        requerido: true
        descripcion: "Nombre de la conexión al cubo"
      - nombre: "expresión_miembro1"
        tipo: text
        requerido: false
        descripcion: "Expresión MDX del miembro"
    retorna: numeric
    categoria: cubos
    relacionadas: [MIEMBROCUBO, CONJUNTOCUBO]
