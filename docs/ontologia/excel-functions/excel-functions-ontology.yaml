        requerido: true
        descripcion: "Nombre de la conexión"
      - nombre: "expresión_conjunto"
        tipo: text
        requerido: true
        descripcion: "Expresión MDX del conjunto"
      - nombre: "título"
        tipo: text
        requerido: false
        descripcion: "Título a mostrar"
      - nombre: "criterio_ordenación"
        tipo: integer
        requerido: false
        descripcion: "Tipo de ordenación"
      - nombre: "criterio_orden"
        tipo: text
        requerido: false
        descripcion: "Valor para ordenar"
    retorna: any
    categoria: cubos
    relacionadas: [VALORCUBO, MIEMBROCUBO, RECUENTOCONJUNTOCUBO]
    complejidad: avanzada
    version: "2007"

  - id: RECUENTOCONJUNTOCUBO
    nombre: RECUENTOCONJUNTOCUBO
    nombre_en: CUBESETCOUNT
    descripcion: "Devuelve el número de elementos en un conjunto."
    sintaxis: "=RECUENTOCONJUNTOCUBO(conjunto)"
