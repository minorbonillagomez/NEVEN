    nombre_en: XNPV
    descripcion: "Devuelve el valor neto actual para flujos de caja no periódicos."
    sintaxis: "=VNA.NO.PER(tasa, valores, fechas)"
    parametros:
      - nombre: "tasa"
        tipo: numeric
        requerido: true
        descripcion: "Tasa de descuento"
      - nombre: "valores"
        tipo: range
        requerido: true
        descripcion: "Flujos de caja"
      - nombre: "fechas"
        tipo: range
        requerido: true
        descripcion: "Fechas de los flujos"
    retorna: numeric
    categoria: financieras
    relacionadas: [VNA, TIR.NO.PER]
    complejidad: avanzada
    version: "2000"

  - id: TIR
    nombre: TIR
    nombre_en: IRR
    descripcion: "Devuelve la tasa interna de retorno para una serie de flujos de caja."
    sintaxis: "=TIR(valores, [estimar])"
    parametros:
      - nombre: "valores"
        tipo: range
        requerido: true
        descripcion: "Flujos de caja"
      - nombre: "estimar"
        tipo: numeric
        requerido: false
        descripcion: "Estimación inicial"
    retorna: numeric
    categoria: financieras
    relacionadas: [VNA, TIRM, TIR.NO.PER]
    complejidad: intermedia
    version: "1.0"

  - id: TIR.NO.PER
