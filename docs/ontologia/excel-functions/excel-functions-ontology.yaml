# ============================================================================
# FUNCIONES LÓGICAS (~17 funciones)
# ============================================================================

funciones_logicas:
  - id: SI
    nombre: SI
    nombre_en: IF
    descripcion: "Evalúa una condición y devuelve un valor si es verdadera y otro si es falsa."
    sintaxis: "=SI(prueba_lógica, valor_si_verdadero, [valor_si_falso])"
    parametros:
      - nombre: "prueba_lógica"
        tipo: boolean
        requerido: true
        descripcion: "Condición a evaluar"
      - nombre: "valor_si_verdadero"
        tipo: any
        requerido: true
        descripcion: "Valor si la condición es TRUE"
      - nombre: "valor_si_falso"
        tipo: any
        requerido: false
        descripcion: "Valor si la condición es FALSE"
    retorna: any
    categoria: logicas
    relacionadas: [SI.CONJUNTO, Y, O]
    complejidad: basica
    version: "1.0"

  - id: Y
    nombre: Y
    nombre_en: AND
    descripcion: "Devuelve VERDADERO si todos los argumentos son verdaderos."
    sintaxis: "=Y(valor_lógico1, [valor_lógico2], ...)"
    parametros:
      - nombre: "valor_lógico1"
        tipo: boolean
        requerido: true
        descripcion: "Primera condición"
      - nombre: "valor_lógico2"
        tipo: boolean
        requerido: false
        descripcion: "Condiciones adicionales (hasta 255)"
    retorna: boolean
    categoria: logicas
    relacionadas: [O, NO, SI]
    complejidad: basica
    version: "1.0"

  - id: O
    nombre: O
    nombre_en: OR
    descripcion: "Devuelve VERDADERO si alguno de los argumentos es verdadero."
    sintaxis: "=O(valor_lógico1, [valor_lógico2], ...)"
    parametros:
      - nombre: "valor_lógico1"
        tipo: boolean
        requerido: true
        descripcion: "Primera condición"
      - nombre: "valor_lógico2"
        tipo: boolean
        requerido: false
        descripcion: "Condiciones adicionales (hasta 255)"
    retorna: boolean
    categoria: logicas
    relacionadas: [Y, NO, SI]
    complejidad: basica
    version: "1.0"

  - id: NO
    nombre: NO
    nombre_en: NOT
    descripcion: "Invierte el valor lógico de su argumento."
    sintaxis: "=NO(valor_lógico)"
    parametros:
      - nombre: "valor_lógico"
        tipo: boolean
        requerido: true
        descripcion: "Valor o expresión a invertir"
    retorna: boolean
    categoria: logicas
    relacionadas: [Y, O, SI]
    complejidad: basica
    version: "1.0"

  - id: XO
    nombre: XO
    nombre_en: XOR
    descripcion: "Devuelve un OR exclusivo lógico de todos los argumentos."
    sintaxis: "=XO(valor_lógico1, [valor_lógico2], ...)"
    parametros:
      - nombre: "valor_lógico1"
        tipo: boolean
        requerido: true
        descripcion: "Primera condición"
      - nombre: "valor_lógico2"
        tipo: boolean
        requerido: false
        descripcion: "Condiciones adicionales"
    retorna: boolean
    categoria: logicas
    relacionadas: [Y, O]
    complejidad: intermedia
    version: "2013"

  - id: VERDADERO
    nombre: VERDADERO
    nombre_en: TRUE
    descripcion: "Devuelve el valor lógico VERDADERO."
    sintaxis: "=VERDADERO()"
    parametros: []
    retorna: boolean
    categoria: logicas
    relacionadas: [FALSO]
    complejidad: basica
    version: "1.0"

  - id: FALSO
    nombre: FALSO
    nombre_en: FALSE
    descripcion: "Devuelve el valor lógico FALSO."
    sintaxis: "=FALSO()"
    parametros: []
    retorna: boolean
    categoria: logicas
    relacionadas: [VERDADERO]
    complejidad: basica
    version: "1.0"

  - id: SI.ERROR
    nombre: SI.ERROR
    nombre_en: IFERROR
    descripcion: "Devuelve un valor especificado si una fórmula produce un error; de lo contrario, devuelve el resultado de la fórmula."
    sintaxis: "=SI.ERROR(valor, valor_si_error)"
    parametros:
      - nombre: "valor"
        tipo: any
        requerido: true
        descripcion: "Valor o fórmula a evaluar"
      - nombre: "valor_si_error"
        tipo: any
        requerido: true
        descripcion: "Valor a devolver si hay error"
    retorna: any
    categoria: logicas
    relacionadas: [SI.ND, SI, ESERROR]
    complejidad: basica
    version: "2007"

  - id: SI.ND
    nombre: SI.ND
    nombre_en: IFNA
    descripcion: "Devuelve el valor especificado si la expresión devuelve #N/A; de lo contrario, devuelve el resultado de la expresión."
    sintaxis: "=SI.ND(valor, valor_si_na)"
    parametros:
      - nombre: "valor"
        tipo: any
        requerido: true
        descripcion: "Valor o fórmula a evaluar"
      - nombre: "valor_si_na"
        tipo: any
        requerido: true
        descripcion: "Valor a devolver si es #N/A"
    retorna: any
    categoria: logicas
    relacionadas: [SI.ERROR, ESNOD]
    complejidad: basica
    version: "2013"

  - id: SI.CONJUNTO
    nombre: SI.CONJUNTO
    nombre_en: IFS
    descripcion: "Comprueba si se cumplen una o varias condiciones y devuelve el valor de la primera condición verdadera."
    sintaxis: "=SI.CONJUNTO(prueba_lógica1, valor_si_verdadero1, [prueba_lógica2, valor_si_verdadero2], ...)"
    parametros:
      - nombre: "prueba_lógica1"
        tipo: boolean
        requerido: true
        descripcion: "Primera condición"
      - nombre: "valor_si_verdadero1"
        tipo: any
        requerido: true
        descripcion: "Valor si primera condición es TRUE"
    retorna: any
    categoria: logicas
    relacionadas: [SI, CAMBIAR]
    complejidad: intermedia
    version: "2016"

  - id: CAMBIAR
    nombre: CAMBIAR
    nombre_en: SWITCH
    descripcion: "Evalúa una expresión contra una lista de valores y devuelve el resultado de la primera coincidencia."
    sintaxis: "=CAMBIAR(expresión, valor1, resultado1, [valor2, resultado2], ..., [predeterminado])"
    parametros:
      - nombre: "expresión"
        tipo: any
        requerido: true
        descripcion: "Valor a comparar"
      - nombre: "valor1"
        tipo: any
        requerido: true
        descripcion: "Primer valor de comparación"
      - nombre: "resultado1"
        tipo: any
        requerido: true
        descripcion: "Resultado si coincide con valor1"
      - nombre: "predeterminado"
        tipo: any
        requerido: false
        descripcion: "Valor si no hay coincidencia"
    retorna: any
    categoria: logicas
    relacionadas: [SI.CONJUNTO, SI, ELEGIR]
    complejidad: intermedia
    version: "2016"

  - id: LAMBDA
    nombre: LAMBDA
    nombre_en: LAMBDA
    descripcion: "Crea una función personalizada reutilizable con parámetros definidos."
    sintaxis: "=LAMBDA([parámetro1], ..., cálculo)"
    parametros:
      - nombre: "parámetro1"
        tipo: any
        requerido: false
        descripcion: "Parámetro de entrada"
      - nombre: "cálculo"
        tipo: any
        requerido: true
        descripcion: "Fórmula o expresión a ejecutar"
    retorna: any
    categoria: logicas
    relacionadas: [LET, MAP, REDUCE]
    complejidad: avanzada
    version: "365"

  - id: LET
    nombre: LET
    nombre_en: LET
    descripcion: "Asigna nombres a valores o cálculos intermedios para uso dentro de una fórmula."
    sintaxis: "=LET(nombre1, valor1, [nombre2, valor2], ..., cálculo)"
    parametros:
      - nombre: "nombre1"
        tipo: text
        requerido: true
        descripcion: "Nombre de la variable"
      - nombre: "valor1"
        tipo: any
        requerido: true
        descripcion: "Valor asignado a nombre1"
      - nombre: "cálculo"
        tipo: any
        requerido: true
        descripcion: "Fórmula que usa las variables"
    retorna: any
    categoria: logicas
    relacionadas: [LAMBDA]
    complejidad: avanzada
    version: "365"

  - id: MAP
    nombre: MAP
    nombre_en: MAP
    descripcion: "Devuelve una matriz aplicando una función LAMBDA a cada valor de una matriz."
    sintaxis: "=MAP(matriz1, [matriz2], ..., lambda)"
    parametros:
      - nombre: "matriz1"
        tipo: range
        requerido: true
        descripcion: "Primera matriz de entrada"
      - nombre: "lambda"
        tipo: function
        requerido: true
        descripcion: "Función LAMBDA a aplicar"
    retorna: array
    categoria: logicas
    relacionadas: [LAMBDA, REDUCE, BYCOL, BYROW]
    complejidad: avanzada
    version: "365"

  - id: REDUCE
    nombre: REDUCE
    nombre_en: REDUCE
    descripcion: "Reduce una matriz a un valor acumulado aplicando una función LAMBDA."
    sintaxis: "=REDUCE([valor_inicial], matriz, lambda)"
    parametros:
      - nombre: "valor_inicial"
        tipo: any
        requerido: false
        descripcion: "Valor inicial del acumulador"
      - nombre: "matriz"
        tipo: range
        requerido: true
        descripcion: "Matriz a reducir"
      - nombre: "lambda"
        tipo: function
        requerido: true
        descripcion: "Función LAMBDA(acumulador, valor)"
    retorna: any
    categoria: logicas
    relacionadas: [LAMBDA, MAP, SCAN]
    complejidad: avanzada
    version: "365"

  - id: SCAN
    nombre: SCAN
    nombre_en: SCAN
    descripcion: "Escanea una matriz aplicando una función LAMBDA a cada valor y devuelve una matriz con valores intermedios."
    sintaxis: "=SCAN([valor_inicial], matriz, lambda)"
    parametros:
      - nombre: "valor_inicial"
        tipo: any
        requerido: false
        descripcion: "Valor inicial del acumulador"
      - nombre: "matriz"
        tipo: range
        requerido: true
        descripcion: "Matriz a escanear"
      - nombre: "lambda"
        tipo: function
        requerido: true
        descripcion: "Función LAMBDA(acumulador, valor)"
    retorna: array
    categoria: logicas
    relacionadas: [REDUCE, MAP, LAMBDA]
    complejidad: avanzada
    version: "365"

  - id: MAKEARRAY
    nombre: MAKEARRAY
    nombre_en: MAKEARRAY
    descripcion: "Devuelve una matriz calculada de un tamaño de fila y columna especificado, aplicando una LAMBDA."
    sintaxis: "=MAKEARRAY(filas, columnas, lambda)"
    parametros:
      - nombre: "filas"
        tipo: integer
        requerido: true
        descripcion: "Número de filas"
      - nombre: "columnas"
        tipo: integer
        requerido: true
        descripcion: "Número de columnas"
      - nombre: "lambda"
        tipo: function
        requerido: true
        descripcion: "Función LAMBDA(fila, columna)"
    retorna: array
    categoria: logicas
    relacionadas: [LAMBDA, SECUENCIA]
    complejidad: avanzada
    version: "365"

  - id: BYCOL
    nombre: BYCOL
    nombre_en: BYCOL
    descripcion: "Aplica una función LAMBDA a cada columna y devuelve una matriz de resultados."
    sintaxis: "=BYCOL(matriz, lambda)"
    parametros:
      - nombre: "matriz"
        tipo: range
        requerido: true
        descripcion: "Matriz de entrada"
      - nombre: "lambda"
        tipo: function
        requerido: true
        descripcion: "Función LAMBDA a aplicar por columna"
    retorna: array
    categoria: logicas
    relacionadas: [BYROW, MAP, LAMBDA]
    complejidad: avanzada
    version: "365"

  - id: BYROW
    nombre: BYROW
    nombre_en: BYROW
    descripcion: "Aplica una función LAMBDA a cada fila y devuelve una matriz de resultados."
    sintaxis: "=BYROW(matriz, lambda)"
    parametros:
      - nombre: "matriz"
        tipo: range
        requerido: true
        descripcion: "Matriz de entrada"
      - nombre: "lambda"
        tipo: function
        requerido: true
        descripcion: "Función LAMBDA a aplicar por fila"
    retorna: array
    categoria: logicas
    relacionadas: [BYCOL, MAP, LAMBDA]
    complejidad: avanzada
    version: "365"

  - id: ISOMITTED
    nombre: ESOMITIDO
    nombre_en: ISOMITTED
    descripcion: "Comprueba si un valor se omitió en una función LAMBDA."
    sintaxis: "=ESOMITIDO(valor)"
    parametros:
      - nombre: "valor"
        tipo: any
        requerido: true
        descripcion: "Valor a comprobar"
    retorna: boolean
    categoria: logicas
    relacionadas: [LAMBDA]
    complejidad: avanzada
    version: "365"

# ============================================================================
# FUNCIONES DE TEXTO (~42 funciones)
# ============================================================================

funciones_texto:
  - id: CONCATENAR
    nombre: CONCATENAR
    nombre_en: CONCATENATE
    descripcion: "Une varias cadenas de texto en una sola."
    sintaxis: "=CONCATENAR(texto1, [texto2], ...)"
    parametros:
      - nombre: "texto1"
        tipo: text
        requerido: true
        descripcion: "Primer texto"
      - nombre: "texto2"
        tipo: text
        requerido: false
        descripcion: "Textos adicionales (hasta 255)"
    retorna: text
    categoria: texto
    relacionadas: [CONCAT, UNIRCADENAS]
    complejidad: basica
    version: "1.0"

  - id: CONCAT
    nombre: CONCAT
    nombre_en: CONCAT
    descripcion: "Combina el texto de varios rangos o cadenas."
    sintaxis: "=CONCAT(texto1, [texto2], ...)"
    parametros:
      - nombre: "texto1"
        tipo: text
        requerido: true
        descripcion: "Primer texto o rango"
    retorna: text
    categoria: texto
    relacionadas: [CONCATENAR, UNIRCADENAS]
    complejidad: basica
    version: "2016"

  - id: UNIRCADENAS
    nombre: UNIRCADENAS
    nombre_en: TEXTJOIN
    descripcion: "Combina texto de varios rangos con un delimitador."
    sintaxis: "=UNIRCADENAS(delimitador, omitir_vacíos, texto1, [texto2], ...)"
    parametros:
      - nombre: "delimitador"
        tipo: text
        requerido: true
        descripcion: "Carácter o texto separador"
      - nombre: "omitir_vacíos"
        tipo: boolean
        requerido: true
        descripcion: "TRUE para ignorar celdas vacías"
      - nombre: "texto1"
        tipo: text
        requerido: true
        descripcion: "Texto o rango"
    retorna: text
    categoria: texto
    relacionadas: [CONCAT, CONCATENAR]
    complejidad: intermedia
    version: "2016"

  - id: IZQUIERDA
    nombre: IZQUIERDA
    nombre_en: LEFT
    descripcion: "Devuelve los caracteres del lado izquierdo de una cadena de texto."
    sintaxis: "=IZQUIERDA(texto, [núm_caracteres])"
    parametros:
      - nombre: "texto"
        tipo: text
        requerido: true
        descripcion: "Cadena de texto"
      - nombre: "núm_caracteres"
        tipo: integer
        requerido: false
        descripcion: "Número de caracteres (predeterminado 1)"
    retorna: text
    categoria: texto
    relacionadas: [DERECHA, EXTRAE]
    complejidad: basica
    version: "1.0"

  - id: DERECHA
    nombre: DERECHA
    nombre_en: RIGHT
    descripcion: "Devuelve los caracteres del lado derecho de una cadena de texto."
    sintaxis: "=DERECHA(texto, [núm_caracteres])"
    parametros:
