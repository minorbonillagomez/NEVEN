# ============================================================================
# FUNCIONES DESTACADAS (Top 10)
# ============================================================================

funciones_destacadas:
  - id: SUMA
    nombre: SUMA
    nombre_en: SUM
    descripcion: "Suma todos los valores numéricos en un rango o lista de argumentos."
    sintaxis: "=SUMA(número1, [número2], ...)"
    parametros:
      - nombre: "número1"
        tipo: numeric|range
        requerido: true
        descripcion: "Primer número o rango a sumar"
      - nombre: "número2"
        tipo: numeric|range
        requerido: false
        descripcion: "Números o rangos adicionales (hasta 255)"
    retorna: numeric
    categoria: matematicas_trigonometria
    relacionadas: [SUMAR.SI, SUMAR.SI.CONJUNTO, PRODUCTO]
    complejidad: basica
    version: "1.0"

  - id: SI
    nombre: SI
    nombre_en: IF
    descripcion: "Evalúa una condición y devuelve un valor si es verdadera y otro si es falsa."
    sintaxis: "=SI(prueba_lógica, valor_si_verdadero, [valor_si_falso])"
    parametros:
      - nombre: "prueba_lógica"
        tipo: boolean
        requerido: true
        descripcion: "Condición a evaluar"
      - nombre: "valor_si_verdadero"
        tipo: any
        requerido: true
        descripcion: "Valor devuelto si la condición es verdadera"
      - nombre: "valor_si_falso"
        tipo: any
        requerido: false
        descripcion: "Valor devuelto si la condición es falsa (por defecto FALSO)"
    retorna: any
    categoria: logicas
    relacionadas: [SI.ERROR, SI.ND, SI.CONJUNTO, Y, O]
    complejidad: basica
    version: "1.0"

  - id: SUMAR.SI.CONJUNTO
    nombre: SUMAR.SI.CONJUNTO
    nombre_en: SUMIFS
    descripcion: "Suma los valores de un rango que cumplen múltiples criterios."
    sintaxis: "=SUMAR.SI.CONJUNTO(rango_suma, rango_criterio1, criterio1, [rango_criterio2, criterio2], ...)"
    parametros:
      - nombre: "rango_suma"
        tipo: range
        requerido: true
        descripcion: "Rango de celdas a sumar"
      - nombre: "rango_criterio1"
        tipo: range
        requerido: true
        descripcion: "Rango donde evaluar el primer criterio"
      - nombre: "criterio1"
        tipo: any
        requerido: true
        descripcion: "Condición que deben cumplir las celdas"
    retorna: numeric
    categoria: matematicas_trigonometria
    relacionadas: [SUMAR.SI, CONTAR.SI.CONJUNTO, PROMEDIO.SI.CONJUNTO]
    complejidad: intermedia
    version: "2007"

  - id: BUSCARX
    nombre: BUSCARX
    nombre_en: XLOOKUP
    descripcion: "Busca un valor en un rango y devuelve el valor correspondiente de otro rango. Reemplaza a BUSCARV y BUSCARH."
    sintaxis: "=BUSCARX(valor_buscado, matriz_buscar, matriz_devolver, [si_no_se_encuentra], [modo_coincidencia], [modo_búsqueda])"
    parametros:
      - nombre: "valor_buscado"
        tipo: any
        requerido: true
        descripcion: "Valor a buscar"
      - nombre: "matriz_buscar"
        tipo: range
        requerido: true
        descripcion: "Rango donde buscar"
      - nombre: "matriz_devolver"
        tipo: range
        requerido: true
        descripcion: "Rango del cual devolver el resultado"
      - nombre: "si_no_se_encuentra"
        tipo: any
        requerido: false
        descripcion: "Valor si no hay coincidencia"
      - nombre: "modo_coincidencia"
        tipo: integer
        requerido: false
        descripcion: "0=exacta, -1=exacta o siguiente menor, 1=exacta o siguiente mayor, 2=comodín"
      - nombre: "modo_búsqueda"
        tipo: integer
        requerido: false
        descripcion: "1=primero al último, -1=último al primero, 2=binaria ascendente, -2=binaria descendente"
    retorna: any
    categoria: busqueda_referencia
    relacionadas: [BUSCARV, BUSCARH, COINCIDIRX, INDICE]
    complejidad: intermedia
    version: "2021"

  - id: CONTAR.SI.CONJUNTO
    nombre: CONTAR.SI.CONJUNTO
    nombre_en: COUNTIFS
    descripcion: "Cuenta las celdas de un rango que cumplen múltiples criterios."
    sintaxis: "=CONTAR.SI.CONJUNTO(rango_criterio1, criterio1, [rango_criterio2, criterio2], ...)"
    parametros:
      - nombre: "rango_criterio1"
        tipo: range
        requerido: true
        descripcion: "Primer rango donde evaluar criterio"
      - nombre: "criterio1"
        tipo: any
        requerido: true
        descripcion: "Primera condición a cumplir"
    retorna: integer
    categoria: estadisticas
    relacionadas: [CONTAR.SI, CONTAR, CONTARA]
    complejidad: intermedia
    version: "2007"

  - id: CONTAR
    nombre: CONTAR
    nombre_en: COUNT
    descripcion: "Cuenta cuántas celdas contienen valores numéricos en un rango."
    sintaxis: "=CONTAR(valor1, [valor2], ...)"
    parametros:
      - nombre: "valor1"
        tipo: range|numeric
        requerido: true
        descripcion: "Primer rango o valor a contar"
    retorna: integer
    categoria: estadisticas
    relacionadas: [CONTARA, CONTAR.BLANCO, CONTAR.SI]
    complejidad: basica
    version: "1.0"

  - id: LET
    nombre: LET
    nombre_en: LET
    descripcion: "Asigna nombres a valores intermedios dentro de una fórmula para mejorar legibilidad y rendimiento."
    sintaxis: "=LET(nombre1, valor1, [nombre2, valor2], ..., cálculo)"
    parametros:
      - nombre: "nombre1"
        tipo: name
        requerido: true
        descripcion: "Nombre de la variable"
      - nombre: "valor1"
        tipo: any
        requerido: true
        descripcion: "Valor asignado al nombre"
      - nombre: "cálculo"
        tipo: formula
        requerido: true
        descripcion: "Fórmula final que usa los nombres definidos"
    retorna: any
    categoria: logicas
    relacionadas: [LAMBDA, SI, ELEGIR]
    complejidad: avanzada
    version: "2021"

  - id: FILTRAR
    nombre: FILTRAR
    nombre_en: FILTER
    descripcion: "Filtra un rango de datos según criterios definidos y devuelve una matriz dinámica."
    sintaxis: "=FILTRAR(matriz, incluir, [si_vacío])"
    parametros:
      - nombre: "matriz"
        tipo: range
        requerido: true
        descripcion: "Rango de datos a filtrar"
      - nombre: "incluir"
        tipo: boolean_array
        requerido: true
        descripcion: "Matriz de valores TRUE/FALSE que indica qué filas incluir"
      - nombre: "si_vacío"
        tipo: any
        requerido: false
        descripcion: "Valor a devolver si no hay resultados"
    retorna: array
    categoria: busqueda_referencia
    relacionadas: [ORDENAR, ORDENARPOR, UNIQUE]
    complejidad: intermedia
    version: "2021"

  - id: UNIQUE
    nombre: UNIQUE
    nombre_en: UNIQUE
    descripcion: "Devuelve los valores únicos de un rango, eliminando duplicados."
    sintaxis: "=UNIQUE(matriz, [por_columna], [exactamente_una_vez])"
    parametros:
      - nombre: "matriz"
        tipo: range
        requerido: true
        descripcion: "Rango del cual extraer valores únicos"
      - nombre: "por_columna"
        tipo: boolean
        requerido: false
        descripcion: "TRUE para comparar columnas, FALSE para filas"
      - nombre: "exactamente_una_vez"
        tipo: boolean
        requerido: false
        descripcion: "TRUE para devolver solo valores que aparecen exactamente una vez"
    retorna: array
    categoria: busqueda_referencia
    relacionadas: [FILTRAR, ORDENAR, DISTINCT]
    complejidad: intermedia
    version: "2021"

  - id: TEXTOANTES
    nombre: TEXTOANTES
    nombre_en: TEXTBEFORE
    descripcion: "Extrae el texto que aparece antes de un delimitador especificado."
    sintaxis: "=TEXTOANTES(texto, delimitador, [núm_instancia], [modo_coincidencia], [si_no_encontrado])"
    parametros:
      - nombre: "texto"
        tipo: text
        requerido: true
        descripcion: "Texto del cual extraer"
      - nombre: "delimitador"
        tipo: text
        requerido: true
        descripcion: "Carácter o cadena delimitadora"
      - nombre: "núm_instancia"
        tipo: integer
        requerido: false
        descripcion: "Número de instancia del delimitador (negativo cuenta desde el final)"
    retorna: text
    categoria: texto
    relacionadas: [TEXTODESPUES, DIVIDIRTEXTO, IZQUIERDA, EXTRAE]
    complejidad: intermedia
    version: "2024"

