entity_type: ChartType
id: count-basic
name:
  en: Basic Count Plot
  es: Count Basic Básico
description:
  en: A count plot displays the frequency of observations in each category of a categorical
    variable using vertical bars. Unlike a basic bar chart that requires pre-computed
    values, a count plot automatically counts occurrences from raw data. This makes
    it ideal for quick exploratory analysis of categorical distributions without manual
    aggregation.
  es: A count plot displays the frequency of observations in each category of a categorical
    variable using vertical bars. Unlike a basic bar chart that requires pre-computed
    values, a count plot automatically counts occurrences from raw data. This makes
    it ideal for quick exploratory analysis of categorical distributions without manual
    aggregation.
