notes:
- Convert power spectrogram to decibel scale (log scale) for better visual dynamic
  range
- Use a sequential colormap (e.g., magma, inferno, or viridis) for clear intensity
  representation
- X-axis should show time in seconds, y-axis should show mel-scaled frequency with
  Hz labels at key mel band edges
