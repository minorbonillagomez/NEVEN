entity_type: ChartType
id: spectrogram-mel
name:
  en: Mel-Spectrogram for Audio Analysis
  es: Spectrogram Mel
description:
  en: A mel-spectrogram displaying the power spectrum of an audio signal with the
    frequency axis warped to the mel scale, which approximates human auditory perception.
    Unlike a standard spectrogram with a linear frequency axis, the mel-spectrogram
    compresses higher frequencies and expands lower frequencies, making perceptually
    similar sounds visually closer together. This is the foundational input representation
    for modern audio machine learning pipelines including speech recognition, speaker
    identification, and music information retrieval.
  es: A mel-spectrogram displaying the power spectrum of an audio signal with the
    frequency axis warped to the mel scale, which approximates human auditory perception.
    Unlike a standard spectrogram with a linear frequency axis, the mel-spectrogram
    compresses higher frequencies and expands lower frequencies, making perceptually
    similar sounds visually closer together. This is the foundational input representation
    for modern audio machine learning pipelines including speech recognition, speaker
    identification, and music information retrieval.
