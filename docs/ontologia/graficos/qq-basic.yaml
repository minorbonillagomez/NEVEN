applications:
  en:
  - Testing normality assumptions before parametric statistical tests (t-tests, ANOVA,
    regression)
  - Identifying distribution characteristics such as skewness and kurtosis in research
    datasets
  - Quality control analysis to verify process measurements follow expected distributions
  - Detecting outliers and data quality issues in experimental data
