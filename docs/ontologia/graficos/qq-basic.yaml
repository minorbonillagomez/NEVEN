notes:
- Points falling along the reference line indicate data follows the reference distribution
- 'Systematic deviations reveal specific distribution characteristics: S-curves indicate
  skewness, curved ends indicate heavy or light tails'
- 'Draw a clearly visible reference line: y = x when theoretical quantiles use the
  sample''s estimated parameters (or both axes are standardized), or a line fitted
  through the quartiles or by least squares when the theoretical axis is in standard-normal
  units'
