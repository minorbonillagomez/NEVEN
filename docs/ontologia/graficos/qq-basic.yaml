entity_type: ChartType
id: qq-basic
name:
  en: Basic Q-Q Plot
  es: Gráfico Q-Q Básico
description:
  en: A Q-Q (Quantile-Quantile) plot compares the distribution of a dataset against
    a theoretical distribution (typically normal) or another dataset. Points are plotted
    by matching sample quantiles to theoretical quantiles, with a reference line indicating
    perfect distribution match. Deviations from the line reveal distribution characteristics
    such as skewness, heavy tails, and outliers.
  es: A Q-Q (Quantile-Quantile) plot compares the distribution of a dataset against
    a theoretical distribution (typically normal) or another dataset. Points are plotted
    by matching sample quantiles to theoretical quantiles, with a reference line indicating
    perfect distribution match. Deviations from the line reveal distribution characteristics
    such as skewness, heavy tails, and outliers.
