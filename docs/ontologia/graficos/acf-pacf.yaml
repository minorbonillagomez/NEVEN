applications:
  en:
  - Identifying appropriate ARIMA(p,d,q) model orders from the decay patterns in ACF
    and PACF before fitting a time series model
  - Diagnosing model residuals to verify that no significant autocorrelation remains
    after fitting a forecasting model
  - Detecting seasonal patterns in economic or climate data by observing periodic
    spikes at seasonal lags
  es:
  - Identifying appropriate ARIMA(p,d,q) model orders from the decay patterns in ACF
    and PACF before fitting a time series model
  - Diagnosing model residuals to verify that no significant autocorrelation remains
    after fitting a forecasting model
  - Detecting seasonal patterns in economic or climate data by observing periodic
    spikes at seasonal lags
