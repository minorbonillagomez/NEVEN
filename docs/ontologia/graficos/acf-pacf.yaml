entity_type: ChartType
id: acf-pacf
name:
  en: Autocorrelation and Partial Autocorrelation (ACF/PACF) Plot
  es: Acf Pacf
description:
  en: Displays the autocorrelation function (ACF) and partial autocorrelation function
    (PACF) of a time series as vertical stem/bar plots arranged in two vertically
    stacked subplots. Each lag is represented by a vertical line from zero to the
    correlation value, with horizontal dashed lines indicating 95% confidence bounds.
    These plots are essential for identifying the order of AR and MA components in
    ARIMA modeling and for diagnosing residual independence.
  es: Displays the autocorrelation function (ACF) and partial autocorrelation function
    (PACF) of a time series as vertical stem/bar plots arranged in two vertically
    stacked subplots. Each lag is represented by a vertical line from zero to the
    correlation value, with horizontal dashed lines indicating 95% confidence bounds.
    These plots are essential for identifying the order of AR and MA components in
    ARIMA modeling and for diagnosing residual independence.
