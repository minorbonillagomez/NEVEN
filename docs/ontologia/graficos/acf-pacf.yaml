notes:
- Display ACF in the top subplot and PACF in the bottom subplot, sharing the x-axis
  (lag number)
- Use vertical stem lines (not filled bars) from the zero baseline to each correlation
  value
- Show 95% confidence interval as horizontal dashed lines at approximately +/-1.96/sqrt(N)
