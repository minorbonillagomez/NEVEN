entity_type: ChartType
id: phase-diagram-pt
name:
  en: Thermodynamic Phase Diagram (Pressure-Temperature)
  es: Phase Diagram Pt
description:
  en: A pressure-temperature (P-T) phase diagram showing the boundaries between solid,
    liquid, and gas phases of a substance. The diagram includes the triple point where
    all three phases coexist and the critical point beyond which the liquid-gas distinction
    vanishes. This is one of the most fundamental diagrams in chemistry and physics,
    essential for understanding phase transitions and states of matter.
  es: A pressure-temperature (P-T) phase diagram showing the boundaries between solid,
    liquid, and gas phases of a substance. The diagram includes the triple point where
    all three phases coexist and the critical point beyond which the liquid-gas distinction
    vanishes. This is one of the most fundamental diagrams in chemistry and physics,
    essential for understanding phase transitions and states of matter.
