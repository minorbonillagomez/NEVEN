notes:
- Phase regions (solid, liquid, gas) should be clearly labeled in their respective
  areas
- The triple point and critical point should be marked with distinct markers and annotated
- The liquid-gas boundary terminates at the critical point; beyond it lies the supercritical
  fluid region
