entity_type: ChartType
id: slope-basic
name:
  en: Basic Slope Chart (Slopegraph)
  es: Slope Basic Básico
description:
  en: A slope chart (slopegraph) visualizes changes between two time points by connecting
    values with lines across vertical axes. It emphasizes the direction and magnitude
    of change rather than absolute values, making it ideal for spotting increases,
    decreases, and rank changes at a glance. This chart type excels at before/after
    comparisons and highlighting which items improved or declined.
  es: A slope chart (slopegraph) visualizes changes between two time points by connecting
    values with lines across vertical axes. It emphasizes the direction and magnitude
    of change rather than absolute values, making it ideal for spotting increases,
    decreases, and rank changes at a glance. This chart type excels at before/after
    comparisons and highlighting which items improved or declined.
