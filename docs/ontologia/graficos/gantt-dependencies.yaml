notes:
- For finish-to-start links, draw dependency arrows from the right edge (end date)
  of each predecessor bar to the left edge (start date) of the successor bar
- Use different visual styles for dependency types (finish-to-start is most common)
- Group headers should show aggregate timeline spanning from earliest to latest task
  in the group
