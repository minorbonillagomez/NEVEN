notes:
- 'Use the canonical layout: 18 groups × 7 periods, with the lanthanides (period 6)
  and actinides (period 7) pulled out into two rows offset below the main grid, leaving
  a gap at group 3 in those periods'
- Tiles are equal-sized squares with a small gap; the f-block rows are visually separated
  from the main body
- Apply a sequential colormap for unipolar properties (e.g., viridis, plasma); a diverging
  map only if the property has a meaningful midpoint
