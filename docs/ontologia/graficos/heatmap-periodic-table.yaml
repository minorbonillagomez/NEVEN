entity_type: ChartType
id: heatmap-periodic-table
name:
  en: Periodic Table Property Heatmap
  es: Mapa de Calor
description:
  en: A periodic table of the elements rendered in its canonical layout — 18 groups
    across by 7 periods down, with the lanthanide and actinide series detached as
    two separate rows below — where each element tile is colored by a continuous property
    such as electronegativity, atomic radius, melting point, or first ionization energy.
    A colorbar maps tile color to property value, and every tile carries the element
    symbol and atomic number, optionally with the numeric property value. This visualization
    fuses an immediately recognizable fixed grid with heatmap encoding, turning a
    familiar reference chart into a tool for spotting periodic trends at a glance.
  es: A periodic table of the elements rendered in its canonical layout — 18 groups
    across by 7 periods down, with the lanthanide and actinide series detached as
    two separate rows below — where each element tile is colored by a continuous property
    such as electronegativity, atomic radius, melting point, or first ionization energy.
    A colorbar maps tile color to property value, and every tile carries the element
    symbol and atomic number, optionally with the numeric property value. This visualization
    fuses an immediately recognizable fixed grid with heatmap encoding, turning a
    familiar reference chart into a tool for spotting periodic trends at a glance.
