applications:
  en:
  - Teaching periodic trends in chemistry — electronegativity rising toward the top-right,
    atomic radius growing down a group — by letting students read the gradient directly
    off the table
  - Comparing physical properties (melting point, density, first ionization energy)
    across the elements to highlight families and anomalies
  - Materials-science screening, shading elements by abundance, cost, or a target
    property to identify candidate substitutions
  - Science communication and reference posters where a single property is encoded
    onto the standard layout everyone already knows
