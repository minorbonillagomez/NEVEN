entity_type: ChartType
id: violin-box
name:
  en: Violin Plot with Embedded Box Plot
  es: Diagrama de Violín
description:
  en: A violin plot with an embedded box plot inside, combining the distribution shape
    visualization (KDE) with traditional quartile statistics. Shows both the probability
    density and summary statistics in one plot.
  es: A violin plot with an embedded box plot inside, combining the distribution shape
    visualization (KDE) with traditional quartile statistics. Shows both the probability
    density and summary statistics in one plot.
aliases:
  en:
  - violin-box
  - violin box
  - violin plot
  es:
  - violin-box
  - violin box
  - diagrama de violín
use_when:
  en:
  - Comparing distributions across groups
  - Identifying outliers and spread
  - Showing median, quartiles, and range
  es:
  - Comparar distribuciones entre grupos
  - Identificar valores atípicos y dispersión
  - Mostrar mediana, cuartiles y rango
avoid_when:
  en: []
  es: []
applications:
  en:
  - Complete distribution visualization
  - Combining density estimate with summary statistics
  - Detailed group comparisons
  - Statistical presentations requiring both views
  es:
  - Complete distribution visualization
  - Combining density estimate with summary statistics
  - Detailed group comparisons
  - Statistical presentations requiring both views
