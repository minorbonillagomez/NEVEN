entity_type: ChartType
id: radar-basic
name:
  en: Basic Radar Chart
  es: Gráfico de Radar Básico
description:
  en: A radar chart (also known as spider or web chart) displays multivariate data
    on axes starting from a common center point, with values connected to form a polygon.
    Each axis represents a different variable, making it ideal for comparing multiple
    quantitative variables at once or visualizing strengths and weaknesses across
    categories.
  es: A radar chart (also known as spider or web chart) displays multivariate data
    on axes starting from a common center point, with values connected to form a polygon.
    Each axis represents a different variable, making it ideal for comparing multiple
    quantitative variables at once or visualizing strengths and weaknesses across
    categories.
