entity_type: ChartType
id: polar-scatter
name:
  en: Polar Scatter Plot
  es: Gráfico Polar
description:
  en: A scatter plot displayed in polar coordinates where data points are positioned
    using angle (theta) and radius (r) rather than Cartesian x and y coordinates.
    This visualization is particularly effective for cyclical or directional data
    where the angular component carries meaningful information.
  es: A scatter plot displayed in polar coordinates where data points are positioned
    using angle (theta) and radius (r) rather than Cartesian x and y coordinates.
    This visualization is particularly effective for cyclical or directional data
    where the angular component carries meaningful information.
