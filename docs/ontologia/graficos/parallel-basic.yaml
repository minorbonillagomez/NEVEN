entity_type: ChartType
id: parallel-basic
name:
  en: Basic Parallel Coordinates Plot
  es: Coordenadas Paralelas Básico
description:
  en: A parallel coordinates plot visualizes multivariate data by representing each
    variable as a vertical axis and each observation as a line connecting values across
    all axes. This technique is powerful for identifying patterns, clusters, and outliers
    in high-dimensional datasets where traditional 2D plots fall short. It enables
    simultaneous comparison of multiple variables for each data point.
  es: A parallel coordinates plot visualizes multivariate data by representing each
    variable as a vertical axis and each observation as a line connecting values across
    all axes. This technique is powerful for identifying patterns, clusters, and outliers
    in high-dimensional datasets where traditional 2D plots fall short. It enables
    simultaneous comparison of multiple variables for each data point.
