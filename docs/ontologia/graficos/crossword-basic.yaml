entity_type: ChartType
id: crossword-basic
name:
  en: Crossword Puzzle Grid
  es: Crossword Basic Básico
description:
  en: A crossword puzzle grid visualization with white entry cells for letters, black
    blocking cells, and numbered starting positions for across and down words. The
    symmetric black cell pattern follows traditional newspaper-style crossword conventions,
    creating a clean and recognizable puzzle layout suitable for printing or digital
    display.
  es: A crossword puzzle grid visualization with white entry cells for letters, black
    blocking cells, and numbered starting positions for across and down words. The
    symmetric black cell pattern follows traditional newspaper-style crossword conventions,
    creating a clean and recognizable puzzle layout suitable for printing or digital
    display.
