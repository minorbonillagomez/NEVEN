use_when:
  en:
  - Showing trends over time
  - Displaying continuous data changes
  - Comparing multiple series
  es:
  - Mostrar tendencias en el tiempo
  - Visualizar cambios en datos continuos
  - Comparar múltiples series
avoid_when:
  en: []
  es: []
applications:
  en:
  - Visualizing Lissajous figures in physics and signal analysis to study frequency
    ratios and phase relationships
  - Plotting spiral curves (Archimedean, logarithmic) for antenna design and natural
    growth patterns
  - Drawing classical mathematical curves such as cardioids, cycloids, and epicycloids
    for education and research
  - Tracing orbital paths and projectile trajectories in physics and engineering simulations
  es:
  - Visualizing Lissajous figures in physics and signal analysis to study frequency
    ratios and phase relationships
  - Plotting spiral curves (Archimedean, logarithmic) for antenna design and natural
    growth patterns
  - Drawing classical mathematical curves such as cardioids, cycloids, and epicycloids
    for education and research
  - Tracing orbital paths and projectile trajectories in physics and engineering simulations
