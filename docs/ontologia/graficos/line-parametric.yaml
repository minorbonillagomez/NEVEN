entity_type: ChartType
id: line-parametric
name:
  en: Parametric Curve Plot
  es: Gráfico de Líneas
description:
  en: A parametric curve plot visualizes x(t) and y(t) as functions of a parameter
    t, tracing smooth curves in 2D space. Unlike standard function plots where y =
    f(x), parametric curves can loop, self-intersect, and form closed shapes such
    as Lissajous figures, spirals, and cardioids. This makes them essential for representing
    trajectories, oscillations, and classical mathematical curves that cannot be expressed
    as single-valued functions.
  es: A parametric curve plot visualizes x(t) and y(t) as functions of a parameter
    t, tracing smooth curves in 2D space. Unlike standard function plots where y =
    f(x), parametric curves can loop, self-intersect, and form closed shapes such
    as Lissajous figures, spirals, and cardioids. This makes them essential for representing
    trajectories, oscillations, and classical mathematical curves that cannot be expressed
    as single-valued functions.
