notes:
- Use equal aspect ratio to prevent geometric distortion of the curves
- Show direction of increasing t using a color gradient along the curve (e.g., from
  cool to warm colors)
- 'Include at least two example curves: a Lissajous figure (x = sin(3t), y = sin(2t))
  and a spiral (x = t*cos(t), y = t*sin(t))'
