notes:
- Use kernel density estimation (KDE) or similar interpolation to create the continuous
  heatmap layer
- Apply a sequential colormap (e.g., YlOrRd, inferno) with transparency to allow the
  basemap to show through
- Include a colorbar legend showing the density or intensity scale
