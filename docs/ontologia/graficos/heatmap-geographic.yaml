entity_type: ChartType
id: heatmap-geographic
name:
  en: Geographic Heatmap for Spatial Density
  es: Mapa de Calor
description:
  en: A geographic heatmap visualizes spatial density or intensity values across a
    map using continuous color gradients. Unlike choropleth maps that color discrete
    regions, this plot shows smooth density variations computed from point data or
    gridded values. The color intensity at each location represents the concentration
    or magnitude of the underlying data, making it ideal for identifying hotspots,
    clusters, and spatial patterns in geographic data.
  es: A geographic heatmap visualizes spatial density or intensity values across a
    map using continuous color gradients. Unlike choropleth maps that color discrete
    regions, this plot shows smooth density variations computed from point data or
    gridded values. The color intensity at each location represents the concentration
    or magnitude of the underlying data, making it ideal for identifying hotspots,
    clusters, and spatial patterns in geographic data.
