entity_type: ChartType
id: bland-altman-basic
name:
  en: Bland-Altman Agreement Plot
  es: Bland Altman Basic
description:
  en: A Bland-Altman plot (also known as a difference plot or Tukey mean-difference
    plot) visualizes the agreement between two measurement methods by plotting the
    difference against the average of paired observations. It displays the mean difference
    (bias) as a horizontal line and limits of agreement (mean ± 1.96 SD) to assess
    whether the methods are interchangeable within acceptable tolerances.
  es: A Bland-Altman plot (also known as a difference plot or Tukey mean-difference
    plot) visualizes the agreement between two measurement methods by plotting the
    difference against the average of paired observations. It displays the mean difference
    (bias) as a horizontal line and limits of agreement (mean ± 1.96 SD) to assess
    whether the methods are interchangeable within acceptable tolerances.
