applications:
  en:
  - Identifying clear trend reversals in stock trading by observing when thick lines
    transition to thin lines or vice versa
  - Analyzing currency pair movements in forex markets where filtering out minor fluctuations
    helps spot major trend changes
  - Evaluating cryptocurrency price action over extended periods by focusing on significant
    price movements rather than time-based volatility
