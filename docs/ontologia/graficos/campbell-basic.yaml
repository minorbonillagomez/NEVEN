notes:
- Engine order lines are straight diagonal lines from the origin with slope = order_number
  / 60 (converting RPM to Hz)
- 'Natural frequency curves should show realistic behavior: slight variation with
  speed due to gyroscopic effects (some modes increase, some decrease with speed)'
- Critical speed intersections should be marked with distinct markers (e.g., red circles
  or diamonds)
