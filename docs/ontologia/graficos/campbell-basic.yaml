applications:
  en:
  - Rotordynamic analysis of turbomachinery (turbines, compressors, pumps) to identify
    critical speeds that must be avoided during operation
  - Automotive powertrain NVH (Noise, Vibration, Harshness) engineering to map engine
    order excitations against structural modes
  - Vibration analysis of rotating equipment during design validation to ensure natural
    frequencies are sufficiently separated from operating speed excitations
  es:
