entity_type: ChartType
id: feynman-basic
name:
  en: Feynman Diagram for Particle Interactions
  es: Feynman Basic Básico
description:
  en: 'A Feynman diagram visualizes interactions between subatomic particles in quantum
    field theory. Different line styles represent different particle types: straight
    lines for fermions (electrons, quarks), wavy lines for photons, curly/looped lines
    for gluons, and dashed lines for scalar bosons (e.g., Higgs). Lines meet at vertices
    representing interaction points. Invented by Richard Feynman, these diagrams are
    both a computational tool and a cultural icon of modern physics.'
  es: 'A Feynman diagram visualizes interactions between subatomic particles in quantum
    field theory. Different line styles represent different particle types: straight
    lines for fermions (electrons, quarks), wavy lines for photons, curly/looped lines
    for gluons, and dashed lines for scalar bosons (e.g., Higgs). Lines meet at vertices
    representing interaction points. Invented by Richard Feynman, these diagrams are
    both a computational tool and a cultural icon of modern physics.'
