notes:
- 'Use distinct line styles: solid/straight for fermions (with arrow for particle
  direction), wavy for photons, curly/looped for gluons, dashed for scalar bosons'
- 'Arrows on fermion lines indicate particle vs antiparticle flow (convention: particle
  flows forward in time, antiparticle backward)'
- Time axis typically runs left to right; label it if helpful
