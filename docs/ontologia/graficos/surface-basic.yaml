entity_type: ChartType
id: surface-basic
name:
  en: Basic 3D Surface Plot
  es: Superficie 3D Básico
description:
  en: A 3D surface plot visualizes a function of two variables as a continuous surface
    in three-dimensional space. The height (z-axis) represents the function value
    at each (x, y) point, with color encoding the same information to enhance depth
    perception. This visualization is ideal for understanding mathematical functions,
    terrain data, and response surfaces where the relationship between two inputs
    and one output needs to be explored.
  es: A 3D surface plot visualizes a function of two variables as a continuous surface
    in three-dimensional space. The height (z-axis) represents the function value
    at each (x, y) point, with color encoding the same information to enhance depth
    perception. This visualization is ideal for understanding mathematical functions,
    terrain data, and response surfaces where the relationship between two inputs
    and one output needs to be explored.
