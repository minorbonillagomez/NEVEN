id: polar-line
name:
  en: Polar Line Plot
  es: Gráfico Polar
description:
  en: A line plot rendered in polar coordinates, where data points are connected with
    lines around a circular axis. The angle (theta) typically represents a cyclical
    variable while the radius shows magnitude.
  es: A line plot rendered in polar coordinates, where data points are connected with
    lines around a circular axis. The angle (theta) typically represents a cyclical
    variable while the radius shows magnitude.
