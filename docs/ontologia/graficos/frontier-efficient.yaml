entity_type: ChartType
id: frontier-efficient
name:
  en: Efficient Frontier for Portfolio Optimization
  es: Frontier Efficient
description:
  en: The efficient frontier is a fundamental visualization in Modern Portfolio Theory
    (MPT) that displays a curve of optimal portfolios offering the highest expected
    return for each level of risk (standard deviation). Portfolios on the frontier
    are "efficient" because no other portfolio exists with higher return for the same
    risk, or lower risk for the same return. This plot is essential for asset allocation
    decisions and understanding the risk-return tradeoff in investment portfolios.
  es: The efficient frontier is a fundamental visualization in Modern Portfolio Theory
    (MPT) that displays a curve of optimal portfolios offering the highest expected
    return for each level of risk (standard deviation). Portfolios on the frontier
    are "efficient" because no other portfolio exists with higher return for the same
    risk, or lower risk for the same return. This plot is essential for asset allocation
    decisions and understanding the risk-return tradeoff in investment portfolios.
