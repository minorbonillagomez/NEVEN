entity_type: ChartType
id: line-confidence
name:
  en: Line Plot with Confidence Interval
  es: Gráfico de Líneas
description:
  en: A line plot with a confidence interval displays a central trend line (typically
    mean or median) surrounded by a shaded band representing uncertainty or variability.
    The combination of a clear central line and semi-transparent confidence region
    effectively communicates both the estimated value and its associated uncertainty,
    making it essential for visualizing statistical estimates, model predictions,
    and forecast ranges.
  es: A line plot with a confidence interval displays a central trend line (typically
    mean or median) surrounded by a shaded band representing uncertainty or variability.
    The combination of a clear central line and semi-transparent confidence region
    effectively communicates both the estimated value and its associated uncertainty,
    making it essential for visualizing statistical estimates, model predictions,
    and forecast ranges.
