entity_type: ChartType
id: ecdf-basic
name:
  en: Basic ECDF Plot
  es: Ecdf Basic Básico
description:
  en: An ECDF (Empirical Cumulative Distribution Function) plot displays a step function
    that shows the proportion of observations less than or equal to each value. Unlike
    histograms, ECDF plots require no binning or smoothing, providing a non-parametric
    estimate of the cumulative distribution. The y-axis ranges from 0 to 1, allowing
    direct reading of percentiles and quantiles from the visualization.
  es: An ECDF (Empirical Cumulative Distribution Function) plot displays a step function
    that shows the proportion of observations less than or equal to each value. Unlike
    histograms, ECDF plots require no binning or smoothing, providing a non-parametric
    estimate of the cumulative distribution. The y-axis ranges from 0 to 1, allowing
    direct reading of percentiles and quantiles from the visualization.
