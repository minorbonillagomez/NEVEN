entity_type: ChartType
id: skewt-logp-atmospheric
name:
  en: Skew-T Log-P Atmospheric Diagram
  es: Skewt Logp Atmospheric
description:
  en: A Skew-T Log-P diagram is a specialized thermodynamic chart used in meteorology
    to display vertical atmospheric profiles. It features a logarithmic pressure axis
    (inverted, with surface at bottom) and temperature isotherms skewed 45 degrees
    to the right, allowing simultaneous visualization of temperature, dewpoint, and
    derived stability parameters. This diagram is essential for analyzing atmospheric
    soundings and assessing weather conditions.
  es: A Skew-T Log-P diagram is a specialized thermodynamic chart used in meteorology
    to display vertical atmospheric profiles. It features a logarithmic pressure axis
    (inverted, with surface at bottom) and temperature isotherms skewed 45 degrees
    to the right, allowing simultaneous visualization of temperature, dewpoint, and
    derived stability parameters. This diagram is essential for analyzing atmospheric
    soundings and assessing weather conditions.
