entity_type: ChartType
id: scatter-regression-linear
name:
  en: Scatter Plot with Linear Regression
  es: Diagrama de Dispersión Regresión
description:
  en: A scatter plot that displays the relationship between two numeric variables
    with a fitted linear regression line and confidence interval band. This visualization
    extends the basic scatter plot by adding statistical modeling elements, making
    it ideal for understanding linear relationships, assessing model fit, and communicating
    the strength of correlations with visual uncertainty quantification.
  es: A scatter plot that displays the relationship between two numeric variables
    with a fitted linear regression line and confidence interval band. This visualization
    extends the basic scatter plot by adding statistical modeling elements, making
    it ideal for understanding linear relationships, assessing model fit, and communicating
    the strength of correlations with visual uncertainty quantification.
aliases:
  en:
  - scatter-regression-linear
  - scatter regression linear
  - regression scatter plot
  es:
  - scatter-regression-linear
  - scatter regression linear
  - diagrama de dispersión regresión
use_when:
  en:
  - Exploring relationship between two continuous variables
  - Detecting correlations (positive, negative, none)
  - Identifying outliers in bivariate data
  es:
  - Explorar relación entre dos variables continuas
  - Detectar correlaciones (positiva, negativa, ninguna)
  - Identificar valores atípicos en datos bivariados
avoid_when:
  en:
  - Categorical variables (use bar chart)
  - Time series (use line chart)
  es:
  - Variables categóricas (usar gráfico de barras)
  - Series temporales (usar gráfico de líneas)
applications:
  en:
  - Analyzing the relationship between advertising spend and sales revenue with prediction
    confidence
  - Studying the correlation between study hours and exam scores in educational research
  - Investigating the linear relationship between temperature and energy consumption
    in utility planning
  es:
  - Analyzing the relationship between advertising spend and sales revenue with prediction
    confidence
  - Studying the correlation between study hours and exam scores in educational research
  - Investigating the linear relationship between temperature and energy consumption
    in utility planning
