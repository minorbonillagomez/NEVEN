entity_type: ChartType
id: quiver-basic
name:
  en: Basic Quiver Plot
  es: Quiver Basic Básico
description:
  en: A quiver plot displays vector fields using arrows positioned at grid points.
    Each arrow represents a vector at that location, with direction indicating the
    vector's angle and length proportional to its magnitude. This visualization reveals
    flow patterns, gradients, and field structure in two-dimensional data.
  es: A quiver plot displays vector fields using arrows positioned at grid points.
    Each arrow represents a vector at that location, with direction indicating the
    vector's angle and length proportional to its magnitude. This visualization reveals
    flow patterns, gradients, and field structure in two-dimensional data.
