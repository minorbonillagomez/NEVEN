entity_type: ChartType
id: area-stacked
name:
  en: Stacked Area Chart
  es: Gráfico de Área Apilado
description:
  en: A stacked area chart displays multiple data series as areas stacked on top of
    each other, with each series starting where the previous one ends. This visualization
    emphasizes both individual contributions and cumulative totals over a continuous
    axis (typically time). It is ideal for showing how parts contribute to a whole
    while tracking changes over time, making patterns of composition and overall trends
    immediately visible.
  es: A stacked area chart displays multiple data series as areas stacked on top of
    each other, with each series starting where the previous one ends. This visualization
    emphasizes both individual contributions and cumulative totals over a continuous
    axis (typically time). It is ideal for showing how parts contribute to a whole
    while tracking changes over time, making patterns of composition and overall trends
    immediately visible.
