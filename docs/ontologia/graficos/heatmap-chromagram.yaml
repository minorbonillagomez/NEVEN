applications:
  en:
  - Music information retrieval researchers analyzing chord progressions and detecting
    key changes in audio recordings
  - Musicologists studying the harmonic structure and tonal patterns of classical
    or contemporary compositions
  - Audio engineers comparing tonal fingerprints of different recordings for music
    similarity analysis
  - Music educators visualizing harmonic progressions to teach students about chord
    theory and voice leading
