applications:
  en:
  - Pulmonology clinics diagnosing obstructive (e.g., asthma, COPD) vs restrictive
    (e.g., pulmonary fibrosis) lung disease by analyzing loop shape distortions
  - Respiratory therapy departments monitoring treatment effectiveness by overlaying
    pre- and post-bronchodilator flow-volume loops
  - Occupational health screening programs assessing lung function in workers exposed
    to respiratory hazards
  - Medical education teaching respiratory physiology and spirometry interpretation
    to students
