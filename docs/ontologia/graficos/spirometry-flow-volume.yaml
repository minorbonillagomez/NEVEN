notes:
- The expiratory limb (upper portion) should show a sharp rise to PEF followed by
  a decline that is roughly linear in a normal loop and scooped (bowed toward the
  volume axis) in obstruction
- The inspiratory limb (lower portion) should appear as a more symmetric, U-shaped
  curve below the zero flow line
- Mark Peak Expiratory Flow (PEF) with a labeled point or annotation
