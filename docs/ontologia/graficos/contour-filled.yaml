entity_type: ChartType
id: contour-filled
name:
  en: Filled Contour Plot
  es: Gráfico de Contorno
description:
  en: A filled contour plot displays colored regions between level curves of a 2D
    scalar field, creating a smooth gradient visualization of continuous data. Unlike
    basic contour plots that show only isolines, filled contours use color bands to
    represent value ranges, making it easier to perceive gradual changes and identify
    regions of similar magnitude. This visualization is particularly effective for
    showing how a quantity varies continuously across a 2D surface.
  es: A filled contour plot displays colored regions between level curves of a 2D
    scalar field, creating a smooth gradient visualization of continuous data. Unlike
    basic contour plots that show only isolines, filled contours use color bands to
    represent value ranges, making it easier to perceive gradual changes and identify
    regions of similar magnitude. This visualization is particularly effective for
    showing how a quantity varies continuously across a 2D surface.
