entity_type: ChartType
id: scatter-text
name:
  en: Scatter Plot with Text Labels Instead of Points
  es: Diagrama de Dispersión
description:
  en: A scatter plot where data points are represented by text labels instead of markers.
    Each label is positioned at its corresponding coordinates, making the text itself
    the visual element. This visualization is particularly useful for displaying named
    entities in 2D space, such as word embeddings, dimensionality reduction outputs,
    or any scenario where identifying individual items by name is more important than
    seeing their relative density.
  es: A scatter plot where data points are represented by text labels instead of markers.
    Each label is positioned at its corresponding coordinates, making the text itself
    the visual element. This visualization is particularly useful for displaying named
    entities in 2D space, such as word embeddings, dimensionality reduction outputs,
    or any scenario where identifying individual items by name is more important than
    seeing their relative density.
aliases:
  en:
  - scatter-text
  - scatter text
  - scatter plot
  es:
  - scatter-text
  - scatter text
  - diagrama de dispersión
use_when:
  en:
  - Exploring relationship between two continuous variables
  - Detecting correlations (positive, negative, none)
  - Identifying outliers in bivariate data
  es:
  - Explorar relación entre dos variables continuas
  - Detectar correlaciones (positiva, negativa, ninguna)
  - Identificar valores atípicos en datos bivariados
avoid_when:
  en:
  - Categorical variables (use bar chart)
  - Time series (use line chart)
  es:
  - Variables categóricas (usar gráfico de barras)
  - Series temporales (usar gráfico de líneas)
applications:
  en:
  - Visualizing word embeddings or document embeddings after t-SNE or UMAP dimensionality
    reduction
  - Displaying product or brand positioning in a competitive landscape analysis
  - Showing author or journal relationships in bibliometric studies
  - Mapping company positions based on two business metrics where company names matter
  es:
  - Visualizing word embeddings or document embeddings after t-SNE or UMAP dimensionality
    reduction
  - Displaying product or brand positioning in a competitive landscape analysis
  - Showing author or journal relationships in bibliometric studies
  - Mapping company positions based on two business metrics where company names matter
