applications:
  en:
  - Identifying trend direction in stock prices using 50-day and 200-day EMA crossovers
    (golden cross/death cross signals)
  - Detecting short-term momentum shifts in cryptocurrency trading using fast EMAs
    (12, 26 periods)
  - Generating entry/exit signals when price crosses above or below EMA lines in forex
    trading
