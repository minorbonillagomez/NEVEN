applications:
  en:
  - Analyzing stock price movements with a moving average to identify buy/sell signals
    and trend reversals
  - Monitoring website traffic or user engagement metrics with smoothed trends for
    seasonal pattern detection
  - Tracking sensor data (temperature, humidity) with noise reduction to reveal true
    environmental trends
  es:
