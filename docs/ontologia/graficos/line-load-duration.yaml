notes:
- The curve must be monotonically decreasing (load values sorted from highest to lowest)
- Shade or fill distinct regions under the curve to distinguish base load (rightmost,
  always-on), intermediate load (middle), and peak load (leftmost, brief spikes)
- Add horizontal dashed lines with labels indicating generation capacity tiers (e.g.,
  base load capacity, intermediate capacity, peak capacity)
