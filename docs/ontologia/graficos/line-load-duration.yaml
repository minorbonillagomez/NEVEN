applications:
  en:
  - 'Power system planning: determining the optimal mix of base load, intermediate,
    and peaking generation capacity based on load profile shape'
  - 'Utility rate design: calculating load factors and capacity utilization to inform
    pricing structures'
  - 'Renewable energy assessment: evaluating capacity credit and understanding how
    variable generation sources align with demand patterns'
  - 'Energy policy analysis: comparing load duration curves before and after demand-side
    management programs to quantify their impact'
