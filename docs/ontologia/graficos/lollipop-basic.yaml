entity_type: ChartType
id: lollipop-basic
name:
  en: Basic Lollipop Chart
  es: Gráfico de Piruleta Básico
description:
  en: A lollipop chart displays categorical data with thin lines (stems) extending
    from a baseline to circular markers (dots) at each data point. It presents the
    same information as a bar chart but with a cleaner, more minimalist aesthetic
    that reduces visual clutter while maintaining clear value comparisons.
  es: A lollipop chart displays categorical data with thin lines (stems) extending
    from a baseline to circular markers (dots) at each data point. It presents the
    same information as a bar chart but with a cleaner, more minimalist aesthetic
    that reduces visual clutter while maintaining clear value comparisons.
