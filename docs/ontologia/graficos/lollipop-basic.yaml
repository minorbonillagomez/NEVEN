  - basic lollipop chart
  es:
  - lollipop-basic
  - lollipop basic
  - gráfico de piruleta básico
use_when:
  en:
  - A lollipop chart displays categorical data with thin lines (stems) extending from
    a baseline to circular markers (dots) at each data point. It presents the same
    information as a bar chart but with a c
  es:
  - A lollipop chart displays categorical data with thin lines (stems) extending from
    a baseline to circular markers (dots) at each data point. It presents the same
    information as a bar chart but with a c
avoid_when:
  en: []
  es: []
applications:
  en:
  - Ranking top performers across categories (e.g., sales by region, employee scores)
  - Survey results with many response categories where bars would look cluttered
  - Year-over-year or period comparisons with discrete categories
  - Displaying sorted metrics where the relative position and exact value both matter
  es:
  - Ranking top performers across categories (e.g., sales by region, employee scores)
  - Survey results with many response categories where bars would look cluttered
  - Year-over-year or period comparisons with discrete categories
  - Displaying sorted metrics where the relative position and exact value both matter
