entity_type: ChartType
id: box-horizontal
name:
  en: Horizontal Box Plot
  es: Diagrama de Caja Horizontal
description:
  en: A horizontal box plot displays the distribution of numerical data through quartiles
    with the boxes oriented horizontally. This orientation is particularly useful
    when category labels are long or when comparing many groups, as it allows for
    easier reading of labels on the y-axis.
  es: A horizontal box plot displays the distribution of numerical data through quartiles
    with the boxes oriented horizontally. This orientation is particularly useful
    when category labels are long or when comparing many groups, as it allows for
    easier reading of labels on the y-axis.
aliases:
  en:
  - box-horizontal
  - box horizontal
  - horizontal box plot
  es:
  - box-horizontal
  - box horizontal
  - diagrama de caja horizontal
use_when:
  en:
  - Comparing distributions across groups
  - Identifying outliers and spread
  - Showing median, quartiles, and range
  es:
  - Comparar distribuciones entre grupos
  - Identificar valores atípicos y dispersión
  - Mostrar mediana, cuartiles y rango
avoid_when:
  en: []
  es: []
applications:
  en:
  - Comparing distributions across many categories with long names
  - Displaying salary ranges by job title or department
  - Analyzing test score distributions by course or subject
  - Visualizing response time distributions by service type
  es:
  - Comparing distributions across many categories with long names
  - Displaying salary ranges by job title or department
  - Analyzing test score distributions by course or subject
  - Visualizing response time distributions by service type
data_requirements:
  min_columns: 2
  max_columns: null
  column_types:
  - categorical
  - numeric
  recommended_rows:
