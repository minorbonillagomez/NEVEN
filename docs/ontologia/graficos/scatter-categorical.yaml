entity_type: ChartType
id: scatter-categorical
name:
  en: Categorical Scatter Plot
  es: Diagrama de Dispersión
description:
  en: A scatter plot where points are colored according to a categorical variable.
    Each category has a distinct color, allowing visual comparison of patterns across
    groups. A legend maps colors to category names.
  es: A scatter plot where points are colored according to a categorical variable.
    Each category has a distinct color, allowing visual comparison of patterns across
    groups. A legend maps colors to category names.
aliases:
  en:
  - scatter-categorical
  - scatter categorical
  - scatter plot
  es:
  - scatter-categorical
  - scatter categorical
  - diagrama de dispersión
use_when:
  en:
  - Exploring relationship between two continuous variables
  - Detecting correlations (positive, negative, none)
  - Identifying outliers in bivariate data
  es:
  - Explorar relación entre dos variables continuas
  - Detectar correlaciones (positiva, negativa, ninguna)
  - Identificar valores atípicos en datos bivariados
avoid_when:
  en:
  - Categorical variables (use bar chart)
  - Time series (use line chart)
  es:
  - Variables categóricas (usar gráfico de barras)
  - Series temporales (usar gráfico de líneas)
applications:
  en:
  - Visualizing relationships between variables across different groups
  - Comparing correlation patterns by category
  - Identifying clusters in multivariate data
  - Exploratory analysis with group membership
  es:
  - Visualizing relationships between variables across different groups
  - Comparing correlation patterns by category
  - Identifying clusters in multivariate data
  - Exploratory analysis with group membership
data_requirements:
  min_columns: 2
  max_columns: null
  column_types:
  - numeric
  - numeric
  recommended_rows:
    min: 20
    max: 5000
