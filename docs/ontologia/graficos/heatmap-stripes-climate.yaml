entity_type: ChartType
id: heatmap-stripes-climate
name:
  en: Climate Warming Stripes
  es: Mapa de Calor
description:
  en: Climate warming stripes (also known as "warming stripes") display temperature
    anomaly data as a sequence of vertical colored bars, one per year, using a blue-to-red
    diverging colormap. Created by climate scientist Ed Hawkins, this minimalist visualization
    strips away axes, labels, and gridlines to communicate long-term warming trends
    through pure color encoding. The progression from cool blues to warm reds makes
    temperature change immediately visible at a glance.
  es: Climate warming stripes (also known as "warming stripes") display temperature
    anomaly data as a sequence of vertical colored bars, one per year, using a blue-to-red
    diverging colormap. Created by climate scientist Ed Hawkins, this minimalist visualization
    strips away axes, labels, and gridlines to communicate long-term warming trends
    through pure color encoding. The progression from cool blues to warm reds makes
    temperature change immediately visible at a glance.
