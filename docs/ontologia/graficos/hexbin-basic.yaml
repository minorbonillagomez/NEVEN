entity_type: ChartType
id: hexbin-basic
name:
  en: Basic Hexbin Plot
  es: Diagrama Hexagonal Básico
description:
  en: A hexagonal binning plot that visualizes the density of 2D point data by aggregating
    points into hexagonal bins. The color intensity of each hexagon represents the
    count of points within it, making it ideal for revealing density patterns in large
    datasets where traditional scatter plots would show overlapping points. Hexagonal
    bins provide better visual representation than square pixels due to their isotropy
    (equal distance to neighboring cells in all directions).
  es: A hexagonal binning plot that visualizes the density of 2D point data by aggregating
    points into hexagonal bins. The color intensity of each hexagon represents the
    count of points within it, making it ideal for revealing density patterns in large
    datasets where traditional scatter plots would show overlapping points. Hexagonal
    bins provide better visual representation than square pixels due to their isotropy
    (equal distance to neighboring cells in all directions).
