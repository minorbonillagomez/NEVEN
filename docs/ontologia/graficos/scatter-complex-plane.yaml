entity_type: ChartType
id: scatter-complex-plane
name:
  en: Complex Plane Visualization (Argand Diagram)
  es: Diagrama de Dispersión
description:
  en: An Argand diagram plots complex numbers as points in the complex plane, with
    the real part on the x-axis and the imaginary part on the y-axis. Vectors from
    the origin to each point illustrate magnitude and phase angle, while a unit circle
    provides a geometric reference. This visualization is foundational for complex
    analysis, signal processing, and understanding operations like addition, multiplication,
    and roots of unity geometrically.
  es: An Argand diagram plots complex numbers as points in the complex plane, with
    the real part on the x-axis and the imaginary part on the y-axis. Vectors from
    the origin to each point illustrate magnitude and phase angle, while a unit circle
    provides a geometric reference. This visualization is foundational for complex
    analysis, signal processing, and understanding operations like addition, multiplication,
    and roots of unity geometrically.
aliases:
  en:
  - scatter-complex-plane
  - scatter complex plane
  - scatter plot
  es:
  - scatter-complex-plane
  - scatter complex plane
  - diagrama de dispersión
use_when:
  en:
  - Exploring relationship between two continuous variables
  - Detecting correlations (positive, negative, none)
  - Identifying outliers in bivariate data
  es:
  - Explorar relación entre dos variables continuas
  - Detectar correlaciones (positiva, negativa, ninguna)
  - Identificar valores atípicos en datos bivariados
avoid_when:
  en:
  - Categorical variables (use bar chart)
  - Time series (use line chart)
  es:
  - Variables categóricas (usar gráfico de barras)
  - Series temporales (usar gráfico de líneas)
applications:
  en:
  - Visualizing roots of polynomials in the complex plane to understand factorization
    and zero distribution
  - Showing nth roots of unity arranged symmetrically on the unit circle for number
    theory and FFT education
  - Illustrating complex transformations such as rotation and scaling by multiplying
    with a complex factor
  - Teaching Euler's formula and the relationship between rectangular (a+bi) and polar
    (r, theta) representations
  es:
  - Visualizing roots of polynomials in the complex plane to understand factorization
    and zero distribution
  - Showing nth roots of unity arranged symmetrically on the unit circle for number
    theory and FFT education
  - Illustrating complex transformations such as rotation and scaling by multiplying
    with a complex factor
  - Teaching Euler's formula and the relationship between rectangular (a+bi) and polar
    (r, theta) representations
