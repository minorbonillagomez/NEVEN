entity_type: ChartType
id: hive-basic
name:
  en: Basic Hive Plot
  es: Hive Basic Básico
description:
  en: A hive plot arranges network nodes on radial axes based on node properties (such
    as degree, category, or other attributes), enabling reproducible and directly
    comparable network visualizations. Unlike force-directed layouts which can produce
    different arrangements for identical networks, hive plots always render the same
    network identically, solving the "hairball" problem of traditional network graphs
    and making structural comparisons reliable.
  es: A hive plot arranges network nodes on radial axes based on node properties (such
    as degree, category, or other attributes), enabling reproducible and directly
    comparable network visualizations. Unlike force-directed layouts which can produce
    different arrangements for identical networks, hive plots always render the same
    network identically, solving the "hairball" problem of traditional network graphs
    and making structural comparisons reliable.
