entity_type: ChartType
id: parallel-categories-basic
name:
  en: Basic Parallel Categories Plot
  es: Coordenadas Paralelas
description:
  en: A parallel categories plot visualizes categorical data across multiple dimensions,
    with vertical axes representing each categorical variable and ribbons connecting
    categories to show observation flow. Unlike parallel coordinates (which use lines
    for numeric data), parallel categories use width-proportional ribbons to show
    counts or frequencies, making it ideal for understanding how categorical values
    co-occur and flow across multiple classification dimensions.
  es: A parallel categories plot visualizes categorical data across multiple dimensions,
    with vertical axes representing each categorical variable and ribbons connecting
    categories to show observation flow. Unlike parallel coordinates (which use lines
    for numeric data), parallel categories use width-proportional ribbons to show
    counts or frequencies, making it ideal for understanding how categorical values
    co-occur and flow across multiple classification dimensions.
