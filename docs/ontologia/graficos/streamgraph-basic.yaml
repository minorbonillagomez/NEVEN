entity_type: ChartType
id: streamgraph-basic
name:
  en: Basic Stream Graph
  es: Streamgraph Basic Básico
description:
  en: A streamgraph (also known as a stacked area chart with a centered baseline)
    displaying the composition of multiple categories over time with smooth, flowing
    curves. Unlike traditional stacked area charts, streamgraphs use a baseline centered
    around the x-axis, creating an organic, river-like appearance that emphasizes
    the overall shape and relative proportions of each category while minimizing the
    visual distortion of individual layers.
  es: A streamgraph (also known as a stacked area chart with a centered baseline)
    displaying the composition of multiple categories over time with smooth, flowing
    curves. Unlike traditional stacked area charts, streamgraphs use a baseline centered
    around the x-axis, creating an organic, river-like appearance that emphasizes
    the overall shape and relative proportions of each category while minimizing the
    visual distortion of individual layers.
