entity_type: ChartType
id: scatter-embedding
name:
  en: t-SNE and UMAP Embedding Visualization
  es: Diagrama de Dispersión
description:
  en: A scatter plot displaying high-dimensional data projected into 2D space using
    non-linear dimensionality reduction techniques such as t-SNE or UMAP. Points are
    colored by cluster or class label, revealing groupings and latent structure in
    the data. This is a standard visualization in machine learning for exploring embeddings,
    single-cell RNA-seq data, and NLP document clustering, helping practitioners verify
    that learned representations capture meaningful distinctions.
  es: A scatter plot displaying high-dimensional data projected into 2D space using
    non-linear dimensionality reduction techniques such as t-SNE or UMAP. Points are
    colored by cluster or class label, revealing groupings and latent structure in
    the data. This is a standard visualization in machine learning for exploring embeddings,
    single-cell RNA-seq data, and NLP document clustering, helping practitioners verify
    that learned representations capture meaningful distinctions.
aliases:
  en:
  - scatter-embedding
  - scatter embedding
  - scatter plot
  es:
  - scatter-embedding
  - scatter embedding
  - diagrama de dispersión
use_when:
  en:
  - Exploring relationship between two continuous variables
  - Detecting correlations (positive, negative, none)
  - Identifying outliers in bivariate data
  es:
  - Explorar relación entre dos variables continuas
  - Detectar correlaciones (positiva, negativa, ninguna)
  - Identificar valores atípicos en datos bivariados
avoid_when:
  en:
  - Categorical variables (use bar chart)
  - Time series (use line chart)
  es:
  - Variables categóricas (usar gráfico de barras)
  - Series temporales (usar gráfico de líneas)
applications:
  en:
  - Visualizing cell-type clusters in single-cell RNA-seq data after dimensionality
    reduction in bioinformatics workflows
  - Exploring word or document embeddings from NLP models to verify semantic groupings
    and detect outliers
  - Inspecting latent space structure of autoencoders or variational autoencoders
    (VAEs) to assess representation quality
  - Quality-checking clustering results from K-means or DBSCAN by overlaying cluster
    assignments on the 2D projection
  es:
  - Visualizing cell-type clusters in single-cell RNA-seq data after dimensionality
    reduction in bioinformatics workflows
  - Exploring word or document embeddings from NLP models to verify semantic groupings
    and detect outliers
  - Inspecting latent space structure of autoencoders or variational autoencoders
    (VAEs) to assess representation quality
  - Quality-checking clustering results from K-means or DBSCAN by overlaying cluster
    assignments on the 2D projection
