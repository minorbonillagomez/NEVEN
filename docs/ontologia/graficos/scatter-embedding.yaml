notes:
- Color each cluster/class with a distinct, colorblind-accessible color and include
  a legend mapping colors to labels
- Optionally annotate cluster centroids with the cluster label text
- Use moderate point size with slight transparency (alpha) to handle overlapping points
  in dense regions
