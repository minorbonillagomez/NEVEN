applications:
  en:
  - 'Hiking and trail planning: visualizing cumulative ascent, descent, and route
    difficulty along a trail'
  - 'Civil engineering: evaluating elevation changes along a proposed road or railway
    corridor'
  - 'Cycling stage profiles: showing climb categories and sprint points along a race
    stage (Tour de France style)'
  - 'GIS and geomorphology: extracting and analyzing terrain cross-sections from digital
    elevation models (DEMs)'
