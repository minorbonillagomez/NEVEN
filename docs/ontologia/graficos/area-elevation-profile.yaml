entity_type: ChartType
id: area-elevation-profile
name:
  en: Terrain Elevation Profile Along Transect
  es: Gráfico de Área
description:
  en: A cross-sectional line plot showing ground elevation along a path or transect
    line, with the area below the profile filled to create a terrain silhouette. Distance
    along the transect is plotted on the x-axis and elevation on the y-axis. This
    visualization is widely used in hiking and cycling route planning, civil engineering
    corridor design, and geomorphology to convey terrain shape and difficulty at a
    glance.
  es: A cross-sectional line plot showing ground elevation along a path or transect
    line, with the area below the profile filled to create a terrain silhouette. Distance
    along the transect is plotted on the x-axis and elevation on the y-axis. This
    visualization is widely used in hiking and cycling route planning, civil engineering
    corridor design, and geomorphology to convey terrain shape and difficulty at a
    glance.
