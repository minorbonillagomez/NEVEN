entity_type: ChartType
id: histogram-kde
name:
  en: Histogram with KDE Overlay
  es: Histograma
description:
  en: A histogram with kernel density estimate (KDE) overlay combines discrete binning
    with continuous density estimation to visualize the distribution of continuous
    data. The histogram bars show frequency counts in each bin while the smooth KDE
    curve reveals the underlying probability density, making it easier to perceive
    the true shape of the distribution without binning artifacts.
  es: A histogram with kernel density estimate (KDE) overlay combines discrete binning
    with continuous density estimation to visualize the distribution of continuous
    data. The histogram bars show frequency counts in each bin while the smooth KDE
    curve reveals the underlying probability density, making it easier to perceive
    the true shape of the distribution without binning artifacts.
aliases:
  en:
  - histogram-kde
  - histogram kde
  - histogram
  es:
  - histogram-kde
  - histogram kde
  - histograma
use_when:
  en:
  - Showing frequency distribution of continuous data
  - Understanding data shape (normal, skewed, bimodal)
  - Identifying common values and outliers
  es:
  - Mostrar distribución de frecuencia de datos continuos
  - Entender la forma de los datos (normal, sesgada, bimodal)
  - Identificar valores comunes y atípicos
avoid_when:
  en: []
  es: []
applications:
  en:
  - Analyzing financial return distributions to identify skewness and tail behavior
  - Exploring measurement data in quality control to compare observed frequencies
    with theoretical distributions
  - Understanding customer behavior patterns in marketing analytics with both discrete
    counts and smooth trends
  es:
  - Analyzing financial return distributions to identify skewness and tail behavior
  - Exploring measurement data in quality control to compare observed frequencies
    with theoretical distributions
  - Understanding customer behavior patterns in marketing analytics with both discrete
    counts and smooth trends
