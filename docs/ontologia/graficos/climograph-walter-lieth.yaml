entity_type: ChartType
id: climograph-walter-lieth
name:
  en: Walter-Lieth Climate Diagram
  es: Climograph Walter Lieth
description:
  en: 'A Walter-Lieth climate diagram (climograph) is the canonical visualization
    of a location''s annual climate, plotting monthly mean temperature and monthly
    precipitation over the twelve months on a single panel. It uses the classic 1:2
    axis-scaling convention where 10 °C on the temperature axis aligns with 20 mm
    on the precipitation axis, so the relationship between the two curves directly
    reveals water availability: where precipitation exceeds the temperature curve
    the period is humid (filled blue/hatched), and where the temperature curve rises
    above precipitation the period is arid (filled red/dotted). A header carries station
    metadata and annual means, while frost indicators along the baseline mark cold
    months.'
  es: 'A Walter-Lieth climate diagram (climograph) is the canonical visualization
    of a location''s annual climate, plotting monthly mean temperature and monthly
    precipitation over the twelve months on a single panel. It uses the classic 1:2
    axis-scaling convention where 10 °C on the temperature axis aligns with 20 mm
    on the precipitation axis, so the relationship between the two curves directly
    reveals water availability: where precipitation exceeds the temperature curve
    the period is humid (filled blue/hatched), and where the temperature curve rises
    above precipitation the period is arid (filled red/dotted). A header carries station
    metadata and annual means, while frost indicators along the baseline mark cold
    months.'
