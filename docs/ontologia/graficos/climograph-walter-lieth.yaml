notes:
- 'Apply the fixed Walter-Lieth scaling convention: the precipitation axis is 2× the
  temperature axis (10 °C ↔ 20 mm) so the two curves are directly comparable; above
  100 mm precipitation the scale is conventionally compressed (10:1) and that upper
  band is filled solid blue to indicate a perhumid (very wet) period'
- Temperature is drawn as a line on the left axis (often red); precipitation as a
  line (or bars) on the right axis (often blue)
- 'Fill the area between the curves: blue/hatched where precipitation > temperature
  curve (humid period), red/dotted where temperature > precipitation (arid period)
  — this is the diagram''s defining visual feature'
