applications:
  en:
  - Displaying wind speed and direction measurements from weather stations
  - Visualizing time-of-day patterns (e.g., website traffic by hour, energy consumption
    cycles)
  - Showing compass-based data such as animal migration directions or survey response
    distributions
  - Analyzing seasonal patterns where the circular nature emphasizes yearly cycles
