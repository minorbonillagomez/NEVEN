entity_type: ChartType
id: polar-basic
name:
  en: Basic Polar Chart
  es: Gráfico Polar Básico
description:
  en: A polar chart displays data points on a circular coordinate system where position
    is determined by angle (theta) and distance from center (radius). This visualization
    is ideal for cyclical patterns, directional data, or any dataset where angular
    relationships are meaningful. It reveals periodic trends and directional distributions
    that would be obscured in Cartesian coordinates.
  es: A polar chart displays data points on a circular coordinate system where position
    is determined by angle (theta) and distance from center (radius). This visualization
    is ideal for cyclical patterns, directional data, or any dataset where angular
    relationships are meaningful. It reveals periodic trends and directional distributions
    that would be obscured in Cartesian coordinates.
