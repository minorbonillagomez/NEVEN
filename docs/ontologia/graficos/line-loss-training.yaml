entity_type: ChartType
id: line-loss-training
name:
  en: Training Loss Curve
  es: Gráfico de Líneas
description:
  en: A line plot showing training and validation loss curves over epochs during neural
    network training. This visualization is essential for monitoring model training,
    detecting overfitting (when validation loss diverges from training loss), and
    determining optimal early stopping points. The dual-curve display reveals the
    gap between training and generalization performance.
  es: A line plot showing training and validation loss curves over epochs during neural
    network training. This visualization is essential for monitoring model training,
    detecting overfitting (when validation loss diverges from training loss), and
    determining optimal early stopping points. The dual-curve display reveals the
    gap between training and generalization performance.
