notes:
- Stack 3-5 tracks vertically with a shared x-axis representing genomic position (base
  pair coordinates)
- 'Gene track: use rectangles for exons, thin lines for introns, and arrows or chevrons
  to indicate strand direction'
- 'Coverage track: render as a filled area plot showing read depth across the region'
