applications:
  en:
  - Exploring gene structure and regulatory regions at specific genomic loci
  - Visualizing sequencing read coverage alongside gene annotations to assess expression
    levels
  - Displaying variant calls (SNPs, indels) in their genomic context relative to exons
    and regulatory elements
  - Integrating multi-omics data (epigenomics, transcriptomics, variants) at a single
    locus for biological interpretation
