entity_type: ChartType
id: genome-track-multi
name:
  en: Genome Track Viewer
  es: Genome Track Multi
description:
  en: A multi-track genome browser view that displays different types of genomic data
    aligned along a shared chromosomal coordinate axis. Multiple parallel horizontal
    tracks (gene annotations, read coverage, variants, regulatory elements) are stacked
    vertically, each showing a different data type at the same genomic locus. This
    visualization is essential for integrative genomics, enabling researchers to explore
    relationships between gene structure, expression, variation, and regulation in
    a single coordinated view.
  es: A multi-track genome browser view that displays different types of genomic data
    aligned along a shared chromosomal coordinate axis. Multiple parallel horizontal
    tracks (gene annotations, read coverage, variants, regulatory elements) are stacked
    vertically, each showing a different data type at the same genomic locus. This
    visualization is essential for integrative genomics, enabling researchers to explore
    relationships between gene structure, expression, variation, and regulation in
    a single coordinated view.
