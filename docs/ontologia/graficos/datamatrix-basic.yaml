entity_type: ChartType
id: datamatrix-basic
name:
  en: Basic Data Matrix 2D Barcode
  es: Datamatrix Basic Básico
description:
  en: A Data Matrix 2D barcode visualization that encodes data into a compact square
    or rectangular matrix of black and white cells. Data Matrix codes follow the ISO/IEC
    16022 standard, featuring an L-shaped finder pattern (solid borders on two adjacent
    sides) and alternating timing patterns on the opposite sides. This barcode format
    is ideal for marking small items and supports high data density with built-in
    error correction (ECC 200).
  es: A Data Matrix 2D barcode visualization that encodes data into a compact square
    or rectangular matrix of black and white cells. Data Matrix codes follow the ISO/IEC
    16022 standard, featuring an L-shaped finder pattern (solid borders on two adjacent
    sides) and alternating timing patterns on the opposite sides. This barcode format
    is ideal for marking small items and supports high data density with built-in
    error correction (ECC 200).
