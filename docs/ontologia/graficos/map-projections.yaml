entity_type: ChartType
id: map-projections
name:
  en: World Map with Different Projections
  es: Mapa
description:
  en: A world map demonstrating different cartographic projections and their distortion
    characteristics. This visualization showcases how the same geographic data appears
    under various map projections (Mercator, Robinson, Mollweide, Orthographic, etc.),
    revealing how each projection preserves or distorts area, shape, distance, or
    direction. The plot includes graticule (latitude/longitude grid lines) and optionally
    Tissot indicatrices to illustrate projection distortion patterns.
  es: A world map demonstrating different cartographic projections and their distortion
    characteristics. This visualization showcases how the same geographic data appears
    under various map projections (Mercator, Robinson, Mollweide, Orthographic, etc.),
    revealing how each projection preserves or distorts area, shape, distance, or
    direction. The plot includes graticule (latitude/longitude grid lines) and optionally
    Tissot indicatrices to illustrate projection distortion patterns.
