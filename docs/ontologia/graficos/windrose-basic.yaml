entity_type: ChartType
id: windrose-basic
name:
  en: Wind Rose Chart
  es: Windrose Basic Básico
description:
  en: A wind rose displays wind speed and direction data as a polar stacked histogram
    showing the frequency distribution of wind across compass directions. Each spoke
    represents a direction sector (typically 8-16 bins), with stacked colored segments
    indicating different wind speed ranges. This specialized meteorological visualization
    reveals dominant wind patterns, prevailing directions, and speed distributions
    simultaneously, making it essential for site assessment and environmental analysis.
  es: A wind rose displays wind speed and direction data as a polar stacked histogram
    showing the frequency distribution of wind across compass directions. Each spoke
    represents a direction sector (typically 8-16 bins), with stacked colored segments
    indicating different wind speed ranges. This specialized meteorological visualization
    reveals dominant wind patterns, prevailing directions, and speed distributions
    simultaneously, making it essential for site assessment and environmental analysis.
