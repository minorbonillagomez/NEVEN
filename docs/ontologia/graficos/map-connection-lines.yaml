entity_type: ChartType
id: map-connection-lines
name:
  en: Connection Lines Map (Origin-Destination)
  es: Mapa
description:
  en: A geographic map visualization showing connection lines (arcs or great circles)
    between pairs of locations. This plot excels at revealing spatial patterns in
    flows, routes, and relationships between places. The curved lines naturally represent
    shortest paths on Earth's surface while avoiding visual overlap with straight
    lines. Line properties like thickness or color can encode additional variables
    such as traffic volume or connection type.
  es: A geographic map visualization showing connection lines (arcs or great circles)
    between pairs of locations. This plot excels at revealing spatial patterns in
    flows, routes, and relationships between places. The curved lines naturally represent
    shortest paths on Earth's surface while avoiding visual overlap with straight
    lines. Line properties like thickness or color can encode additional variables
    such as traffic volume or connection type.
