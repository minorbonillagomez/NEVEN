entity_type: ChartType
id: histogram-stacked
name:
  en: Stacked Histogram
  es: Histograma Apilado
description:
  en: A histogram showing multiple groups stacked on top of each other within each
    bin. The total bar height represents the combined frequency, while colored segments
    show individual group contributions.
  es: A histogram showing multiple groups stacked on top of each other within each
    bin. The total bar height represents the combined frequency, while colored segments
    show individual group contributions.
aliases:
  en:
  - histogram-stacked
  - histogram stacked
  - stacked histogram
  es:
  - histogram-stacked
  - histogram stacked
  - histograma apilado
use_when:
  en:
  - Showing frequency distribution of continuous data
  - Understanding data shape (normal, skewed, bimodal)
  - Identifying common values and outliers
  es:
  - Mostrar distribución de frecuencia de datos continuos
  - Entender la forma de los datos (normal, sesgada, bimodal)
  - Identificar valores comunes y atípicos
avoid_when:
  en: []
  es: []
applications:
  en:
  - Comparing distributions of multiple groups
  - Showing composition within histogram bins
  - Total frequency with group breakdown
  - Demographic or categorical comparisons
  es:
  - Comparing distributions of multiple groups
  - Showing composition within histogram bins
  - Total frequency with group breakdown
  - Demographic or categorical comparisons
data_requirements:
  min_columns: 1
  max_columns: null
  column_types:
  - numeric
  recommended_rows:
    min: 30
    max: 100000
