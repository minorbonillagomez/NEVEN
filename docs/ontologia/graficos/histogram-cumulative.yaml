entity_type: ChartType
id: histogram-cumulative
name:
  en: Cumulative Histogram
  es: Histograma
description:
  en: A cumulative histogram (also known as an ogive or cumulative frequency histogram)
    displays the running total of observations up to each bin boundary. The y-axis
    shows cumulative count or proportion, creating a monotonically increasing step
    function that reaches the total sample size (or 1.0 for normalized).
  es: A cumulative histogram (also known as an ogive or cumulative frequency histogram)
    displays the running total of observations up to each bin boundary. The y-axis
    shows cumulative count or proportion, creating a monotonically increasing step
    function that reaches the total sample size (or 1.0 for normalized).
aliases:
  en:
  - histogram-cumulative
  - histogram cumulative
  - histogram
  es:
  - histogram-cumulative
  - histogram cumulative
  - histograma
use_when:
  en:
  - Showing frequency distribution of continuous data
  - Understanding data shape (normal, skewed, bimodal)
  - Identifying common values and outliers
  es:
  - Mostrar distribución de frecuencia de datos continuos
  - Entender la forma de los datos (normal, sesgada, bimodal)
  - Identificar valores comunes y atípicos
avoid_when:
  en: []
  es: []
applications:
  en:
  - Visualizing percentiles and quantile positions
  - Understanding data distribution thresholds (e.g., "what percentage is below X?")
  - Quality control and process analysis
  - Comparing empirical vs theoretical CDFs
  - Financial risk analysis (Value at Risk)
  es:
  - Visualizing percentiles and quantile positions
  - Understanding data distribution thresholds (e.g., "what percentage is below X?")
  - Quality control and process analysis
  - Comparing empirical vs theoretical CDFs
  - Financial risk analysis (Value at Risk)
