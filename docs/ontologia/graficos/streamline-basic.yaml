entity_type: ChartType
id: streamline-basic
name:
  en: Basic Streamline Plot
  es: Streamline Basic Básico
description:
  en: A streamline plot visualizes vector fields using smooth curves that are tangent
    to the field at every point. Unlike quiver plots that show discrete arrows, streamlines
    trace continuous paths through the field, revealing flow patterns, circulation,
    and field topology. This visualization is ideal for understanding fluid dynamics,
    electromagnetic fields, or gradient fields where the continuous nature of the
    flow is important.
  es: A streamline plot visualizes vector fields using smooth curves that are tangent
    to the field at every point. Unlike quiver plots that show discrete arrows, streamlines
    trace continuous paths through the field, revealing flow patterns, circulation,
    and field topology. This visualization is ideal for understanding fluid dynamics,
    electromagnetic fields, or gradient fields where the continuous nature of the
    flow is important.
