entity_type: ChartType
id: box-grouped
name:
  en: Grouped Box Plot
  es: Diagrama de Caja Agrupado
description:
  en: A grouped box plot displays multiple box plots side-by-side within each category,
    enabling comparison of distributions across subgroups. Each group contains boxes
    representing different subcategories or conditions, making it ideal for multi-factor
    comparisons and A/B testing scenarios with multiple metrics.
  es: A grouped box plot displays multiple box plots side-by-side within each category,
    enabling comparison of distributions across subgroups. Each group contains boxes
    representing different subcategories or conditions, making it ideal for multi-factor
    comparisons and A/B testing scenarios with multiple metrics.
aliases:
  en:
  - box-grouped
  - box grouped
  - grouped box plot
  es:
  - box-grouped
  - box grouped
  - diagrama de caja agrupado
use_when:
  en:
  - Comparing distributions across groups
  - Identifying outliers and spread
  - Showing median, quartiles, and range
  es:
  - Comparar distribuciones entre grupos
  - Identificar valores atípicos y dispersión
  - Mostrar mediana, cuartiles y rango
avoid_when:
  en: []
  es: []
applications:
  en:
  - Comparing treatment effects across different patient demographics in clinical
    trials
  - A/B testing with multiple metrics (conversion rate, time on site) across user
    segments
  - Analyzing performance distributions by department and experience level
  - Comparing experimental results across multiple factors in research studies
  es:
  - Comparing treatment effects across different patient demographics in clinical
    trials
  - A/B testing with multiple metrics (conversion rate, time on site) across user
    segments
  - Analyzing performance distributions by department and experience level
  - Comparing experimental results across multiple factors in research studies
