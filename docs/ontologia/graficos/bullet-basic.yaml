entity_type: ChartType
id: bullet-basic
name:
  en: Basic Bullet Chart
  es: Gráfico de Bala Básico
description:
  en: A bullet chart displays a single measure against qualitative ranges and a target
    marker, designed by Stephen Few as a space-efficient alternative to gauge charts.
    The linear format shows actual performance as a bar, a target as a vertical marker,
    and background bands representing qualitative ranges (poor/satisfactory/good).
    Its compact design allows multiple bullet charts to fit on a single dashboard
    for easy comparison across metrics.
  es: A bullet chart displays a single measure against qualitative ranges and a target
    marker, designed by Stephen Few as a space-efficient alternative to gauge charts.
    The linear format shows actual performance as a bar, a target as a vertical marker,
    and background bands representing qualitative ranges (poor/satisfactory/good).
    Its compact design allows multiple bullet charts to fit on a single dashboard
    for easy comparison across metrics.
