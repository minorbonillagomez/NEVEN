entity_type: ChartType
id: strip-basic
name:
  en: Basic Strip Plot
  es: Diagrama de Tiras Básico
description:
  en: A strip plot displays individual data points for each category along a single
    axis, with random horizontal jitter applied to reduce overplotting. Unlike box
    plots or violin plots that show summary statistics, strip plots reveal every observation,
    making them ideal for small to medium datasets where individual values matter.
    The random jitter spreads points horizontally within each category to show density
    through point accumulation.
  es: A strip plot displays individual data points for each category along a single
    axis, with random horizontal jitter applied to reduce overplotting. Unlike box
    plots or violin plots that show summary statistics, strip plots reveal every observation,
    making them ideal for small to medium datasets where individual values matter.
    The random jitter spreads points horizontally within each category to show density
    through point accumulation.
