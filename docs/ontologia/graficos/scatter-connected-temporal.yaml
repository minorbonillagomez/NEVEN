entity_type: ChartType
id: scatter-connected-temporal
name:
  en: Connected Scatter Plot with Temporal Path
  es: Diagrama de Dispersión
description:
  en: A scatter plot where data points are connected by lines in temporal order, revealing
    how two variables co-evolve over time. Unlike standard time series plots that
    show one variable against time, this plot encodes time as movement through 2D
    space, making cyclical patterns, regime changes, and directional trends visible.
    Popularized by the New York Times, it is a powerful tool for narrative data visualization.
  es: A scatter plot where data points are connected by lines in temporal order, revealing
    how two variables co-evolve over time. Unlike standard time series plots that
    show one variable against time, this plot encodes time as movement through 2D
    space, making cyclical patterns, regime changes, and directional trends visible.
    Popularized by the New York Times, it is a powerful tool for narrative data visualization.
aliases:
  en:
  - scatter-connected-temporal
  - scatter connected temporal
  - scatter plot
  es:
  - scatter-connected-temporal
  - scatter connected temporal
  - diagrama de dispersión
use_when:
  en:
  - Exploring relationship between two continuous variables
  - Detecting correlations (positive, negative, none)
  - Identifying outliers in bivariate data
  es:
  - Explorar relación entre dos variables continuas
  - Detectar correlaciones (positiva, negativa, ninguna)
  - Identificar valores atípicos en datos bivariados
avoid_when:
  en:
  - Categorical variables (use bar chart)
  - Time series (use line chart)
  es:
  - Variables categóricas (usar gráfico de barras)
  - Series temporales (usar gráfico de líneas)
applications:
  en:
  - Tracking the relationship between unemployment rate and inflation over decades
    (Phillips curve dynamics)
  - Visualizing how a country's life expectancy and GDP per capita change together
    year-over-year
  - Showing the co-evolution of temperature and CO2 concentration across climate epochs
  - Analyzing how two financial indicators (e.g., price and volume) move together
    over trading sessions
  es:
  - Tracking the relationship between unemployment rate and inflation over decades
    (Phillips curve dynamics)
  - Visualizing how a country's life expectancy and GDP per capita change together
    year-over-year
  - Showing the co-evolution of temperature and CO2 concentration across climate epochs
  - Analyzing how two financial indicators (e.g., price and volume) move together
    over trading sessions
