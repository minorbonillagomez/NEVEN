entity_type: ChartType
id: candlestick-basic
name:
  en: Basic Candlestick Chart
  es: Gráfico de Velas Básico
description:
  en: A candlestick chart displays open, high, low, and close (OHLC) price data for
    financial instruments over time. Each candlestick shows the price range within
    a specific period, with the body indicating the open-close range and the wicks
    (shadows) showing the high-low range. Color coding distinguishes bullish (price
    increase) from bearish (price decrease) periods, making it easy to identify trends
    and price patterns at a glance.
  es: A candlestick chart displays open, high, low, and close (OHLC) price data for
    financial instruments over time. Each candlestick shows the price range within
    a specific period, with the body indicating the open-close range and the wicks
    (shadows) showing the high-low range. Color coding distinguishes bullish (price
    increase) from bearish (price decrease) periods, making it easy to identify trends
    and price patterns at a glance.
