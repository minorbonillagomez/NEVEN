entity_type: ChartType
id: choropleth-basic
name:
  en: Choropleth Map with Regional Coloring
  es: Mapa Coroplético Básico
description:
  en: A choropleth map visualizes data by shading geographic regions (countries, states,
    or counties) according to a measured variable. This technique is ideal for showing
    regional patterns and spatial distributions, making it easy to identify areas
    with high or low values at a glance. The color intensity represents the data magnitude,
    creating an intuitive way to understand geographic variation.
  es: A choropleth map visualizes data by shading geographic regions (countries, states,
    or counties) according to a measured variable. This technique is ideal for showing
    regional patterns and spatial distributions, making it easy to identify areas
    with high or low values at a glance. The color intensity represents the data magnitude,
    creating an intuitive way to understand geographic variation.
