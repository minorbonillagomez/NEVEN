entity_type: ChartType
id: bar-3d-categorical
name:
  en: 3D Bar Chart for Categorical Comparison
  es: Gráfico de Barras 3D
description:
  en: A three-dimensional bar chart where bars rise from a 2D categorical grid, with
    height encoding the measured value. Two categorical axes define the grid position
    on the base plane while the vertical axis shows magnitude. This visualization
    extends the bar chart family into 3D space, making it effective for comparing
    values across two categorical dimensions simultaneously.
  es: A three-dimensional bar chart where bars rise from a 2D categorical grid, with
    height encoding the measured value. Two categorical axes define the grid position
    on the base plane while the vertical axis shows magnitude. This visualization
    extends the bar chart family into 3D space, making it effective for comparing
    values across two categorical dimensions simultaneously.
aliases:
  en:
  - bar-3d-categorical
  - bar 3d categorical
  - 3d bar chart
  es:
  - bar-3d-categorical
  - bar 3d categorical
  - gráfico de barras 3d
use_when:
  en:
  - Comparing values across categories
  - Showing rankings or distributions
  - Displaying discrete data
  es:
  - Comparar valores entre categorías
  - Mostrar rankings o distribuciones
  - Visualizar datos discretos
avoid_when:
  en:
  - Continuous data over time (use line chart)
  - Part-to-whole relationships (use pie)
  es:
  - Datos continuos en el tiempo (usar líneas)
  - Relaciones parte-todo (usar circular)
applications:
  en:
  - Comparing sales figures across product categories and geographic regions simultaneously
  - Displaying survey responses across two demographic dimensions (e.g., age group
    vs education level)
  - Showing experimental results with two categorical factors in factorial designs
  - Visualizing frequency tables or cross-tabulations with two grouping variables
  es:
  - Comparing sales figures across product categories and geographic regions simultaneously
  - Displaying survey responses across two demographic dimensions (e.g., age group
    vs education level)
  - Showing experimental results with two categorical factors in factorial designs
  - Visualizing frequency tables or cross-tabulations with two grouping variables
