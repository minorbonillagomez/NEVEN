entity_type: ChartType
id: survival-kaplan-meier
name:
  en: Kaplan-Meier Survival Plot
  es: Survival Kaplan Meier
description:
  en: A Kaplan-Meier survival plot visualizes the probability of survival (or event-free
    time) over a time period using a step function. It is the standard method for
    estimating survival functions from time-to-event data, handling censored observations
    where the event has not yet occurred. The plot shows how survival probability
    decreases over time, with optional confidence intervals and comparison between
    groups.
  es: A Kaplan-Meier survival plot visualizes the probability of survival (or event-free
    time) over a time period using a step function. It is the standard method for
    estimating survival functions from time-to-event data, handling censored observations
    where the event has not yet occurred. The plot shows how survival probability
    decreases over time, with optional confidence intervals and comparison between
    groups.
