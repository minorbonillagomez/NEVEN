entity_type: ChartType
id: curve-oc
name:
  en: Operating Characteristic (OC) Curve
  es: Curve Oc
description:
  en: An Operating Characteristic (OC) curve shows the probability of accepting a
    lot as a function of the true fraction defective in that lot. It is the primary
    tool for evaluating and comparing acceptance sampling plans, revealing how well
    an inspection plan discriminates between good and bad lots. The S-shaped curve
    highlights producer's risk (rejecting good lots) and consumer's risk (accepting
    bad lots), making it essential for designing effective quality inspection strategies.
  es: An Operating Characteristic (OC) curve shows the probability of accepting a
    lot as a function of the true fraction defective in that lot. It is the primary
    tool for evaluating and comparing acceptance sampling plans, revealing how well
    an inspection plan discriminates between good and bad lots. The S-shaped curve
    highlights producer's risk (rejecting good lots) and consumer's risk (accepting
    bad lots), making it essential for designing effective quality inspection strategies.
