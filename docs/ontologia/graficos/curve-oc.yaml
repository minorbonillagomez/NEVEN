notes:
- 'Compute acceptance probabilities using the binomial cumulative distribution function:
  P(accept) = sum of C(n,k) * p^k * (1-p)^(n-k) for k = 0 to c'
- Annotate AQL (Acceptable Quality Level) and LTPD (Lot Tolerance Percent Defective)
  on the x-axis with vertical reference lines or markers
- Mark producer's risk (alpha) at AQL and consumer's risk (beta) at LTPD with labeled
  points or shaded regions
