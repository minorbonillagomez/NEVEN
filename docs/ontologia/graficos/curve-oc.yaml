applications:
  en:
  - 'Quality inspection: designing and comparing single-sample acceptance sampling
    plans with different sample sizes and acceptance numbers'
  - 'Incoming goods inspection: evaluating whether a supplier''s defect rate meets
    contractual AQL (Acceptable Quality Level) requirements'
  - 'Regulatory compliance: assessing inspection plans against standards such as MIL-STD-1916
    or ISO 2859 for defense and commercial procurement'
  - 'Process improvement: visualizing how increasing sample size tightens the discrimination
    between acceptable and unacceptable lot quality'
