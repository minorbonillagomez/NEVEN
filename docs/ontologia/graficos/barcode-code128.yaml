entity_type: ChartType
id: barcode-code128
name:
  en: Code 128 Barcode
  es: Barcode Code128
description:
  en: A Code 128 barcode visualization that encodes alphanumeric data into a high-density
    linear barcode pattern. Code 128 is a widely-used 1D barcode format that supports
    the full 128 ASCII character set, with three code subsets (A, B, C) that can be
    switched dynamically for optimal encoding efficiency. This visualization generates
    scannable barcodes commonly found on shipping labels, industrial parts, and healthcare
    specimens.
  es: A Code 128 barcode visualization that encodes alphanumeric data into a high-density
    linear barcode pattern. Code 128 is a widely-used 1D barcode format that supports
    the full 128 ASCII character set, with three code subsets (A, B, C) that can be
    switched dynamically for optimal encoding efficiency. This visualization generates
    scannable barcodes commonly found on shipping labels, industrial parts, and healthcare
    specimens.
