entity_type: ChartType
id: upset-basic
name:
  en: UpSet Plot for Multi-Set Intersection Analysis
  es: Upset Basic Básico
description:
  en: An UpSet plot visualizes intersections of multiple sets using a matrix-based
    layout that scales far better than Venn diagrams beyond 3 sets. A horizontal bar
    chart shows individual set sizes, a dot-matrix indicates which sets participate
    in each intersection, and a vertical bar chart above shows the intersection cardinality.
    This is the modern standard for set intersection analysis, making complex overlaps
    between many sets immediately readable.
  es: An UpSet plot visualizes intersections of multiple sets using a matrix-based
    layout that scales far better than Venn diagrams beyond 3 sets. A horizontal bar
    chart shows individual set sizes, a dot-matrix indicates which sets participate
    in each intersection, and a vertical bar chart above shows the intersection cardinality.
    This is the modern standard for set intersection analysis, making complex overlaps
    between many sets immediately readable.
