notes:
- Intersections should be sorted by size (descending) by default, with degree-based
  sorting as an alternative
- Connected dots in the matrix show which sets form each intersection; unconnected
  dots indicate non-membership
- Horizontal bars on the left show individual set sizes (total members per set)
