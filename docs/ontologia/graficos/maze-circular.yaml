entity_type: ChartType
id: maze-circular
name:
  en: Circular Maze Puzzle
  es: Maze Circular
description:
  en: A circular maze puzzle visualization featuring concentric rings connected by
    radial passages. Unlike rectangular mazes, this design creates a unique solving
    experience where the player navigates inward through ring-shaped corridors. The
    maze has an entry point on the outer edge and a goal at the center, with algorithmically
    generated walls ensuring exactly one solvable path.
  es: A circular maze puzzle visualization featuring concentric rings connected by
    radial passages. Unlike rectangular mazes, this design creates a unique solving
    experience where the player navigates inward through ring-shaped corridors. The
    maze has an entry point on the outer edge and a goal at the center, with algorithmically
    generated walls ensuring exactly one solvable path.
