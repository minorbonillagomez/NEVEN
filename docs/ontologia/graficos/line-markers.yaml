entity_type: ChartType
id: line-markers
name:
  en: Line Plot with Markers
  es: Gráfico de Líneas
description:
  en: A line plot with visible markers at each data point, combining line and scatter
    plot features. This is particularly useful for sparse data where individual observations
    are significant.
  es: A line plot with visible markers at each data point, combining line and scatter
    plot features. This is particularly useful for sparse data where individual observations
    are significant.
aliases:
  en:
  - line-markers
  - line markers
  - line chart
  es:
  - line-markers
  - line markers
  - gráfico de líneas
use_when:
  en:
  - Showing trends over time
  - Displaying continuous data changes
  - Comparing multiple series
  es:
  - Mostrar tendencias en el tiempo
  - Visualizar cambios en datos continuos
  - Comparar múltiples series
avoid_when:
  en: []
  es: []
applications:
  en:
  - Sparse datasets where each point matters
  - Highlighting specific data points on trend lines
  - Experimental data with discrete measurements
  - Quality control charts with individual readings
  es:
  - Sparse datasets where each point matters
  - Highlighting specific data points on trend lines
  - Experimental data with discrete measurements
  - Quality control charts with individual readings
data_requirements:
  min_columns: 2
  max_columns: null
  column_types:
  - numeric|temporal
  - numeric
  recommended_rows:
    min: 10
    max: 10000
