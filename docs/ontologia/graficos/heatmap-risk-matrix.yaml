notes:
- Use a green-yellow-orange-red color gradient for the background grid cells based
  on the risk score (likelihood x impact)
- 'Axis labels should use descriptive terms: Likelihood axis (Rare, Unlikely, Possible,
  Likely, Almost Certain), Impact axis (Negligible, Minor, Moderate, Major, Catastrophic)'
- Risk items should be plotted as labeled markers with slight jitter to avoid overlapping
  when multiple risks share the same cell
