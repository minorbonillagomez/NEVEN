entity_type: ChartType
id: wordcloud-basic
name:
  en: Basic Word Cloud
  es: Nube de Palabras Básico
description:
  en: A word cloud displays text data where word size represents frequency or importance.
    Words are arranged to fill available space, creating a visual summary of text
    content that highlights prominent terms and patterns. This visualization is ideal
    for quickly identifying the most common themes or keywords in a body of text.
  es: A word cloud displays text data where word size represents frequency or importance.
    Words are arranged to fill available space, creating a visual summary of text
    content that highlights prominent terms and patterns. This visualization is ideal
    for quickly identifying the most common themes or keywords in a body of text.
