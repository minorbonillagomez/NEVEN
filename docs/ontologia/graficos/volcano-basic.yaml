notes:
- Include horizontal threshold line at -log10(0.05) ≈ 1.3 for significance cutoff
- Include vertical threshold lines at log2 fold change of ±1 (2-fold change) for effect
  size cutoffs
- 'Color points by significance status: non-significant (gray), significant up-regulated
  (red), significant down-regulated (blue)'
