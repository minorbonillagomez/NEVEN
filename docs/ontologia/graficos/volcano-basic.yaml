entity_type: ChartType
id: volcano-basic
name:
  en: Volcano Plot for Statistical Significance
  es: Volcano Basic Básico
description:
  en: A volcano plot displays statistical significance (-log10 p-value) on the y-axis
    versus effect size (log2 fold change) on the x-axis. Points are typically color-coded
    to highlight features that are both statistically significant and have large effect
    sizes. This visualization is essential for quickly identifying the most important
    changes in differential expression, proteomics, and genomics studies.
  es: A volcano plot displays statistical significance (-log10 p-value) on the y-axis
    versus effect size (log2 fold change) on the x-axis. Points are typically color-coded
    to highlight features that are both statistically significant and have large effect
    sizes. This visualization is essential for quickly identifying the most important
    changes in differential expression, proteomics, and genomics studies.
