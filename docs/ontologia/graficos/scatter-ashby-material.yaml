entity_type: ChartType
id: scatter-ashby-material
name:
  en: Ashby Material Selection Chart
  es: Diagrama de Dispersión
description:
  en: A log-log scatter plot comparing two material properties (e.g., Young's modulus
    vs. density) with material families displayed as labeled bubble regions. Developed
    by Michael Ashby for systematic material selection in engineering design, this
    chart enables rapid visual comparison of material classes across multiple property
    dimensions. It is a standard tool in materials science and mechanical engineering
    education.
  es: A log-log scatter plot comparing two material properties (e.g., Young's modulus
    vs. density) with material families displayed as labeled bubble regions. Developed
    by Michael Ashby for systematic material selection in engineering design, this
    chart enables rapid visual comparison of material classes across multiple property
    dimensions. It is a standard tool in materials science and mechanical engineering
    education.
aliases:
  en:
  - scatter-ashby-material
  - scatter ashby material
  - scatter plot
  es:
  - scatter-ashby-material
  - scatter ashby material
  - diagrama de dispersión
use_when:
  en:
  - Exploring relationship between two continuous variables
  - Detecting correlations (positive, negative, none)
  - Identifying outliers in bivariate data
  es:
  - Explorar relación entre dos variables continuas
  - Detectar correlaciones (positiva, negativa, ninguna)
  - Identificar valores atípicos en datos bivariados
avoid_when:
  en:
  - Categorical variables (use bar chart)
  - Time series (use line chart)
  es:
  - Variables categóricas (usar gráfico de barras)
  - Series temporales (usar gráfico de líneas)
applications:
  en:
  - Selecting lightweight yet stiff materials for aerospace structural components
    by comparing Young's modulus against density
  - Comparing thermal conductivity versus cost across material families for heat exchanger
    design
  - Teaching materials science students to reason about trade-offs between competing
    material properties
  es:
  - Selecting lightweight yet stiff materials for aerospace structural components
    by comparing Young's modulus against density
  - Comparing thermal conductivity versus cost across material families for heat exchanger
    design
  - Teaching materials science students to reason about trade-offs between competing
    material properties
