entity_type: ChartType
id: voronoi-basic
name:
  en: Voronoi Diagram for Spatial Partitioning
  es: Voronoi Basic Básico
description:
  en: A Voronoi diagram partitions a plane into regions based on the distance to a
    set of seed points, where each region contains all points closer to its seed than
    to any other. This visualization is essential for understanding spatial relationships,
    proximity analysis, and territorial boundaries. It reveals natural clustering
    patterns and helps identify areas of influence around data points.
  es: A Voronoi diagram partitions a plane into regions based on the distance to a
    set of seed points, where each region contains all points closer to its seed than
    to any other. This visualization is essential for understanding spatial relationships,
    proximity analysis, and territorial boundaries. It reveals natural clustering
    patterns and helps identify areas of influence around data points.
