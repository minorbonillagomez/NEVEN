notes:
- Use a stereographic or azimuthal equidistant projection so the circular sky boundary
  looks natural
- 'Invert magnitude for point sizing: brighter stars (lower magnitude) should map
  to larger points'
- Draw constellation lines as thin, semi-transparent lines connecting star pairs
