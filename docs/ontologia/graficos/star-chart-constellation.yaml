entity_type: ChartType
id: star-chart-constellation
name:
  en: Star Chart with Constellations
  es: Star Chart Constellation
description:
  en: A celestial map that plots stars on a sky projection (stereographic or azimuthal
    equidistant) with constellation stick-figure lines connecting notable stars. Star
    apparent magnitudes are represented by point size (brighter stars appear larger),
    and a coordinate grid overlays the chart for orientation. In the dark theme, a
    dark background mimics a night sky, making this an intuitive tool for identifying
    constellations and planning observations.
  es: A celestial map that plots stars on a sky projection (stereographic or azimuthal
    equidistant) with constellation stick-figure lines connecting notable stars. Star
    apparent magnitudes are represented by point size (brighter stars appear larger),
    and a coordinate grid overlays the chart for orientation. In the dark theme, a
    dark background mimics a night sky, making this an intuitive tool for identifying
    constellations and planning observations.
