entity_type: ChartType
id: map-tile-background
name:
  en: Map with Tile Background
  es: Mapa
description:
  en: A map visualization that displays data points on top of tile-based backgrounds
    such as OpenStreetMap, Stamen, or satellite imagery. Unlike vector-based basemaps,
    tile backgrounds provide rich geographic context including street-level detail,
    terrain, or satellite imagery that loads dynamically as the user navigates. This
    visualization is essential for location-based analysis where real-world geographic
    context enhances data interpretation.
  es: A map visualization that displays data points on top of tile-based backgrounds
    such as OpenStreetMap, Stamen, or satellite imagery. Unlike vector-based basemaps,
    tile backgrounds provide rich geographic context including street-level detail,
    terrain, or satellite imagery that loads dynamically as the user navigates. This
    visualization is essential for location-based analysis where real-world geographic
    context enhances data interpretation.
