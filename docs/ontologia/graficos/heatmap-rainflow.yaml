entity_type: ChartType
id: heatmap-rainflow
name:
  en: Rainflow Counting Matrix for Fatigue Analysis
  es: Mapa de Calor
description:
  en: A rainflow counting matrix visualizes the results of rainflow cycle counting
    from a load or stress time history. The matrix displays cycle counts as a 2D heatmap
    where one axis represents cycle amplitude (half-range), the other represents cycle
    mean value, and color intensity represents the frequency of each cycle combination.
    This is a fundamental tool in fatigue analysis and durability engineering, used
    to characterize variable-amplitude loading for fatigue life prediction.
  es: A rainflow counting matrix visualizes the results of rainflow cycle counting
    from a load or stress time history. The matrix displays cycle counts as a 2D heatmap
    where one axis represents cycle amplitude (half-range), the other represents cycle
    mean value, and color intensity represents the frequency of each cycle combination.
    This is a fundamental tool in fatigue analysis and durability engineering, used
    to characterize variable-amplitude loading for fatigue life prediction.
