notes:
- Display as a 2D heatmap with amplitude on the y-axis and mean on the x-axis
- Use a sequential colormap (e.g., viridis or hot) with a logarithmic or linear color
  scale to clearly distinguish high-frequency from low-frequency cycle bins
- Include a colorbar indicating cycle count values
