applications:
  en:
  - Visualizing hydrogen atom energy levels and spectral series (Lyman, Balmer, Paschen)
    to understand atomic emission and absorption spectra
  - Showing molecular orbital energy diagrams in chemistry to illustrate bonding,
    antibonding, and nonbonding interactions
  - Illustrating laser transitions and stimulated emission processes for photonics
    and quantum optics education
  - Teaching quantum mechanics concepts such as energy quantization, selection rules,
    and degeneracy in atomic physics courses
  es:
  - Visualizing hydrogen atom energy levels and spectral series (Lyman, Balmer, Paschen)
    to understand atomic emission and absorption spectra
