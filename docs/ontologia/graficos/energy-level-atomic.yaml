notes:
- Horizontal lines should span partial width of the plot area, not full width, and
  be labeled with quantum numbers or orbital designations
- Downward arrows represent emission transitions; upward arrows represent absorption
  transitions
- Color arrows by wavelength or frequency of the transition to convey spectral information
  visually
