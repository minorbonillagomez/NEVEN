entity_type: ChartType
id: energy-level-atomic
name:
  en: Atomic Energy Level Diagram
  es: Energy Level Atomic
description:
  en: An energy level diagram displays quantized energy states as horizontal lines
    positioned at their respective energy values, with vertical arrows representing
    transitions between levels. This visualization reveals the discrete nature of
    atomic and molecular energy structures, making it essential for understanding
    spectral series, electron configurations, and quantum state transitions. It provides
    an intuitive way to connect abstract quantum numbers to observable spectral phenomena.
  es: An energy level diagram displays quantized energy states as horizontal lines
    positioned at their respective energy values, with vertical arrows representing
    transitions between levels. This visualization reveals the discrete nature of
    atomic and molecular energy structures, making it essential for understanding
    spectral series, electron configurations, and quantum state transitions. It provides
    an intuitive way to connect abstract quantum numbers to observable spectral phenomena.
