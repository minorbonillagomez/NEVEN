entity_type: ChartType
id: pp-basic
name:
  en: Probability-Probability (P-P) Plot
  es: Gráfico P-P Básico
description:
  en: A diagnostic plot comparing the cumulative distribution function (CDF) of observed
    data against a theoretical distribution by plotting empirical CDF values against
    theoretical CDF values. Unlike Q-Q plots which compare quantiles, P-P plots compare
    cumulative probabilities on both axes (0 to 1), making them more sensitive to
    deviations in the center of the distribution. Points falling along the 45-degree
    diagonal indicate a good fit.
  es: A diagnostic plot comparing the cumulative distribution function (CDF) of observed
    data against a theoretical distribution by plotting empirical CDF values against
    theoretical CDF values. Unlike Q-Q plots which compare quantiles, P-P plots compare
    cumulative probabilities on both axes (0 to 1), making them more sensitive to
    deviations in the center of the distribution. Points falling along the 45-degree
    diagonal indicate a good fit.
