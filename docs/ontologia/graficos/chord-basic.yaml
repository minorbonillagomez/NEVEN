entity_type: ChartType
id: chord-basic
name:
  en: Basic Chord Diagram
  es: Diagrama de Cuerdas Básico
description:
  en: A chord diagram displays relationships or flows between entities arranged around
    a circle's perimeter. Arcs (chords) connect related entities, with chord width
    proportional to the flow magnitude. This visualization excels at revealing the
    overall structure of connections and identifying the strongest relationships within
    a system.
  es: A chord diagram displays relationships or flows between entities arranged around
    a circle's perimeter. Arcs (chords) connect related entities, with chord width
    proportional to the flow magnitude. This visualization excels at revealing the
    overall structure of connections and identifying the strongest relationships within
    a system.
