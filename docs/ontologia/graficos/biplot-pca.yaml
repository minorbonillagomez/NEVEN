applications:
  en:
  - Exploratory data analysis to understand which variables contribute most to data
    variance and how samples cluster in reduced dimensionality
  - Quality control in manufacturing to visualize relationships between process variables
    and identify outliers in multivariate measurements
  - Gene expression analysis to reveal sample groupings and identify which genes drive
    biological variation across conditions
