entity_type: ChartType
id: biplot-pca
name:
  en: PCA Biplot with Scores and Loading Vectors
  es: Biplot Pca
description:
  en: A PCA biplot simultaneously displays both observation scores (as points) and
    variable loadings (as arrows) in the principal component space. This dual representation
    is essential for interpreting PCA results, revealing how observations relate to
    each other and which original variables drive the separation along each principal
    component. The length and direction of loading arrows indicate variable importance
    and correlation with the components.
  es: A PCA biplot simultaneously displays both observation scores (as points) and
    variable loadings (as arrows) in the principal component space. This dual representation
    is essential for interpreting PCA results, revealing how observations relate to
    each other and which original variables drive the separation along each principal
    component. The length and direction of loading arrows indicate variable importance
    and correlation with the components.
