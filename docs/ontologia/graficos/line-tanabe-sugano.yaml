notes:
- One dⁿ configuration per chart; prefer a d⁴–d⁷ configuration (d⁶ and d⁷ are classic
  textbook examples), because only these have the high-spin/low-spin crossover, whose
  vertical line and kink make the diagram recognizable, while d², d³ and d⁸ remain
  valid choices without a crossover; state the configuration and the C/B ratio used
  in the title or a subtitle, since curve shapes depend on it
- Curve energies follow from diagonalizing the Tanabe-Sugano matrices for the chosen
  dⁿ at a fixed C/B ratio, then subtracting the ground-term energy at each Δ_o/B —
  do not approximate the curves with hand-fitted splines
- The ground term is flat at E/B = 0 by construction; draw it as a visible curve along
  the axis, not as an omitted baseline
