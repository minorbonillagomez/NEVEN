applications:
  en:
  - Assigning d-d absorption bands in the UV-Vis spectrum of a coordination complex
    to specific term-to-term transitions
  - Estimating the octahedral splitting Δ_o and the Racah parameter B of a complex
    from two or three measured band positions
  - Teaching crystal field and ligand field theory, where the diagram connects term
    symbols to observable spectra
  - Predicting whether a given dⁿ ion with a given ligand set is high-spin or low-spin
    from the position of its Δ_o/B relative to the crossover
