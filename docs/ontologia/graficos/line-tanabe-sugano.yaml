entity_type: ChartType
id: line-tanabe-sugano
name:
  en: Tanabe-Sugano Diagram for Crystal Field Theory
  es: Gráfico de Líneas
description:
  en: 'A Tanabe-Sugano diagram plots the energies of the electronic term states of
    a transition-metal ion in an octahedral ligand field as continuous functions of
    the field strength. The x-axis is the reduced ligand-field strength Δ_o/B (octahedral
    splitting divided by the Racah parameter B) and the y-axis is the reduced term
    energy E/B measured from the ground term, which therefore runs along the x-axis
    itself as a horizontal line at E/B = 0. Each term — labeled with its full symbol
    including spin multiplicity and Mulliken label — is one curve, and for d⁴–d⁷ a
    vertical line marks the high-spin/low-spin crossover where the ground term changes
    and every curve kinks. Chemists read the chart in reverse: matching ratios of
    observed UV-Vis band energies against the curves yields both Δ_o and B for a real
    complex.'
  es: 'A Tanabe-Sugano diagram plots the energies of the electronic term states of
    a transition-metal ion in an octahedral ligand field as continuous functions of
    the field strength. The x-axis is the reduced ligand-field strength Δ_o/B (octahedral
    splitting divided by the Racah parameter B) and the y-axis is the reduced term
    energy E/B measured from the ground term, which therefore runs along the x-axis
    itself as a horizontal line at E/B = 0. Each term — labeled with its full symbol
    including spin multiplicity and Mulliken label — is one curve, and for d⁴–d⁷ a
    vertical line marks the high-spin/low-spin crossover where the ground term changes
    and every curve kinks. Chemists read the chart in reverse: matching ratios of
    observed UV-Vis band energies against the curves yields both Δ_o and B for a real
    complex.'
