notes:
- Display R² value prominently on the plot to indicate goodness of fit
- Polynomial curve should be visually distinct from scatter points (solid line, contrasting
  color)
- Use polynomial degree 2 (quadratic) as default; higher degrees (3-4) for more complex
  curves
