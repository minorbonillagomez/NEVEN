entity_type: ChartType
id: scatter-regression-polynomial
name:
  en: Scatter Plot with Polynomial Regression
  es: Diagrama de Dispersión Regresión
description:
  en: A scatter plot displaying the relationship between two numeric variables with
    a fitted polynomial regression curve (degree 2-4). This visualization extends
    beyond linear regression to capture non-linear relationships in data, making it
    ideal for modeling curved trends, parabolic patterns, and complex data relationships
    where a straight line would not adequately represent the underlying pattern.
  es: A scatter plot displaying the relationship between two numeric variables with
    a fitted polynomial regression curve (degree 2-4). This visualization extends
    beyond linear regression to capture non-linear relationships in data, making it
    ideal for modeling curved trends, parabolic patterns, and complex data relationships
    where a straight line would not adequately represent the underlying pattern.
aliases:
  en:
  - scatter-regression-polynomial
  - scatter regression polynomial
  - regression scatter plot
  es:
  - scatter-regression-polynomial
  - scatter regression polynomial
  - diagrama de dispersión regresión
use_when:
  en:
  - Exploring relationship between two continuous variables
  - Detecting correlations (positive, negative, none)
  - Identifying outliers in bivariate data
  es:
  - Explorar relación entre dos variables continuas
  - Detectar correlaciones (positiva, negativa, ninguna)
  - Identificar valores atípicos en datos bivariados
avoid_when:
  en:
  - Categorical variables (use bar chart)
  - Time series (use line chart)
  es:
  - Variables categóricas (usar gráfico de barras)
  - Series temporales (usar gráfico de líneas)
applications:
  en:
  - Analyzing diminishing returns in economics where initial gains decrease over time
  - Studying growth curves in biology where populations follow sigmoid or exponential
    patterns
  - Modeling physical phenomena like projectile motion or thermal expansion with quadratic
    relationships
  es:
  - Analyzing diminishing returns in economics where initial gains decrease over time
  - Studying growth curves in biology where populations follow sigmoid or exponential
    patterns
  - Modeling physical phenomena like projectile motion or thermal expansion with quadratic
    relationships
