entity_type: ChartType
id: bar-horizontal
name:
  en: Horizontal Bar Chart
  es: Gráfico de Barras Horizontal
description:
  en: A horizontal bar chart displaying categorical data with rectangular bars extending
    horizontally from the y-axis. The length of each bar is proportional to the value
    it represents. This orientation is particularly effective when category names
    are long or numerous, as horizontal labels are easier to read than rotated vertical
    labels. Horizontal bar charts excel at rankings, comparisons, and survey results
    visualization.
  es: A horizontal bar chart displaying categorical data with rectangular bars extending
    horizontally from the y-axis. The length of each bar is proportional to the value
    it represents. This orientation is particularly effective when category names
    are long or numerous, as horizontal labels are easier to read than rotated vertical
    labels. Horizontal bar charts excel at rankings, comparisons, and survey results
    visualization.
aliases:
  en:
  - bar-horizontal
  - bar horizontal
  - horizontal bar chart
  es:
  - bar-horizontal
  - bar horizontal
  - gráfico de barras horizontal
use_when:
  en:
  - Comparing values across categories
  - Showing rankings or distributions
  - Displaying discrete data
  es:
  - Comparar valores entre categorías
  - Mostrar rankings o distribuciones
  - Visualizar datos discretos
avoid_when:
  en:
  - Continuous data over time (use line chart)
  - Part-to-whole relationships (use pie)
  es:
  - Datos continuos en el tiempo (usar líneas)
  - Relaciones parte-todo (usar circular)
applications:
  en:
  - Displaying survey results with descriptive response options
  - Showing ranked lists such as top products, countries by population, or employee
    performance
  - Creating population pyramid base charts for demographic analysis
  es:
  - Displaying survey results with descriptive response options
  - Showing ranked lists such as top products, countries by population, or employee
    performance
  - Creating population pyramid base charts for demographic analysis
data_requirements:
