entity_type: ChartType
id: histogram-stepwise
name:
  en: Step Histogram
  es: Histograma
description:
  en: A histogram displayed as step lines (outline only) without filled bars. The
    distribution is shown as connected horizontal and vertical line segments, creating
    a step function appearance.
  es: A histogram displayed as step lines (outline only) without filled bars. The
    distribution is shown as connected horizontal and vertical line segments, creating
    a step function appearance.
aliases:
  en:
  - histogram-stepwise
  - histogram stepwise
  - histogram
  es:
  - histogram-stepwise
  - histogram stepwise
  - histograma
use_when:
  en:
  - Showing frequency distribution of continuous data
  - Understanding data shape (normal, skewed, bimodal)
  - Identifying common values and outliers
  es:
  - Mostrar distribución de frecuencia de datos continuos
  - Entender la forma de los datos (normal, sesgada, bimodal)
  - Identificar valores comunes y atípicos
avoid_when:
  en: []
  es: []
applications:
  en:
  - Comparing multiple distributions without visual overlap
  - Clean, minimal histogram visualization
  - Overlaying distributions for direct comparison
  - Print-friendly histogram representation
  es:
  - Comparing multiple distributions without visual overlap
  - Clean, minimal histogram visualization
  - Overlaying distributions for direct comparison
  - Print-friendly histogram representation
data_requirements:
  min_columns: 1
  max_columns: null
  column_types:
  - numeric
  recommended_rows:
    min: 30
    max: 100000
