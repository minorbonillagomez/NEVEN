notes:
- Nodes should be reorderable by cluster, degree, or community assignment to expose
  block-diagonal structure
- For undirected graphs the matrix is symmetric; implementations should fill both
  triangles
- Color intensity maps to edge weight; absent edges should use a distinct background
  (e.g., white or near-white)
