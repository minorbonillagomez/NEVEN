entity_type: ChartType
id: heatmap-adjacency
name:
  en: Network Adjacency Matrix Heatmap
  es: Mapa de Calor
description:
  en: A matrix-based representation of a network or graph where rows and columns represent
    nodes and cell color indicates the presence or weight of edges between them. This
    visualization complements node-link diagrams by excelling at revealing clusters,
    structural patterns, and density in large or dense networks where node-link layouts
    become cluttered. Reordering nodes by cluster, degree, or community membership
    exposes block-diagonal structure and makes group boundaries immediately visible.
  es: A matrix-based representation of a network or graph where rows and columns represent
    nodes and cell color indicates the presence or weight of edges between them. This
    visualization complements node-link diagrams by excelling at revealing clusters,
    structural patterns, and density in large or dense networks where node-link layouts
    become cluttered. Reordering nodes by cluster, degree, or community membership
    exposes block-diagonal structure and makes group boundaries immediately visible.
