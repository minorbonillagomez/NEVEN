notes:
- Each row of stacked bars represents a depth level in the call stack, with the root
  at the bottom
- Bar width encodes the proportion of total samples, not execution order (x-axis ordering
  is alphabetical or arbitrary, not temporal)
- Use a warm color palette (yellows, oranges, reds) following the conventional flame
  graph aesthetic
