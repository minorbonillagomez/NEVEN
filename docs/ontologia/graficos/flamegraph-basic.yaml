entity_type: ChartType
id: flamegraph-basic
name:
  en: Flame Graph for Performance Profiling
  es: Flamegraph Basic Básico
description:
  en: A flame graph visualizes hierarchical call stack data from performance profiling,
    where each horizontal bar represents a function in the call stack and its width
    is proportional to the time (or samples) spent in that function. Stacks are layered
    bottom-to-top showing caller-to-callee relationships. Invented by Brendan Gregg,
    flame graphs are the standard visualization for identifying CPU bottlenecks and
    hot code paths across all major programming languages and profiling tools.
  es: A flame graph visualizes hierarchical call stack data from performance profiling,
    where each horizontal bar represents a function in the call stack and its width
    is proportional to the time (or samples) spent in that function. Stacks are layered
    bottom-to-top showing caller-to-callee relationships. Invented by Brendan Gregg,
    flame graphs are the standard visualization for identifying CPU bottlenecks and
    hot code paths across all major programming languages and profiling tools.
