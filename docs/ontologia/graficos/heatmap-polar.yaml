entity_type: ChartType
id: heatmap-polar
name:
  en: Polar Heatmap for Cyclic Two-Dimensional Data
  es: Mapa de Calor
description:
  en: A heatmap wrapped around a circle where the angular axis represents a cyclic
    variable (e.g., hour of day, month) and the radial axis represents a second categorical
    or ordinal variable (e.g., day of week, year). Cell color encodes the measured
    value. This visualization reveals patterns in data with inherent cyclical structure
    that rectangular heatmaps distort, since the first and last angular bins are visually
    adjacent rather than separated at opposite ends of a row.
  es: A heatmap wrapped around a circle where the angular axis represents a cyclic
    variable (e.g., hour of day, month) and the radial axis represents a second categorical
    or ordinal variable (e.g., day of week, year). Cell color encodes the measured
    value. This visualization reveals patterns in data with inherent cyclical structure
    that rectangular heatmaps distort, since the first and last angular bins are visually
    adjacent rather than separated at opposite ends of a row.
