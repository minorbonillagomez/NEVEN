entity_type: ChartType
id: candlestick-volume
name:
  en: Stock Candlestick Chart with Volume
  es: Gráfico de Velas
description:
  en: A professional candlestick chart combining OHLC (open, high, low, close) price
    data with volume bars in a synchronized lower pane. The dual-pane layout presents
    price action in the main chart with corresponding trading volume below, sharing
    a common time axis. This format is the standard for technical analysis platforms,
    enabling traders to correlate price movements with trading activity and identify
    volume-confirmed trends or reversals.
  es: A professional candlestick chart combining OHLC (open, high, low, close) price
    data with volume bars in a synchronized lower pane. The dual-pane layout presents
    price action in the main chart with corresponding trading volume below, sharing
    a common time axis. This format is the standard for technical analysis platforms,
    enabling traders to correlate price movements with trading activity and identify
    volume-confirmed trends or reversals.
