entity_type: ChartType
id: tree-phylogenetic
name:
  en: Phylogenetic Tree Diagram
  es: Tree Phylogenetic
description:
  en: A phylogenetic tree (evolutionary tree) visualization showing hierarchical relationships
    between species or sequences, with branch lengths proportional to evolutionary
    distance. This diagram reveals how organisms or genes evolved from common ancestors,
    with longer branches indicating greater divergence. Phylogenetic trees are essential
    for understanding evolutionary history, taxonomy, and molecular biology relationships.
  es: A phylogenetic tree (evolutionary tree) visualization showing hierarchical relationships
    between species or sequences, with branch lengths proportional to evolutionary
    distance. This diagram reveals how organisms or genes evolved from common ancestors,
    with longer branches indicating greater divergence. Phylogenetic trees are essential
    for understanding evolutionary history, taxonomy, and molecular biology relationships.
