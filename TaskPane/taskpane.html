<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEVEN Studio</title>
  <link rel="stylesheet" href="taskpane.css?v=5">
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

</head>
<body>

  <div class="header">
    <h1>NEVEN Studio</h1>
    <span class="version">v3.0</span>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="viewers">Viewers</div>
    <div class="tab" data-tab="sql">SQL</div>
    <div class="tab" data-tab="data-studio">Data Studio</div>
  </div>

  <!-- Tab: Viewers -->
  <div class="tab-content active" id="viewers">
    <div class="card">
      <div class="card-title">Visualizacion Activa</div>
      <div id="viewers-msg" class="msg-info">Ejecute =P.Geodata(), =P.Dashboard(), etc. en Excel</div>
      <div class="controls" style="margin-top:6px">
        <button class="btn btn-primary" id="btn-load-viewer">Cargar Viewer</button>
      </div>
    </div>
    <div id="viz-chart" style="display:none;height:calc(100vh - 200px);"></div>
  </div>

  <!-- Tab: SQL -->
  <div class="tab-content" id="sql">
    <div class="card">
      <div class="card-title">Consulta SQL (tabla: dataset)</div>
      <textarea class="sql-editor" id="sql-input" placeholder="SELECT * FROM dataset LIMIT 100"></textarea>
      <div class="controls" style="margin-top:6px">
        <button class="btn btn-primary" id="btn-sql-run">Ejecutar</button>
        <span id="sql-status"></span>
      </div>
    </div>
    <div id="sql-error" class="msg-error" style="display:none"></div>
    <div id="sql-results"></div>
  </div>

  <!-- Tab: Data Studio -->
  <div class="tab-content" id="data-studio">
    <div class="card">
      <div class="card-title">Datos</div>
      <div class="controls">
        <input type="text" id="csv-path" placeholder="C:/ruta/archivo.csv" style="flex:1;min-width:180px">
        <button class="btn btn-primary" id="btn-load">Cargar CSV</button>
        <button class="btn btn-secondary" id="btn-bridge-read">Leer de Excel</button>
      </div>
      <div id="data-info" class="msg-info">Cargue CSV o use "Leer de Excel"</div>
    </div>
    <div id="preview-area"></div>
    <div id="pivot-area" style="display:none;margin-top:8px;">
      <div class="card-title" style="margin-bottom:4px">Pivot Table</div>
      <div id="pivot-output"></div>
    </div>
    <div style="margin-top:6px">
      <button class="btn btn-secondary" id="btn-pivot" style="display:none">Abrir Pivot</button>
    </div>
    <div class="card" id="groupby-card" style="display:none">
      <div class="card-title">GROUP BY</div>
      <div class="controls">
        <select id="grp-col"></select>
        <select id="grp-metric">
          <option value="SUM">Suma</option>
          <option value="AVG">Media</option>
          <option value="COUNT">Count</option>
          <option value="MIN">Min</option>
          <option value="MAX">Max</option>
        </select>
        <select id="grp-val"></select>
      </div>
      <div id="grp-chart" style="height:180px"></div>
      <div id="grp-table"></div>
    </div>
  </div>

  <div class="status-bar">
    <span id="status-server">●</span>
  </div>

<script>
var API = window.location.origin;

// --- Tabs ---
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
    document.querySelectorAll('.tab-content').forEach(function(x){x.classList.remove('active')});
    t.classList.add('active');
    document.getElementById(t.dataset.tab).classList.add('active');
  });
});

// --- Cargar CSV ---
document.getElementById('btn-load').addEventListener('click', function(){
  var path = document.getElementById('csv-path').value.trim();
  if(!path){document.getElementById('data-info').textContent='Ingrese una ruta';return;}
  document.getElementById('data-info').innerHTML='<span class="spinner"></span> Cargando...';
  fetch(API+'/api/load_file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:path})})
  .then(function(r){return r.json()})
  .then(function(d){
    if(d.status==='ok'){
      document.getElementById('data-info').textContent=d.rows_loaded+' filas x '+d.columns.length+' cols cargadas';
      populateGroupBy(d.columns, d.types);
      // Auto-analyze and pivot
      fetch(API+'/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})
      .then(function(r){return r.json()})
      .then(function(stats){
        if(stats.status==='ok'){
          showStats(stats);
          // Prepare pivot button
          document.getElementById('btn-pivot').style.display='inline-block';
        }
      });
    } else {
      document.getElementById('data-info').textContent='Error: '+d.message;
    }
  }).catch(function(e){document.getElementById('data-info').textContent='Error: '+e;});
});

// --- Pivot button ---
var _pivotLibsLoaded = false;

document.getElementById('btn-pivot').addEventListener('click', function(){
  this.innerHTML='<span class="spinner"></span>';
  var self = this;
  fetch(API+'/api/query',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({sql:'SELECT * FROM dataset LIMIT 10000',page:1,page_size:10000})})
  .then(function(r){return r.json()})
  .then(function(res){
    if(res.status==='ok'){
      self.style.display='none';
      var cols=res.columns;
      var rows=res.rows.map(function(r){var obj={};cols.forEach(function(c,i){obj[c]=r[i];});return obj;});
      showPivot(rows);
    } else {
      self.textContent='Abrir Pivot';
      alert('Error: '+res.message);
    }
  }).catch(function(e){ self.textContent='Abrir Pivot'; });
});

// --- Leer de Excel ---
document.getElementById('btn-bridge-read').addEventListener('click', function(){
  document.getElementById('data-info').innerHTML='<span class="spinner"></span> Leyendo bridge...';
  fetch(API+'/api/bridge/pull?key=geolive')
  .then(function(r){return r.json()})
  .then(function(result){
    var data = (result.status==='ok' && result.data) ? result.data : null;
    if(!data){return fetch(API+'/api/bridge/pull?key=default').then(function(r){return r.json()}).then(function(r2){data=(r2.status==='ok'&&r2.data)?r2.data:null;return data;});}
    return data;
  }).then(function(data){
    if(!data){document.getElementById('data-info').textContent='No hay datos en el bridge';return;}
    var cols,rows;
    if(data.points){cols=data.columns;rows=data.points.map(function(p){return cols.map(function(c){return p[c]!==undefined?p[c]:'';});});}
    else{cols=data.columns;rows=data.rows||[];}
    var types={};cols.forEach(function(c,i){var s=rows.slice(0,50).map(function(r){return r[i];});var n=s.filter(function(v){return typeof v==='number'||!isNaN(parseFloat(v));}).length;types[c]=n>s.length*0.5?'numeric':'text';});
    document.getElementById('data-info').textContent=rows.length+' filas x '+cols.length+' cols';
    showPreview(cols,rows.slice(0,20));
    populateGroupBy(cols,types);
    fetch(API+'/api/load',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({columns:cols,types:types,data:rows})});
  }).catch(function(e){document.getElementById('data-info').textContent='Error: '+e;});
});

// --- Cargar Viewer ---
document.getElementById('btn-load-viewer').addEventListener('click', function(){
  var msg=document.getElementById('viewers-msg');
  msg.innerHTML='<span class="spinner"></span> Cargando...';
  fetch(API+'/api/bridge/pull?key=active_viewer')
  .then(function(r){return r.json()})
  .then(function(d){
    if(d.status==='ok'&&d.data&&d.data.file){
      var el=document.getElementById('viz-chart');
      el.style.display='block';
      el.innerHTML='<iframe src="'+API+'/viewers/'+d.data.file+'?t='+Date.now()+'" style="width:100%;height:100%;border:none;border-radius:6px;"></iframe>';
      msg.innerHTML='<span style="color:var(--accent)">'+d.data.file+'</span>';
    } else { msg.textContent='No hay viewer activo'; }
  }).catch(function(e){msg.textContent='Error: '+e;});
});

// --- SQL ---
document.getElementById('btn-sql-run').addEventListener('click', function(){
  var sql=document.getElementById('sql-input').value.trim();
  if(!sql)return;
  document.getElementById('sql-status').innerHTML='<span class="spinner"></span>';
  document.getElementById('sql-error').style.display='none';
  fetch(API+'/api/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sql:sql,page:1,page_size:100})})
  .then(function(r){return r.json()})
  .then(function(d){
    if(d.status==='error'){document.getElementById('sql-error').style.display='block';document.getElementById('sql-error').textContent=d.message;document.getElementById('sql-status').textContent='';return;}
    document.getElementById('sql-status').textContent=d.total_rows+' filas';
    var html='<table class="data-table"><tr>';d.columns.forEach(function(c){html+='<th>'+c+'</th>';});html+='</tr>';
    d.rows.forEach(function(row){html+='<tr>';row.forEach(function(v){html+='<td>'+(v!==null?v:'')+'</td>';});html+='</tr>';});
    html+='</table>';document.getElementById('sql-results').innerHTML=html;
  }).catch(function(e){document.getElementById('sql-error').style.display='block';document.getElementById('sql-error').textContent=e;});
});
document.getElementById('sql-input').addEventListener('keydown',function(e){if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();document.getElementById('btn-sql-run').click();}});

// --- GROUP BY ---
function populateGroupBy(cols,types){
  var gc=document.getElementById('grp-col'),gv=document.getElementById('grp-val');
  gc.innerHTML='';gv.innerHTML='';
  cols.forEach(function(c){if(types[c]==='text')gc.innerHTML+='<option>'+c+'</option>';if(types[c]==='numeric')gv.innerHTML+='<option>'+c+'</option>';});
  document.getElementById('groupby-card').style.display=(gc.options.length>0&&gv.options.length>0)?'block':'none';
}
['grp-col','grp-metric','grp-val'].forEach(function(id){
  document.getElementById(id).addEventListener('change',function(){
    var gc=document.getElementById('grp-col').value,gm=document.getElementById('grp-metric').value,gv=document.getElementById('grp-val').value;
    if(!gc||!gv)return;
    fetch(API+'/api/groupby',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({group_column:gc,value_column:gv,metric:gm})})
    .then(function(r){return r.json()}).then(function(d){
      if(d.status==='ok'){
        var labels=d.results.map(function(r){return r.group;}),vals=d.results.map(function(r){return r.value;});
        if(typeof Plotly!=='undefined'){Plotly.newPlot('grp-chart',[{x:labels,y:vals,type:'bar',marker:{color:'rgba(168,230,0,0.7)'}}],{paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{color:'#888',size:9},margin:{t:8,r:10,b:35,l:50}},{responsive:true,displayModeBar:false});}
        var html='<table class="data-table"><tr><th>'+gc+'</th><th>'+gm+'('+gv+')</th></tr>';d.results.forEach(function(r){html+='<tr><td>'+r.group+'</td><td>'+r.value.toFixed(2)+'</td></tr>';});html+='</table>';
        document.getElementById('grp-table').innerHTML=html;
      }
    });
  });
});

// --- Preview ---
function showPreview(cols,rows){
  var html='<table class="data-table"><tr>';cols.forEach(function(c){html+='<th>'+c+'</th>';});html+='</tr>';
  rows.forEach(function(row){html+='<tr>';row.forEach(function(v){html+='<td>'+(v!==null&&v!==undefined?v:'')+'</td>';});html+='</tr>';});
  html+='</table>';document.getElementById('preview-area').innerHTML=html;
}

// --- Health ---
fetch(API+'/health').then(function(r){return r.json()}).then(function(){
  document.getElementById('status-server').style.color='#4caf50';
}).catch(function(){document.getElementById('status-server').style.color='#ff4444';});

// --- Pivot Table (custom, no external dependencies) ---
var _pivotData = [];

function showPivot(data) {
  _pivotData = data;
  showPivotFallback(data);
}

// --- Pivot fallback (no jQuery) ---
function showPivotFallback(data) {
  if (!data || data.length === 0) return;
  var cols = Object.keys(data[0]);
  var html = '<div class="pivot-ui"><div class="pivot-controls">'
    + '<div class="pivot-section"><label class="pivot-label">Filas</label><select id="pv-row">'
    + cols.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select></div>'
    + '<div class="pivot-section"><label class="pivot-label">Columnas</label><select id="pv-col"><option value="">(ninguna)</option>'
    + cols.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select></div>'
    + '<div class="pivot-section"><label class="pivot-label">Valores</label><select id="pv-val">'
    + cols.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select></div>'
    + '<div class="pivot-section"><label class="pivot-label">Funcion</label><select id="pv-fn">'
    + '<option value="sum">Suma</option><option value="count">Conteo</option><option value="avg">Media</option><option value="min">Min</option><option value="max">Max</option>'
    + '</select></div>'
    + '<button class="btn btn-primary" onclick="runPivotFallback()">Calcular</button>'
    + '</div><div id="pv-result" style="margin-top:8px;overflow:auto;max-height:300px;"></div></div>';
  document.getElementById('pivot-output').innerHTML = html;
  document.getElementById('pivot-area').style.display = 'block';

  window.runPivotFallback = function(){
    var rf=document.getElementById('pv-row').value, cf=document.getElementById('pv-col').value;
    var vf=document.getElementById('pv-val').value, fn=document.getElementById('pv-fn').value;
    var agg={};
    data.forEach(function(row){
      var rk=String(row[rf]||''), ck=cf?String(row[cf]||''):'Total', v=parseFloat(row[vf])||0;
      if(!agg[rk])agg[rk]={};
      if(!agg[rk][ck])agg[rk][ck]={s:0,n:0,mn:Infinity,mx:-Infinity};
      agg[rk][ck].s+=v; agg[rk][ck].n++; if(v<agg[rk][ck].mn)agg[rk][ck].mn=v; if(v>agg[rk][ck].mx)agg[rk][ck].mx=v;
    });
    var cks=[];Object.values(agg).forEach(function(r){Object.keys(r).forEach(function(k){if(cks.indexOf(k)<0)cks.push(k);});});cks.sort();
    var fns={sum:function(c){return c.s.toFixed(2);},count:function(c){return c.n;},avg:function(c){return(c.s/c.n).toFixed(2);},min:function(c){return c.mn.toFixed(2);},max:function(c){return c.mx.toFixed(2);}};
    var h='<table class="data-table"><tr><th>'+rf+'</th>'+cks.map(function(k){return'<th>'+k+'</th>';}).join('')+'</tr>';
    Object.keys(agg).sort().forEach(function(rk){h+='<tr><td>'+rk+'</td>'+cks.map(function(ck){return'<td>'+(agg[rk][ck]?fns[fn](agg[rk][ck]):'-')+'</td>';}).join('')+'</tr>';});
    document.getElementById('pv-result').innerHTML=h+'</table>';
  };
}

// --- Stats Summary ---
function showStats(result){
  var html='<table class="data-table"><tr><th>Variable</th><th>Tipo</th><th>N</th><th>NA%</th>'
    +'<th>Min</th><th>P25</th><th>P50</th><th>Media</th><th>Mediana</th><th>Moda</th>'
    +'<th>P75</th><th>P90</th><th>P99</th><th>Max</th><th>Std</th></tr>';
  result.statistics.forEach(function(s){
    if(s.numeric){
      html+='<tr>'
        +'<td>'+s.column+'</td><td>num</td><td>'+s.count+'</td><td>'+s.na_pct+'%</td>'
        +'<td>'+s.min.toFixed(2)+'</td>'
        +'<td>'+s.q25.toFixed(2)+'</td>'
        +'<td>'+(s.q50!==undefined?s.q50.toFixed(2):'-')+'</td>'
        +'<td>'+s.mean.toFixed(2)+'</td>'
        +'<td>'+s.median.toFixed(2)+'</td>'
        +'<td>'+(s.mode!==undefined?s.mode.toFixed(2):'-')+'</td>'
        +'<td>'+s.q75.toFixed(2)+'</td>'
        +'<td>'+(s.q90!==undefined?s.q90.toFixed(2):'-')+'</td>'
        +'<td>'+(s.q99!==undefined?s.q99.toFixed(2):'-')+'</td>'
        +'<td>'+s.max.toFixed(2)+'</td>'
        +'<td>'+s.std.toFixed(2)+'</td>'
        +'</tr>';
    } else {
      html+='<tr><td>'+s.column+'</td><td>cat</td><td colspan="2">'+s.na_pct+'% NA</td>'
        +'<td colspan="11" style="color:#888">unicos: '+s.unique+' | moda: '+s.mode+'</td></tr>';
    }
  });
  html+='</table>';
  document.getElementById('preview-area').innerHTML=html;
}
</script>
</body>
</html>
