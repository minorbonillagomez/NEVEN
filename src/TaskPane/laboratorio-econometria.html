<!-- NEVEN Studio - Laboratorio Visual de Econometria -->
<!-- Modulos interactivos: OLS, Panel/FWL, GLS/Cholesky, Raiz Unitaria -->
<style>
  #lab-econometria {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg-primary);
  }
  #lab-econometria .lab-header {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  #lab-econometria .lab-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 2px;
  }
  #lab-econometria .lab-subtitle {
    font-size: 9px;
    color: var(--text-secondary);
  }
  #lab-econometria .lab-tabs {
    display: flex;
    gap: 4px;
    padding: 6px 8px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  #lab-econometria .lab-tab {
    padding: 6px 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: 4px;
    cursor: pointer;
    font-size: 9px;
    font-weight: 600;
    transition: 0.15s;
  }
  #lab-econometria .lab-tab:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
  #lab-econometria .lab-tab.active {
    background: var(--accent);
    color: #1a1a1a;
    border-color: var(--accent);
  }
  #lab-econometria .lab-workspace {
    flex: 1;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 8px;
    padding: 8px;
    overflow: hidden;
  }
  @media (max-width: 600px) {
    #lab-econometria .lab-workspace {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
    }
  }
  #lab-econometria .lab-controls {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    overflow-y: auto;
  }
  #lab-econometria .control-group {
    margin-bottom: 12px;
  }
  #lab-econometria .control-group label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  #lab-econometria .control-group label span:last-child {
    color: var(--accent);
    font-weight: 600;
  }
  #lab-econometria input[type=range] {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
    height: 4px;
  }
  #lab-econometria .lab-metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 10px;
  }
  #lab-econometria .metric {
    background: var(--bg-primary);
    padding: 6px;
    border-radius: 4px;
    text-align: center;
    border: 1px solid var(--border);
  }
  #lab-econometria .metric .val {
    font-size: 13px;
    font-weight: 700;
    color: var(--success);
  }
  #lab-econometria .metric .lbl {
    font-size: 8px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  #lab-econometria .math-card {
    background: var(--bg-primary);
    border-left: 2px solid var(--accent);
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 9px;
    line-height: 1.5;
    color: var(--text-secondary);
    margin-top: 10px;
  }
  #lab-econometria .math-card b {
    color: var(--text-primary);
  }
  #lab-econometria .math-card code {
    background: rgba(215,165,56,0.1);
    padding: 1px 4px;
    border-radius: 2px;
    color: var(--accent);
    font-family: 'Consolas', monospace;
    font-size: 9px;
  }
  #lab-econometria .lab-canvas-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #lab-econometria canvas {
    background: #0d0d0d;
    border-radius: 4px;
    max-width: 100%;
    max-height: 100%;
  }
</style>

<div id="lab-econometria">
  <div class="lab-header">
    <div class="lab-title">Laboratorio Geometrico: Algebra Lineal y Econometria</div>
    <div class="lab-subtitle">Interactua con los deslizadores para observar como los operadores matriciales gobiernan cada modelo econometrico.</div>
  </div>

  <div class="lab-tabs">
    <button class="lab-tab active" onclick="labSetMode(0)">1. Proyeccion OLS</button>
    <button class="lab-tab" onclick="labSetMode(1)">2. Panel / FWL</button>
    <button class="lab-tab" onclick="labSetMode(2)">3. GLS / Cholesky</button>
    <button class="lab-tab" onclick="labSetMode(3)">4. Raiz Unitaria</button>
  </div>

  <div class="lab-workspace">
    <div class="lab-controls" id="lab-controls-panel"></div>
    <div class="lab-canvas-box">
      <canvas id="labCanvas" width="520" height="360"></canvas>
    </div>
  </div>
</div>

<script>
(function() {
  var canvas = document.getElementById('labCanvas');
  var ctx = canvas.getContext('2d');
  var labMode = 0;

  // Colores de la paleta NEVEN
  var C = {
    bg: '#0d0d0d',
    accent: '#d7a538',
    accentDim: 'rgba(215,165,56,0.3)',
    text: '#e0e0e0',
    muted: '#888',
    success: '#4caf50',
    error: '#ff4444',
    grid: '#333'
  };

  // Estado global de parametros
  var state = {
    // Modo 0: Proyeccion OLS
    angleX: 25, yAngle: 68,
    // Modo 1: Panel FWL
    theta: 0.0,
    // Modo 2: GLS / Cholesky
    hetero: 2.8, rho: 0.65, applyCholesky: 0,
    // Modo 3: Series de Tiempo
    lambda: 0.85
  };

  // Semilla determinista
  function seededRandom(seed) {
    var x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
  }

  window.labSetMode = function(m) {
    labMode = m;
    document.querySelectorAll('#lab-econometria .lab-tab').forEach(function(t, i) {
      t.classList.toggle('active', i === m);
    });
    renderControls();
    draw();
  };

  function renderControls() {
    var panel = document.getElementById('lab-controls-panel');
    if (labMode === 0) {
      panel.innerHTML = 
        '<div class="control-group">' +
          '<label><span>Angulo del Subespacio C(X)</span><span id="v_ax">' + state.angleX + ' grados</span></label>' +
          '<input type="range" min="5" max="45" value="' + state.angleX + '" oninput="labState.angleX=+this.value; labUpdateUI()">' +
        '</div>' +
        '<div class="control-group">' +
          '<label><span>Direccion del Vector y</span><span id="v_ya">' + state.yAngle + ' grados</span></label>' +
          '<input type="range" min="15" max="85" value="' + state.yAngle + '" oninput="labState.yAngle=+this.value; labUpdateUI()">' +
        '</div>' +
        '<div class="lab-metrics">' +
          '<div class="metric"><div class="val" id="m_r2">0.00</div><div class="lbl">R-cuadrado</div></div>' +
          '<div class="metric"><div class="val" id="m_orth">0.00</div><div class="lbl">Producto y-hat, epsilon</div></div>' +
        '</div>' +
        '<div class="math-card">' +
          '<b>Algebra Lineal:</b><br>' +
          'Proyector: <code>P_X = X(X\'X)^-1 X\'</code><br>' +
          'Aniquilador: <code>M_X = I - P_X</code><br><br>' +
          '<b>Intuicion:</b> El estimador OLS busca que el residuo <span style="color:' + C.error + '">epsilon = M_X y</span> caiga a 90 grados exactos sobre el subespacio <span style="color:' + C.accent + '">C(X)</span>.' +
        '</div>';
    } else if (labMode === 1) {
      panel.innerHTML = 
        '<div class="control-group">' +
          '<label><span>Operador Within (theta)</span><span id="v_th">' + state.theta.toFixed(2) + '</span></label>' +
          '<input type="range" min="0" max="1" step="0.02" value="' + state.theta + '" oninput="labState.theta=+this.value; labUpdateUI()">' +
        '</div>' +
        '<div class="lab-metrics">' +
          '<div class="metric"><div class="val" id="m_b_pool">0.00</div><div class="lbl">Pendiente beta(theta)</div></div>' +
          '<div class="metric"><div class="val" style="color:' + C.accent + '">+0.80</div><div class="lbl">Verdadero beta</div></div>' +
        '</div>' +
        '<div class="math-card">' +
          '<b>Matriz Aniquiladora de Panel (FWL):</b><br>' +
          '<code>Q = I_N (x) (I_T - theta * ii\'/T)</code><br><br>' +
          '<b>theta = 0 (Pooled OLS):</b> Ignora alpha_i. Sufre sesgo severo.<br>' +
          '<b>theta = 1 (Efectos Fijos):</b> Purga alpha_i y recupera beta = +0.80.' +
        '</div>';
    } else if (labMode === 2) {
      panel.innerHTML = 
        '<div class="control-group">' +
          '<label><span>Heterocedasticidad (sigma2 / sigma1)</span><span id="v_het">' + state.hetero.toFixed(1) + 'x</span></label>' +
          '<input type="range" min="1" max="4" step="0.1" value="' + state.hetero + '" oninput="labState.hetero=+this.value; labUpdateUI()">' +
        '</div>' +
        '<div class="control-group">' +
          '<label><span>Autocorrelacion (rho)</span><span id="v_rho">' + state.rho.toFixed(2) + '</span></label>' +
          '<input type="range" min="-0.8" max="0.8" step="0.05" value="' + state.rho + '" oninput="labState.rho=+this.value; labUpdateUI()">' +
        '</div>' +
        '<div class="control-group">' +
          '<label><span>Transformacion Cholesky (C)</span><span id="v_chol">' + Math.round(state.applyCholesky * 100) + '%</span></label>' +
          '<input type="range" min="0" max="1" step="0.02" value="' + state.applyCholesky + '" oninput="labState.applyCholesky=+this.value; labUpdateUI()">' +
        '</div>' +
        '<div class="math-card">' +
          '<b>Metrica de Mahalanobis y GLS:</b><br>' +
          'Cuando <code>Var(epsilon) = Omega != sigma^2 I</code>, las curvas de isodensidad son elipsoides inclinados.<br><br>' +
          'Al deslizar <b>Cholesky al 100%</b>, premultiplicas por <code>C</code> (donde <code>Omega^-1 = C\'C</code>), devolviendo el elipsoide a una esfera donde OLS = GLS.' +
        '</div>';
    } else if (labMode === 3) {
      panel.innerHTML = 
        '<div class="control-group">' +
          '<label><span>Autovalor Dominante |lambda|</span><span id="v_lam">' + state.lambda.toFixed(2) + '</span></label>' +
          '<input type="range" min="0.20" max="1.05" step="0.01" value="' + state.lambda + '" oninput="labState.lambda=+this.value; labUpdateUI()">' +
        '</div>' +
        '<div class="lab-metrics">' +
          '<div class="metric"><div class="val" id="m_stat">I(0)</div><div class="lbl">Orden de Integracion</div></div>' +
          '<div class="metric"><div class="val" id="m_spec">Estable</div><div class="lbl">Condicion Espectral</div></div>' +
        '</div>' +
        '<div class="math-card">' +
          '<b>Teoria Espectral en Series de Tiempo:</b><br>' +
          '<code>Y_t = F * Y_{t-1} + V_t</code><br><br>' +
          'Si <b>|lambda| < 1</b> (dentro del circulo): Serie estacionaria <b>I(0)</b>, vuelve a su media.<br>' +
          'Si <b>|lambda| = 1</b> (sobre el borde): <b>Raiz Unitaria I(1)</b>. Memoria infinita; OLS produce Regresion Espuria.' +
        '</div>';
    }
    labUpdateUI();
  }

  window.labState = state;

  window.labUpdateUI = function() {
    if (labMode === 0) {
      var el_ax = document.getElementById('v_ax');
      var el_ya = document.getElementById('v_ya');
      if (el_ax) el_ax.textContent = state.angleX + ' grados';
      if (el_ya) el_ya.textContent = state.yAngle + ' grados';
      var diffRad = (state.yAngle - state.angleX) * Math.PI / 180;
      var r2 = Math.pow(Math.cos(diffRad), 2);
      var el_r2 = document.getElementById('m_r2');
      if (el_r2) el_r2.textContent = r2.toFixed(3);
      var el_orth = document.getElementById('m_orth');
      if (el_orth) el_orth.textContent = '0.000';
    } else if (labMode === 1) {
      var el_th = document.getElementById('v_th');
      if (el_th) el_th.textContent = state.theta.toFixed(2);
    } else if (labMode === 2) {
      var el_het = document.getElementById('v_het');
      var el_rho = document.getElementById('v_rho');
      var el_chol = document.getElementById('v_chol');
      if (el_het) el_het.textContent = state.hetero.toFixed(1) + 'x';
      if (el_rho) el_rho.textContent = state.rho.toFixed(2);
      if (el_chol) el_chol.textContent = Math.round(state.applyCholesky * 100) + '%';
    } else if (labMode === 3) {
      var el_lam = document.getElementById('v_lam');
      if (el_lam) el_lam.textContent = state.lambda.toFixed(2);
      var st = document.getElementById('m_stat');
      var sp = document.getElementById('m_spec');
      if (st && sp) {
        if (state.lambda < 0.99) {
          st.textContent = 'I(0)'; st.style.color = C.success;
          sp.textContent = '|lambda| < 1'; sp.style.color = C.success;
        } else if (state.lambda <= 1.01) {
          st.textContent = 'I(1)'; st.style.color = C.accent;
          sp.textContent = '|lambda| = 1'; sp.style.color = C.accent;
        } else {
          st.textContent = 'Explosiva'; st.style.color = C.error;
          sp.textContent = '|lambda| > 1'; sp.style.color = C.error;
        }
      }
    }
    draw();
  };

  function drawArrow(x1, y1, x2, y2, color, width, label) {
    var headlen = 8;
    var angle = Math.atan2(y2 - y1, x2 - x1);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = width || 2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
    ctx.closePath();
    ctx.fill();
    if (label) {
      ctx.font = '10px Segoe UI';
      ctx.fillText(label, x2 + 6, y2 - 4);
    }
  }

  function draw() {
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (labMode === 0) {
      // MODO 0: PROYECCION ORTOGONAL OLS
      var ox = 100, oy = 280;
      var radX = -state.angleX * Math.PI / 180;
      var radY = -state.yAngle * Math.PI / 180;
      var scale = 1.4;
      var yLenPx = 140 * scale;

      // Subespacio C(X)
      ctx.strokeStyle = C.grid;
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(ox - 40 * Math.cos(radX), oy - 40 * Math.sin(radX));
      ctx.lineTo(ox + 380 * Math.cos(radX), oy + 380 * Math.sin(radX));
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = C.accent;
      ctx.font = '10px Segoe UI';
      ctx.fillText('Subespacio C(X)', ox + 280 * Math.cos(radX), oy + 280 * Math.sin(radX) + 16);

      // Vector y
      var yx = ox + yLenPx * Math.cos(radY);
      var yy = oy + yLenPx * Math.sin(radY);

      // Proyeccion y-hat
      var diff = radY - radX;
      var yhatLen = yLenPx * Math.cos(diff);
      var yhx = ox + yhatLen * Math.cos(radX);
      var yhy = oy + yhatLen * Math.sin(radX);

      // Angulo recto
      var sq = 10;
      var ux = Math.cos(radX), uy = Math.sin(radX);
      var nx = -uy, ny = ux;
      ctx.strokeStyle = C.muted;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(yhx - sq * ux, yhy - sq * uy);
      ctx.lineTo(yhx - sq * ux - sq * nx, yhy - sq * uy - sq * ny);
      ctx.lineTo(yhx - sq * nx, yhy - sq * ny);
      ctx.stroke();

      // Vectores
      drawArrow(ox, oy, yhx, yhy, C.success, 3, 'y-hat = P_X y');
      drawArrow(yhx, yhy, yx, yy, C.error, 2, 'epsilon = M_X y');
      drawArrow(ox, oy, yx, yy, C.text, 2, 'Vector y');

    } else if (labMode === 1) {
      // MODO 1: DATOS DE PANEL Y OPERADOR WITHIN
      var cx = 260, cy = 180;
      var groups = [
        { meanX: -100, meanY: 70, color: C.accent },
        { meanX: 0, meanY: 0, color: C.success },
        { meanX: 100, meanY: -70, color: '#888' }
      ];
      var trueSlope = 0.8;
      var sumX = 0, sumY = 0, sumXY = 0, sumXX = 0, n = 0;

      // Ejes
      ctx.strokeStyle = C.grid;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(30, cy);
      ctx.lineTo(490, cy);
      ctx.moveTo(cx, 20);
      ctx.lineTo(cx, 340);
      ctx.stroke();

      // Etiquetas
      ctx.fillStyle = C.muted;
      ctx.font = '9px Segoe UI';
      ctx.fillText('X', 480, cy - 5);
      ctx.fillText('Y', cx + 5, 28);

      groups.forEach(function(g, gi) {
        var curMeanX = g.meanX * (1 - state.theta);
        var curMeanY = g.meanY * (1 - state.theta);
        for (var t = 0; t < 10; t++) {
          var dx = (seededRandom(gi * 100 + t) - 0.5) * 70;
          var noise = (seededRandom(gi * 200 + t) - 0.5) * 28;
          var dy = trueSlope * dx + noise;
          var px = cx + curMeanX + dx;
          var py = cy - (curMeanY + dy);

          ctx.fillStyle = g.color;
          ctx.beginPath();
          ctx.arc(px, py, 4, 0, Math.PI * 2);
          ctx.fill();

          var xVal = curMeanX + dx;
          var yVal = curMeanY + dy;
          sumX += xVal;
          sumY += yVal;
          sumXY += xVal * yVal;
          sumXX += xVal * xVal;
          n++;
        }
      });

      var betaHat = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
      var el_bp = document.getElementById('m_b_pool');
      if (el_bp) {
        el_bp.textContent = (betaHat >= 0 ? '+' : '') + betaHat.toFixed(2);
        el_bp.style.color = betaHat > 0 ? C.success : C.error;
      }

      // Linea de regresion
      ctx.strokeStyle = betaHat > 0 ? C.success : C.error;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - 200, cy - (-200 * betaHat));
      ctx.lineTo(cx + 200, cy - (200 * betaHat));
      ctx.stroke();

      // Leyenda
      ctx.fillStyle = C.muted;
      ctx.font = '9px Segoe UI';
      ctx.fillText('Ind 1 (alpha alto)', 20, 25);
      ctx.fillStyle = C.accent;
      ctx.fillRect(5, 18, 10, 10);
      ctx.fillStyle = C.muted;
      ctx.fillText('Ind 2 (alpha medio)', 20, 40);
      ctx.fillStyle = C.success;
      ctx.fillRect(5, 33, 10, 10);
      ctx.fillStyle = C.muted;
      ctx.fillText('Ind 3 (alpha bajo)', 20, 55);
      ctx.fillStyle = '#888';
      ctx.fillRect(5, 48, 10, 10);

    } else if (labMode === 2) {
      // MODO 2: ELIPSOIDES Y CHOLESKY
      var cx = 260, cy = 180;
      var t = state.applyCholesky;
      var curHet = state.hetero * (1 - t) + 1.0 * t;
      var curRho = state.rho * (1 - t);

      // Ejes
      ctx.strokeStyle = C.grid;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(50, cy);
      ctx.lineTo(470, cy);
      ctx.moveTo(cx, 30);
      ctx.lineTo(cx, 330);
      ctx.stroke();

      // Elipses de isodensidad
      [35, 65, 95].forEach(function(r, idx) {
        ctx.save();
        ctx.translate(cx, cy);
        var angle = 0.5 * Math.atan2(2 * curRho * curHet, 1 - curHet * curHet);
        ctx.rotate(-angle);
        ctx.strokeStyle = t > 0.9 ? C.success : C.accent;
        ctx.lineWidth = idx === 1 ? 2 : 1;
        ctx.beginPath();
        ctx.ellipse(0, 0, r * curHet * 0.7, r * 0.7 * (1 - Math.abs(curRho) * 0.4), 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      });

      ctx.fillStyle = C.text;
      ctx.font = '10px Segoe UI';
      ctx.fillText(t > 0.9 ? 'Espacio Transformado C*epsilon: Esferico (OLS = GLS)' : 'Espacio Original epsilon: Elipsoide Deformado (Omega != sigma^2 I)', 20, 25);

    } else if (labMode === 3) {
      // MODO 3: CIRCULO UNITARIO Y SERIE DE TIEMPO
      // Izquierda: Plano complejo
      var cx = 130, cy = 180, rad = 80;

      ctx.strokeStyle = C.grid;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(20, cy);
      ctx.lineTo(240, cy);
      ctx.moveTo(cx, 70);
      ctx.lineTo(cx, 290);
      ctx.stroke();

      // Circulo unitario
      ctx.strokeStyle = C.success;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.arc(cx, cy, rad, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = C.muted;
      ctx.font = '9px Segoe UI';
      ctx.fillText('|lambda| = 1', cx - 25, cy + rad + 15);

      // Autovalor lambda
      var lx = cx + state.lambda * rad;
      ctx.fillStyle = state.lambda >= 1 ? C.error : C.accent;
      ctx.beginPath();
      ctx.arc(lx, cy, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillText('lambda = ' + state.lambda.toFixed(2), lx - 22, cy - 10);

      // Derecha: Trayectoria de la serie
      var sx = 270, sy = 180, w = 230;
      ctx.strokeStyle = C.grid;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + w, sy);
      ctx.stroke();

      ctx.strokeStyle = state.lambda >= 1 ? C.accent : C.success;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      var yVal = 0;
      for (var t = 0; t < 70; t++) {
        var shock = (seededRandom(t + 42) - 0.48) * 18;
        yVal = state.lambda * yVal + shock;
        var px = sx + (t / 69) * w;
        var py = Math.max(30, Math.min(330, sy - yVal));
        if (t === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();

      ctx.fillStyle = C.text;
      ctx.font = '10px Segoe UI';
      ctx.fillText('Trayectoria: y_t = lambda * y_{t-1} + epsilon_t', sx, 25);
    }
  }

  // Inicializar
  renderControls();
})();
</script>
