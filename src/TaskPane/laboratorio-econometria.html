<!-- Incluye: Mini-chat con RAG de econometria + KaTeX para ecuaciones -->

    height: 100%;
    display: flex;

    background: var(--bg-card);

    padding: 8px;
    overflow-y: auto;
  }
  #lab-econometria .control-group {
    margin-bottom: 10px;
  }
  #lab-econometria .control-group label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-secondary);
    margin-bottom: 3px;
  }
  #lab-econometria .control-group label span:last-child {
    color: var(--accent);
    font-weight: 600;
  }
  #lab-econometria input[type=range] {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
    height: 4px;
  }
  #lab-econometria .lab-metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;

  }
  #lab-econometria .metric {
    background: var(--bg-primary);

    border-radius: 4px;

    border: 1px solid var(--border);
  }
  #lab-econometria .metric .val {
    font-size: 12px;
    font-weight: 700;
    color: var(--success);
  }
  #lab-econometria .metric .lbl {
    font-size: 8px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  #lab-econometria .math-card {
    background: var(--bg-primary);
    border-left: 2px solid var(--accent);
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 9px;
    line-height: 1.4;
    color: var(--text-secondary);
    margin-top: 8px;
  }
  #lab-econometria .math-card b {
    color: var(--text-primary);
  }
  #lab-econometria .eq {
    display: block;
    text-align: center;
    margin: 6px 0;

  #lab-econometria .lab-canvas-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #lab-econometria .canvas-eq {
    padding: 4px 8px;
    font-size: 10px;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
    text-align: center;
  }
  #lab-econometria canvas {
    flex: 1;
    background: #0d0d0d;
    max-width: 100%;
  }
  /* Chat del Profesor */
  #lab-econometria .lab-chat {
    border-top: 1px solid var(--border);
    background: var(--bg-secondary);
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    max-height: 180px;
  }
  #lab-econometria .chat-header {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--accent);
    font-weight: 600;
  }
  #lab-econometria .chat-suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  #lab-econometria .chat-chip {
    padding: 3px 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 8px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: 0.15s;
  }
  #lab-econometria .chat-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  #lab-econometria .chat-messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 40px;
    max-height: 80px;
  }
  #lab-econometria .chat-msg {
    font-size: 9px;
    line-height: 1.4;
    padding: 4px 6px;
    border-radius: 4px;
  }
  #lab-econometria .chat-msg.user {
    background: var(--accent);

  }
  #lab-econometria .chat-input-row {
    display: flex;
    gap: 4px;
  }
  #lab-econometria .chat-input {
    flex: 1;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 10px;
    color: var(--text-primary);
    outline: none;
  }
  #lab-econometria .chat-input:focus {
    border-color: var(--accent);
  }
  #lab-econometria .chat-send {
    padding: 5px 12px;
    background: var(--accent);
    border: none;
    border-radius: 4px;
    color: #1a1a1a;
    font-size: 9px;
    font-weight: 600;
    cursor: pointer;
  }
  #lab-econometria .chat-send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>

<div id="lab-econometria">
  <div class="lab-header">
    <div class="lab-title">Laboratorio Geometrico: Algebra Lineal y Econometria</div>
    <div class="lab-subtitle">Interactua con los deslizadores y pregunta al Profesor IA.</div>
  </div>

  <div class="lab-tabs">
    <button class="lab-tab active" onclick="labSetMode(0)">1. Proyeccion OLS</button>
    <button class="lab-tab" onclick="labSetMode(1)">2. Panel / FWL</button>
    <button class="lab-tab" onclick="labSetMode(2)">3. GLS / Cholesky</button>
    <button class="lab-tab" onclick="labSetMode(3)">4. Raiz Unitaria</button>
  </div>

  <div class="lab-main">
    <div class="lab-workspace">
      <div class="lab-controls" id="lab-controls-panel"></div>
      <div class="lab-canvas-box">
        <div class="canvas-eq" id="lab-equation"></div>
        <canvas id="labCanvas" width="520" height="280"></canvas>
      </div>
    </div>

    <!-- Chat del Profesor -->
    <div class="lab-chat">
      <div class="chat-header">
        <span>Profesor de Econometria</span>
        <span style="font-weight:400;color:var(--text-muted)">(usa RAG con 10 libros indexados)</span>
      </div>
      <div class="chat-suggestions" id="lab-suggestions"></div>
      <div class="chat-messages" id="lab-chat-messages"></div>
      <div class="chat-input-row">
        <input type="text" class="chat-input" id="lab-chat-input" 
               placeholder="Pregunta sobre lo que ves..." 
               onkeydown="if(event.key==='Enter')labSendChat()">
        <button class="chat-send" id="lab-chat-send" onclick="labSendChat()">Preguntar</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  setTimeout(function() {
    var canvas = document.getElementById('labCanvas');
    if (!canvas) { console.error('[NEVEN Lab] Canvas not found'); return; }
    var ctx = canvas.getContext('2d');
    var labMode = 0;

    var C = {
      bg: '#0d0d0d', accent: '#d7a538', accentDim: 'rgba(215,165,56,0.3)',
      text: '#e0e0e0', muted: '#888', success: '#4caf50', error: '#ff4444', grid: '#333'
    };

    var state = {
      angleX: 25, yAngle: 68,
      theta: 0.0,
      hetero: 2.8, rho: 0.65, applyCholesky: 0,
      lambda: 0.85
    };

    // Preguntas sugeridas por modulo
    var suggestions = [
      ['Que es la proyeccion ortogonal?', 'Por que R-cuadrado es cos^2?', 'Que significa M_X?'],
      ['Que es el sesgo de variable omitida?', 'Explicame el teorema FWL', 'Cuando usar efectos fijos?'],
      ['Por que OLS es ineficiente con heterocedasticidad?', 'Que es la matriz Omega?', 'Como funciona GLS?'],
      ['Que es una raiz unitaria?', 'Que es regresion espuria?', 'Cuando hay cointegracion?']
    ];

    // Ecuaciones por modulo (para KaTeX)
    var equations = [
      '\\hat{y} = P_X y = X(X\'X)^{-1}X\'y \\quad \\text{donde} \\quad \\hat{\\varepsilon} = M_X y \\perp \\mathcal{C}(X)',
      'y_{it} = \\alpha_i + \\beta x_{it} + \\varepsilon_{it} \\quad \\xrightarrow{\\text{Within}} \\quad \\tilde{y}_{it} = \\beta \\tilde{x}_{it} + \\tilde{\\varepsilon}_{it}',
      '\\hat{\\beta}_{GLS} = (X\'\\Omega^{-1}X)^{-1}X\'\\Omega^{-1}y \\quad \\text{donde} \\quad \\Omega^{-1} = C\'C',
      'y_t = \\lambda y_{t-1} + \\varepsilon_t \\quad \\Rightarrow \\quad |\\lambda| < 1 \\text{ (estacionario)}, \\; |\\lambda| = 1 \\text{ (raiz unitaria)}'
    ];

    function seededRandom(seed) { var x = Math.sin(seed) * 10000; return x - Math.floor(x); }

    window.labSetMode = function(m) {
      labMode = m;
      document.querySelectorAll('#lab-econometria .lab-tab').forEach(function(t, i) {
        t.classList.toggle('active', i === m);
      });
      renderControls();
      renderSuggestions();
      renderEquation();
      draw();
    };

    function renderEquation() {
      var el = document.getElementById('lab-equation');
      if (el && window.katex) {
        try {
          katex.render(equations[labMode], el, { displayMode: false, throwOnError: false });
        } catch(e) { el.textContent = equations[labMode]; }
      } else if (el) {
        el.textContent = equations[labMode];
      }
    }

    function renderSuggestions() {
      var el = document.getElementById('lab-suggestions');
      if (!el) return;
      el.innerHTML = suggestions[labMode].map(function(q) {
        return '<span class="chat-chip" onclick="labAskSuggestion(\'' + q.replace(/'/g, "\\'") + '\')">' + q + '</span>';
      }).join('');
    }

    window.labAskSuggestion = function(q) {
      document.getElementById('lab-chat-input').value = q;
      labSendChat();
    };

    window.labSendChat = async function() {
      var input = document.getElementById('lab-chat-input');
      var messages = document.getElementById('lab-chat-messages');
      var btn = document.getElementById('lab-chat-send');
      var q = input.value.trim();
      if (!q) return;

      // Agregar mensaje del usuario
      messages.innerHTML += '<div class="chat-msg user">' + escapeHtml(q) + '</div>';
      input.value = '';
      btn.disabled = true;
      messages.scrollTop = messages.scrollHeight;

      // Agregar indicador de carga
      var loadingId = 'loading-' + Date.now();
      messages.innerHTML += '<div class="chat-msg assistant" id="' + loadingId + '">Consultando RAG...</div>';
      messages.scrollTop = messages.scrollHeight;

      try {
        // Llamar al endpoint RAG con contexto de econometria
        var resp = await fetch('/api/rag/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query: q,
            domain: 'econometria',
            limit: 3,
            use_ontology: true
          })
        });
        var data = await resp.json();

        // Construir contexto de los chunks
        var context = '';
        if (data.results && data.results.length > 0) {
          context = data.results.map(function(r) {
            return r.text || r.content || '';
          }).join('\n\n---\n\n');
        }

        // Llamar al LLM con el contexto
        var llmResp = await fetch('/api/ai/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: [
              { role: 'system', content: 'Eres un profesor de econometria. Responde de forma clara y concisa (max 3 oraciones). Usa el siguiente contexto de libros de econometria:\n\n' + context },
              { role: 'user', content: q }
            ],
            max_tokens: 200
          })
        });
        var llmData = await llmResp.json();

        // Mostrar respuesta
        var loadingEl = document.getElementById(loadingId);
        if (loadingEl) {
          var answer = llmData.choices?.[0]?.message?.content || llmData.response || 'No pude obtener una respuesta.';
          loadingEl.innerHTML = escapeHtml(answer);
        }
      } catch(err) {
        var loadingEl = document.getElementById(loadingId);
        if (loadingEl) {
          loadingEl.innerHTML = 'Error: ' + escapeHtml(err.message);
          loadingEl.style.color = C.error;
        }
      }

      btn.disabled = false;
      messages.scrollTop = messages.scrollHeight;
    };

    function escapeHtml(t) {
      return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderControls() {
      var panel = document.getElementById('lab-controls-panel');
      if (labMode === 0) {
        panel.innerHTML = 
          '<div class="control-group">' +
            '<label><span>Angulo del Subespacio C(X)</span><span id="v_ax">' + state.angleX + '</span></label>' +
            '<input type="range" min="5" max="45" value="' + state.angleX + '" oninput="labState.angleX=+this.value; labUpdateUI()">' +
            '<div style="font-size:8px;color:' + C.muted + '">Inclinacion del plano de regresores. Angulos pequenos = multicolinealidad.</div>' +
          '</div>' +
          '<div class="control-group">' +
            '<label><span>Direccion del Vector y</span><span id="v_ya">' + state.yAngle + '</span></label>' +
            '<input type="range" min="15" max="85" value="' + state.yAngle + '" oninput="labState.yAngle=+this.value; labUpdateUI()">' +
            '<div style="font-size:8px;color:' + C.muted + '">Variable dependiente. Mas cerca de C(X) = mayor R^2.</div>' +
          '</div>' +
          '<div class="lab-metrics">' +
            '<div class="metric"><div class="val" id="m_r2">0.00</div><div class="lbl" id="lbl_r2"></div></div>' +
            '<div class="metric"><div class="val" id="m_orth">0.00</div><div class="lbl">Ortogonalidad</div></div>' +
          '</div>' +
          '<div class="math-card">' +
            '<b>Geometria OLS:</b> El vector <b>y</b> se proyecta sobre C(X). La proyeccion es <b>y-hat</b> (verde), el residuo es <b>epsilon</b> (rojo, siempre perpendicular).<br><br>' +
            '<b>Experimento:</b> Acerca y a C(X) y observa como sube el R^2.' +
          '</div>';
        // Renderizar R^2 con KaTeX
        setTimeout(function() {
          var lbl = document.getElementById('lbl_r2');
          if (lbl && window.katex) katex.render('R^2 = \\cos^2(\\theta)', lbl, {throwOnError:false});
          else if (lbl) lbl.textContent = 'R^2 = cos^2(theta)';
        }, 0);
      } else if (labMode === 1) {
        panel.innerHTML = 
          '<div class="control-group">' +
            '<label><span>Operador Within</span><span id="v_th">' + state.theta.toFixed(2) + '</span></label>' +
            '<input type="range" min="0" max="1" step="0.02" value="' + state.theta + '" oninput="labState.theta=+this.value; labUpdateUI()">' +
            '<div style="font-size:8px;color:' + C.muted + '">0 = Pooled OLS, 1 = Efectos Fijos (centra cada grupo).</div>' +
          '</div>' +
          '<div class="lab-metrics">' +
            '<div class="metric"><div class="val" id="m_b_pool">0.00</div><div class="lbl" id="lbl_beta"></div></div>' +
            '<div class="metric"><div class="val" style="color:' + C.accent + '">+0.80</div><div class="lbl">Verdadero efecto</div></div>' +
          '</div>' +
          '<div class="math-card">' +
            '<b>Paradoja de Simpson:</b> Tres individuos con diferentes interceptos. Pooled OLS ve pendiente negativa porque confunde efectos individuales con el efecto de X.<br><br>' +
            '<b>Solucion:</b> Sube theta a 1. El operador Within centra cada grupo, revelando la verdadera pendiente +0.80.' +
          '</div>';
        setTimeout(function() {
          var lbl = document.getElementById('lbl_beta');
          if (lbl && window.katex) katex.render('\\hat{\\beta}(\\theta)', lbl, {throwOnError:false});
          else if (lbl) lbl.textContent = 'beta(theta)';
        }, 0);
      } else if (labMode === 2) {
        panel.innerHTML = 
          '<div class="control-group">' +
            '<label><span>Heterocedasticidad</span><span id="v_het">' + state.hetero.toFixed(1) + 'x</span></label>' +
            '<input type="range" min="1" max="4" step="0.1" value="' + state.hetero + '" oninput="labState.hetero=+this.value; labUpdateUI()">' +
            '<div style="font-size:8px;color:' + C.muted + '">Ratio de varianzas. 1x = homocedastico.</div>' +
          '</div>' +
          '<div class="control-group">' +
            '<label><span>Autocorrelacion</span><span id="v_rho">' + state.rho.toFixed(2) + '</span></label>' +
            '<input type="range" min="-0.8" max="0.8" step="0.05" value="' + state.rho + '" oninput="labState.rho=+this.value; labUpdateUI()">' +
            '<div style="font-size:8px;color:' + C.muted + '">Correlacion serial. Inclina el elipsoide.</div>' +
          '</div>' +
          '<div class="control-group">' +
            '<label><span>Transformacion Cholesky</span><span id="v_chol">' + Math.round(state.applyCholesky * 100) + '%</span></label>' +
            '<input type="range" min="0" max="1" step="0.02" value="' + state.applyCholesky + '" oninput="labState.applyCholesky=+this.value; labUpdateUI()">' +
            '<div style="font-size:8px;color:' + C.muted + '">Aplica C tal que Omega^-1 = C\'C.</div>' +
          '</div>' +
          '<div class="math-card">' +
            '<b>GLS transforma el espacio:</b> Las elipses son curvas de isodensidad de epsilon. Con heterocedasticidad/autocorrelacion, OLS pierde eficiencia.<br><br>' +
            '<b>Solucion:</b> Desliza Cholesky al 100%. El elipsoide se vuelve esfera: OLS = GLS.' +
          '</div>';
      } else if (labMode === 3) {
        panel.innerHTML = 
          '<div class="control-group">' +
            '<label><span>Autovalor Dominante</span><span id="v_lam">' + state.lambda.toFixed(2) + '</span></label>' +
            '<input type="range" min="0.20" max="1.05" step="0.01" value="' + state.lambda + '" oninput="labState.lambda=+this.value; labUpdateUI()">' +
            '<div style="font-size:8px;color:' + C.muted + '">Posicion de lambda en el plano complejo.</div>' +
          '</div>' +
          '<div class="lab-metrics">' +
            '<div class="metric"><div class="val" id="m_stat">I(0)</div><div class="lbl">Integracion</div></div>' +
            '<div class="metric"><div class="val" id="m_spec">Estable</div><div class="lbl">Espectro</div></div>' +
          '</div>' +
          '<div class="math-card">' +
            '<b>Circulo unitario:</b> Si |lambda| < 1, la serie es estacionaria I(0). Si |lambda| = 1, es raiz unitaria I(1) con memoria infinita.<br><br>' +
            '<b>Peligro:</b> Con I(1), OLS produce regresion espuria (R^2 alto sin causalidad).<br><br>' +
            '<b>Experimento:</b> Lleva lambda a 1.0 y observa como la trayectoria deja de revertir a la media.' +
          '</div>';
      }
      labUpdateUI();
    }

    window.labState = state;

    window.labUpdateUI = function() {
      if (labMode === 0) {
        var el_ax = document.getElementById('v_ax');
        var el_ya = document.getElementById('v_ya');
        if (el_ax) el_ax.textContent = state.angleX + ' grados';
        if (el_ya) el_ya.textContent = state.yAngle + ' grados';
        var diffRad = (state.yAngle - state.angleX) * Math.PI / 180;
        var r2 = Math.pow(Math.cos(diffRad), 2);
        var el_r2 = document.getElementById('m_r2');
        if (el_r2) el_r2.textContent = r2.toFixed(3);
        var el_orth = document.getElementById('m_orth');
        if (el_orth) el_orth.textContent = '0.000';
      } else if (labMode === 1) {
        var el_th = document.getElementById('v_th');
        if (el_th) el_th.textContent = state.theta.toFixed(2);
      } else if (labMode === 2) {
        var el_het = document.getElementById('v_het');
        var el_rho = document.getElementById('v_rho');
        var el_chol = document.getElementById('v_chol');
        if (el_het) el_het.textContent = state.hetero.toFixed(1) + 'x';
        if (el_rho) el_rho.textContent = state.rho.toFixed(2);
        if (el_chol) el_chol.textContent = Math.round(state.applyCholesky * 100) + '%';
      } else if (labMode === 3) {
        var el_lam = document.getElementById('v_lam');
        if (el_lam) el_lam.textContent = state.lambda.toFixed(2);
        var st = document.getElementById('m_stat');
        var sp = document.getElementById('m_spec');
        if (st && sp) {
          if (state.lambda < 0.99) {
            st.textContent = 'I(0)'; st.style.color = C.success;
            sp.textContent = '|lambda| < 1'; sp.style.color = C.success;
          } else if (state.lambda <= 1.01) {
            st.textContent = 'I(1)'; st.style.color = C.accent;
            sp.textContent = '|lambda| = 1'; sp.style.color = C.accent;
          } else {
            st.textContent = 'Explosiva'; st.style.color = C.error;
            sp.textContent = '|lambda| > 1'; sp.style.color = C.error;
          }
        }
      }
      draw();
    };

    function drawArrow(x1, y1, x2, y2, color, width, label) {
      var headlen = 8;
      var angle = Math.atan2(y2 - y1, x2 - x1);
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width || 2;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
      ctx.closePath(); ctx.fill();
      if (label) { ctx.font = '10px Segoe UI'; ctx.fillText(label, x2 + 6, y2 - 4); }
    }

    function draw() {
      ctx.fillStyle = C.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (labMode === 0) {
        var ox = 80, oy = 220;
        var radX = -state.angleX * Math.PI / 180;
        var radY = -state.yAngle * Math.PI / 180;
        var yLenPx = 160;

        ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
        ctx.beginPath();
        ctx.moveTo(ox - 30 * Math.cos(radX), oy - 30 * Math.sin(radX));
        ctx.lineTo(ox + 350 * Math.cos(radX), oy + 350 * Math.sin(radX));
        ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = C.accent; ctx.font = '10px Segoe UI';
        ctx.fillText('C(X)', ox + 280 * Math.cos(radX), oy + 280 * Math.sin(radX) + 14);

        var yx = ox + yLenPx * Math.cos(radY);
        var yy = oy + yLenPx * Math.sin(radY);
        var diff = radY - radX;
        var yhatLen = yLenPx * Math.cos(diff);
        var yhx = ox + yhatLen * Math.cos(radX);
        var yhy = oy + yhatLen * Math.sin(radX);

        var sq = 10, ux = Math.cos(radX), uy = Math.sin(radX), nx = -uy, ny = ux;
        ctx.strokeStyle = C.muted; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(yhx - sq * ux, yhy - sq * uy);
        ctx.lineTo(yhx - sq * ux - sq * nx, yhy - sq * uy - sq * ny);
        ctx.lineTo(yhx - sq * nx, yhy - sq * ny);
        ctx.stroke();

        drawArrow(ox, oy, yhx, yhy, C.success, 3, 'y-hat');
        drawArrow(yhx, yhy, yx, yy, C.error, 2, 'epsilon');
        drawArrow(ox, oy, yx, yy, C.text, 2, 'y');

      } else if (labMode === 1) {
        var cx = 260, cy = 140;
        var groups = [
          { meanX: -100, meanY: 70, color: C.accent },
          { meanX: 0, meanY: 0, color: C.success },
          { meanX: 100, meanY: -70, color: '#888' }
        ];
        var trueSlope = 0.8;
        var sumX = 0, sumY = 0, sumXY = 0, sumXX = 0, n = 0;

        ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(30, cy); ctx.lineTo(490, cy);
        ctx.moveTo(cx, 10); ctx.lineTo(cx, 270); ctx.stroke();

        groups.forEach(function(g, gi) {
          var curMeanX = g.meanX * (1 - state.theta);
          var curMeanY = g.meanY * (1 - state.theta);
          for (var t = 0; t < 10; t++) {
            var dx = (seededRandom(gi * 100 + t) - 0.5) * 70;
            var noise = (seededRandom(gi * 200 + t) - 0.5) * 28;
            var dy = trueSlope * dx + noise;
            var px = cx + curMeanX + dx;
            var py = cy - (curMeanY + dy);
            ctx.fillStyle = g.color;
            ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
            sumX += curMeanX + dx; sumY += curMeanY + dy;
            sumXY += (curMeanX + dx) * (curMeanY + dy);
            sumXX += (curMeanX + dx) * (curMeanX + dx); n++;
          }
        });

        var betaHat = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
        var el_bp = document.getElementById('m_b_pool');
        if (el_bp) {
          el_bp.textContent = (betaHat >= 0 ? '+' : '') + betaHat.toFixed(2);
          el_bp.style.color = betaHat > 0 ? C.success : C.error;
        }

        ctx.strokeStyle = betaHat > 0 ? C.success : C.error; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx - 180, cy - (-180 * betaHat));
        ctx.lineTo(cx + 180, cy - (180 * betaHat));
        ctx.stroke();

      } else if (labMode === 2) {
        var cx = 260, cy = 140;
        var t = state.applyCholesky;
        var curHet = state.hetero * (1 - t) + 1.0 * t;
        var curRho = state.rho * (1 - t);

        ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(50, cy); ctx.lineTo(470, cy);
        ctx.moveTo(cx, 20); ctx.lineTo(cx, 260); ctx.stroke();

        [30, 55, 80].forEach(function(r, idx) {
          ctx.save(); ctx.translate(cx, cy);
          var angle = 0.5 * Math.atan2(2 * curRho * curHet, 1 - curHet * curHet);
          ctx.rotate(-angle);
          ctx.strokeStyle = t > 0.9 ? C.success : C.accent;
          ctx.lineWidth = idx === 1 ? 2 : 1;
          ctx.beginPath();
          ctx.ellipse(0, 0, r * curHet * 0.7, r * 0.7 * (1 - Math.abs(curRho) * 0.4), 0, 0, Math.PI * 2);
          ctx.stroke(); ctx.restore();
        });

      } else if (labMode === 3) {
        var cx = 110, cy = 140, rad = 70;

        ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(15, cy); ctx.lineTo(205, cy);
        ctx.moveTo(cx, 50); ctx.lineTo(cx, 230); ctx.stroke();

        ctx.strokeStyle = C.success; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
        ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);

        var lx = cx + state.lambda * rad;
        ctx.fillStyle = state.lambda >= 1 ? C.error : C.accent;
        ctx.beginPath(); ctx.arc(lx, cy, 5, 0, Math.PI * 2); ctx.fill();

        var sx = 240, sy = 140, w = 260;
        ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + w, sy); ctx.stroke();

        ctx.strokeStyle = state.lambda >= 1 ? C.accent : C.success; ctx.lineWidth = 1.5;
        ctx.beginPath();
        var yVal = 0;
        for (var i = 0; i < 70; i++) {
          var shock = (seededRandom(i + 42) - 0.48) * 18;
          yVal = state.lambda * yVal + shock;
          var px = sx + (i / 69) * w;
          var py = Math.max(20, Math.min(260, sy - yVal));
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
    }

    // Inicializar
    renderControls();
    renderSuggestions();
    renderEquation();
  }, 10);
})();
</script>
