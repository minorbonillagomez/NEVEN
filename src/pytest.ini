[pytest]
# Runner unico de los tests de Python (B-02). Comando: python scripts/run_python_tests.py
testpaths = .
python_files = test_*.py
# importlib: hay dos test_rag_queries.py con el mismo nombre (startup/ e Install/scripts/)
addopts = --import-mode=importlib -p no:cacheprovider
norecursedirs = .* Build Dist _deps Releases __pycache__ external node_modules .git libreria Include
