# Ontology schema for Algebra Lineal
# Domain: algebra_lineal

domain:
  id: algebra_lineal
  name: Algebra Lineal
  description: 'Knowledge domain: Linear Algebra - matrices, vectors, transformations, eigenvalues'

types:
  Concept:
    description: General concept or term in linear algebra
    properties:
      name: string
      description: string
      notation: string
      source_book: string
  
  Method:
    description: Technique, algorithm or computational method
    properties:
      name: string
      description: string
      complexity: string
      steps: list
      source_book: string
  
  Theorem:
    description: Mathematical theorem or proposition
    properties:
      name: string
      statement: string
      proof_outline: string
      source_book: string
  
  Definition:
    description: Formal mathematical definition
    properties:
      name: string
      formal_definition: string
      examples: list
      source_book: string
  
  ExcelFunction:
    description: Excel function related to linear algebra
    properties:
      name: string
      syntax: string
      description: string
      examples: list
      source_book: string
  
  BestPractice:
    description: Recommended practice or pattern
    properties:
      name: string
      description: string
      rationale: string
      source_book: string

relations:
  - type: RELATED_TO
    description: General relationship between concepts
  - type: DEPENDS_ON
    description: Conceptual dependency
  - type: APPLIES_TO
    description: Application relationship
  - type: IMPLEMENTS
    description: Implementation of a concept in code/Excel
  - type: PREREQUISITE_OF
    description: Must understand A before B
  - type: GENERALIZES
    description: A is a generalization of B
  - type: SPECIAL_CASE_OF
    description: A is a special case of B
  - type: COMPUTES
    description: Method/function computes a concept
  - type: PROVES
    description: Theorem proves a statement
