<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ontología Excel — NEVEN</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    :root {
      --bg-main: #0f1419;
      --bg-panel: #1a1f26;
      --bg-card: #242b35;
      --border-subtle: #2d3748;
      --border-focus: #4a5568;
      --text-primary: #e2e8f0;
      --text-secondary: #a0aec0;
      --text-muted: #718096;
      --accent: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
    }
    #network { flex: 1; height: 100%; }
    #sidebar {
      width: 380px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-subtle);
      background: linear-gradient(135deg, #1a472a 0%, #1a1f26 100%);
    }
    .sidebar-header h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--accent);
    }
    .search-box {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 8px 12px;
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 13px;
    }
    .stats {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      background: var(--bg-card);
      padding: 4px 8px;
      border-radius: 4px;
    }
    .stat-color {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .stat-label { color: var(--text-secondary); }
    .stat-count { color: var(--text-primary); font-weight: 600; }
    #node-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .node-item {
      padding: 10px 12px;
      margin-bottom: 4px;
      background: var(--bg-card);
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .node-item:hover {
      border-color: var(--accent);
    }
    .node-item-name {
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 2px;
    }
    .node-item-type {
      font-size: 10px;
      color: var(--text-muted);
    }
    #detail-panel {
      padding: 16px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-card);
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    #detail-panel h3 {
      font-size: 13px;
      margin-bottom: 8px;
    }
    #detail-panel p {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.5;
      font-family: 'Consolas', monospace;
    }
    .controls {
      position: absolute;
      bottom: 20px;
      right: 400px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .control-btn {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .control-btn:hover {
      background: var(--bg-card);
      color: var(--accent);
      border-color: var(--accent);
    }
  </style>
</head>

    <div id="detail-panel">

  <div class="controls">

  </div>

const nodes = new vis.DataSet(nodesData);
const edges = new vis.DataSet(edgesData);

const container = document.getElementById('network');
const data = { nodes, edges };
const options = {
  physics: {
    enabled: true,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -80,
      centralGravity: 0.015,
      springLength: 120,
      springConstant: 0.06
    },
    stabilization: { iterations: 200 }
  },
  interaction: {
    hover: true,
    tooltipDelay: 100,
    zoomView: true,
    dragView: true
  },
  nodes: {
    borderWidth: 2,
    shadow: true
  },
  edges: {
    width: 1,
    shadow: false
  }
};

const network = new vis.Network(container, data, options);

// Render node list
const nodeList = document.getElementById('node-list');
const sortedNodes = [...nodesData].sort((a, b) => a.fullName.localeCompare(b.fullName));

sortedNodes.forEach(node => {
  const div = document.createElement('div');
  div.className = 'node-item';
  div.innerHTML = `
    <div class="node-item-name" style="color:${node.color.background}">${node.fullName}</div>
    <div class="node-item-type">${node.type}</div>
  `;
  div.onclick = () => {
    network.focus(node.id, { scale: 1.5, animation: true });
    network.selectNodes([node.id]);
    showDetail(node);
  };
  nodeList.appendChild(div);
});

// Search
document.getElementById('search').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase();
  document.querySelectorAll('.node-item').forEach(item => {
    const name = item.querySelector('.node-item-name').textContent.toLowerCase();
    item.style.display = name.includes(query) ? '' : 'none';
  });
});

// Show detail
function showDetail(node) {
  document.getElementById('detail-panel').style.display = 'block';
  document.getElementById('detail-name').textContent = node.fullName;
  document.getElementById('detail-name').style.color = node.color.background;
  document.getElementById('detail-desc').textContent = node.description || 'Sin descripción';
}

network.on('click', (params) => {
  if (params.nodes.length > 0) {
    const node = nodesData.find(n => n.id === params.nodes[0]);
    if (node) showDetail(node);
  }
});

let physicsEnabled = true;
function togglePhysics() {
  physicsEnabled = !physicsEnabled;
  network.setOptions({ physics: { enabled: physicsEnabled } });
}

let currentTypeFilter = null;
const types = [...new Set(nodesData.map(n => n.type))];
function filterByType() {
  const idx = currentTypeFilter === null ? 0 : (types.indexOf(currentTypeFilter) + 1) % (types.length + 1);
  currentTypeFilter = idx === types.length ? null : types[idx];
  
  if (currentTypeFilter === null) {
    nodes.update(nodesData.map(n => ({ id: n.id, hidden: false })));
  } else {
    nodes.update(nodesData.map(n => ({ id: n.id, hidden: n.type !== currentTypeFilter })));
  }
}
