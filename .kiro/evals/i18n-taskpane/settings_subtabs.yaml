      es: "Conocimiento"
      en: "Knowledge"

  - id: "subtab_rag"
    expected:
      es: "RAG"
      en: "RAG"

  - id: "subtab_notebooks"
    expected:
      es: "Notebooks"
      en: "Notebooks"

  - id: "subtab_motores"
    expected:
      es: "Motores"
      en: "Engines"

  - id: "subtab_graficos"
