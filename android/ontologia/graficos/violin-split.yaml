entity_type: ChartType
id: violin-split
name:
  en: Split Violin Plot
  es: Diagrama de Violín
description:
  en: A split violin plot displaying two distributions side-by-side within each violin,
    with each half representing a different group. Unlike standard violin plots that
    mirror the same distribution, split violins use the left and right halves to compare
    two conditions (such as before/after, male/female, or control/treatment) at each
    category level. This enables direct visual comparison of distribution shapes between
    paired groups.
  es: A split violin plot displaying two distributions side-by-side within each violin,
    with each half representing a different group. Unlike standard violin plots that
    mirror the same distribution, split violins use the left and right halves to compare
    two conditions (such as before/after, male/female, or control/treatment) at each
    category level. This enables direct visual comparison of distribution shapes between
    paired groups.
