entity_type: ChartType
id: polar-bar
name:
  en: Polar Bar Chart (Wind Rose)
  es: Gráfico Polar
description:
  en: A bar chart arranged in a circle with bars radiating outward from the center.
    Each bar's angle represents a category (often direction) and length represents
    magnitude. Commonly used as a wind rose for meteorological data.
  es: A bar chart arranged in a circle with bars radiating outward from the center.
    Each bar's angle represents a category (often direction) and length represents
    magnitude. Commonly used as a wind rose for meteorological data.
