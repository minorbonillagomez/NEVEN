entity_type: ChartType
id: cat-box-strip
name:
  en: Box Plot with Strip Overlay
  es: Cat Box Strip
description:
  en: A combined visualization that overlays individual data points (strip plot) on
    top of a box plot. This provides both summary statistics (median, quartiles, whiskers)
    and visibility of the actual data distribution.
  es: A combined visualization that overlays individual data points (strip plot) on
    top of a box plot. This provides both summary statistics (median, quartiles, whiskers)
    and visibility of the actual data distribution.
