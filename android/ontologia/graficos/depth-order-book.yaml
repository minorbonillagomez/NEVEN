notes:
- Compute cumulative quantity separately per side, accumulating from the best bid/best
  ask (nearest the mid price) outward toward worse prices
- Render both areas as left-continuous step (staircase) curves, not smooth lines,
  to reflect discrete price levels
- Use green for the bid area and red for the ask area, with semi-transparent fills
  and matching solid outline strokes
