notes:
- LOWESS curve should be visually distinct from scatter points (solid line, contrasting
  color)
- Use moderate smoothing bandwidth (frac ~0.3-0.5) as default for balanced smoothness
- Points should have moderate transparency (alpha ~0.5-0.7) to show density and the
  fitted curve clearly
