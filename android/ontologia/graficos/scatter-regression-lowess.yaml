entity_type: ChartType
id: scatter-regression-lowess
name:
  en: Scatter Plot with LOWESS Regression
  es: Diagrama de Dispersión Regresión
description:
  en: A scatter plot with a LOWESS (Locally Weighted Scatterplot Smoothing) regression
    curve overlaid. LOWESS is a non-parametric method that fits smooth curves by performing
    local weighted regressions at each point, adapting to local data patterns without
    assuming a specific functional form. This makes it ideal for exploring complex
    relationships where the underlying pattern is unknown or varies across the data
    range.
  es: A scatter plot with a LOWESS (Locally Weighted Scatterplot Smoothing) regression
    curve overlaid. LOWESS is a non-parametric method that fits smooth curves by performing
    local weighted regressions at each point, adapting to local data patterns without
    assuming a specific functional form. This makes it ideal for exploring complex
    relationships where the underlying pattern is unknown or varies across the data
    range.
aliases:
  en:
  - scatter-regression-lowess
  - scatter regression lowess
  - regression scatter plot
  es:
  - scatter-regression-lowess
  - scatter regression lowess
  - diagrama de dispersión regresión
use_when:
  en:
  - Exploring relationship between two continuous variables
  - Detecting correlations (positive, negative, none)
  - Identifying outliers in bivariate data
  es:
  - Explorar relación entre dos variables continuas
  - Detectar correlaciones (positiva, negativa, ninguna)
  - Identificar valores atípicos en datos bivariados
avoid_when:
  en:
  - Categorical variables (use bar chart)
  - Time series (use line chart)
  es:
  - Variables categóricas (usar gráfico de barras)
  - Series temporales (usar gráfico de líneas)
applications:
  en:
  - Exploring non-linear relationships in exploratory data analysis where the true
    relationship is unknown
  - Visualizing trends in economic data where patterns may change over different value
    ranges
  - Analyzing biological dose-response curves that don't follow standard mathematical
    models
  es:
  - Exploring non-linear relationships in exploratory data analysis where the true
    relationship is unknown
  - Visualizing trends in economic data where patterns may change over different value
    ranges
  - Analyzing biological dose-response curves that don't follow standard mathematical
    models
