entity_type: ChartType
id: line-stepwise
name:
  en: Step Line Plot
  es: Gráfico de Líneas
description:
  en: A step function plot where values remain constant until the next change, creating
    horizontal-then-vertical transitions. This visualization emphasizes discrete changes
    rather than interpolated values.
  es: A step function plot where values remain constant until the next change, creating
    horizontal-then-vertical transitions. This visualization emphasizes discrete changes
    rather than interpolated values.
aliases:
  en:
  - line-stepwise
  - line stepwise
  - line chart
  es:
  - line-stepwise
  - line stepwise
  - gráfico de líneas
use_when:
  en:
  - Showing trends over time
  - Displaying continuous data changes
  - Comparing multiple series
  es:
  - Mostrar tendencias en el tiempo
  - Visualizar cambios en datos continuos
  - Comparar múltiples series
avoid_when:
  en: []
  es: []
applications:
  en:
  - Discrete state changes over time
  - Price/value stepping (stock prices at close)
  - Cumulative counts that increase discretely
  - Digital signals and binary states
  - Piecewise constant functions
  es:
  - Discrete state changes over time
  - Price/value stepping (stock prices at close)
  - Cumulative counts that increase discretely
  - Digital signals and binary states
  - Piecewise constant functions
