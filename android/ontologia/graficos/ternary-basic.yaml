entity_type: ChartType
id: ternary-basic
name:
  en: Basic Ternary Plot
  es: Diagrama Ternario Básico
description:
  en: A ternary plot displays three-component compositional data on an equilateral
    triangle where each vertex represents 100% of one component. Points inside the
    triangle show compositions that sum to a constant total (usually 100%), with position
    indicating relative proportions. This visualization is essential for data where
    three variables are interdependent and constrained to sum to a fixed value.
  es: A ternary plot displays three-component compositional data on an equilateral
    triangle where each vertex represents 100% of one component. Points inside the
    triangle show compositions that sum to a constant total (usually 100%), with position
    indicating relative proportions. This visualization is essential for data where
    three variables are interdependent and constrained to sum to a fixed value.
