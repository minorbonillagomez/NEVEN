use_when:
  en:
  - A ternary plot displays three-component compositional data on an equilateral triangle
    where each vertex represents 100% of one component. Points inside the triangle
    show compositions that sum to a con
  es:
  - A ternary plot displays three-component compositional data on an equilateral triangle
    where each vertex represents 100% of one component. Points inside the triangle
    show compositions that sum to a con
avoid_when:
