entity_type: ChartType
id: alluvial-opinion-flow
name:
  en: Opinion Flow Diagram
  es: Alluvial Opinion Flow
description:
  en: An alluvial/Sankey-style diagram showing how opinions or group memberships shift
    between survey waves or time periods. Flows connect the same response categories
    across columns, revealing patterns of opinion change, stability, and polarization.
    Unlike a basic alluvial diagram, this variant emphasizes distinguishing stable
    respondents from net changers and displays respondent totals per category at each
    wave.
  es: An alluvial/Sankey-style diagram showing how opinions or group memberships shift
    between survey waves or time periods. Flows connect the same response categories
    across columns, revealing patterns of opinion change, stability, and polarization.
    Unlike a basic alluvial diagram, this variant emphasizes distinguishing stable
    respondents from net changers and displays respondent totals per category at each
    wave.
