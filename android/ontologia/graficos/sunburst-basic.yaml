entity_type: ChartType
id: sunburst-basic
name:
  en: Basic Sunburst Chart
  es: Gráfico de Explosión Solar Básico
description:
  en: A sunburst chart displays hierarchical data as concentric rings, where each
    ring represents a level in the hierarchy. Inner rings show parent categories while
    outer rings show their children, with segment angles proportional to values. This
    radial visualization excels at revealing hierarchical structures and part-to-whole
    relationships across multiple levels simultaneously.
  es: A sunburst chart displays hierarchical data as concentric rings, where each
    ring represents a level in the hierarchy. Inner rings show parent categories while
    outer rings show their children, with segment angles proportional to values. This
    radial visualization excels at revealing hierarchical structures and part-to-whole
    relationships across multiple levels simultaneously.
