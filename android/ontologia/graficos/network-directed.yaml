entity_type: ChartType
id: network-directed
name:
  en: Directed Network Graph
  es: Grafo de Red
description:
  en: A directed network graph visualizes relationships between entities using nodes
    connected by edges with arrows, indicating the direction of relationships or flow.
    Unlike undirected graphs, directed graphs reveal asymmetric relationships such
    as dependencies, hierarchies, or information flow. The arrows clearly communicate
    which entity points to which, making cause-and-effect relationships and directional
    dependencies immediately visible.
  es: A directed network graph visualizes relationships between entities using nodes
    connected by edges with arrows, indicating the direction of relationships or flow.
    Unlike undirected graphs, directed graphs reveal asymmetric relationships such
    as dependencies, hierarchies, or information flow. The arrows clearly communicate
    which entity points to which, making cause-and-effect relationships and directional
    dependencies immediately visible.
