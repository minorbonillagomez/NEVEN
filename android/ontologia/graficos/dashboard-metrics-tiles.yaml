notes:
- 'Grid layout should be responsive: 2x2 for 4 tiles, 3x2 for 6 tiles, 3x3 or 4x3
  for more'
- 'Each tile contains: prominent value display, metric label, mini sparkline, change
  indicator with arrow'
- 'Color coding for status: green for good/normal, yellow/orange for warning, red
  for critical'
