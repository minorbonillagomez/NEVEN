entity_type: ChartType
id: parliament-basic
name:
  en: Parliament Seat Chart
  es: Parliament Basic Básico
description:
  en: A semicircular parliament seat chart visualizes political party representation
    by arranging seats in concentric arcs. Each seat is displayed as an individual
    dot or segment, colored by party affiliation. This visualization is ideal for
    showing the composition of legislative bodies, election results, and voting bloc
    distributions at a glance.
  es: A semicircular parliament seat chart visualizes political party representation
    by arranging seats in concentric arcs. Each seat is displayed as an individual
    dot or segment, colored by party affiliation. This visualization is ideal for
    showing the composition of legislative bodies, election results, and voting bloc
    distributions at a glance.
