entity_type: ChartType
id: treemap-basic
name:
  en: Basic Treemap
  es: Mapa de Árbol Básico
description:
  en: A treemap displaying hierarchical data as nested rectangles, where each rectangle's
    area is proportional to its value. This visualization excels at showing part-to-whole
    relationships in hierarchical structures, making it easy to spot large and small
    items at a glance. Treemaps efficiently use screen space to display large amounts
    of hierarchical data in a compact form.
  es: A treemap displaying hierarchical data as nested rectangles, where each rectangle's
    area is proportional to its value. This visualization excels at showing part-to-whole
    relationships in hierarchical structures, making it easy to spot large and small
    items at a glance. Treemaps efficiently use screen space to display large amounts
    of hierarchical data in a compact form.
