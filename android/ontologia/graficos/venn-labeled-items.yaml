notes:
- Use the standard symmetric three-circle Venn layout with equally sized circles and
  clear pairwise and triple overlaps
- Apply semi-transparent fills so overlapping regions remain visible through each
  other
- Place item labels inside their assigned zone without overlapping neighbors; use
  small point markers or text-only placement
