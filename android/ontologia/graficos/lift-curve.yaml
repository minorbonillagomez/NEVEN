entity_type: ChartType
id: lift-curve
name:
  en: Model Lift Chart
  es: Lift Curve
description:
  en: 'A lift curve visualizes how much better a predictive model performs compared
    to random selection, showing the cumulative lift ratio as you target increasing
    percentages of the population. It answers the question: "If I target the top X%
    of predictions, how many times more responders will I capture than random targeting?"
    This plot is essential for evaluating and comparing classification models in scenarios
    where targeting efficiency matters.'
  es: 'A lift curve visualizes how much better a predictive model performs compared
    to random selection, showing the cumulative lift ratio as you target increasing
    percentages of the population. It answers the question: "If I target the top X%
    of predictions, how many times more responders will I capture than random targeting?"
    This plot is essential for evaluating and comparing classification models in scenarios
    where targeting efficiency matters.'
