notes:
- Y-axis should range from 0% to 100% with a prominent horizontal reference line at
  50%
- Fill the area above 50% with the home team color and below 50% with the away team
  color
- Annotate key scoring events (touchdowns, goals, runs) that caused significant probability
  swings
