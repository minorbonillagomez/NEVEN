entity_type: ChartType
id: line-win-probability
name:
  en: Win Probability Chart
  es: Gráfico de Líneas
description:
  en: A win probability chart shows how each team's likelihood of winning evolves
    over the course of a game. The line starts near 50% and fluctuates based on scoring
    events, ultimately reaching 100% or 0% at game end. The area above and below the
    50% baseline is filled with team colors to convey momentum at a glance. This visualization
    is widely used across major sports for post-game analysis and live broadcasting.
  es: A win probability chart shows how each team's likelihood of winning evolves
    over the course of a game. The line starts near 50% and fluctuates based on scoring
    events, ultimately reaching 100% or 0% at game end. The area above and below the
    50% baseline is filled with team colors to convey momentum at a glance. This visualization
    is widely used across major sports for post-game analysis and live broadcasting.
