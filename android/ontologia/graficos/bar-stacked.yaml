entity_type: ChartType
id: bar-stacked
name:
  en: Stacked Bar Chart
  es: Gráfico de Barras Apilado
description:
  en: A stacked bar chart that displays multiple data series stacked on top of each
    other within each category, showing both individual component values and their
    cumulative totals. This visualization excels at revealing part-to-whole relationships
    while maintaining the ability to compare totals across categories. Stacked bar
    charts are particularly effective for composition analysis, where understanding
    how different components contribute to a whole is as important as comparing totals.
  es: A stacked bar chart that displays multiple data series stacked on top of each
    other within each category, showing both individual component values and their
    cumulative totals. This visualization excels at revealing part-to-whole relationships
    while maintaining the ability to compare totals across categories. Stacked bar
    charts are particularly effective for composition analysis, where understanding
    how different components contribute to a whole is as important as comparing totals.
aliases:
  en:
  - bar-stacked
  - bar stacked
  - stacked bar chart
  es:
  - bar-stacked
  - bar stacked
  - gráfico de barras apilado
use_when:
  en:
  - Comparing values across categories
  - Showing rankings or distributions
  - Displaying discrete data
  es:
  - Comparar valores entre categorías
  - Mostrar rankings o distribuciones
  - Visualizar datos discretos
avoid_when:
  en:
  - Continuous data over time (use line chart)
  - Part-to-whole relationships (use pie)
  es:
  - Datos continuos en el tiempo (usar líneas)
  - Relaciones parte-todo (usar circular)
applications:
  en:
  - Analyzing budget allocations across departments showing expense categories as
    stacked components
  - Visualizing revenue composition over time with different product lines or regions
    stacked
  - Displaying survey responses where multiple answer options are stacked to show
    total respondents per question
  es:
  - Analyzing budget allocations across departments showing expense categories as
    stacked components
  - Visualizing revenue composition over time with different product lines or regions
    stacked
  - Displaying survey responses where multiple answer options are stacked to show
    total respondents per question
