entity_type: ChartType
id: nyquist-basic
name:
  en: Nyquist Plot for Control Systems
  es: Nyquist Basic Básico
description:
  en: A Nyquist plot maps a system's open-loop frequency response onto the complex
    plane by plotting the imaginary part against the real part of the transfer function
    as frequency varies from zero to infinity. It is the primary tool for applying
    the Nyquist stability criterion to determine whether a closed-loop control system
    is stable. The plot visually reveals gain and phase margins and is widely used
    in classical control theory and electronic circuit design.
  es: A Nyquist plot maps a system's open-loop frequency response onto the complex
    plane by plotting the imaginary part against the real part of the transfer function
    as frequency varies from zero to infinity. It is the primary tool for applying
    the Nyquist stability criterion to determine whether a closed-loop control system
    is stable. The plot visually reveals gain and phase margins and is widely used
    in classical control theory and electronic circuit design.
