notes:
- Mark the critical point (-1, 0) with a distinct marker (e.g., red "x" or filled
  circle)
- Draw a unit circle centered at the origin for reference
- Annotate selected frequency values along the curve at key points (e.g., gain crossover,
  phase crossover), optionally with the phase margin and gain margin read there
