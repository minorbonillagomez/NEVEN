entity_type: ChartType
id: heatmap-calendar
name:
  en: Basic Calendar Heatmap
  es: Mapa de Calor
description:
  en: A calendar heatmap visualizes time-series data on a calendar grid, where each
    day is represented as a cell and color intensity indicates the value magnitude.
    The layout follows a calendar structure with days as cells, weekdays as rows,
    weeks as columns, and months as labeled sections along the top. This visualization
    excels at revealing daily patterns, seasonal trends, and temporal anomalies over
    extended time periods.
  es: A calendar heatmap visualizes time-series data on a calendar grid, where each
    day is represented as a cell and color intensity indicates the value magnitude.
    The layout follows a calendar structure with days as cells, weekdays as rows,
    weeks as columns, and months as labeled sections along the top. This visualization
    excels at revealing daily patterns, seasonal trends, and temporal anomalies over
    extended time periods.
