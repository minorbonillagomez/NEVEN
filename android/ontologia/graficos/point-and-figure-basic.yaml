entity_type: ChartType
id: point-and-figure-basic
name:
  en: Point and Figure Chart
  es: Point And Figure Basic
description:
  en: A Point and Figure (P&F) chart is a price-action focused visualization that
    uses columns of X's (rising prices) and O's (falling prices) to display significant
    price movements while filtering out time and minor fluctuations. Unlike traditional
    time-based charts, P&F charts only plot a new symbol when price moves by a defined
    box size, and only start a new column when price reverses by a specified number
    of boxes (typically 3). This makes it ideal for identifying clear trends, support/resistance
    levels, and generating trading signals.
  es: A Point and Figure (P&F) chart is a price-action focused visualization that
    uses columns of X's (rising prices) and O's (falling prices) to display significant
    price movements while filtering out time and minor fluctuations. Unlike traditional
    time-based charts, P&F charts only plot a new symbol when price moves by a defined
    box size, and only start a new column when price reverses by a specified number
    of boxes (typically 3). This makes it ideal for identifying clear trends, support/resistance
    levels, and generating trading signals.
