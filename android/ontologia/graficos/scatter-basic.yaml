entity_type: ChartType
id: scatter-basic
name:
  en: Basic Scatter Plot
  es: Diagrama de Dispersión Básico
description:
  en: A fundamental 2D scatter plot that displays the relationship between two numeric
    variables by plotting points on a Cartesian coordinate system. This visualization
    is essential for exploring correlations, identifying patterns, detecting outliers,
    and understanding the distribution of paired data points.
  es: A fundamental 2D scatter plot that displays the relationship between two numeric
    variables by plotting points on a Cartesian coordinate system. This visualization
    is essential for exploring correlations, identifying patterns, detecting outliers,
    and understanding the distribution of paired data points.
aliases:
  en:
  - scatter-basic
  - scatter basic
  - basic scatter plot
  es:
  - scatter-basic
  - scatter basic
  - diagrama de dispersión básico
use_when:
  en:
  - Exploring relationship between two continuous variables
  - Detecting correlations (positive, negative, none)
  - Identifying outliers in bivariate data
  es:
  - Explorar relación entre dos variables continuas
  - Detectar correlaciones (positiva, negativa, ninguna)
  - Identificar valores atípicos en datos bivariados
avoid_when:
  en:
  - Categorical variables (use bar chart)
  - Time series (use line chart)
  es:
  - Variables categóricas (usar gráfico de barras)
  - Series temporales (usar gráfico de líneas)
applications:
  en:
  - Analyzing the correlation between height and weight in a health study
  - Exploring the relationship between marketing spend and sales revenue
  - Investigating the connection between study hours and exam scores
  es:
  - Analyzing the correlation between height and weight in a health study
  - Exploring the relationship between marketing spend and sales revenue
  - Investigating the connection between study hours and exam scores
data_requirements:
  min_columns: 2
  max_columns: null
  column_types:
  - numeric
  - numeric
  recommended_rows:
