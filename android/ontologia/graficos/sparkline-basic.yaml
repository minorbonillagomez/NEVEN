entity_type: ChartType
id: sparkline-basic
name:
  en: Basic Sparkline
  es: Minigráfico Básico
description:
  en: 'A sparkline is a small, condensed line chart designed to be embedded inline
    with text or in dashboard cells. It shows trends at a glance without axes, axis
    labels, or detailed scales - pure data visualization in minimal space. The defining
    characteristic is extreme minimalism: a single continuous line that conveys the
    shape of data without any chart chrome.'
  es: 'A sparkline is a small, condensed line chart designed to be embedded inline
    with text or in dashboard cells. It shows trends at a glance without axes, axis
    labels, or detailed scales - pure data visualization in minimal space. The defining
    characteristic is extreme minimalism: a single continuous line that conveys the
    shape of data without any chart chrome.'
