entity_type: ChartType
id: chessboard-pieces
name:
  en: Chess Board with Pieces for Position Diagrams
  es: Chessboard Pieces
description:
  en: 'A chess board visualization with pieces that can be positioned programmatically
    to display specific game positions, puzzles, or notable games. Pieces are defined
    using a dictionary mapping squares (e.g., ''e4'': ''K'') to standard chess notation
    where uppercase letters represent white pieces (K/Q/R/B/N/P) and lowercase represent
    black pieces (k/q/r/b/n/p). Unicode chess symbols provide clean, recognizable
    piece rendering.'
  es: 'A chess board visualization with pieces that can be positioned programmatically
    to display specific game positions, puzzles, or notable games. Pieces are defined
    using a dictionary mapping squares (e.g., ''e4'': ''K'') to standard chess notation
    where uppercase letters represent white pieces (K/Q/R/B/N/P) and lowercase represent
    black pieces (k/q/r/b/n/p). Unicode chess symbols provide clean, recognizable
    piece rendering.'
