    investment options under uncertain market conditions'
  - 'Medical decision-making: choosing between treatment pathways based on probability
    of outcomes and quality-adjusted life years'
  - 'Project management: analyzing go/no-go decisions for R&D projects with uncertain
    technical success and market demand'
  - 'Operations research: optimizing sequential decisions such as equipment replacement
    or capacity expansion under uncertainty'
