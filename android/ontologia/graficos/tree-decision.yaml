notes:
- Decision nodes should be rendered as squares, chance nodes as circles, and terminal
  nodes as right-pointing triangles
- Left-to-right layout is preferred for readability
- Pruned branches should be marked with a double-strike or cross mark and rendered
  with reduced opacity or a dashed line
