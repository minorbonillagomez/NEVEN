entity_type: ChartType
id: line-styled
name:
  en: Styled Line Plot
  es: Gráfico de Líneas
description:
  en: A line plot using different line styles (solid, dashed, dotted, dash-dot) to
    distinguish multiple data series. This is especially useful for black-and-white
    printing or when color distinction is insufficient.
  es: A line plot using different line styles (solid, dashed, dotted, dash-dot) to
    distinguish multiple data series. This is especially useful for black-and-white
    printing or when color distinction is insufficient.
aliases:
  en:
  - line-styled
  - line styled
  - line chart
  es:
  - line-styled
  - line styled
  - gráfico de líneas
use_when:
  en:
  - Showing trends over time
  - Displaying continuous data changes
  - Comparing multiple series
  es:
  - Mostrar tendencias en el tiempo
  - Visualizar cambios en datos continuos
  - Comparar múltiples series
avoid_when:
  en: []
  es: []
applications:
  en:
  - Comparing trends in print publications
  - Distinguishing overlapping lines without color
  - Accessibility-friendly visualizations
  - Technical documentation with monochrome printing
  es:
  - Comparing trends in print publications
  - Distinguishing overlapping lines without color
  - Accessibility-friendly visualizations
  - Technical documentation with monochrome printing
