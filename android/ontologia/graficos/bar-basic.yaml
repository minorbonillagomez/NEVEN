entity_type: ChartType
id: bar-basic
name:
  en: Basic Bar Chart
  es: Gráfico de Barras Básico
description:
  en: A vertical bar chart that displays categorical data with rectangular bars whose
    heights are proportional to the values they represent. This fundamental visualization
    is ideal for comparing discrete categories and identifying which categories have
    the highest or lowest values. Bar charts excel at showing rankings, distributions
    across categories, and making relative comparisons intuitive.
  es: A vertical bar chart that displays categorical data with rectangular bars whose
    heights are proportional to the values they represent. This fundamental visualization
    is ideal for comparing discrete categories and identifying which categories have
    the highest or lowest values. Bar charts excel at showing rankings, distributions
    across categories, and making relative comparisons intuitive.
aliases:
  en:
  - bar-basic
  - bar basic
  - basic bar chart
  es:
  - bar-basic
  - bar basic
  - gráfico de barras básico
use_when:
  en:
  - Comparing values across categories
  - Showing rankings or distributions
  - Displaying discrete data
  es:
  - Comparar valores entre categorías
  - Mostrar rankings o distribuciones
  - Visualizar datos discretos
avoid_when:
  en:
  - Continuous data over time (use line chart)
  - Part-to-whole relationships (use pie)
  es:
  - Datos continuos en el tiempo (usar líneas)
  - Relaciones parte-todo (usar circular)
applications:
  en:
  - Comparing quarterly sales figures across different product lines
  - Visualizing survey responses showing preference counts for different options
  - Displaying population statistics across different age groups or regions
  es:
  - Comparing quarterly sales figures across different product lines
  - Visualizing survey responses showing preference counts for different options
  - Displaying population statistics across different age groups or regions
