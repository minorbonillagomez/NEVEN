entity_type: ChartType
id: donut-basic
name:
  en: Basic Donut Chart
  es: Gráfico de Dona Básico
description:
  en: A donut chart (ring chart) showing proportions of categorical data as segments
    of a ring, with a hollow center. Similar to pie charts but the empty center can
    display summary statistics or additional information. The ring format can be easier
    to read when comparing segment sizes.
  es: A donut chart (ring chart) showing proportions of categorical data as segments
    of a ring, with a hollow center. Similar to pie charts but the empty center can
    display summary statistics or additional information. The ring format can be easier
    to read when comparing segment sizes.
aliases:
  en:
  - donut-basic
  - donut basic
  - basic donut chart
  es:
  - donut-basic
  - donut basic
  - gráfico de dona básico
use_when:
  en:
  - Showing part-to-whole relationships
  - Displaying composition with few categories (≤6)
  - Emphasizing proportions
  es:
  - Mostrar relaciones parte-todo
  - Visualizar composición con pocas categorías (≤6)
  - Enfatizar proporciones
avoid_when:
  en:
  - Many categories (>6)
  - Comparing values (use bar)
  es:
  - Muchas categorías (>6)
  - Comparar valores (usar barras)
applications:
  en:
  - Budget allocation by category with total in center
  - Market share distribution with company logo in center
  - Progress tracking (completion percentage)
  - Portfolio allocation by asset class
  es:
  - Budget allocation by category with total in center
  - Market share distribution with company logo in center
  - Progress tracking (completion percentage)
  - Portfolio allocation by asset class
data_requirements:
  min_columns: 2
  max_columns: null
  column_types:
  - categorical
  - numeric
  recommended_rows:
    min: 2
    max: 10
