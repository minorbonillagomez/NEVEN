applications:
  en:
  - 'Pediatrics: tracking an individual child''s growth trajectory against population
    reference percentiles during well-child visits'
  - 'Public health: comparing population-level growth distributions to WHO/CDC reference
    standards for nutritional surveillance'
  - 'Nutrition research: identifying trends in childhood malnutrition or obesity by
    visualizing cohort data against percentile bands'
  - 'Medical education: teaching students how to interpret growth charts and assess
    developmental milestones'
