notes:
- Percentile bands should be rendered as filled areas between adjacent percentile
  curves with graduated color intensity (darker near extremes, lighter near median)
- The 50th percentile (median) line should be visually emphasized (thicker or distinct
  color)
- 'Gender-specific coloring convention: use blue tones for boys and pink/rose tones
  for girls (generate the chart for one gender)'
