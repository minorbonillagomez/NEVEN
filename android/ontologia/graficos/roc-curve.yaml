entity_type: ChartType
id: roc-curve
name:
  en: ROC Curve with AUC
  es: Curva ROC
description:
  en: A Receiver Operating Characteristic (ROC) curve visualizes the performance of
    a binary classifier by plotting the True Positive Rate (TPR) against the False
    Positive Rate (FPR) at various classification thresholds. The Area Under the Curve
    (AUC) provides a single metric summarizing model performance, where 1.0 indicates
    perfect classification and 0.5 represents random guessing.
  es: A Receiver Operating Characteristic (ROC) curve visualizes the performance of
    a binary classifier by plotting the True Positive Rate (TPR) against the False
    Positive Rate (FPR) at various classification thresholds. The Area Under the Curve
    (AUC) provides a single metric summarizing model performance, where 1.0 indicates
    perfect classification and 0.5 represents random guessing.
