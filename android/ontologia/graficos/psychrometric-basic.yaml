notes:
- The saturation curve (100% RH) forms the upper boundary of the chart and should
  be visually prominent
- Relative humidity curves (10%-100%) should be drawn as smooth curves between the
  saturation line and x-axis
- Wet-bulb and enthalpy lines run diagonally from upper-left to lower-right
