entity_type: ChartType
id: psychrometric-basic
name:
  en: Psychrometric Chart for HVAC
  es: Psychrometric Basic Básico
description:
  en: A psychrometric chart plots dry-bulb temperature against humidity ratio, overlaid
    with curves for relative humidity, wet-bulb temperature, enthalpy, and specific
    volume. It is the fundamental tool for HVAC system design and air conditioning
    process analysis. The chart reveals the thermodynamic properties of moist air
    at a glance, enabling engineers to trace heating, cooling, humidification, and
    dehumidification processes as paths on the diagram.
  es: A psychrometric chart plots dry-bulb temperature against humidity ratio, overlaid
    with curves for relative humidity, wet-bulb temperature, enthalpy, and specific
    volume. It is the fundamental tool for HVAC system design and air conditioning
    process analysis. The chart reveals the thermodynamic properties of moist air
    at a glance, enabling engineers to trace heating, cooling, humidification, and
    dehumidification processes as paths on the diagram.
