entity_type: ChartType
id: map-route-path
name:
  en: Route Path Map
  es: Mapa
description:
  en: A geographic map visualization showing a connected path or route between sequential
    waypoints. Unlike scatter maps that display discrete points, this plot connects
    coordinates in order to reveal journeys, tracks, and navigation paths. Ideal for
    GPS data, delivery routes, and travel visualization where the sequence and continuity
    of movement matters.
  es: A geographic map visualization showing a connected path or route between sequential
    waypoints. Unlike scatter maps that display discrete points, this plot connects
    coordinates in order to reveal journeys, tracks, and navigation paths. Ideal for
    GPS data, delivery routes, and travel visualization where the sequence and continuity
    of movement matters.
