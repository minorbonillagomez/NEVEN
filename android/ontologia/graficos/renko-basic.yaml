entity_type: ChartType
id: renko-basic
name:
  en: Basic Renko Chart
  es: Renko Basic Básico
description:
  en: A Renko chart displays price movements using fixed-size bricks that ignore time
    and focus purely on price action. A new brick is drawn only when the price moves
    by a specified amount (brick size), filtering out market noise and minor fluctuations.
    Bullish bricks (price increase) and bearish bricks (price decrease) alternate
    direction on trend reversals, making it easy to identify trends, support/resistance
    levels, and potential trading signals.
  es: A Renko chart displays price movements using fixed-size bricks that ignore time
    and focus purely on price action. A new brick is drawn only when the price moves
    by a specified amount (brick size), filtering out market noise and minor fluctuations.
    Bullish bricks (price increase) and bearish bricks (price decrease) alternate
    direction on trend reversals, making it easy to identify trends, support/resistance
    levels, and potential trading signals.
