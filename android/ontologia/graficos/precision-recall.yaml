entity_type: ChartType
id: precision-recall
name:
  en: Precision-Recall Curve
  es: Precision Recall
description:
  en: A Precision-Recall curve plots precision (positive predictive value) against
    recall (sensitivity) at various classification thresholds. This visualization
    is essential for evaluating binary classifiers on imbalanced datasets where accuracy
    alone is misleading. The area under the curve (Average Precision) summarizes classifier
    performance, with higher values indicating better performance.
  es: A Precision-Recall curve plots precision (positive predictive value) against
    recall (sensitivity) at various classification thresholds. This visualization
    is essential for evaluating binary classifiers on imbalanced datasets where accuracy
    alone is misleading. The area under the curve (Average Precision) summarizes classifier
    performance, with higher values indicating better performance.
