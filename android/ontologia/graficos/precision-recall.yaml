avoid_when:
  en: []
  es: []
applications:
  en:
  - Evaluating fraud detection models where fraudulent transactions are rare compared
    to legitimate ones
  - Assessing medical diagnostic systems where correctly identifying positive cases
    (high recall) is critical
  - Comparing information retrieval systems for document search relevance ranking
  - Optimizing spam filters to balance catching spam (recall) with minimizing false
    positives (precision)
