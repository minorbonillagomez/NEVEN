entity_type: ChartType
id: logistic-regression
name:
  en: Logistic Regression Curve Plot
  es: Logistic Regression Regresión
description:
  en: A logistic regression visualization showing the characteristic S-shaped (sigmoid)
    probability curve for binary classification. The plot displays data points colored
    by their binary class, the fitted logistic curve representing predicted probabilities,
    confidence intervals around the curve, and a dashed decision threshold line at
    probability 0.5. This visualization is essential for understanding how a logistic
    model maps continuous input features to class probabilities.
  es: A logistic regression visualization showing the characteristic S-shaped (sigmoid)
    probability curve for binary classification. The plot displays data points colored
    by their binary class, the fitted logistic curve representing predicted probabilities,
    confidence intervals around the curve, and a dashed decision threshold line at
    probability 0.5. This visualization is essential for understanding how a logistic
    model maps continuous input features to class probabilities.
