notes:
- Data points should be jittered slightly on the y-axis (around 0 and 1) for visibility
  when overlapping
- Use distinct colors for the two classes (e.g., blue for class 0, orange for class
  1)
- The logistic curve should be smooth and prominently displayed (solid line, ~2px
  width)
