entity_type: ChartType
id: scatter-color-mapped
name:
  en: Color-Mapped Scatter Plot
  es: Diagrama de Dispersión
description:
  en: A scatter plot that encodes a third continuous variable using a colormap, allowing
    visualization of three dimensions on a 2D plane. This visualization is essential
    for exploring multivariate relationships where the third variable represents intensity,
    magnitude, or any continuous measurement. A colorbar provides a reference scale
    for interpreting the color values.
  es: A scatter plot that encodes a third continuous variable using a colormap, allowing
    visualization of three dimensions on a 2D plane. This visualization is essential
    for exploring multivariate relationships where the third variable represents intensity,
    magnitude, or any continuous measurement. A colorbar provides a reference scale
    for interpreting the color values.
aliases:
  en:
  - scatter-color-mapped
  - scatter color mapped
  - scatter plot
  es:
  - scatter-color-mapped
  - scatter color mapped
  - diagrama de dispersión
use_when:
  en:
  - Exploring relationship between two continuous variables
  - Detecting correlations (positive, negative, none)
  - Identifying outliers in bivariate data
  es:
  - Explorar relación entre dos variables continuas
  - Detectar correlaciones (positiva, negativa, ninguna)
  - Identificar valores atípicos en datos bivariados
avoid_when:
  en:
  - Categorical variables (use bar chart)
  - Time series (use line chart)
  es:
  - Variables categóricas (usar gráfico de barras)
  - Series temporales (usar gráfico de líneas)
applications:
  en:
  - Visualizing temperature distribution across geographic coordinates
  - Showing intensity or magnitude patterns in scientific measurements
  - Displaying correlation strength or significance levels across data points
  es:
  - Visualizing temperature distribution across geographic coordinates
  - Showing intensity or magnitude patterns in scientific measurements
  - Displaying correlation strength or significance levels across data points
