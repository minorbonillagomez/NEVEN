entity_type: ChartType
id: cartogram-area-distortion
name:
  en: Cartogram with Area Distortion by Data Value
  es: Cartogram Area Distortion
description:
  en: A cartogram distorts geographic regions so that their area becomes proportional
    to a data variable (e.g., population, GDP, election votes) rather than physical
    land area. This solves the classic problem of large but sparsely populated areas
    dominating standard maps, making it easier to compare values across regions at
    a glance. Contiguous cartograms preserve adjacency and rough shape of regions
    while rescaling them, famously used in election coverage worldwide.
  es: A cartogram distorts geographic regions so that their area becomes proportional
    to a data variable (e.g., population, GDP, election votes) rather than physical
    land area. This solves the classic problem of large but sparsely populated areas
    dominating standard maps, making it easier to compare values across regions at
    a glance. Contiguous cartograms preserve adjacency and rough shape of regions
    while rescaling them, famously used in election coverage worldwide.
