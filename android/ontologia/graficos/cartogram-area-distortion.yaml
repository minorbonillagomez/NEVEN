notes:
- Prefer a contiguous cartogram (regions keep sharing borders after distortion) to
  preserve geographic context; where boundary geometry or a contiguous cartogram algorithm
  isn't available, a non-contiguous form (Dorling circles or Demers squares) is accepted,
  each region near its true position, shapes not overlapping, neighbors kept close
- Include original region outlines or a reference map inset for comparison
- Use a color scale to encode a secondary variable or to reinforce the size variable
