applications:
  en:
  - Visualizing national election results where each state or district is sized by
    number of voters or electoral votes
  - Comparing GDP or economic output across countries, avoiding the visual bias of
    geographically large but economically small regions
  - Displaying population distribution across administrative regions to highlight
    urbanization patterns
