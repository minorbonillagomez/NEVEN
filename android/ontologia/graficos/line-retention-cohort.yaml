  - Visualizar cambios en datos continuos
  - Comparar múltiples series
avoid_when:
  en: []
  es: []
applications:
  en:
  - Product analytics teams comparing user retention across monthly or weekly signup
    cohorts to measure engagement trends
  - A/B testing analysts evaluating how a new onboarding flow affects long-term user
    retention versus a control group
  - Growth teams reporting retention improvements to stakeholders by showing cohort
    curves shifting upward over time
  es:
  - Product analytics teams comparing user retention across monthly or weekly signup
