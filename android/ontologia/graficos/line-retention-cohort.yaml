entity_type: ChartType
id: line-retention-cohort
name:
  en: User Retention Curve by Cohort
  es: Gráfico de Líneas
description:
  en: A line chart showing the percentage of retained users over time since signup,
    with separate curves for different cohorts. All curves start at 100% at time zero
    and typically exhibit exponential decay, revealing how well a product retains
    users over their lifecycle. By overlaying multiple cohorts, teams can visually
    compare whether retention is improving or degrading across signup periods.
  es: A line chart showing the percentage of retained users over time since signup,
    with separate curves for different cohorts. All curves start at 100% at time zero
    and typically exhibit exponential decay, revealing how well a product retains
    users over their lifecycle. By overlaying multiple cohorts, teams can visually
    compare whether retention is improving or degrading across signup periods.
