entity_type: ChartType
id: line-multi
name:
  en: Multi-Line Comparison Plot
  es: Gráfico de Líneas Múltiple
description:
  en: A multi-line plot displays multiple data series on the same axes for direct
    comparison. Each series is represented by a distinct line with its own color and
    optional style, making it easy to identify trends, correlations, and divergences
    between variables. This visualization is essential for comparing related metrics
    over a common sequence or time period.
  es: A multi-line plot displays multiple data series on the same axes for direct
    comparison. Each series is represented by a distinct line with its own color and
    optional style, making it easy to identify trends, correlations, and divergences
    between variables. This visualization is essential for comparing related metrics
    over a common sequence or time period.
