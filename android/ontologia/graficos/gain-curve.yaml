applications:
  en:
  - 'Marketing campaign optimization: Determine the minimum audience size needed to
    reach a target percentage of likely responders'
  - 'Customer churn prevention: Identify the smallest segment of at-risk customers
    that captures most potential churners'
  - 'Credit scoring model assessment: Evaluate how effectively a model concentrates
    defaulters in high-risk score bands'
  - 'Fraud detection prioritization: Calculate what fraction of investigations captures
    most fraudulent cases'
