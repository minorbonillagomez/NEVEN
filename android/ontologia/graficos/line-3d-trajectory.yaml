entity_type: ChartType
id: line-3d-trajectory
name:
  en: 3D Line Plot for Trajectory Visualization
  es: Gráfico de Líneas 3D
description:
  en: A 3D line plot that displays paths, trajectories, or curves as connected lines
    in three-dimensional space. Unlike scatter plots that show discrete points, this
    visualization connects data points sequentially to reveal continuous paths, making
    it ideal for understanding motion, mathematical curves, and temporal evolution
    in 3D. Interactive rotation is essential for exploring the spatial structure of
    complex trajectories.
  es: A 3D line plot that displays paths, trajectories, or curves as connected lines
    in three-dimensional space. Unlike scatter plots that show discrete points, this
    visualization connects data points sequentially to reveal continuous paths, making
    it ideal for understanding motion, mathematical curves, and temporal evolution
    in 3D. Interactive rotation is essential for exploring the spatial structure of
    complex trajectories.
