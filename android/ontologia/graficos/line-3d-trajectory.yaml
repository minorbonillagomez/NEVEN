use_when:
  en:
  - Showing trends over time
  - Displaying continuous data changes
  - Comparing multiple series
  es:
  - Mostrar tendencias en el tiempo
  - Visualizar cambios en datos continuos
  - Comparar múltiples series
avoid_when:
  en: []
  es: []
applications:
  en:
  - Visualizing particle trajectories and orbital mechanics in physics simulations
  - Plotting flight paths, drone routes, or vehicle navigation in aerospace and robotics
  - Displaying mathematical curves like helices, spirals, and chaotic attractors (Lorenz,
    Rossler)
  - Analyzing time series data embedded in 3D feature spaces for pattern recognition
  es:
  - Visualizing particle trajectories and orbital mechanics in physics simulations
