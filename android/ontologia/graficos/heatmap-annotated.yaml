entity_type: ChartType
id: heatmap-annotated
name:
  en: Annotated Heatmap
  es: Mapa de Calor
description:
  en: A heatmap with numeric values displayed inside each cell, combining color intensity
    with exact value labels. Essential for correlation matrices, confusion matrices,
    and any matrix visualization where both pattern recognition and precise values
    matter. Text color automatically contrasts with background for readability.
  es: A heatmap with numeric values displayed inside each cell, combining color intensity
    with exact value labels. Essential for correlation matrices, confusion matrices,
    and any matrix visualization where both pattern recognition and precise values
    matter. Text color automatically contrasts with background for readability.
