  - heatmap annotated
  - heatmap
  es:
  - heatmap-annotated
  - heatmap annotated
  - mapa de calor
use_when:
  en:
  - Visualizing matrix data
  - Showing correlations between variables
  - Displaying density patterns
  es:
  - Visualizar datos matriciales
  - Mostrar correlaciones entre variables
  - Mostrar patrones de densidad
avoid_when:
  en: []
  es: []
applications:
  en:
  - Correlation matrices showing relationships between variables with exact coefficients
  - Confusion matrices in machine learning model evaluation
  - Performance matrices comparing metrics across categories and time periods
  - Statistical analysis requiring both visual patterns and precise values
  es:
  - Correlation matrices showing relationships between variables with exact coefficients
  - Confusion matrices in machine learning model evaluation
  - Performance matrices comparing metrics across categories and time periods
  - Statistical analysis requiring both visual patterns and precise values
