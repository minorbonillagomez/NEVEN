notes:
- Multiple trajectories from different initial conditions can reveal basin of attraction
  structure
- Fixed points (equilibria) are the states on the dx/dt = 0 axis where the system
  stays at rest; a trajectory that merely crosses that axis is at a turning point,
  not at a fixed point
- Closed loops indicate periodic oscillation (limit cycles or centers)
