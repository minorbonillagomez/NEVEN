entity_type: ChartType
id: phase-diagram
name:
  en: Phase Diagram (State Space Plot)
  es: Phase Diagram
description:
  en: A phase diagram (or state space plot) displays the trajectory of a dynamical
    system by plotting a variable against its derivative (x vs dx/dt). This visualization
    reveals the qualitative behavior of systems including fixed points, limit cycles,
    stability, and oscillation patterns. It is essential for analyzing differential
    equations without solving them explicitly.
  es: A phase diagram (or state space plot) displays the trajectory of a dynamical
    system by plotting a variable against its derivative (x vs dx/dt). This visualization
    reveals the qualitative behavior of systems including fixed points, limit cycles,
    stability, and oscillation patterns. It is essential for analyzing differential
    equations without solving them explicitly.
