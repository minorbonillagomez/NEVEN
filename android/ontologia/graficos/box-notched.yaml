entity_type: ChartType
id: box-notched
name:
  en: Notched Box Plot
  es: Diagrama de Caja
description:
  en: A notched box plot extends the standard box plot by adding notches around the
    median that represent a confidence interval. If the notches of two boxes do not
    overlap, this provides visual evidence that the medians differ significantly.
    This variant is particularly valuable for quick visual hypothesis testing and
    comparing group medians in statistical analysis.
  es: A notched box plot extends the standard box plot by adding notches around the
    median that represent a confidence interval. If the notches of two boxes do not
    overlap, this provides visual evidence that the medians differ significantly.
    This variant is particularly valuable for quick visual hypothesis testing and
    comparing group medians in statistical analysis.
