  - Identifying outliers and spread
  - Showing median, quartiles, and range
  es:
  - Comparar distribuciones entre grupos
  - Identificar valores atípicos y dispersión
  - Mostrar mediana, cuartiles y rango
avoid_when:
  en: []
  es: []
applications:
  en:
  - Comparing treatment effects across experimental groups in research studies
  - Analyzing salary distributions across departments with statistical significance
    testing
  - 'Quality control: identifying statistically different production batches'
  - 'Clinical trials: comparing patient outcomes between control and treatment groups'
  es:
  - Comparing treatment effects across experimental groups in research studies
  - Analyzing salary distributions across departments with statistical significance
