entity_type: ChartType
id: curve-bias-variance-tradeoff
name:
  en: Bias-Variance Tradeoff Curve
  es: Curve Bias Variance Tradeoff
description:
  en: 'A theoretical visualization of the bias-variance tradeoff showing how total
    prediction error decomposes into bias squared, variance, and irreducible noise
    as a function of model complexity. The plot displays multiple curves: bias squared
    (decreasing with complexity), variance (increasing with complexity), irreducible
    error (constant), and total error (U-shaped). This is one of the most fundamental
    conceptual plots in machine learning for understanding model selection, overfitting,
    and underfitting.'
  es: 'A theoretical visualization of the bias-variance tradeoff showing how total
    prediction error decomposes into bias squared, variance, and irreducible noise
    as a function of model complexity. The plot displays multiple curves: bias squared
    (decreasing with complexity), variance (increasing with complexity), irreducible
    error (constant), and total error (U-shaped). This is one of the most fundamental
    conceptual plots in machine learning for understanding model selection, overfitting,
    and underfitting.'
