applications:
  en:
  - Identifying differentially expressed genes between treatment and control conditions
    in RNA-seq experiments
  - Assessing normalization quality and detecting expression-dependent bias in microarray
    data
  - Comparing treatment versus control conditions in transcriptomics studies
  - Quality control in high-throughput genomics pipelines to verify fold-change distributions
