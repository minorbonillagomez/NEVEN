entity_type: ChartType
id: ma-differential-expression
name:
  en: MA Plot for Differential Expression
  es: Ma Differential Expression
description:
  en: An MA plot (M-versus-A plot) visualizes the relationship between log fold change
    (M) and mean average expression (A) when comparing two experimental conditions.
    Each point represents a gene or feature, with significantly differentially expressed
    genes highlighted. This plot is a standard diagnostic tool in RNA-seq and microarray
    analysis for assessing differential expression results and detecting systematic
    expression-dependent bias.
  es: An MA plot (M-versus-A plot) visualizes the relationship between log fold change
    (M) and mean average expression (A) when comparing two experimental conditions.
    Each point represents a gene or feature, with significantly differentially expressed
    genes highlighted. This plot is a standard diagnostic tool in RNA-seq and microarray
    analysis for assessing differential expression results and detecting systematic
    expression-dependent bias.
