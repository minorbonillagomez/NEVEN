notes:
- Highlight significant genes (adjusted p < 0.05) in a distinct color (e.g., red)
  against non-significant genes in gray
- Draw a horizontal reference line at M = 0 (no change) and dashed lines at M = +1
  and M = -1 (2-fold change thresholds)
- Include a LOESS smoothing curve to reveal any systematic expression-dependent bias
