entity_type: ChartType
id: smith-chart-basic
name:
  en: Smith Chart for RF/Impedance
  es: Smith Chart Basic
description:
  en: A Smith chart is a specialized circular diagram used in RF engineering to display
    complex impedance and reflection coefficients on a normalized polar grid. The
    chart features constant resistance circles (centered along the horizontal axis)
    and constant reactance arcs (curving from the right edge), enabling engineers
    to visualize impedance matching, transmission line behavior, and antenna characteristics.
    It reveals relationships between impedance, admittance, and reflection coefficient
    that would be difficult to interpret in Cartesian coordinates.
  es: A Smith chart is a specialized circular diagram used in RF engineering to display
    complex impedance and reflection coefficients on a normalized polar grid. The
    chart features constant resistance circles (centered along the horizontal axis)
    and constant reactance arcs (curving from the right edge), enabling engineers
    to visualize impedance matching, transmission line behavior, and antenna characteristics.
    It reveals relationships between impedance, admittance, and reflection coefficient
    that would be difficult to interpret in Cartesian coordinates.
