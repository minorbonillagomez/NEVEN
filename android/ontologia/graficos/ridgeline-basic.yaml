entity_type: ChartType
id: ridgeline-basic
name:
  en: Basic Ridgeline Plot
  es: Gráfico de Crestas Básico
description:
  en: A ridgeline plot (also known as Joy Plot, named after the Joy Division album
    cover) displays the distribution of multiple groups by stacking partially overlapping
    density curves vertically. This creates a mountain ridge appearance that allows
    efficient comparison of many distributions simultaneously while maintaining a
    compact and visually striking presentation.
  es: A ridgeline plot (also known as Joy Plot, named after the Joy Division album
    cover) displays the distribution of multiple groups by stacking partially overlapping
    density curves vertically. This creates a mountain ridge appearance that allows
    efficient comparison of many distributions simultaneously while maintaining a
    compact and visually striking presentation.
