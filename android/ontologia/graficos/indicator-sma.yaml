applications:
  en:
  - Identifying trend direction by comparing price position relative to 50-day and
    200-day SMAs in stock analysis
  - Detecting golden cross (50-day crosses above 200-day) and death cross signals
    in cryptocurrency trading
  - Analyzing short-term momentum versus long-term trend using 20/50/200-day SMA combinations
  - Smoothing noisy time series data to reveal underlying patterns in sensor or metrics
    monitoring
