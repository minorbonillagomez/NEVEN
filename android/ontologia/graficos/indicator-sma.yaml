notes:
- Display the price/close line prominently, typically as a solid line or with subtle
  markers
- Each SMA should use a distinct color with consistent styling across all implementations
- Include a legend showing the period for each SMA (e.g., "SMA 20", "SMA 50", "SMA
  200")
