applications:
  en:
  - Product feature comparison showing how competing products score across attributes
    like price, quality, durability, and support
  - Employee or team skill assessments comparing individuals across competencies such
    as communication, technical skills, leadership, and creativity
  - Sports player or team performance comparison across metrics like speed, accuracy,
    endurance, and teamwork
  - Business competitor analysis across key performance indicators such as market
    share, customer satisfaction, and innovation
