entity_type: ChartType
id: radar-multi
name:
  en: Multi-Series Radar Chart
  es: Gráfico de Radar Múltiple
description:
  en: A multi-series radar chart overlays multiple data polygons on shared axes radiating
    from a center point, enabling direct comparison across several entities or categories.
    Each series is rendered as a distinct colored polygon, making it easy to identify
    relative strengths and weaknesses at a glance. This visualization excels at comparative
    analysis where multiple subjects are evaluated across the same set of metrics.
  es: A multi-series radar chart overlays multiple data polygons on shared axes radiating
    from a center point, enabling direct comparison across several entities or categories.
    Each series is rendered as a distinct colored polygon, making it easy to identify
    relative strengths and weaknesses at a glance. This visualization excels at comparative
    analysis where multiple subjects are evaluated across the same set of metrics.
