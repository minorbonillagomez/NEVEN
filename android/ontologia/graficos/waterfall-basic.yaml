entity_type: ChartType
id: waterfall-basic
name:
  en: Basic Waterfall Chart
  es: Gráfico de Cascada Básico
description:
  en: A waterfall chart visualizes how an initial value is affected by a series of
    intermediate positive or negative values, leading to a final value. Each bar represents
    a change from the previous cumulative total, with positive values extending upward
    and negative values extending downward. This chart type is essential for understanding
    cumulative effects and breaking down the components that contribute to a final
    result.
  es: A waterfall chart visualizes how an initial value is affected by a series of
    intermediate positive or negative values, leading to a final value. Each bar represents
    a change from the previous cumulative total, with positive values extending upward
    and negative values extending downward. This chart type is essential for understanding
    cumulative effects and breaking down the components that contribute to a final
    result.
