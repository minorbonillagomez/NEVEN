entity_type: ChartType
id: maze-printable
name:
  en: Printable Maze Puzzle
  es: Maze Printable
description:
  en: A rectangular maze puzzle visualization with clearly marked start and goal positions.
    The maze is algorithmically generated to guarantee exactly one solution path from
    start to finish. The clean black-and-white design is optimized for printing, allowing
    users to solve the puzzle with a pen or pencil.
  es: A rectangular maze puzzle visualization with clearly marked start and goal positions.
    The maze is algorithmically generated to guarantee exactly one solution path from
    start to finish. The clean black-and-white design is optimized for printing, allowing
    users to solve the puzzle with a pen or pencil.
