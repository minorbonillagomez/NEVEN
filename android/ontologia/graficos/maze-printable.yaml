notes:
- Use maze generation algorithms (DFS, Prim's, Kruskal's) that guarantee a single
  solution
- Start position typically marked with "S" or arrow, goal with "G" or star
- Interior wall thickness should be consistent and print-friendly (not too thin);
  the outer boundary may be drawn heavier
