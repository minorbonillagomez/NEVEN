entity_type: ChartType
id: boxen-basic
name:
  en: Basic Boxen Plot (Letter-Value Plot)
  es: Boxen Basic Básico
description:
  en: A boxen plot (also known as letter-value plot) extends the traditional box plot
    to show more quantile information, making it ideal for large datasets with 1000+
    observations. Instead of just displaying the median and quartiles, it shows additional
    "letter values" (eighths, sixteenths, etc.) as nested boxes, revealing the full
    shape of the distribution including tail behavior. This makes outlier detection
    more meaningful and distribution comparison more detailed.
  es: A boxen plot (also known as letter-value plot) extends the traditional box plot
    to show more quantile information, making it ideal for large datasets with 1000+
    observations. Instead of just displaying the median and quartiles, it shows additional
    "letter values" (eighths, sixteenths, etc.) as nested boxes, revealing the full
    shape of the distribution including tail behavior. This makes outlier detection
    more meaningful and distribution comparison more detailed.
