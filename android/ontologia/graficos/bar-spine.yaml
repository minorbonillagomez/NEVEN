entity_type: ChartType
id: bar-spine
name:
  en: Spine Plot for Two-Variable Proportions
  es: Gráfico de Barras
description:
  en: A spine plot (spineplot) is a stacked bar chart where bar widths are proportional
    to the marginal frequency of one categorical variable and the subdivisions within
    each bar show the conditional distribution of a second categorical variable. All
    bars are normalized to the same height (100%), so visual comparison focuses on
    how the conditional proportions shift across categories. It is a one-dimensional
    specialization of mosaic plots and excels at revealing associations between two
    categorical variables in contingency table data.
  es: A spine plot (spineplot) is a stacked bar chart where bar widths are proportional
    to the marginal frequency of one categorical variable and the subdivisions within
    each bar show the conditional distribution of a second categorical variable. All
    bars are normalized to the same height (100%), so visual comparison focuses on
    how the conditional proportions shift across categories. It is a one-dimensional
    specialization of mosaic plots and excels at revealing associations between two
    categorical variables in contingency table data.
aliases:
  en:
  - bar-spine
  - bar spine
  - bar chart
  es:
  - bar-spine
  - bar spine
  - gráfico de barras
use_when:
  en:
  - Comparing values across categories
  - Showing rankings or distributions
  - Displaying discrete data
  es:
  - Comparar valores entre categorías
  - Mostrar rankings o distribuciones
  - Visualizar datos discretos
avoid_when:
  en:
  - Continuous data over time (use line chart)
  - Part-to-whole relationships (use pie)
  es:
  - Datos continuos en el tiempo (usar líneas)
  - Relaciones parte-todo (usar circular)
applications:
  en:
  - Showing survival rates across passenger classes in the Titanic dataset
  - Visualizing disease prevalence across demographic age groups
  - Displaying customer churn rates segmented by subscription tier
  - Comparing pass/fail rates across different experimental test conditions
  es:
  - Showing survival rates across passenger classes in the Titanic dataset
  - Visualizing disease prevalence across demographic age groups
  - Displaying customer churn rates segmented by subscription tier
  - Comparing pass/fail rates across different experimental test conditions
