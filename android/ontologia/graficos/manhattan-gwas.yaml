entity_type: ChartType
id: manhattan-gwas
name:
  en: Manhattan Plot for GWAS
  es: Manhattan Gwas
description:
  en: A Manhattan plot visualizes genome-wide association study (GWAS) results by
    displaying -log10 transformed p-values across chromosomal positions. Points are
    arranged by genomic position along the x-axis with alternating colors for each
    chromosome, making it easy to identify significant associations. A horizontal
    threshold line indicates genome-wide significance (typically p < 5×10⁻⁸). This
    plot is essential for identifying genetic variants associated with traits or diseases.
  es: A Manhattan plot visualizes genome-wide association study (GWAS) results by
    displaying -log10 transformed p-values across chromosomal positions. Points are
    arranged by genomic position along the x-axis with alternating colors for each
    chromosome, making it easy to identify significant associations. A horizontal
    threshold line indicates genome-wide significance (typically p < 5×10⁻⁸). This
    plot is essential for identifying genetic variants associated with traits or diseases.
