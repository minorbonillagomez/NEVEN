notes:
- X-axis should show cumulative genomic position with chromosome labels centered below
  their region
- Use alternating colors (e.g., blue/gray) for adjacent chromosomes for visual distinction
- Include horizontal dashed line at -log10(5×10⁻⁸) ≈ 7.3 for genome-wide significance
  threshold
