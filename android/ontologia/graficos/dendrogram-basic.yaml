entity_type: ChartType
id: dendrogram-basic
name:
  en: Basic Dendrogram
  es: Dendrograma Básico
description:
  en: A dendrogram visualizes hierarchical clustering by showing how data points or
    clusters merge at different distance levels. The tree-like structure reveals relationships
    and similarity between items, with branch heights indicating the distance at which
    clusters merge. This visualization is essential for understanding the hierarchical
    structure in data and identifying natural groupings.
  es: A dendrogram visualizes hierarchical clustering by showing how data points or
    clusters merge at different distance levels. The tree-like structure reveals relationships
    and similarity between items, with branch heights indicating the distance at which
    clusters merge. This visualization is essential for understanding the hierarchical
    structure in data and identifying natural groupings.
