entity_type: ChartType
id: histogram-basic
name:
  en: Basic Histogram
  es: Histograma Básico
description:
  en: A histogram displays the distribution of a single continuous variable by dividing
    the data range into bins and showing the frequency (count) of observations in
    each bin. It reveals the shape of the data distribution, including central tendency,
    spread, and presence of outliers or multiple modes.
  es: A histogram displays the distribution of a single continuous variable by dividing
    the data range into bins and showing the frequency (count) of observations in
    each bin. It reveals the shape of the data distribution, including central tendency,
    spread, and presence of outliers or multiple modes.
aliases:
  en:
  - histogram-basic
  - histogram basic
  - basic histogram
  es:
  - histogram-basic
  - histogram basic
  - histograma básico
use_when:
  en:
  - Showing frequency distribution of continuous data
  - Understanding data shape (normal, skewed, bimodal)
  - Identifying common values and outliers
  es:
  - Mostrar distribución de frecuencia de datos continuos
  - Entender la forma de los datos (normal, sesgada, bimodal)
  - Identificar valores comunes y atípicos
avoid_when:
  en: []
  es: []
applications:
  en:
  - Analyzing exam score distributions to understand student performance patterns
  - Exploring measurement data to identify quality control issues in manufacturing
  - Understanding customer age demographics for marketing segmentation
  es:
  - Analyzing exam score distributions to understand student performance patterns
  - Exploring measurement data to identify quality control issues in manufacturing
  - Understanding customer age demographics for marketing segmentation
data_requirements:
  min_columns: 1
  max_columns: null
  column_types:
