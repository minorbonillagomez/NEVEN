notes:
- Render the actual remaining work as a step series (work is completed in discrete
  chunks), or a straight line if the library makes steps awkward
- Draw the ideal burndown as a straight reference line from (start, total scope) to
  (end, 0), visually distinct (e.g. dashed, muted color)
- Y-axis starts at 0 and represents remaining work (story points or tasks); X-axis
  is the sprint timeline
