entity_type: ChartType
id: burndown-sprint
name:
  en: Agile Sprint Burndown Chart
  es: Burndown Sprint
description:
  en: A sprint burndown chart tracks the amount of remaining work in an agile sprint
    over time, plotted as a step (or line) series that descends as tasks are completed.
    A straight ideal-burndown guideline runs diagonally from the total committed scope
    on day one down to zero on the final day, giving the team an at-a-glance reference
    for whether they are ahead of or behind schedule. It is one of the most widely
    used project-management visualizations in software development, surfacing scope
    creep, stalled progress, and end-of-sprint risk early enough to act on.
  es: A sprint burndown chart tracks the amount of remaining work in an agile sprint
    over time, plotted as a step (or line) series that descends as tasks are completed.
    A straight ideal-burndown guideline runs diagonally from the total committed scope
    on day one down to zero on the final day, giving the team an at-a-glance reference
    for whether they are ahead of or behind schedule. It is one of the most widely
    used project-management visualizations in software development, surfacing scope
    creep, stalled progress, and end-of-sprint risk early enough to act on.
