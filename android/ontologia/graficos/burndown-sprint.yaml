applications:
  en:
  - Daily Scrum tracking of remaining story points across a two-week sprint to forecast
    on-time completion
  - Detecting scope changes mid-sprint, where the remaining-work line jumps up when
    new work is added
  - Comparing actual progress against the ideal trajectory to flag a team that is
    consistently behind
  - Release or milestone burndown over a longer horizon to communicate delivery confidence
    to stakeholders
  es:
