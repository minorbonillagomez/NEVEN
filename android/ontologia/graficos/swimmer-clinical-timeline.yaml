applications:
  en:
  - Visualizing treatment response timelines for patients in an oncology drug trial,
    showing when each patient achieved response or experienced progression
  - Comparing duration of therapy across patients in a Phase II clinical study, highlighting
    differences between treatment arms
  - Presenting patient-level safety and efficacy data in regulatory submission documents
    and medical conference posters
