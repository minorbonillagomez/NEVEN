notes:
- Bars should be horizontal and sorted by duration (longest at top or bottom, consistently)
- Use distinct markers/symbols for different event types (e.g., triangle for partial
  response, star for complete response, diamond for progression)
- Ongoing patients (still on treatment at data cutoff) should be visually distinguished
  with an arrow or open-ended bar
