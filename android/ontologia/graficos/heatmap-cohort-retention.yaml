notes:
- Period 0 (signup period) should always show 100% retention for every cohort
- 'The heatmap should have a triangular shape: the first cohort has the most columns,
  each subsequent cohort has one fewer'
- Use a sequential colormap from light (low retention) to dark (high retention), such
  as a green or blue gradient
