notes:
- Hexagon size should be configurable to balance detail vs. aggregation (larger hexagons
  for overview, smaller for detailed patterns)
- 'Support aggregation methods: count (default), sum, and mean of values'
- Use a sequential colormap (e.g., viridis, plasma, YlOrRd) with a color legend showing
  the scale
