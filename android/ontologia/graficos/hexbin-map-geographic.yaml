entity_type: ChartType
id: hexbin-map-geographic
name:
  en: Hexagonal Binning Map
  es: Diagrama Hexagonal
description:
  en: A geographic map visualization that aggregates point data into hexagonal cells,
    displaying density or aggregated values per cell using color intensity. Unlike
    continuous heatmaps that use kernel density estimation, hexbin maps provide discrete
    binning that clearly shows data aggregation boundaries. The hexagonal grid is
    superior to square grids due to isotropy (equal distance to neighboring cells)
    and better visual continuity, making it ideal for spatial statistics and urban
    data analysis.
  es: A geographic map visualization that aggregates point data into hexagonal cells,
    displaying density or aggregated values per cell using color intensity. Unlike
    continuous heatmaps that use kernel density estimation, hexbin maps provide discrete
    binning that clearly shows data aggregation boundaries. The hexagonal grid is
    superior to square grids due to isotropy (equal distance to neighboring cells)
    and better visual continuity, making it ideal for spatial statistics and urban
    data analysis.
