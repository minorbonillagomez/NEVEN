entity_type: ChartType
id: drawdown-basic
name:
  en: Drawdown Chart
  es: Drawdown Basic Básico
description:
  en: A drawdown chart visualizes the percentage decline from peak value over time,
    showing how far an investment or asset has fallen from its highest point. This
    chart is essential for risk assessment and understanding the magnitude of losses
    during unfavorable market periods. The filled area below the zero line emphasizes
    the depth and duration of drawdowns, making it easy to identify maximum drawdown
    periods and recovery points.
  es: A drawdown chart visualizes the percentage decline from peak value over time,
    showing how far an investment or asset has fallen from its highest point. This
    chart is essential for risk assessment and understanding the magnitude of losses
    during unfavorable market periods. The filled area below the zero line emphasizes
    the depth and duration of drawdowns, making it easy to identify maximum drawdown
    periods and recovery points.
