entity_type: ChartType
id: facet-grid
name:
  en: Faceted Grid Plot
  es: Facet Grid
description:
  en: A grid of subplots where each cell shows the same type of plot for a different
    subset of data, split by one or two categorical variables. Enables systematic
    comparison across multiple dimensions.
  es: A grid of subplots where each cell shows the same type of plot for a different
    subset of data, split by one or two categorical variables. Enables systematic
    comparison across multiple dimensions.
