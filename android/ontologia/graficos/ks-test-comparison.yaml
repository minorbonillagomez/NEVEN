applications:
  en:
  - Model validation in credit scoring, comparing score distributions between Good
    and Bad customers to assess model discrimination
  - A/B testing to verify whether control and treatment groups have statistically
    different outcome distributions
  - Quality control analysis comparing actual product measurements against expected
    or historical distributions
  - Validating that model predictions or residuals follow expected distributions in
    regression diagnostics
