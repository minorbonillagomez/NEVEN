entity_type: ChartType
id: range-interval
name:
  en: Range Interval Chart
  es: Range Interval
description:
  en: A range interval chart displays min-max ranges or intervals as vertical or horizontal
    bars/segments for each category, making it ideal for visualizing uncertainty bounds,
    confidence intervals, or value spreads. Unlike error bars which extend from a
    central data point, range intervals show the full span between two values as a
    filled bar or line segment, emphasizing the range itself rather than deviation
    from a center. This visualization excels at comparing ranges across multiple categories
    simultaneously.
  es: A range interval chart displays min-max ranges or intervals as vertical or horizontal
    bars/segments for each category, making it ideal for visualizing uncertainty bounds,
    confidence intervals, or value spreads. Unlike error bars which extend from a
    central data point, range intervals show the full span between two values as a
    filled bar or line segment, emphasizing the range itself rather than deviation
    from a center. This visualization excels at comparing ranges across multiple categories
    simultaneously.
