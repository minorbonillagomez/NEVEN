notes:
- Flags should be positioned to avoid obscuring price data, using alternating heights
  or smart placement
- Use distinct icons or colors for different event types (e.g., dollar sign for dividends,
  chart icon for earnings)
- Include vertical dashed lines from flags to the price level for precise date alignment
