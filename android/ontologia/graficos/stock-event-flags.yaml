applications:
  en:
  - Annotating quarterly earnings announcements on equity price charts to analyze
    market reactions
  - Marking dividend payment and ex-dividend dates on income-focused stock analysis
  - Highlighting stock splits, reverse splits, or corporate restructuring events
  - Visualizing the impact of news events, analyst upgrades/downgrades, or regulatory
    filings on price
