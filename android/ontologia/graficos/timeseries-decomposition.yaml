applications:
  en:
  - Analyzing sales data to separate long-term growth trends from seasonal holiday
    patterns
  - Decomposing temperature records to isolate climate trends from annual cycles
  - Understanding stock market behavior by separating systematic patterns from random
    fluctuations
  - Preprocessing time series for forecasting by examining component predictability
