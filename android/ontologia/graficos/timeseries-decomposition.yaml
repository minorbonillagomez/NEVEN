entity_type: ChartType
id: timeseries-decomposition
name:
  en: Time Series Decomposition Plot
  es: Serie Temporal
description:
  en: 'A time series decomposition plot displays a time series broken down into its
    constituent components: the original series, trend, seasonal pattern, and residual
    noise. Each component is shown as a separate subplot stacked vertically, sharing
    a common time axis. This visualization is essential for understanding the underlying
    structure of time series data and identifying patterns that may not be visible
    in the raw series.'
  es: 'A time series decomposition plot displays a time series broken down into its
    constituent components: the original series, trend, seasonal pattern, and residual
    noise. Each component is shown as a separate subplot stacked vertically, sharing
    a common time axis. This visualization is essential for understanding the underlying
    structure of time series data and identifying patterns that may not be visible
    in the raw series.'
