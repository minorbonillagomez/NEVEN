applications:
  en:
  - Coaches periodizing an athlete's season to peak fitness while managing fatigue
    before a key race
  - Cyclists and runners deciding rest vs. overload by reading current form (TSB)
    against rising fitness (CTL)
  - Sports scientists studying training monotony, ramp rate, and injury/overtraining
    risk from acute:chronic load
  - Self-coached endurance athletes tracking long-term progression and taper timing
    across a training block
