entity_type: ChartType
id: line-training-load-pmc
name:
  en: Training Load Performance Management Chart
  es: Gráfico de Líneas
description:
  en: A Performance Management Chart (PMC), popularized by TrainingPeaks, summarizes
    an endurance athlete's training history on a single shared time axis. Two exponentially-smoothed
    lines track Chronic Training Load (CTL, "fitness", ~42-day time constant) and
    Acute Training Load (ATL, "fatigue", ~7-day time constant), while a filled area
    or band shows Training Stress Balance (TSB, "form" = CTL − ATL) above and below
    a zero baseline. Daily Training Stress Score (TSS) values appear as points or
    thin vertical bars, giving the raw workout intensity behind the smoothed trends.
    The chart reveals whether an athlete is building fitness, accumulating fatigue,
    or freshening up (positive form) for a target event.
  es: A Performance Management Chart (PMC), popularized by TrainingPeaks, summarizes
    an endurance athlete's training history on a single shared time axis. Two exponentially-smoothed
    lines track Chronic Training Load (CTL, "fitness", ~42-day time constant) and
    Acute Training Load (ATL, "fatigue", ~7-day time constant), while a filled area
    or band shows Training Stress Balance (TSB, "form" = CTL − ATL) above and below
    a zero baseline. Daily Training Stress Score (TSS) values appear as points or
    thin vertical bars, giving the raw workout intensity behind the smoothed trends.
    The chart reveals whether an athlete is building fitness, accumulating fatigue,
    or freshening up (positive form) for a target event.
