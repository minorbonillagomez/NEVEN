notes:
- Plot CTL and ATL as smooth lines on the primary axis (e.g. blue for fitness, purple/magenta
  for fatigue); CTL should look smoother and lag ATL
- Render TSB as a filled area or band relative to a zero baseline, ideally two-toned
  (positive form = fresh/blue, negative = fatigued/red); it may sit on a secondary
  axis since it oscillates around zero
- Draw daily TSS as light points or thin bars near the bottom so they read as the
  raw input without dominating the smoothed lines
