entity_type: ChartType
id: rug-basic
name:
  en: Basic Rug Plot
  es: Rug Basic Básico
description:
  en: A rug plot displays individual data points as small tick marks along an axis,
    typically at the bottom or side of another plot. Unlike histograms or density
    plots that bin data, rug plots show the exact location of every observation. They
    reveal clustering patterns, gaps in data, and the precise distribution of values
    with minimal visual footprint.
  es: A rug plot displays individual data points as small tick marks along an axis,
    typically at the bottom or side of another plot. Unlike histograms or density
    plots that bin data, rug plots show the exact location of every observation. They
    reveal clustering patterns, gaps in data, and the precise distribution of values
    with minimal visual footprint.
