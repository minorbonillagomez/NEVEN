entity_type: ChartType
id: lightcurve-transit
name:
  en: Astronomical Light Curve
  es: Lightcurve Transit
description:
  en: A time-series plot showing the brightness of an astronomical object over time,
    designed to reveal exoplanet transit events as characteristic dips in flux. The
    plot displays photometric measurements with error bars against orbital phase,
    with a fitted transit model overlay. This visualization is fundamental in observational
    astronomy for detecting and characterizing planetary transits, variable stars,
    and other periodic brightness variations.
  es: A time-series plot showing the brightness of an astronomical object over time,
    designed to reveal exoplanet transit events as characteristic dips in flux. The
    plot displays photometric measurements with error bars against orbital phase,
    with a fitted transit model overlay. This visualization is fundamental in observational
    astronomy for detecting and characterizing planetary transits, variable stars,
    and other periodic brightness variations.
