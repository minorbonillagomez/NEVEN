applications:
  en:
  - Detecting exoplanet transits in Kepler/TESS photometric survey data by identifying
    periodic flux dips
  - Classifying variable stars (Cepheids, eclipsing binaries) through phase-folded
    brightness patterns
  - Monitoring supernova brightness evolution over weeks to months for distance calibration
