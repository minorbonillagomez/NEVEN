applications:
  en:
  - Comparing U.S. Treasury yield curves across different dates to track monetary
    policy shifts and recession signals
  - Visualizing the term structure of government bonds for central bank publications
    and financial media
  - Analyzing spread compression or inversion between short-term and long-term maturities
    for investment strategy decisions
  es:
