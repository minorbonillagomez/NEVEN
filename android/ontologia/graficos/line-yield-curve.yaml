notes:
- Use `maturity_years` for x-axis positioning to reflect true time spacing (log or
  linear scale); use `maturity` labels for tick marks
- Include at least two curves on the same plot to show how the yield curve shape changes
  over time (e.g., a normal upward-sloping curve vs. an inverted curve)
- Highlight the inversion region where short-term yields exceed long-term yields using
  shading or annotation
