id: area-stacked-percent
name:
  en: 100% Stacked Area Chart
  es: Gráfico de Área Apilado
description:
  en: A stacked area chart normalized to 100%, where each area represents the percentage
    contribution of a category to the total. The combined height always equals 100%,
    showing proportional changes over time.
  es: A stacked area chart normalized to 100%, where each area represents the percentage
    contribution of a category to the total. The combined height always equals 100%,
    showing proportional changes over time.
