entity_type: ChartType
id: scatter-shot-chart
name:
  en: Basketball Shot Chart
  es: Diagrama de Dispersión
description:
  en: A basketball shot chart overlays shooting data on a half-court diagram, plotting
    each shot attempt as a point colored by outcome (made or missed). The court drawing
    includes the three-point arc, free-throw line, paint/key area, and basket, providing
    spatial context for analyzing shooting patterns and efficiency. Essential for
    basketball analytics and player evaluation.
  es: A basketball shot chart overlays shooting data on a half-court diagram, plotting
    each shot attempt as a point colored by outcome (made or missed). The court drawing
    includes the three-point arc, free-throw line, paint/key area, and basket, providing
    spatial context for analyzing shooting patterns and efficiency. Essential for
    basketball analytics and player evaluation.
aliases:
  en:
  - scatter-shot-chart
  - scatter shot chart
  - scatter plot
  es:
  - scatter-shot-chart
  - scatter shot chart
  - diagrama de dispersión
use_when:
  en:
  - Exploring relationship between two continuous variables
  - Detecting correlations (positive, negative, none)
  - Identifying outliers in bivariate data
  es:
  - Explorar relación entre dos variables continuas
  - Detectar correlaciones (positiva, negativa, ninguna)
  - Identificar valores atípicos en datos bivariados
avoid_when:
  en:
  - Categorical variables (use bar chart)
  - Time series (use line chart)
  es:
  - Variables categóricas (usar gráfico de barras)
  - Series temporales (usar gráfico de líneas)
applications:
  en:
  - Analyzing a player's shooting tendencies and field-goal percentage by court zone
  - Scouting opposing players to identify their preferred and weakest shooting locations
  - Evaluating team offensive strategies and shot selection patterns
  - Sports journalism and broadcast graphics summarizing game or season performance
  es:
  - Analyzing a player's shooting tendencies and field-goal percentage by court zone
  - Scouting opposing players to identify their preferred and weakest shooting locations
  - Evaluating team offensive strategies and shot selection patterns
  - Sports journalism and broadcast graphics summarizing game or season performance
