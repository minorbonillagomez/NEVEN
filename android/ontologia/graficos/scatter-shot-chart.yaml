notes:
- 'Draw an accurate NBA half-court outline using standard dimensions (50 ft wide x
  47 ft deep): three-point arc (23.75 ft at top, 22 ft in corners), free-throw line
  (15 ft from backboard), paint/key area (16 ft wide), restricted area arc, and basket/backboard'
- 'Plot each shot as a point: green for made, red for missed'
- Court lines should be drawn in a neutral color (gray or black) so shot markers stand
  out
