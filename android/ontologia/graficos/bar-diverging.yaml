entity_type: ChartType
id: bar-diverging
name:
  en: Diverging Bar Chart
  es: Gráfico de Barras
description:
  en: A diverging bar chart displays bars extending in opposite directions from a
    central baseline, typically at zero. This visualization is ideal for comparing
    positive and negative values, showing responses above and below a neutral point,
    or contrasting opposing categories. Different colors distinguish positive from
    negative values, making it easy to identify magnitude and direction at a glance.
  es: A diverging bar chart displays bars extending in opposite directions from a
    central baseline, typically at zero. This visualization is ideal for comparing
    positive and negative values, showing responses above and below a neutral point,
    or contrasting opposing categories. Different colors distinguish positive from
    negative values, making it easy to identify magnitude and direction at a glance.
aliases:
  en:
  - bar-diverging
  - bar diverging
  - bar chart
  es:
  - bar-diverging
  - bar diverging
  - gráfico de barras
use_when:
  en:
  - Comparing values across categories
  - Showing rankings or distributions
  - Displaying discrete data
  es:
  - Comparar valores entre categorías
  - Mostrar rankings o distribuciones
  - Visualizar datos discretos
avoid_when:
  en:
  - Continuous data over time (use line chart)
  - Part-to-whole relationships (use pie)
  es:
  - Datos continuos en el tiempo (usar líneas)
  - Relaciones parte-todo (usar circular)
applications:
  en:
  - Visualizing survey responses (agree/disagree, satisfied/dissatisfied scales)
  - Displaying net promoter scores or sentiment analysis results
  - Comparing political polling data across ideological spectrums
  - Showing profit/loss or growth/decline metrics across categories
  es:
  - Visualizing survey responses (agree/disagree, satisfied/dissatisfied scales)
  - Displaying net promoter scores or sentiment analysis results
  - Comparing political polling data across ideological spectrums
  - Showing profit/loss or growth/decline metrics across categories
