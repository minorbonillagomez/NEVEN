entity_type: ChartType
id: scatter-marginal
name:
  en: Scatter Plot with Marginal Distributions
  es: Diagrama de Dispersión
description:
  en: A scatter plot enhanced with marginal distribution plots (histograms or kernel
    density estimates) on the top and right axes. This composite visualization simultaneously
    shows the bivariate relationship between two variables in the central scatter
    plot while displaying each variable's univariate distribution along its respective
    axis. It provides a comprehensive view of both the joint and marginal distributions
    in a single figure.
  es: A scatter plot enhanced with marginal distribution plots (histograms or kernel
    density estimates) on the top and right axes. This composite visualization simultaneously
    shows the bivariate relationship between two variables in the central scatter
    plot while displaying each variable's univariate distribution along its respective
    axis. It provides a comprehensive view of both the joint and marginal distributions
    in a single figure.
aliases:
  en:
  - scatter-marginal
  - scatter marginal
  - scatter plot
  es:
  - scatter-marginal
  - scatter marginal
  - diagrama de dispersión
use_when:
  en:
  - Exploring relationship between two continuous variables
  - Detecting correlations (positive, negative, none)
  - Identifying outliers in bivariate data
  es:
  - Explorar relación entre dos variables continuas
  - Detectar correlaciones (positiva, negativa, ninguna)
  - Identificar valores atípicos en datos bivariados
avoid_when:
  en:
  - Categorical variables (use bar chart)
  - Time series (use line chart)
  es:
  - Variables categóricas (usar gráfico de barras)
  - Series temporales (usar gráfico de líneas)
applications:
  en:
  - Exploring the correlation between two continuous variables while understanding
    their individual distributions in exploratory data analysis
  - Visualizing feature relationships in machine learning datasets to identify skewness,
    multimodality, or outliers
  - Analyzing measurement data in scientific research where both the relationship
    and the distribution characteristics matter
  es:
  - Exploring the correlation between two continuous variables while understanding
    their individual distributions in exploratory data analysis
  - Visualizing feature relationships in machine learning datasets to identify skewness,
    multimodality, or outliers
  - Analyzing measurement data in scientific research where both the relationship
    and the distribution characteristics matter
