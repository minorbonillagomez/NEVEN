notes:
- Use an appropriate map projection (e.g., Natural Earth, Robinson for world maps;
  Mercator for regional/city scale)
- Include a basemap showing country boundaries, coastlines, or terrain for geographic
  context
- Add a color legend when color encoding is used, and a size legend when size varies
