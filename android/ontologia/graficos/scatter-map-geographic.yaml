entity_type: ChartType
id: scatter-map-geographic
name:
  en: Scatter Map with Geographic Points
  es: Diagrama de Dispersión
description:
  en: A geographic scatter plot that displays data points on a world or regional map,
    with each point positioned by its latitude and longitude coordinates. This visualization
    is ideal for showing spatial distributions of events, locations, or measurements
    across geographic areas. Points can optionally encode additional variables through
    size and color, enabling multi-dimensional geographic analysis at a glance.
  es: A geographic scatter plot that displays data points on a world or regional map,
    with each point positioned by its latitude and longitude coordinates. This visualization
    is ideal for showing spatial distributions of events, locations, or measurements
    across geographic areas. Points can optionally encode additional variables through
    size and color, enabling multi-dimensional geographic analysis at a glance.
aliases:
  en:
  - scatter-map-geographic
  - scatter map geographic
  - scatter plot
  es:
  - scatter-map-geographic
  - scatter map geographic
  - diagrama de dispersión
use_when:
  en:
  - Exploring relationship between two continuous variables
  - Detecting correlations (positive, negative, none)
  - Identifying outliers in bivariate data
  es:
  - Explorar relación entre dos variables continuas
  - Detectar correlaciones (positiva, negativa, ninguna)
  - Identificar valores atípicos en datos bivariados
avoid_when:
  en:
  - Categorical variables (use bar chart)
  - Time series (use line chart)
  es:
  - Variables categóricas (usar gráfico de barras)
  - Series temporales (usar gráfico de líneas)
applications:
  en:
  - Visualizing earthquake epicenters or natural disaster locations with magnitude
    encoded as point size
  - Mapping customer or store locations with sales volume represented by point size
    and category by color
  - Displaying sensor network readings across a geographic region with measurement
    values encoded in color
  - Tracking wildlife sightings or species distribution with population counts as
    point size
  es:
  - Visualizing earthquake epicenters or natural disaster locations with magnitude
    encoded as point size
  - Mapping customer or store locations with sales volume represented by point size
    and category by color
  - Displaying sensor network readings across a geographic region with measurement
    values encoded in color
  - Tracking wildlife sightings or species distribution with population counts as
    point size
