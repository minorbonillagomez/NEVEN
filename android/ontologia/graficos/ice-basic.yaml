entity_type: ChartType
id: ice-basic
name:
  en: Individual Conditional Expectation (ICE) Plot
  es: Ice Basic Básico
description:
  en: An Individual Conditional Expectation (ICE) plot visualizes how the predicted
    outcome of a machine learning model changes for each individual observation as
    a single feature varies across its range. Unlike partial dependence plots (PDP)
    that show the average marginal effect, ICE plots display one line per observation,
    revealing heterogeneous effects, feature interactions, and subgroup-specific behaviors
    that would be hidden by averaging. This makes ICE plots essential for detecting
    when a feature's effect varies across the population.
  es: An Individual Conditional Expectation (ICE) plot visualizes how the predicted
    outcome of a machine learning model changes for each individual observation as
    a single feature varies across its range. Unlike partial dependence plots (PDP)
    that show the average marginal effect, ICE plots display one line per observation,
    revealing heterogeneous effects, feature interactions, and subgroup-specific behaviors
    that would be hidden by averaging. This makes ICE plots essential for detecting
    when a feature's effect varies across the population.
