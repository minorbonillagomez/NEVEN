notes:
- Individual lines should use low alpha (semi-transparent) to show density and overlap
  patterns
- Overlay the partial dependence (PDP) line as a bold, opaque curve to show the average
  effect
- Consider a centered ICE (c-ICE) variant that shifts all lines to start at zero for
  easier comparison of effect shapes
