applications:
  en:
  - Detecting feature interactions in ensemble models by identifying observations
    whose prediction curves diverge from the average trend
  - Identifying subgroups with different feature responses in clinical prediction
    models, such as patients who respond differently to dosage changes
  - Validating monotonicity assumptions in pricing or risk models by checking whether
    all individual curves move in the expected direction
  - Exploring non-linear and heterogeneous effects in gradient boosting or random
    forest models during model audit and interpretability review
