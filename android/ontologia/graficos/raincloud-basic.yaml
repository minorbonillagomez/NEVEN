notes:
- '**Required Orientation**: Use HORIZONTAL orientation with categories on y-axis
  and values on x-axis. "Above" and "below" always refer to the y-direction (screen
  up/down), not the x-direction'
- '**Critical Layout**: For each category on the y-axis: the "cloud" (half-violin/KDE)
  must extend ABOVE the category baseline (upward on screen), the boxplot sits centered
  ON the category baseline, and "rain" (jittered points) must appear BELOW the category
  baseline (downward on screen) - like rain falling from a cloud'
- Clip the violin to show only half (the "cloud" portion), not a full violin
