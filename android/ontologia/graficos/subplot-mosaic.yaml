entity_type: ChartType
id: subplot-mosaic
name:
  en: Mosaic Subplot Layout with Varying Sizes
  es: Subplot Mosaic
description:
  en: A complex subplot layout where different subplots can have varying sizes and
    arrangements using intuitive ASCII-art style string definitions. Unlike GridSpec
    approaches that require explicit row/column spanning, mosaic layouts allow defining
    layouts through visual string patterns (e.g., "AB;CC" creates A and B on top,
    C spanning below), making complex configurations more readable and maintainable.
  es: A complex subplot layout where different subplots can have varying sizes and
    arrangements using intuitive ASCII-art style string definitions. Unlike GridSpec
    approaches that require explicit row/column spanning, mosaic layouts allow defining
    layouts through visual string patterns (e.g., "AB;CC" creates A and B on top,
    C spanning below), making complex configurations more readable and maintainable.
