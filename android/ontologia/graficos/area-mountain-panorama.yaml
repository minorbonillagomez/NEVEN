entity_type: ChartType
id: area-mountain-panorama
name:
  en: Mountain Panorama Profile with Labeled Peaks
  es: Gráfico de Área
description:
  en: A panoramic mountain silhouette chart that renders the horizon as seen from
    a fixed vantage point, like a photograph of a ridgeline against the sky. A filled
    area under the skyline curve traces the ridgeline across a horizontal viewing
    range (in degrees of bearing or horizontal distance), and major summits are annotated
    with their name and elevation. The skyline is jagged and angular — sharp triangular
    peaks with steep, often asymmetric flanks meeting at pointed apexes, connected
    by rugged ridges with cols, sub-peaks and rocky notches — not a sequence of smooth
    bell-shaped bumps. Unlike an elevation-profile-along-a-trail, this plot is the
    angular view of the surrounding peaks from a single observer, making it ideal
    for summit-identification infographics, alpine panoramas, and travel guides.
  es: A panoramic mountain silhouette chart that renders the horizon as seen from
    a fixed vantage point, like a photograph of a ridgeline against the sky. A filled
    area under the skyline curve traces the ridgeline across a horizontal viewing
    range (in degrees of bearing or horizontal distance), and major summits are annotated
    with their name and elevation. The skyline is jagged and angular — sharp triangular
    peaks with steep, often asymmetric flanks meeting at pointed apexes, connected
    by rugged ridges with cols, sub-peaks and rocky notches — not a sequence of smooth
    bell-shaped bumps. Unlike an elevation-profile-along-a-trail, this plot is the
    angular view of the surrounding peaks from a single observer, making it ideal
    for summit-identification infographics, alpine panoramas, and travel guides.
