notes:
- 'Render the ridgeline as a piecewise-linear / fractal silhouette: triangular peaks
  with sharp apexes and steep linear flanks, with small irregular jaggedness along
  the ridges (e.g. midpoint-displacement noise, jittered linear segments, or summed
  steep triangle/tent functions). Do NOT model summits as Gaussian / bell-curve bumps
  — the silhouette must read as alpine rock, not as a probability density'
- Vary slope steepness and asymmetry per summit (e.g. one flank steeper than the other),
  and let saddles between neighboring peaks dip far enough to make each summit individually
  recognizable
- 'Optional layered depth: a darker foreground ridge in front of one or two lighter
  background ridges fading toward the sky color, like a classic Zermatt / Matterhorn
  panorama photograph'
