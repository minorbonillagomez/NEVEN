notes:
- Four subplots arranged in a 2x2 grid layout with shared figure title
- '**Subplot 1 (Residuals vs Fitted):** Scatter of residuals against fitted values
  with a horizontal zero-reference line and a LOWESS smoother to reveal non-linear
  patterns'
- '**Subplot 2 (Normal Q-Q):** Standardized residuals plotted against theoretical
  normal quantiles with a 45-degree reference line; deviations indicate non-normality'
