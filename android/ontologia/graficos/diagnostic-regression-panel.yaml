entity_type: ChartType
id: diagnostic-regression-panel
name:
  en: Regression Diagnostic Panel (Four-Plot Display)
  es: Diagnostic Regression Panel Regresión
description:
  en: 'A 2x2 panel of diagnostic plots for evaluating linear regression model assumptions,
    replicating the classic output of R''s `plot(lm)`. The four subplots are: (1)
    Residuals vs Fitted values to detect non-linearity and heteroscedasticity, (2)
    Normal Q-Q plot of standardized residuals to assess normality, (3) Scale-Location
    plot (square root of standardized residuals vs fitted values) to check homoscedasticity,
    and (4) Residuals vs Leverage with Cook''s distance contours to identify influential
    observations. This composite display is the standard first step in regression
    model validation across statistics, academia, and regulated industries.'
  es: 'A 2x2 panel of diagnostic plots for evaluating linear regression model assumptions,
    replicating the classic output of R''s `plot(lm)`. The four subplots are: (1)
    Residuals vs Fitted values to detect non-linearity and heteroscedasticity, (2)
    Normal Q-Q plot of standardized residuals to assess normality, (3) Scale-Location
    plot (square root of standardized residuals vs fitted values) to check homoscedasticity,
    and (4) Residuals vs Leverage with Cook''s distance contours to identify influential
    observations. This composite display is the standard first step in regression
    model validation across statistics, academia, and regulated industries.'
