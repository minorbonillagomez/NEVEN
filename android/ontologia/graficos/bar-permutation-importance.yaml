entity_type: ChartType
id: bar-permutation-importance
name:
  en: Permutation Feature Importance Plot
  es: Gráfico de Barras
description:
  en: A horizontal bar chart displaying permutation feature importance from machine
    learning models, showing the decrease in model score when each feature is randomly
    shuffled. Unlike model-specific feature importances, permutation importance is
    model-agnostic and measures how much the model's performance degrades when a feature's
    relationship with the target is broken. Error bars indicate variability across
    multiple shuffles, providing a confidence measure for each importance score.
  es: A horizontal bar chart displaying permutation feature importance from machine
    learning models, showing the decrease in model score when each feature is randomly
    shuffled. Unlike model-specific feature importances, permutation importance is
    model-agnostic and measures how much the model's performance degrades when a feature's
    relationship with the target is broken. Error bars indicate variability across
    multiple shuffles, providing a confidence measure for each importance score.
aliases:
  en:
  - bar-permutation-importance
  - bar permutation importance
  - bar chart
  es:
  - bar-permutation-importance
  - bar permutation importance
  - gráfico de barras
use_when:
  en:
  - Comparing values across categories
  - Showing rankings or distributions
  - Displaying discrete data
  es:
  - Comparar valores entre categorías
  - Mostrar rankings o distribuciones
  - Visualizar datos discretos
avoid_when:
  en:
  - Continuous data over time (use line chart)
  - Part-to-whole relationships (use pie)
  es:
  - Datos continuos en el tiempo (usar líneas)
  - Relaciones parte-todo (usar circular)
applications:
  en:
  - Comparing feature importance across different model types (e.g., comparing a random
    forest vs neural network on the same dataset)
  - Identifying features that may be redundant or have spurious correlations by examining
    importance variability
  - Model validation by verifying that domain-expected important features rank highly
    in permutation importance
  es:
  - Comparing feature importance across different model types (e.g., comparing a random
    forest vs neural network on the same dataset)
  - Identifying features that may be redundant or have spurious correlations by examining
    importance variability
  - Model validation by verifying that domain-expected important features rank highly
    in permutation importance
