notes:
- The main diagonal is always filled (every state recurs with itself) and should be
  visually present
- Use Euclidean distance in the embedding space to compute the distance matrix; apply
  a binary threshold for the standard recurrence plot
- Consider embedding the scalar time series using time-delay embedding (Takens' theorem)
  with appropriate embedding dimension and delay before computing distances
