entity_type: ChartType
id: calibration-beer-lambert
name:
  en: Beer-Lambert Calibration Curve
  es: Calibration Beer Lambert
description:
  en: A calibration curve plotting absorbance versus concentration following Beer-Lambert
    law (A = εlc). Measured calibration standards are shown as scatter points with
    a linear regression fit line. The regression equation (y = mx + b) and R² value
    are displayed on the plot. An example unknown sample is marked with dashed lines
    extending to both axes, demonstrating how the curve is used to determine concentration
    from a measured absorbance. This plot is fundamental in analytical chemistry for
    quantitative spectrophotometric analysis.
  es: A calibration curve plotting absorbance versus concentration following Beer-Lambert
    law (A = εlc). Measured calibration standards are shown as scatter points with
    a linear regression fit line. The regression equation (y = mx + b) and R² value
    are displayed on the plot. An example unknown sample is marked with dashed lines
    extending to both axes, demonstrating how the curve is used to determine concentration
    from a measured absorbance. This plot is fundamental in analytical chemistry for
    quantitative spectrophotometric analysis.
