entity_type: ChartType
id: bar-diverging-likert
name:
  en: Likert Scale Diverging Bar Chart
  es: Gráfico de Barras
description:
  en: A diverging stacked bar chart designed for Likert scale survey responses (e.g.,
    Strongly Disagree to Strongly Agree). Bars diverge from a central neutral point,
    with negative responses (Disagree, Strongly Disagree) extending left and positive
    responses (Agree, Strongly Agree) extending right. This layout makes it easy to
    compare overall agreement levels across multiple survey questions at a glance.
  es: A diverging stacked bar chart designed for Likert scale survey responses (e.g.,
    Strongly Disagree to Strongly Agree). Bars diverge from a central neutral point,
    with negative responses (Disagree, Strongly Disagree) extending left and positive
    responses (Agree, Strongly Agree) extending right. This layout makes it easy to
    compare overall agreement levels across multiple survey questions at a glance.
