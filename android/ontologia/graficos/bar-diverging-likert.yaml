notes:
- Center the chart on the neutral response category, splitting it evenly across the
  midpoint
- Use a diverging color scheme (e.g., red-to-blue or orange-to-teal) with a muted
  tone for neutral
- Sort questions by net agreement (agree + strongly agree minus disagree + strongly
  disagree) for easy comparison
