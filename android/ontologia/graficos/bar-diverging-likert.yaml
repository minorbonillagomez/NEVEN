use_when:
  en:
  - Comparing values across categories
  - Showing rankings or distributions
  - Displaying discrete data
  es:
  - Comparar valores entre categorías
  - Mostrar rankings o distribuciones
  - Visualizar datos discretos
avoid_when:
  en:
  - Continuous data over time (use line chart)
  - Part-to-whole relationships (use pie)
  es:
  - Datos continuos en el tiempo (usar líneas)
  - Relaciones parte-todo (usar circular)
applications:
  en:
  - Visualizing survey results in social science research with multi-point agreement
    scales
  - Displaying employee satisfaction and engagement survey outcomes across departments
    or questions
  - Analyzing customer feedback and Net Promoter Score distributions
  - Comparing course evaluation responses across educational assessment items
  es:
  - Visualizing survey results in social science research with multi-point agreement
    scales
  - Displaying employee satisfaction and engagement survey outcomes across departments
    or questions
  - Analyzing customer feedback and Net Promoter Score distributions
  - Comparing course evaluation responses across educational assessment items
