notes:
- Stack letters vertically at each position, ordered by frequency (most frequent on
  top)
- Scale the total stack height by information content in bits (max 2 bits for DNA,
  max ~4.32 bits for protein)
- 'Use standard color schemes: DNA — A=green, C=blue, G=orange/yellow, T=red; protein
  — chemistry-based coloring (e.g., hydrophobic, polar, charged groups)'
