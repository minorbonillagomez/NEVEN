entity_type: ChartType
id: sequence-logo-basic
name:
  en: Sequence Logo for Motif Visualization
  es: Sequence Logo Basic
description:
  en: A sequence logo visualizes the consensus of multiple aligned DNA, RNA, or protein
    sequences. At each position, letters are stacked vertically with height proportional
    to information content (measured in bits), and individual letter heights within
    the stack reflect their relative frequency. This is the standard visualization
    for identifying conserved positions in transcription factor binding sites, splice
    sites, and protein domains.
  es: A sequence logo visualizes the consensus of multiple aligned DNA, RNA, or protein
    sequences. At each position, letters are stacked vertically with height proportional
    to information content (measured in bits), and individual letter heights within
    the stack reflect their relative frequency. This is the standard visualization
    for identifying conserved positions in transcription factor binding sites, splice
    sites, and protein domains.
