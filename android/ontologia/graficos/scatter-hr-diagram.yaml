notes:
- X-axis must be reversed (high temperature/blue on left, low temperature/red on right)
  following the astrophysical convention
- Y-axis should use logarithmic scale for luminosity
- Points should be color-coded by spectral type using conventional colors (blue for
  O/B, white for A, yellow for F/G, orange for K, red for M)
