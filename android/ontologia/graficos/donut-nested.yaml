entity_type: ChartType
id: donut-nested
name:
  en: Nested Donut Chart
  es: Gráfico de Dona
description:
  en: A nested donut chart displays hierarchical data as multiple concentric rings,
    where each ring represents a level of the hierarchy. Inner rings show parent categories
    while outer rings show their subdivisions. This visualization effectively reveals
    part-to-whole relationships across multiple levels while maintaining the familiar
    donut format.
  es: A nested donut chart displays hierarchical data as multiple concentric rings,
    where each ring represents a level of the hierarchy. Inner rings show parent categories
    while outer rings show their subdivisions. This visualization effectively reveals
    part-to-whole relationships across multiple levels while maintaining the familiar
    donut format.
aliases:
  en:
  - donut-nested
  - donut nested
  - donut chart
  es:
  - donut-nested
  - donut nested
  - gráfico de dona
use_when:
  en:
  - Showing part-to-whole relationships
  - Displaying composition with few categories (≤6)
  - Emphasizing proportions
  es:
  - Mostrar relaciones parte-todo
  - Visualizar composición con pocas categorías (≤6)
  - Enfatizar proporciones
avoid_when:
  en:
  - Many categories (>6)
  - Comparing values (use bar)
  es:
  - Muchas categorías (>6)
  - Comparar valores (usar barras)
applications:
  en:
  - Budget allocation showing department totals (inner) and expense categories (outer)
  - Market share by region (inner) and product lines within each region (outer)
  - Organization structure showing divisions and their teams
  - Revenue breakdown by business unit and customer segments
  es:
  - Budget allocation showing department totals (inner) and expense categories (outer)
  - Market share by region (inner) and product lines within each region (outer)
  - Organization structure showing divisions and their teams
  - Revenue breakdown by business unit and customer segments
