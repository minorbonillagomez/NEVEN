notes:
- Mark open-loop poles with x markers and open-loop zeros with o markers
- Show locus branches as continuous curves with arrows indicating the direction of
  increasing gain
- Draw real axis segments that are part of the root locus (segments to the left of
  an odd number of real-axis poles/zeros)
