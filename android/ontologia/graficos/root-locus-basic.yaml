applications:
  en:
  - Designing PID controllers by selecting gain values that place poles in desired
    locations
  - Analyzing closed-loop stability margins as loop gain varies in feedback systems
  - Determining breakaway and break-in points where locus branches merge or split
    on the real axis
  - Teaching classical control theory concepts such as pole placement, damping, and
    natural frequency
