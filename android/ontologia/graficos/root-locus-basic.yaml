entity_type: ChartType
id: root-locus-basic
name:
  en: Root Locus Plot for Control Systems
  es: Root Locus Basic
description:
  en: A root locus plot traces how the closed-loop poles of a transfer function migrate
    through the complex plane as a system parameter (typically gain K) varies from
    0 to infinity. It is a fundamental tool in classical control theory for analyzing
    system stability and designing controllers. The plot reveals critical information
    about pole trajectories, stability boundaries, and gain margins.
  es: A root locus plot traces how the closed-loop poles of a transfer function migrate
    through the complex plane as a system parameter (typically gain K) varies from
    0 to infinity. It is a fundamental tool in classical control theory for analyzing
    system stability and designing controllers. The plot reveals critical information
    about pole trajectories, stability boundaries, and gain margins.
