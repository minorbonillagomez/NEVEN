entity_type: ChartType
id: ternary-density
name:
  en: Ternary Density Plot
  es: Diagrama Ternario
description:
  en: A ternary density plot combines a three-component ternary diagram with kernel
    density estimation to visualize where compositional data concentrates. Instead
    of showing individual points, this visualization uses a heatmap overlay to reveal
    the underlying probability distribution of compositions, making it ideal for identifying
    clusters, modes, and patterns in large compositional datasets.
  es: A ternary density plot combines a three-component ternary diagram with kernel
    density estimation to visualize where compositional data concentrates. Instead
    of showing individual points, this visualization uses a heatmap overlay to reveal
    the underlying probability distribution of compositions, making it ideal for identifying
    clusters, modes, and patterns in large compositional datasets.
