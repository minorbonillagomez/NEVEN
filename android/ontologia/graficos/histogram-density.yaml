entity_type: ChartType
id: histogram-density
name:
  en: Density Histogram
  es: Histograma
description:
  en: A density histogram displays the distribution of a continuous variable normalized
    so that the total area under the histogram equals 1, representing probability
    density instead of raw counts. This normalization allows direct comparison between
    distributions with different sample sizes and enables overlaying theoretical probability
    density functions (PDFs) for statistical analysis.
  es: A density histogram displays the distribution of a continuous variable normalized
    so that the total area under the histogram equals 1, representing probability
    density instead of raw counts. This normalization allows direct comparison between
    distributions with different sample sizes and enables overlaying theoretical probability
    density functions (PDFs) for statistical analysis.
aliases:
  en:
  - histogram-density
  - histogram density
  - histogram
  es:
  - histogram-density
  - histogram density
  - histograma
use_when:
  en:
  - Showing frequency distribution of continuous data
  - Understanding data shape (normal, skewed, bimodal)
  - Identifying common values and outliers
  es:
  - Mostrar distribución de frecuencia de datos continuos
  - Entender la forma de los datos (normal, sesgada, bimodal)
  - Identificar valores comunes y atípicos
avoid_when:
  en: []
  es: []
applications:
  en:
  - Comparing empirical distributions across datasets with different sample sizes
  - Overlaying theoretical distributions (normal, exponential, etc.) to assess goodness
    of fit
  - Visualizing probability density for statistical inference and hypothesis testing
  - Standardizing distribution displays for publication-quality statistical graphics
  es:
  - Comparing empirical distributions across datasets with different sample sizes
  - Overlaying theoretical distributions (normal, exponential, etc.) to assess goodness
