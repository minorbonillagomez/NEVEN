notes:
- Draw each ring as a thick partial arc starting at 90° (top) and progressing clockwise;
  use rounded line caps for the iconic look
- Behind each colored arc, render a faint full-circle track (typically the ring color
  at low opacity) so remaining progress is visible
- Fraction = value / goal; clamp the visible sweep to 360° but allow values that exceed
  the goal to be indicated (e.g., full ring plus a label) where the library permits
