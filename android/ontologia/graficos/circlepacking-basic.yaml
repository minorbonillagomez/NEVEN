entity_type: ChartType
id: circlepacking-basic
name:
  en: Circle Packing Chart
  es: Circlepacking Basic Básico
description:
  en: A circle packing chart displays hierarchical data as nested circles, where each
    circle contains smaller circles representing its children. Circle size is proportional
    to node value, and circles are packed efficiently without overlap. This visualization
    excels at revealing hierarchical structures while simultaneously showing quantitative
    relationships through area encoding.
  es: A circle packing chart displays hierarchical data as nested circles, where each
    circle contains smaller circles representing its children. Circle size is proportional
    to node value, and circles are packed efficiently without overlap. This visualization
    excels at revealing hierarchical structures while simultaneously showing quantitative
    relationships through area encoding.
