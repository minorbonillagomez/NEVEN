entity_type: ChartType
id: coefficient-confidence
name:
  en: Coefficient Plot with Confidence Intervals
  es: Coefficient Confidence
description:
  en: A coefficient plot displays regression coefficients as points positioned along
    a horizontal axis, with horizontal error bars showing confidence intervals. This
    visualization makes it easy to assess effect sizes and statistical significance
    - coefficients whose confidence intervals cross zero are not statistically significant.
    Typically used to summarize results from linear, logistic, or other regression
    models in a clear, publication-ready format.
  es: A coefficient plot displays regression coefficients as points positioned along
    a horizontal axis, with horizontal error bars showing confidence intervals. This
    visualization makes it easy to assess effect sizes and statistical significance
    - coefficients whose confidence intervals cross zero are not statistically significant.
    Typically used to summarize results from linear, logistic, or other regression
    models in a clear, publication-ready format.
