notes:
- Error bars should have visible caps (horizontal lines at ends) to clearly mark the
  error range
- Consider using different colors or markers when comparing multiple series
- Include a legend or annotation explaining what the asymmetric bounds represent (e.g.,
  "10th-90th percentile", "95% CI")
