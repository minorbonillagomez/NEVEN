applications:
  en:
  - Scientific research presenting results with non-symmetric confidence intervals
    (e.g., 5th-95th percentile)
  - Financial forecasting showing different upside and downside risk projections
  - Clinical trials displaying treatment effects with asymmetric uncertainty bounds
  - Environmental monitoring reporting measurements with different detection limits
    above and below
