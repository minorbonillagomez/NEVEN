entity_type: ChartType
id: piano-roll-midi
name:
  en: MIDI Piano Roll Visualization
  es: Piano Roll Midi
description:
  en: A grid-based visualization of musical notes over time, as seen in digital audio
    workstations (DAWs). Each note is represented as a horizontal rectangle positioned
    by pitch (y-axis) and time (x-axis), with bar length indicating note duration
    and color indicating velocity (dynamics). The background alternates between white
    and dark rows to mirror piano keyboard layout, with vertical grid lines marking
    beats and measures.
  es: A grid-based visualization of musical notes over time, as seen in digital audio
    workstations (DAWs). Each note is represented as a horizontal rectangle positioned
    by pitch (y-axis) and time (x-axis), with bar length indicating note duration
    and color indicating velocity (dynamics). The background alternates between white
    and dark rows to mirror piano keyboard layout, with vertical grid lines marking
    beats and measures.
