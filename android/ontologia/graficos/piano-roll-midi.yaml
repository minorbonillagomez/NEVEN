notes:
- Y-axis should display note names (C4, D4, etc.) alongside or instead of raw MIDI
  numbers
- Background rows should alternate shading to distinguish black keys from white keys
  on a piano
- Vertical grid lines should mark beat divisions (quarter notes) with stronger lines
  at measure boundaries
