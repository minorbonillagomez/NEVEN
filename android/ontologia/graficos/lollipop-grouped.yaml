entity_type: ChartType
id: lollipop-grouped
name:
  en: Grouped Lollipop Chart
  es: Gráfico de Piruleta Agrupado
description:
  en: A grouped lollipop chart displays multiple series across categorical variables
    using thin stems and circular markers arranged in groups. Each category has multiple
    lollipops side by side, one for each series, enabling direct comparison of metrics
    across groups. It combines the clarity of dot plots with the organization of grouped
    bar charts while reducing visual clutter.
  es: A grouped lollipop chart displays multiple series across categorical variables
    using thin stems and circular markers arranged in groups. Each category has multiple
    lollipops side by side, one for each series, enabling direct comparison of metrics
    across groups. It combines the clarity of dot plots with the organization of grouped
    bar charts while reducing visual clutter.
