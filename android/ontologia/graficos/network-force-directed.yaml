entity_type: ChartType
id: network-force-directed
name:
  en: Force-Directed Graph
  es: Grafo de Red
description:
  en: A force-directed graph uses physics simulation to position nodes, where connected
    nodes attract each other and all nodes repel. This creates organic layouts that
    naturally reveal community structure, central nodes, and overall network topology
    without manual positioning. The algorithm balances attractive forces (edges pulling
    connected nodes together) and repulsive forces (nodes pushing apart) until reaching
    equilibrium.
  es: A force-directed graph uses physics simulation to position nodes, where connected
    nodes attract each other and all nodes repel. This creates organic layouts that
    naturally reveal community structure, central nodes, and overall network topology
    without manual positioning. The algorithm balances attractive forces (edges pulling
    connected nodes together) and repulsive forces (nodes pushing apart) until reaching
    equilibrium.
