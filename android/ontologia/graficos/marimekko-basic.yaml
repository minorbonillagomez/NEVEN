entity_type: ChartType
id: marimekko-basic
name:
  en: Basic Marimekko Chart
  es: Marimekko Basic Básico
description:
  en: A Marimekko chart (also called mekko or mosaic plot) is a stacked bar chart
    where both the width and height of segments represent data values. This visualization
    shows two categorical dimensions simultaneously with proportional areas, making
    it ideal for understanding how parts relate to wholes across categories of different
    sizes.
  es: A Marimekko chart (also called mekko or mosaic plot) is a stacked bar chart
    where both the width and height of segments represent data values. This visualization
    shows two categorical dimensions simultaneously with proportional areas, making
    it ideal for understanding how parts relate to wholes across categories of different
    sizes.
