applications:
  en:
  - Systematic review authors assessing whether small-study effects indicate publication
    bias across included trials
  - Cochrane reviewers generating standard funnel plots as part of required reporting
    for intervention reviews
  - Research methodologists evaluating selective reporting by visually inspecting
    funnel asymmetry
  - Epidemiologists checking meta-analytic robustness before drawing pooled conclusions
