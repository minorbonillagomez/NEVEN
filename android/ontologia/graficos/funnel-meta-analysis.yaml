entity_type: ChartType
id: funnel-meta-analysis
name:
  en: Meta-Analysis Funnel Plot for Publication Bias
  es: Gráfico de Embudo
description:
  en: A funnel plot used in meta-analysis to assess publication bias by plotting individual
    study effect sizes against their precision (typically standard error). Studies
    scatter around a summary effect line, with pseudo 95% confidence limits forming
    an inverted funnel shape. In the absence of bias, studies distribute symmetrically
    around the summary effect; asymmetry suggests publication bias or systematic heterogeneity.
    This is a standard tool in systematic reviews and Cochrane-style meta-analyses.
  es: A funnel plot used in meta-analysis to assess publication bias by plotting individual
    study effect sizes against their precision (typically standard error). Studies
    scatter around a summary effect line, with pseudo 95% confidence limits forming
    an inverted funnel shape. In the absence of bias, studies distribute symmetrically
    around the summary effect; asymmetry suggests publication bias or systematic heterogeneity.
    This is a standard tool in systematic reviews and Cochrane-style meta-analyses.
