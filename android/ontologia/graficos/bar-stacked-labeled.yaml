entity_type: ChartType
id: bar-stacked-labeled
name:
  en: Stacked Bar Chart with Total Labels
  es: Gráfico de Barras Apilado
description:
  en: A stacked bar chart that displays multiple data series stacked on top of each
    other with total value labels prominently shown above each bar stack. This variant
    combines part-to-whole visualization with explicit numerical annotations, making
    it easy to read both individual segment contributions and cumulative totals at
    a glance. The total labels eliminate the need for mental arithmetic when comparing
    overall values across categories.
  es: A stacked bar chart that displays multiple data series stacked on top of each
    other with total value labels prominently shown above each bar stack. This variant
    combines part-to-whole visualization with explicit numerical annotations, making
    it easy to read both individual segment contributions and cumulative totals at
    a glance. The total labels eliminate the need for mental arithmetic when comparing
    overall values across categories.
aliases:
  en:
  - bar-stacked-labeled
  - bar stacked labeled
  - stacked bar chart
  es:
  - bar-stacked-labeled
  - bar stacked labeled
  - gráfico de barras apilado
use_when:
  en:
  - Comparing values across categories
  - Showing rankings or distributions
  - Displaying discrete data
  es:
  - Comparar valores entre categorías
  - Mostrar rankings o distribuciones
  - Visualizar datos discretos
avoid_when:
  en:
  - Continuous data over time (use line chart)
  - Part-to-whole relationships (use pie)
  es:
  - Datos continuos en el tiempo (usar líneas)
  - Relaciones parte-todo (usar circular)
applications:
  en:
  - Comparing quarterly sales by product line with clear total revenue figures for
    executive presentations
  - Displaying project budget breakdowns by task category with visible total costs
    for each project phase
  - Visualizing survey response distributions with total respondent counts labeled
    for each question
  es:
  - Comparing quarterly sales by product line with clear total revenue figures for
    executive presentations
  - Displaying project budget breakdowns by task category with visible total costs
    for each project phase
  - Visualizing survey response distributions with total respondent counts labeled
    for each question
