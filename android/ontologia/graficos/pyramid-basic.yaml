entity_type: ChartType
id: pyramid-basic
name:
  en: Basic Pyramid Chart
  es: Pyramid Basic Básico
description:
  en: A pyramid chart displays two opposing horizontal bar charts that share a central
    axis, creating a pyramid or butterfly shape. This visualization is ideal for comparing
    two related metrics across the same categories, revealing asymmetries and patterns
    in bidirectional data. Most commonly used for population pyramids showing age-gender
    distributions.
  es: A pyramid chart displays two opposing horizontal bar charts that share a central
    axis, creating a pyramid or butterfly shape. This visualization is ideal for comparing
    two related metrics across the same categories, revealing asymmetries and patterns
    in bidirectional data. Most commonly used for population pyramids showing age-gender
    distributions.
