entity_type: ChartType
id: map-marker-clustered
name:
  en: Clustered Marker Map
  es: Mapa
description:
  en: A geographic map that dynamically clusters nearby markers based on the current
    zoom level. At lower zoom levels, clusters aggregate multiple points into a single
    marker displaying the count, while zooming in progressively expands clusters to
    reveal individual markers. This visualization is essential for efficiently displaying
    large geographic datasets without visual clutter, enabling users to see both the
    overall distribution and specific locations through interactive exploration.
  es: A geographic map that dynamically clusters nearby markers based on the current
    zoom level. At lower zoom levels, clusters aggregate multiple points into a single
    marker displaying the count, while zooming in progressively expands clusters to
    reveal individual markers. This visualization is essential for efficiently displaying
    large geographic datasets without visual clutter, enabling users to see both the
    overall distribution and specific locations through interactive exploration.
