applications:
  en:
  - Store locator maps showing retail locations that cluster regionally and expand
    to individual stores when zoomed
  - Event venue mapping where concerts, conferences, or festivals are grouped by city
    or neighborhood
  - POI (Point of Interest) visualization for tourism, real estate, or service directories
  - Large-scale geographic datasets (e.g., sensor networks, incident reports) where
    thousands of points need efficient display
