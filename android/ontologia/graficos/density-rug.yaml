entity_type: ChartType
id: density-rug
name:
  en: Density Plot with Rug Marks
  es: Gráfico de Densidad
description:
  en: 'A kernel density estimation (KDE) plot combined with rug marks along the x-axis,
    showing both the smoothed probability distribution and the exact location of each
    individual data point. This combination provides the best of both worlds: the
    KDE reveals the overall shape, modality, and smoothed density of the distribution,
    while the rug marks preserve transparency about where actual observations fall,
    highlighting data density and potential gaps.'
  es: 'A kernel density estimation (KDE) plot combined with rug marks along the x-axis,
    showing both the smoothed probability distribution and the exact location of each
    individual data point. This combination provides the best of both worlds: the
    KDE reveals the overall shape, modality, and smoothed density of the distribution,
    while the rug marks preserve transparency about where actual observations fall,
    highlighting data density and potential gaps.'
