notes:
- Display the KDE curve with fill for visual weight and the rug marks as small tick
  marks along the x-axis
- Use semi-transparent fill under the density curve to avoid obscuring the rug
- Rug marks should be subtle but visible, with slight transparency for overlapping
  points
