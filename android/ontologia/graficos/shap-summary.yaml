entity_type: ChartType
id: shap-summary
name:
  en: SHAP Summary Plot
  es: Shap Summary
description:
  en: A SHAP (SHapley Additive exPlanations) summary plot displaying the distribution
    of SHAP values for each feature, ordered by mean absolute SHAP value (importance).
    Each dot represents a sample, positioned horizontally by its SHAP value and colored
    by the feature's value (typically low=blue to high=red). This visualization is
    essential for machine learning interpretability, showing both feature importance
    and the direction and magnitude of feature effects on model predictions.
  es: A SHAP (SHapley Additive exPlanations) summary plot displaying the distribution
    of SHAP values for each feature, ordered by mean absolute SHAP value (importance).
    Each dot represents a sample, positioned horizontally by its SHAP value and colored
    by the feature's value (typically low=blue to high=red). This visualization is
    essential for machine learning interpretability, showing both feature importance
    and the direction and magnitude of feature effects on model predictions.
