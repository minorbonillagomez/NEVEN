applications:
  en:
  - Explaining gradient boosting or random forest model predictions to stakeholders
    by showing which features drive predictions up or down
  - Identifying non-linear relationships where high and low feature values both push
    predictions in the same direction
  - Detecting feature interactions by observing clustered or bimodal SHAP value distributions
