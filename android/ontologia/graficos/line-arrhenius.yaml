entity_type: ChartType
id: line-arrhenius
name:
  en: Arrhenius Plot for Reaction Kinetics
  es: Gráfico de Líneas
description:
  en: An Arrhenius plot displays ln(k) versus 1/T to determine the activation energy
    of a chemical reaction from experimental rate constant data. The Arrhenius equation
    predicts a linear relationship on this transformed scale, where the slope equals
    -Ea/R (activation energy divided by the gas constant). This visualization is fundamental
    in physical chemistry and chemical engineering for characterizing reaction kinetics
    and comparing catalytic performance.
  es: An Arrhenius plot displays ln(k) versus 1/T to determine the activation energy
    of a chemical reaction from experimental rate constant data. The Arrhenius equation
    predicts a linear relationship on this transformed scale, where the slope equals
    -Ea/R (activation energy divided by the gas constant). This visualization is fundamental
    in physical chemistry and chemical engineering for characterizing reaction kinetics
    and comparing catalytic performance.
