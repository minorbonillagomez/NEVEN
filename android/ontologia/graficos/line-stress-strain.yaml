notes:
- 'Label key regions on the curve: elastic, plastic (strain hardening), and necking'
- 'Mark critical points: yield point (0.2% offset method), ultimate tensile strength
  (UTS), and fracture point'
- Annotate the elastic modulus (Young's modulus) as the slope in the elastic region,
  with a visible slope line or text annotation
