applications:
  en:
  - Comparing mechanical properties (yield strength, UTS, ductility) of different
    materials or alloys for design selection
  - Determining yield strength using the 0.2% offset method for structural engineering
    design calculations
  - Quality control testing in manufacturing to verify materials meet specified mechanical
    property requirements
  - Teaching material science and mechanics of materials concepts in engineering education
