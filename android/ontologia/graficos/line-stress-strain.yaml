entity_type: ChartType
id: line-stress-strain
name:
  en: Engineering Stress-Strain Curve
  es: Gráfico de Líneas
description:
  en: An engineering stress-strain curve visualizes the relationship between applied
    stress (MPa) and resulting strain (dimensionless) in a material under uniaxial
    tensile loading. The curve reveals distinct mechanical behavior regions — elastic
    deformation, yielding, strain hardening, and necking — culminating in fracture.
    It is the foundational plot for characterizing material mechanical properties
    and comparing material performance.
  es: An engineering stress-strain curve visualizes the relationship between applied
    stress (MPa) and resulting strain (dimensionless) in a material under uniaxial
    tensile loading. The curve reveals distinct mechanical behavior regions — elastic
    deformation, yielding, strain hardening, and necking — culminating in fracture.
    It is the foundational plot for characterizing material mechanical properties
    and comparing material performance.
