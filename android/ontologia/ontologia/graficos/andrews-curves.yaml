entity_type: ChartType
id: andrews-curves
name:
  en: Andrews Curves for Multivariate Data
  es: Andrews Curves
description:
  en: Andrews curves visualization transforms multivariate observations into smooth
    Fourier series curves. Each data point is represented as a continuous function
    where variable values become coefficients in a Fourier expansion, producing distinctive
    wave patterns. This technique enables visual comparison of multivariate patterns,
    cluster identification, and outlier detection—observations with similar values
    across variables produce similar curves, while outliers appear as distinctly different
    patterns.
  es: Andrews curves visualization transforms multivariate observations into smooth
    Fourier series curves. Each data point is represented as a continuous function
    where variable values become coefficients in a Fourier expansion, producing distinctive
    wave patterns. This technique enables visual comparison of multivariate patterns,
    cluster identification, and outlier detection—observations with similar values
    across variables produce similar curves, while outliers appear as distinctly different
    patterns.
