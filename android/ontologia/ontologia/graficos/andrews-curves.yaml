applications:
  en:
  - Comparing iris flower species across sepal/petal measurements to visualize natural
    clustering in botanical data
  - Detecting anomalous network traffic patterns by transforming connection metrics
    into curves and identifying outliers
  - Analyzing wine quality factors (acidity, sugar, alcohol, pH) to reveal how different
    quality grades separate visually
