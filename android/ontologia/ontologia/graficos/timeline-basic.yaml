entity_type: ChartType
id: timeline-basic
name:
  en: Event Timeline
  es: Timeline Basic Básico
description:
  en: A timeline visualization that displays events and milestones along a temporal
    axis. Events are represented as points or markers with accompanying labels, making
    it easy to understand the sequence and timing of events. This plot type excels
    at showing chronological progressions and is particularly effective for communicating
    project phases, historical events, or any time-ordered sequence of occurrences.
  es: A timeline visualization that displays events and milestones along a temporal
    axis. Events are represented as points or markers with accompanying labels, making
    it easy to understand the sequence and timing of events. This plot type excels
    at showing chronological progressions and is particularly effective for communicating
    project phases, historical events, or any time-ordered sequence of occurrences.
