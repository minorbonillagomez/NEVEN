entity_type: ChartType
id: column-stratigraphic
name:
  en: Stratigraphic Column with Lithology Patterns
  es: Column Stratigraphic
description:
  en: A vertical column visualization showing geological rock layers with standardized
    lithology patterns, formation names, ages, and thickness scales. Each layer is
    represented as a stacked rectangular block filled with a distinctive pattern (e.g.,
    brick pattern for limestone, dots for sandstone, dashes for shale) following FGDC/USGS
    conventions. This plot is essential for communicating subsurface geology and sedimentary
    sequences in a compact, standardized format.
  es: A vertical column visualization showing geological rock layers with standardized
    lithology patterns, formation names, ages, and thickness scales. Each layer is
    represented as a stacked rectangular block filled with a distinctive pattern (e.g.,
    brick pattern for limestone, dots for sandstone, dashes for shale) following FGDC/USGS
    conventions. This plot is essential for communicating subsurface geology and sedimentary
    sequences in a compact, standardized format.
