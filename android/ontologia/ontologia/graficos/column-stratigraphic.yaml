notes:
- Each lithology type should use a distinct fill pattern (hatching or texture) that
  approximates standard geological map symbols (e.g., brick pattern for limestone,
  stipple dots for sandstone, horizontal dashes for shale, random dashes for siltstone)
- The vertical axis represents depth or thickness (increasing downward by convention
  in borehole logs, or upward for outcrop sections); use increasing downward for this
  spec
- Formation names should be labeled to the right of or within each layer
