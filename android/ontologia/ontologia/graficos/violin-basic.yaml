entity_type: ChartType
id: violin-basic
name:
  en: Basic Violin Plot
  es: Diagrama de Violín Básico
description:
  en: A violin plot combining a box plot with a kernel density estimation on each
    side, showing the distribution shape of numerical data. The width of the violin
    at each point represents the frequency of data values at that level. Excellent
    for comparing distributions across categories while revealing their underlying
    shape, providing more detail than a traditional box plot.
  es: A violin plot combining a box plot with a kernel density estimation on each
    side, showing the distribution shape of numerical data. The width of the violin
    at each point represents the frequency of data values at that level. Excellent
    for comparing distributions across categories while revealing their underlying
    shape, providing more detail than a traditional box plot.
