entity_type: ChartType
id: windbarb-basic
name:
  en: Wind Barb Plot for Meteorological Data
  es: Windbarb Basic Básico
description:
  en: A wind barb plot displays wind speed and direction at specific locations using
    standard meteorological barb notation. Each barb consists of a staff pointing
    in the direction from which the wind blows, with short barbs (5 knots), long barbs
    (10 knots), and triangular pennants (50 knots) attached to indicate speed. This
    internationally recognized symbology enables rapid interpretation of wind patterns
    across weather maps and atmospheric data visualizations.
  es: A wind barb plot displays wind speed and direction at specific locations using
    standard meteorological barb notation. Each barb consists of a staff pointing
    in the direction from which the wind blows, with short barbs (5 knots), long barbs
    (10 knots), and triangular pennants (50 knots) attached to indicate speed. This
    internationally recognized symbology enables rapid interpretation of wind patterns
    across weather maps and atmospheric data visualizations.
