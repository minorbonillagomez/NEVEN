notes:
- Use lower-hemisphere equal-area (Schmidt net) projection; this preserves area relationships
  making density analysis meaningful
- Great circles should be drawn for planes; poles (points) plotted at 90 degrees to
  each plane
- The primitive circle represents the horizontal plane; North is at top (0/360 degrees)
