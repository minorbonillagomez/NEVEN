entity_type: ChartType
id: stereonet-equal-area
name:
  en: Structural Geology Stereonet (Equal-Area Projection)
  es: Stereonet Equal Area
description:
  en: A Schmidt equal-area (lower-hemisphere) stereographic projection for plotting
    geological structural data. Great circles represent planar features (bedding,
    faults, joints) by their strike and dip, while poles to planes are plotted as
    points showing the orientation of the normal to each plane. Density contours highlight
    preferred orientations in clustered data. This is the standard projection used
    in structural geology for analyzing fabric elements and kinematic indicators.
  es: A Schmidt equal-area (lower-hemisphere) stereographic projection for plotting
    geological structural data. Great circles represent planar features (bedding,
    faults, joints) by their strike and dip, while poles to planes are plotted as
    points showing the orientation of the normal to each plane. Density contours highlight
    preferred orientations in clustered data. This is the standard projection used
    in structural geology for analyzing fabric elements and kinematic indicators.
