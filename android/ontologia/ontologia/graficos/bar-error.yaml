entity_type: ChartType
id: bar-error
name:
  en: Bar Chart with Error Bars
  es: Gráfico de Barras
description:
  en: A bar chart with error bars displays categorical data as rectangular bars with
    vertical (or horizontal) lines extending from each bar to indicate uncertainty
    or variability. Error bars typically represent standard deviation, standard error,
    confidence intervals, or min/max ranges. This visualization is essential for comparing
    group means while communicating the reliability and precision of each measurement.
  es: A bar chart with error bars displays categorical data as rectangular bars with
    vertical (or horizontal) lines extending from each bar to indicate uncertainty
    or variability. Error bars typically represent standard deviation, standard error,
    confidence intervals, or min/max ranges. This visualization is essential for comparing
    group means while communicating the reliability and precision of each measurement.
aliases:
  en:
  - bar-error
  - bar error
  - bar chart
  es:
  - bar-error
  - bar error
  - gráfico de barras
use_when:
  en:
  - Comparing values across categories
  - Showing rankings or distributions
  - Displaying discrete data
  es:
  - Comparar valores entre categorías
  - Mostrar rankings o distribuciones
  - Visualizar datos discretos
avoid_when:
  en:
  - Continuous data over time (use line chart)
  - Part-to-whole relationships (use pie)
  es:
  - Datos continuos en el tiempo (usar líneas)
  - Relaciones parte-todo (usar circular)
applications:
  en:
  - Scientific experiments comparing treatment groups with measurement uncertainty
  - Survey results displaying response means with confidence intervals
  - A/B test results showing conversion rates with statistical bounds
  - Comparing group means with standard deviations across categories
  es:
  - Scientific experiments comparing treatment groups with measurement uncertainty
  - Survey results displaying response means with confidence intervals
  - A/B test results showing conversion rates with statistical bounds
  - Comparing group means with standard deviations across categories
data_requirements:
  min_columns: 2
  max_columns: null
  column_types:
