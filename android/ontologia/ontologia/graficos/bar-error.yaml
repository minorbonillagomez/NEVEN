notes:
- Error bars should have visible caps (horizontal lines at ends) to clearly mark the
  error range
- Include a legend or annotation explaining what the error bars represent (e.g., "±1
  SD", "95% CI")
- Consider horizontal orientation when category labels are long or numerous
