entity_type: ChartType
id: network-basic
name:
  en: Basic Network Graph
  es: Grafo de Red Básico
description:
  en: A network graph (node-link diagram) visualizes relationships between entities
    as nodes connected by edges. It reveals the structure of connections, clusters,
    and central nodes in relational data. Network graphs are essential for understanding
    complex systems where relationships matter as much as the entities themselves,
    making hidden patterns of connectivity visible at a glance.
  es: A network graph (node-link diagram) visualizes relationships between entities
    as nodes connected by edges. It reveals the structure of connections, clusters,
    and central nodes in relational data. Network graphs are essential for understanding
    complex systems where relationships matter as much as the entities themselves,
    making hidden patterns of connectivity visible at a glance.
