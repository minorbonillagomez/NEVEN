entity_type: ChartType
id: barcode-ean13
name:
  en: EAN-13 Barcode
  es: Barcode Ean13
description:
  en: A standard EAN-13 barcode visualization commonly used for retail products worldwide.
    The plot renders a scannable linear barcode encoding a 13-digit number with proper
    bar widths, guard patterns, and human-readable digits. This visualization is essential
    for product identification, inventory management, and point-of-sale systems.
  es: A standard EAN-13 barcode visualization commonly used for retail products worldwide.
    The plot renders a scannable linear barcode encoding a 13-digit number with proper
    bar widths, guard patterns, and human-readable digits. This visualization is essential
    for product identification, inventory management, and point-of-sale systems.
