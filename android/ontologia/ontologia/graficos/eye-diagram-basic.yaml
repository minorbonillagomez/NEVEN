notes:
- Use color intensity (density heatmap coloring) to show where traces overlap most
  frequently, with the dense end of the sequential colormap marking high trace density
- Time axis should be labeled in unit intervals (UI), not absolute time
- Voltage axis should show signal levels (e.g., 0 and 1 for NRZ)
