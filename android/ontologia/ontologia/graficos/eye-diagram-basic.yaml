entity_type: ChartType
id: eye-diagram-basic
name:
  en: Signal Integrity Eye Diagram
  es: Eye Diagram Basic
description:
  en: An eye diagram visualizes signal integrity by overlaying many periods of a digital
    signal onto a single time window spanning 1-2 unit intervals (UI). The overlapping
    traces form a characteristic eye-shaped opening whose height, width, and clarity
    reveal signal quality metrics such as jitter, noise, and inter-symbol interference
    (ISI). A wide-open eye indicates clean signal transmission, while a closed or
    blurred eye signals degradation.
  es: An eye diagram visualizes signal integrity by overlaying many periods of a digital
    signal onto a single time window spanning 1-2 unit intervals (UI). The overlapping
    traces form a characteristic eye-shaped opening whose height, width, and clarity
    reveal signal quality metrics such as jitter, noise, and inter-symbol interference
    (ISI). A wide-open eye indicates clean signal transmission, while a closed or
    blurred eye signals degradation.
