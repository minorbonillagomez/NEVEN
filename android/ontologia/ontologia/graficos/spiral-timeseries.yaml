entity_type: ChartType
id: spiral-timeseries
name:
  en: Spiral Time Series Chart
  es: Spiral Timeseries
description:
  en: A time series plotted along a spiral (Archimedean or logarithmic), where each
    full revolution represents one cycle period (e.g., one year). By wrapping temporal
    data around a spiral, corresponding periods from different cycles align vertically,
    making recurring seasonal or periodic patterns immediately visible. This layout
    provides a compact alternative to long horizontal time series for cyclic data,
    revealing periodicity and trend simultaneously.
  es: A time series plotted along a spiral (Archimedean or logarithmic), where each
    full revolution represents one cycle period (e.g., one year). By wrapping temporal
    data around a spiral, corresponding periods from different cycles align vertically,
    making recurring seasonal or periodic patterns immediately visible. This layout
    provides a compact alternative to long horizontal time series for cyclic data,
    revealing periodicity and trend simultaneously.
