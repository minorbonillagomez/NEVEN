  - histogram
  es:
  - histogram-returns-distribution
  - histogram returns distribution
  - histograma
use_when:
  en:
  - Showing frequency distribution of continuous data
  - Understanding data shape (normal, skewed, bimodal)
  - Identifying common values and outliers
  es:
  - Mostrar distribución de frecuencia de datos continuos
  - Entender la forma de los datos (normal, sesgada, bimodal)
  - Identificar valores comunes y atípicos
avoid_when:
  en: []
  es: []
applications:
  en:
  - Risk analysis and return distribution assessment for portfolio management
  - Comparing actual return distributions to theoretical normal distribution assumptions
  - Identifying fat tails and skewness in financial time series for VaR calculations
  - Evaluating portfolio return characteristics and risk metrics
  es:
  - Risk analysis and return distribution assessment for portfolio management
  - Comparing actual return distributions to theoretical normal distribution assumptions
  - Identifying fat tails and skewness in financial time series for VaR calculations
  - Evaluating portfolio return characteristics and risk metrics
