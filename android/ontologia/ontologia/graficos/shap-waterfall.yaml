entity_type: ChartType
id: shap-waterfall
name:
  en: SHAP Waterfall Plot for Feature Attribution
  es: Shap Waterfall
description:
  en: A waterfall-style chart showing how each feature contributes to pushing a model
    prediction from a base value (expected model output) to the final predicted value.
    Horizontal bar segments extend right for positive SHAP values and left for negative
    SHAP values, stacking cumulatively so the viewer can trace the path from baseline
    to prediction. This is a core ML explainability visualization for explaining individual
    predictions, complementing the SHAP summary plot which shows feature effects across
    many samples.
  es: A waterfall-style chart showing how each feature contributes to pushing a model
    prediction from a base value (expected model output) to the final predicted value.
    Horizontal bar segments extend right for positive SHAP values and left for negative
    SHAP values, stacking cumulatively so the viewer can trace the path from baseline
    to prediction. This is a core ML explainability visualization for explaining individual
    predictions, complementing the SHAP summary plot which shows feature effects across
    many samples.
