entity_type: ChartType
id: sankey-basic
name:
  en: Basic Sankey Diagram
  es: Diagrama de Sankey Básico
description:
  en: A Sankey diagram visualizes flow or transfer between nodes using links with
    widths proportional to flow values. It excels at showing how quantities distribute
    from sources to destinations, revealing patterns in resource allocation, process
    flows, and system transitions. The diagram makes it easy to identify major pathways
    and compare relative magnitudes of different flows.
  es: A Sankey diagram visualizes flow or transfer between nodes using links with
    widths proportional to flow values. It excels at showing how quantities distribute
    from sources to destinations, revealing patterns in resource allocation, process
    flows, and system transitions. The diagram makes it easy to identify major pathways
    and compare relative magnitudes of different flows.
