use_when:
  en:
  - Comparing values across categories
  - Showing rankings or distributions
  - Displaying discrete data
  es:
  - Comparar valores entre categorías
  - Mostrar rankings o distribuciones
  - Visualizar datos discretos
avoid_when:
  en:
  - Continuous data over time (use line chart)
  - Part-to-whole relationships (use pie)
  es:
  - Datos continuos en el tiempo (usar líneas)
  - Relaciones parte-todo (usar circular)
applications:
  en:
  - 'Endurance training: reviewing a single run or ride to confirm time was spent
    in the intended intensity zone (e.g. mostly Z2 for a base session)'
  - 'Coaching and training-load analysis: summarizing a week or training block to
    balance easy vs. hard time and avoid overtraining'
  - 'Fitness app workout summaries: presenting per-zone duration in the familiar Garmin/Strava/Polar
    style after an activity'
  - 'Polarized-training assessment: checking the 80/20 split between low- and high-intensity
    zones'
  es:
  - 'Endurance training: reviewing a single run or ride to confirm time was spent
    in the intended intensity zone (e.g. mostly Z2 for a base session)'
  - 'Coaching and training-load analysis: summarizing a week or training block to
