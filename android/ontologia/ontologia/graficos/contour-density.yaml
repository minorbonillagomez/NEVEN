entity_type: ChartType
id: contour-density
name:
  en: Density Contour Plot
  es: Gráfico de Contorno
description:
  en: A density contour plot (also known as a 2D KDE contour plot) displays the concentration
    of points in a 2D scatter plot using contour lines. The contours connect points
    of equal density, revealing clusters, patterns, and the overall bivariate distribution
    shape.
  es: A density contour plot (also known as a 2D KDE contour plot) displays the concentration
    of points in a 2D scatter plot using contour lines. The contours connect points
    of equal density, revealing clusters, patterns, and the overall bivariate distribution
    shape.
