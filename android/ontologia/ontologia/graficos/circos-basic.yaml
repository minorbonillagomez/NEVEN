entity_type: ChartType
id: circos-basic
name:
  en: Circos Plot
  es: Circos Basic Básico
description:
  en: A Circos plot is a circular visualization that displays data on concentric tracks
    arranged around a circle, with ribbons or arcs connecting related segments across
    the circular layout. Originally designed for genomic data visualization, it excels
    at showing relationships between segments while simultaneously displaying multiple
    data attributes on different tracks. The circular arrangement makes efficient
    use of space and reveals patterns in complex relational data.
  es: A Circos plot is a circular visualization that displays data on concentric tracks
    arranged around a circle, with ribbons or arcs connecting related segments across
    the circular layout. Originally designed for genomic data visualization, it excels
    at showing relationships between segments while simultaneously displaying multiple
    data attributes on different tracks. The circular arrangement makes efficient
    use of space and reveals patterns in complex relational data.
