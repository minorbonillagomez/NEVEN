notes:
- X-axis MUST be logarithmic in time (seconds), with human-readable tick labels (e.g.
  1s, 5s, 30s, 1min, 5min, 20min, 1h)
- Plot the empirical mean-maximal curve as the primary series and overlay the fitted
  critical power model as a distinct (e.g. dashed) line
- 'Annotate reference durations with vertical markers and labels: 5 s sprint, 1 min,
