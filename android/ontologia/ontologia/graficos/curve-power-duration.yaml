applications:
  en:
  - 'Cycling performance analysis: profiling a rider as a sprinter, puncheur, or time-trialist
    by the shape of their power-duration curve and the height of its short- vs long-duration
    regions'
  - 'Critical power testing: fitting the CP/W′ model to a handful of maximal efforts
    to estimate sustainable aerobic power and anaerobic reserve'
  - 'Training prescription: deriving Functional Threshold Power (FTP) and training
    zones from the 20-minute and 60-minute power points'
  - 'Longitudinal fitness tracking: overlaying curves from different training blocks
    or seasons to visualize gains across the durational spectrum'
  es:
