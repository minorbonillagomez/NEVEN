entity_type: ChartType
id: curve-power-duration
name:
  en: Mean-Maximal Power Duration Curve
  es: Curve Power Duration
description:
  en: A power duration curve plots an athlete's best mean-maximal power output (watts)
    against effort duration on a logarithmic time axis spanning roughly 1 second to
    several hours. Each point answers "what is the highest average power this rider
    could sustain for exactly this long?", producing a characteristic monotonically
    decreasing decay curve. A critical power (CP) model is fitted and overlaid, decomposing
    performance into an aerobic asymptote (CP) and a finite anaerobic work capacity
    (W′). The chart is a cornerstone of cycling and endurance sports analytics for
    profiling rider strengths, tracking fitness, and setting training zones.
  es: A power duration curve plots an athlete's best mean-maximal power output (watts)
    against effort duration on a logarithmic time axis spanning roughly 1 second to
    several hours. Each point answers "what is the highest average power this rider
    could sustain for exactly this long?", producing a characteristic monotonically
    decreasing decay curve. A critical power (CP) model is fitted and overlaid, decomposing
    performance into an aerobic asymptote (CP) and a finite anaerobic work capacity
    (W′). The chart is a cornerstone of cycling and endurance sports analytics for
    profiling rider strengths, tracking fitness, and setting training zones.
