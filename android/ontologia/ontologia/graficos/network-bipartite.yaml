entity_type: ChartType
id: network-bipartite
name:
  en: Bipartite Network Graph
  es: Grafo de Red
description:
  en: A bipartite network graph visualizes relationships between two distinct sets
    of entities, where edges only connect nodes from different sets — never within
    the same set. The two node groups are arranged in separate columns or rows, making
    the two-mode structure immediately apparent. This layout is fundamental for understanding
    cross-category relationships, revealing which entities from one set are linked
    to which entities in the other, and exposing patterns like hubs, clusters, and
    isolated nodes.
  es: A bipartite network graph visualizes relationships between two distinct sets
    of entities, where edges only connect nodes from different sets — never within
    the same set. The two node groups are arranged in separate columns or rows, making
    the two-mode structure immediately apparent. This layout is fundamental for understanding
    cross-category relationships, revealing which entities from one set are linked
    to which entities in the other, and exposing patterns like hubs, clusters, and
    isolated nodes.
