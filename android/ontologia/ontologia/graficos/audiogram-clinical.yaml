notes:
- 'Y-axis: hearing threshold in dB HL, **inverted** so 0 dB HL is at the top and values
  increase downward (typical range -10 to 120 dB HL, gridlines every 10 dB)'
- 'X-axis: **logarithmic** frequency from 125 Hz to 8 kHz; label octave frequencies
  as ticks (125, 250, 500, 1k, 2k, 4k, 8k) using kHz shorthand where conventional'
- 'Right ear: red, circle (O) marker, solid connecting line. Left ear: blue, cross
  (X) marker, solid connecting line (dashed line is an acceptable convention to distinguish
  ears)'
