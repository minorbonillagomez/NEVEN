entity_type: ChartType
id: audiogram-clinical
name:
  en: Clinical Audiogram
  es: Audiogram Clinical
description:
  en: A standardized clinical audiogram that displays hearing test results, plotting
    hearing threshold (dB HL) against test frequency for each ear. The y-axis is inverted
    so that 0 dB HL (best hearing) sits at the top and increasing hearing loss extends
    downward, while the x-axis is logarithmic spanning the standard audiometric frequencies
    (125 Hz to 8 kHz). Thresholds are marked with the conventional symbols — a circle
    (O) for the right ear in red and a cross (X) for the left ear in blue — and connected
    per ear, with shaded horizontal bands indicating severity of hearing loss (normal,
    mild, moderate, severe, profound).
  es: A standardized clinical audiogram that displays hearing test results, plotting
    hearing threshold (dB HL) against test frequency for each ear. The y-axis is inverted
    so that 0 dB HL (best hearing) sits at the top and increasing hearing loss extends
    downward, while the x-axis is logarithmic spanning the standard audiometric frequencies
    (125 Hz to 8 kHz). Thresholds are marked with the conventional symbols — a circle
    (O) for the right ear in red and a cross (X) for the left ear in blue — and connected
    per ear, with shaded horizontal bands indicating severity of hearing loss (normal,
    mild, moderate, severe, profound).
