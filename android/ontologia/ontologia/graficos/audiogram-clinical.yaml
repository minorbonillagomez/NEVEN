applications:
  en:
  - Audiology clinics recording and interpreting pure-tone audiometry results to diagnose
    and grade hearing loss
  - ENT (otolaryngology) practices distinguishing conductive, sensorineural, and mixed
    hearing loss patterns across ears
  - Occupational health programs screening for noise-induced hearing loss in workers
    exposed to loud environments
  - Pediatric and educational audiology documenting hearing thresholds for hearing-aid
    fitting and follow-up
