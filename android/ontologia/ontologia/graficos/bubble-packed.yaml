entity_type: ChartType
id: bubble-packed
name:
  en: Basic Packed Bubble Chart
  es: Gráfico de Burbujas
description:
  en: A packed bubble chart displays data as circles where size represents value,
    and circles are packed together without overlap using physics simulation. Unlike
    scatter or traditional bubble charts, position has no meaning - only size and
    optional grouping matter. This visualization efficiently uses space for comparing
    values across many categories.
  es: A packed bubble chart displays data as circles where size represents value,
    and circles are packed together without overlap using physics simulation. Unlike
    scatter or traditional bubble charts, position has no meaning - only size and
    optional grouping matter. This visualization efficiently uses space for comparing
    values across many categories.
