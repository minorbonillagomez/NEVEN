entity_type: ChartType
id: spectrum-nmr
name:
  en: NMR Spectrum (Nuclear Magnetic Resonance)
  es: Spectrum Nmr
description:
  en: An NMR spectrum plots signal intensity versus chemical shift (in ppm) to reveal
    the electronic environment of atomic nuclei in a molecule. It is the primary analytical
    tool in organic chemistry for determining molecular structure, with peak positions
    indicating functional groups and splitting patterns (multiplets) revealing connectivity
    between neighboring atoms. The x-axis is conventionally reversed (high ppm on
    the left) and peaks appear as sharp signals rising from a baseline.
  es: An NMR spectrum plots signal intensity versus chemical shift (in ppm) to reveal
    the electronic environment of atomic nuclei in a molecule. It is the primary analytical
    tool in organic chemistry for determining molecular structure, with peak positions
    indicating functional groups and splitting patterns (multiplets) revealing connectivity
    between neighboring atoms. The x-axis is conventionally reversed (high ppm on
    the left) and peaks appear as sharp signals rising from a baseline.
