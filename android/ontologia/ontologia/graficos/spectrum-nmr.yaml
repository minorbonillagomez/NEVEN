notes:
- The x-axis must be reversed so that higher ppm values appear on the left (standard
  NMR convention)
- Peaks should be sharp and well-resolved with realistic splitting patterns (singlet,
  doublet, triplet, quartet)
- Label key peaks with their chemical shift values
