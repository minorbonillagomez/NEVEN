entity_type: ChartType
id: elbow-curve
name:
  en: Elbow Curve for K-Means Clustering
  es: Elbow Curve
description:
  en: An elbow curve visualizes the relationship between the number of clusters (k)
    and within-cluster sum of squares (inertia/distortion) in K-means clustering.
    The plot helps identify the optimal number of clusters by finding the "elbow point"
    where adding more clusters yields diminishing returns in reducing inertia. This
    is a fundamental diagnostic tool for unsupervised learning parameter selection.
  es: An elbow curve visualizes the relationship between the number of clusters (k)
    and within-cluster sum of squares (inertia/distortion) in K-means clustering.
    The plot helps identify the optimal number of clusters by finding the "elbow point"
    where adding more clusters yields diminishing returns in reducing inertia. This
    is a fundamental diagnostic tool for unsupervised learning parameter selection.
