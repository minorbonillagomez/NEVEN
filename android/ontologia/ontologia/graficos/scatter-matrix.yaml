entity_type: ChartType
id: scatter-matrix
name:
  en: Scatter Plot Matrix
  es: Diagrama de Dispersión
description:
  en: A grid of scatter plots showing all pairwise relationships between multiple
    variables, with histograms or kernel density estimates on the diagonal. This comprehensive
    visualization enables simultaneous exploration of correlations and distributions
    across an entire dataset, making it invaluable for understanding multivariate
    data structure at a glance. Also known as a pairplot or SPLOM (Scatter Plot Matrix).
  es: A grid of scatter plots showing all pairwise relationships between multiple
    variables, with histograms or kernel density estimates on the diagonal. This comprehensive
    visualization enables simultaneous exploration of correlations and distributions
    across an entire dataset, making it invaluable for understanding multivariate
    data structure at a glance. Also known as a pairplot or SPLOM (Scatter Plot Matrix).
aliases:
  en:
  - scatter-matrix
  - scatter matrix
  - scatter plot
  es:
  - scatter-matrix
  - scatter matrix
  - diagrama de dispersión
use_when:
  en:
  - Exploring relationship between two continuous variables
  - Detecting correlations (positive, negative, none)
  - Identifying outliers in bivariate data
  es:
  - Explorar relación entre dos variables continuas
  - Detectar correlaciones (positiva, negativa, ninguna)
  - Identificar valores atípicos en datos bivariados
avoid_when:
  en:
  - Categorical variables (use bar chart)
  - Time series (use line chart)
  es:
  - Variables categóricas (usar gráfico de barras)
  - Series temporales (usar gráfico de líneas)
applications:
  en:
  - Exploratory data analysis to quickly identify correlations, clusters, and outliers
    across multiple features in a dataset
  - Feature selection in machine learning by visually assessing variable relationships
    before modeling
  - Dataset overview and quality checking to understand distributions and detect anomalies
    in multivariate data
  es:
  - Exploratory data analysis to quickly identify correlations, clusters, and outliers
    across multiple features in a dataset
  - Feature selection in machine learning by visually assessing variable relationships
    before modeling
  - Dataset overview and quality checking to understand distributions and detect anomalies
    in multivariate data
