entity_type: ChartType
id: bar-grouped
name:
  en: Grouped Bar Chart
  es: Gráfico de Barras Agrupado
description:
  en: A grouped bar chart that displays multiple bars side-by-side for each category,
    enabling direct comparison of values across different groups within the same categorical
    dimension. This visualization excels at showing how different groups perform relative
    to each other across multiple categories, making patterns and differences immediately
    apparent. Grouped bar charts are essential for comparative analysis where you
    need to track multiple series against the same set of categories.
  es: A grouped bar chart that displays multiple bars side-by-side for each category,
    enabling direct comparison of values across different groups within the same categorical
    dimension. This visualization excels at showing how different groups perform relative
    to each other across multiple categories, making patterns and differences immediately
    apparent. Grouped bar charts are essential for comparative analysis where you
    need to track multiple series against the same set of categories.
aliases:
  en:
  - bar-grouped
  - bar grouped
  - grouped bar chart
  es:
  - bar-grouped
  - bar grouped
  - gráfico de barras agrupado
use_when:
  en:
  - Comparing values across categories
  - Showing rankings or distributions
  - Displaying discrete data
  es:
  - Comparar valores entre categorías
  - Mostrar rankings o distribuciones
  - Visualizar datos discretos
avoid_when:
  en:
  - Continuous data over time (use line chart)
  - Part-to-whole relationships (use pie)
  es:
  - Datos continuos en el tiempo (usar líneas)
  - Relaciones parte-todo (usar circular)
applications:
  en:
  - Comparing quarterly sales figures for multiple products across different regions
  - Visualizing survey responses across demographic groups (age, gender, location)
  - Displaying performance metrics for different teams or departments over several
    time periods
  es:
  - Comparing quarterly sales figures for multiple products across different regions
  - Visualizing survey responses across demographic groups (age, gender, location)
  - Displaying performance metrics for different teams or departments over several
    time periods
data_requirements:
  min_columns: 2
  max_columns: null
  column_types:
