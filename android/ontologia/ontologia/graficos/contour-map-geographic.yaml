entity_type: ChartType
id: contour-map-geographic
name:
  en: Contour Lines on Geographic Map
  es: Gráfico de Contorno
description:
  en: A contour map overlays isolines (lines of equal value) onto a geographic basemap,
    visualizing continuous spatial data such as elevation, temperature, or atmospheric
    pressure across real-world coordinates. Unlike basic contour plots that use abstract
    x/y coordinates, this plot anchors contours to latitude/longitude positions with
    geographic context like coastlines, borders, or terrain. It combines the precision
    of isoline visualization with spatial awareness, making it ideal for meteorological,
    topographic, and environmental applications.
  es: A contour map overlays isolines (lines of equal value) onto a geographic basemap,
    visualizing continuous spatial data such as elevation, temperature, or atmospheric
    pressure across real-world coordinates. Unlike basic contour plots that use abstract
    x/y coordinates, this plot anchors contours to latitude/longitude positions with
    geographic context like coastlines, borders, or terrain. It combines the precision
    of isoline visualization with spatial awareness, making it ideal for meteorological,
    topographic, and environmental applications.
