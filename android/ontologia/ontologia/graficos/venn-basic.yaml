entity_type: ChartType
id: venn-basic
name:
  en: Venn Diagram
  es: Diagrama de Venn Básico
description:
  en: A Venn diagram visualizes the logical relationships between two or three sets
    using overlapping circles. Each circle represents a set, and overlapping regions
    show elements shared between sets. This classic visualization is ideal for showing
    intersections, unions, and exclusive memberships, making abstract set relationships
    immediately intuitive.
  es: A Venn diagram visualizes the logical relationships between two or three sets
    using overlapping circles. Each circle represents a set, and overlapping regions
    show elements shared between sets. This classic visualization is ideal for showing
    intersections, unions, and exclusive memberships, making abstract set relationships
    immediately intuitive.
