entity_type: ChartType
id: scatter-pitch-events
name:
  en: Soccer Pitch Event Map
  es: Diagrama de Dispersión
description:
  en: A soccer pitch event map positions match events (passes, shots, tackles, interceptions)
    as markers on an accurately scaled football pitch diagram. The pitch is drawn
    with standard markings including penalty areas, center circle, goal areas, and
    halfway line. Each event type uses distinct markers and colors, with directional
    arrows for passes and shots. This visualization is essential for tactical match
    analysis, scouting, and coaching in football analytics.
  es: A soccer pitch event map positions match events (passes, shots, tackles, interceptions)
    as markers on an accurately scaled football pitch diagram. The pitch is drawn
    with standard markings including penalty areas, center circle, goal areas, and
    halfway line. Each event type uses distinct markers and colors, with directional
    arrows for passes and shots. This visualization is essential for tactical match
    analysis, scouting, and coaching in football analytics.
