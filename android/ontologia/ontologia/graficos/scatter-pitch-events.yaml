notes:
- Draw an accurate pitch outline with standard FIFA dimensions (105m × 68m) including
  penalty areas, goal areas, center circle, halfway line, corner arcs, and goal posts
- Use distinct marker shapes and colors for each event type (e.g., circles for passes,
  stars for shots, triangles for tackles, diamonds for interceptions)
- Encode outcome (successful/unsuccessful) via marker fill or opacity (e.g., filled
  vs hollow, or high vs low opacity)
