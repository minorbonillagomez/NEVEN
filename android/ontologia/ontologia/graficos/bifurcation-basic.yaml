entity_type: ChartType
id: bifurcation-basic
name:
  en: Bifurcation Diagram for Dynamical Systems
  es: Bifurcation Basic Básico
description:
  en: A bifurcation diagram shows how the steady-state behavior of a dynamical system
    changes as a control parameter varies. By plotting the long-term values of a state
    variable against a continuously varied parameter, it reveals transitions from
    stable fixed points through period-doubling cascades to chaotic regimes. The classic
    example is the logistic map, where the route to chaos is clearly visible as the
    growth rate parameter increases.
  es: A bifurcation diagram shows how the steady-state behavior of a dynamical system
    changes as a control parameter varies. By plotting the long-term values of a state
    variable against a continuously varied parameter, it reveals transitions from
    stable fixed points through period-doubling cascades to chaotic regimes. The classic
    example is the logistic map, where the route to chaos is clearly visible as the
    growth rate parameter increases.
