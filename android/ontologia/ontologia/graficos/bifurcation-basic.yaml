notes:
- Use very small point size (1px or smaller) with low alpha transparency to create
  density-based visualization
- Show the full period-doubling cascade from period-1 through period-2, period-4,
  etc., leading into chaos
- Use the logistic map x(n+1) = r * x(n) * (1 - x(n)) as the default example system
