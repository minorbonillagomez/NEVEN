entity_type: ChartType
id: line-filled
name:
  en: Filled Line Plot
  es: Gráfico de Líneas
description:
  en: A line plot with the area between the line and the baseline (typically x-axis)
    filled with a semi-transparent color. This creates an area chart effect for a
    single series, emphasizing the magnitude of values.
  es: A line plot with the area between the line and the baseline (typically x-axis)
    filled with a semi-transparent color. This creates an area chart effect for a
    single series, emphasizing the magnitude of values.
aliases:
  en:
  - line-filled
  - line filled
  - line chart
  es:
  - line-filled
  - line filled
  - gráfico de líneas
use_when:
  en:
  - Showing trends over time
  - Displaying continuous data changes
  - Comparing multiple series
  es:
  - Mostrar tendencias en el tiempo
  - Visualizar cambios en datos continuos
  - Comparar múltiples series
avoid_when:
  en: []
  es: []
applications:
  en:
  - Emphasizing magnitude of values over time
  - Volume or quantity visualization
  - Single series with area emphasis
  - Stock price or metric trends
  es:
  - Emphasizing magnitude of values over time
  - Volume or quantity visualization
  - Single series with area emphasis
  - Stock price or metric trends
data_requirements:
  min_columns: 2
  max_columns: null
  column_types:
  - numeric|temporal
  - numeric
  recommended_rows:
    min: 10
    max: 10000
