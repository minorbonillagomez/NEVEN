applications:
  en:
  - Equity or forex traders identifying trend direction and momentum using the cloud
    color and thickness
  - Technical analysts locating dynamic support and resistance zones formed by the
    Kumo
  - Swing traders spotting bullish/bearish crossover signals between Tenkan-sen and
    Kijun-sen
