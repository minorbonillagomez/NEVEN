entity_type: ChartType
id: indicator-ichimoku
name:
  en: Ichimoku Cloud Technical Indicator Chart
  es: Indicator Ichimoku
description:
  en: Displays the Ichimoku Kinko Hyo ("one glance equilibrium chart") overlay on
    a candlestick price chart. The indicator plots five lines — Tenkan-sen (conversion),
    Kijun-sen (base), Senkou Span A, Senkou Span B, and Chikou Span (lagging) — with
    the area between Senkou Span A and B filled as the "Kumo" (cloud). The cloud color
    changes depending on which span is on top, providing an at-a-glance view of trend
    direction, momentum, and support/resistance zones.
  es: Displays the Ichimoku Kinko Hyo ("one glance equilibrium chart") overlay on
    a candlestick price chart. The indicator plots five lines — Tenkan-sen (conversion),
    Kijun-sen (base), Senkou Span A, Senkou Span B, and Chikou Span (lagging) — with
    the area between Senkou Span A and B filled as the "Kumo" (cloud). The cloud color
    changes depending on which span is on top, providing an at-a-glance view of trend
    direction, momentum, and support/resistance zones.
