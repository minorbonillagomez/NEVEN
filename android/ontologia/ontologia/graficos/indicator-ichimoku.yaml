notes:
- The cloud (Kumo) should be filled between Senkou Span A and Senkou Span B, with
  a green/bullish tint when Span A > Span B and a red/bearish tint when Span B > Span
  A
- Tenkan-sen and Kijun-sen should be drawn as distinct colored lines over the candlestick
  chart
- Chikou Span should be plotted shifted 26 periods into the past
