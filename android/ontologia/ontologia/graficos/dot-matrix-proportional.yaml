entity_type: ChartType
id: dot-matrix-proportional
name:
  en: Dot Matrix Chart for Proportional Counts
  es: Dot Matrix Proportional
description:
  en: A dot matrix chart displays proportions using a grid of equally-sized dots where
    filled or colored dots represent counts out of a total. Each dot corresponds to
    one unit, making it intuitive to read "X out of N" statistics at a glance. Unlike
    waffle charts that use percentage-based squares, dot matrix charts emphasize absolute
    counts with variable grid sizes, excelling at risk communication and survey result
    visualization.
  es: A dot matrix chart displays proportions using a grid of equally-sized dots where
    filled or colored dots represent counts out of a total. Each dot corresponds to
    one unit, making it intuitive to read "X out of N" statistics at a glance. Unlike
    waffle charts that use percentage-based squares, dot matrix charts emphasize absolute
    counts with variable grid sizes, excelling at risk communication and survey result
    visualization.
