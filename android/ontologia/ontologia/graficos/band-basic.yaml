entity_type: ChartType
id: band-basic
name:
  en: Basic Band Plot
  es: Band Basic Básico
description:
  en: A band plot displays a filled region between two boundary lines, commonly used
    to show confidence intervals, prediction intervals, or ranges around a central
    trend line. The semi-transparent band provides visual representation of uncertainty
    or variability while maintaining visibility of underlying data or overlapping
    elements.
  es: A band plot displays a filled region between two boundary lines, commonly used
    to show confidence intervals, prediction intervals, or ranges around a central
    trend line. The semi-transparent band provides visual representation of uncertainty
    or variability while maintaining visibility of underlying data or overlapping
    elements.
