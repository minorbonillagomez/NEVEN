  - point-basic
  - point basic
  - basic point basic
  es:
  - point-basic
  - point basic
  - point basic básico
use_when:
  en:
  - A point estimate plot displays central tendency values (means, medians, or other
    estimates) with confidence intervals or error bars for each category. Each point
    represents the estimate, and the lines
  es:
  - A point estimate plot displays central tendency values (means, medians, or other
    estimates) with confidence intervals or error bars for each category. Each point
    represents the estimate, and the lines
avoid_when:
  en: []
  es: []
applications:
  en:
  - Comparing group means with statistical uncertainty
  - Displaying regression coefficients with confidence intervals
  - Treatment effect visualization in clinical trials
  - Survey results with margin of error
  - Meta-analysis effect size summaries
  es:
  - Comparing group means with statistical uncertainty
  - Displaying regression coefficients with confidence intervals
  - Treatment effect visualization in clinical trials
  - Survey results with margin of error
  - Meta-analysis effect size summaries
