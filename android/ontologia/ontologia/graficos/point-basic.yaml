entity_type: ChartType
id: point-basic
name:
  en: Point Estimate Plot
  es: Point Basic Básico
description:
  en: A point estimate plot displays central tendency values (means, medians, or other
    estimates) with confidence intervals or error bars for each category. Each point
    represents the estimate, and the lines extending from it show the uncertainty
    range.
  es: A point estimate plot displays central tendency values (means, medians, or other
    estimates) with confidence intervals or error bars for each category. Each point
    represents the estimate, and the lines extending from it show the uncertainty
    range.
aliases:
