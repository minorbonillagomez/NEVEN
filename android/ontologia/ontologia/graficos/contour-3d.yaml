entity_type: ChartType
id: contour-3d
name:
  en: 3D Contour Plot
  es: Gráfico de Contorno 3D
description:
  en: A 3D contour plot displays contour lines or filled contour bands on a three-dimensional
    surface, showing isolines of a function of two variables in 3D space. Unlike 2D
    contour plots that flatten the visualization, 3D contour plots preserve the surface
    geometry while highlighting level curves, making it easier to understand both
    the overall shape and specific value regions simultaneously. This visualization
    combines the spatial intuition of 3D surfaces with the precision of contour-based
    value identification.
  es: A 3D contour plot displays contour lines or filled contour bands on a three-dimensional
    surface, showing isolines of a function of two variables in 3D space. Unlike 2D
    contour plots that flatten the visualization, 3D contour plots preserve the surface
    geometry while highlighting level curves, making it easier to understand both
    the overall shape and specific value regions simultaneously. This visualization
    combines the spatial intuition of 3D surfaces with the precision of contour-based
    value identification.
