notes:
- Tiles may be squares or hexagons — both are valid approaches
- Color tiles using a sequential colormap for unipolar data or a diverging colormap
  when a meaningful midpoint exists
- Label each tile with the region abbreviation, ensuring text is legible against the
  tile color
