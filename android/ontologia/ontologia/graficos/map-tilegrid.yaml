applications:
  en:
  - Comparing US state-level election results without geographic area bias distorting
    the visual impression
  - Showing per-country statistics across Europe with each nation given equal visual
    weight regardless of land area
  - Displaying regional health metrics (vaccination rates, disease incidence) without
    geographic size distortion
  - Visualizing technology adoption rates or policy compliance across administrative
    regions
