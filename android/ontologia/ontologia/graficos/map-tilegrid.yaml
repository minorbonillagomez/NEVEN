entity_type: ChartType
id: map-tilegrid
name:
  en: Tile Grid Map for Equal-Area Geographic Comparison
  es: Mapa
description:
  en: A tile grid map represents geographic regions (states, countries, provinces)
    as equally-sized tiles — squares or hexagons — arranged to approximate their real-world
    geographic positions. Unlike choropleth maps where large-area regions dominate
    visually, every region receives identical visual weight, making tile grid maps
    ideal for per-capita or per-region comparisons where the statistic matters more
    than physical area. Tiles are colored by a data variable and labeled with region
    abbreviations for identification.
  es: A tile grid map represents geographic regions (states, countries, provinces)
    as equally-sized tiles — squares or hexagons — arranged to approximate their real-world
    geographic positions. Unlike choropleth maps where large-area regions dominate
    visually, every region receives identical visual weight, making tile grid maps
    ideal for per-capita or per-region comparisons where the statistic matters more
    than physical area. Tiles are colored by a data variable and labeled with region
    abbreviations for identification.
