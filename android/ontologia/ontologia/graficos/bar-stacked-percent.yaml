entity_type: ChartType
id: bar-stacked-percent
name:
  en: 100% Stacked Bar Chart
  es: Gráfico de Barras Apilado
description:
  en: A 100% stacked bar chart displays multiple data series as proportional segments
    within each bar, where every bar is normalized to sum to 100%. This visualization
    emphasizes composition and relative proportions rather than absolute values, making
    it ideal for comparing how different components contribute to a whole across categories.
    It reveals patterns in distribution and share that might be obscured when absolute
    values vary significantly between categories.
  es: A 100% stacked bar chart displays multiple data series as proportional segments
    within each bar, where every bar is normalized to sum to 100%. This visualization
    emphasizes composition and relative proportions rather than absolute values, making
    it ideal for comparing how different components contribute to a whole across categories.
    It reveals patterns in distribution and share that might be obscured when absolute
    values vary significantly between categories.
aliases:
