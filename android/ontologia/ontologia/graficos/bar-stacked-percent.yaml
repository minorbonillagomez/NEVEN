  es:
  - bar-stacked-percent
  - bar stacked percent
  - gráfico de barras apilado
use_when:
  en:
  - Comparing values across categories
  - Showing rankings or distributions
  - Displaying discrete data
  es:
  - Comparar valores entre categorías
  - Mostrar rankings o distribuciones
  - Visualizar datos discretos
avoid_when:
  en:
  - Continuous data over time (use line chart)
  - Part-to-whole relationships (use pie)
  es:
  - Datos continuos en el tiempo (usar líneas)
  - Relaciones parte-todo (usar circular)
applications:
  en:
  - Tracking market share evolution over time where each bar represents a time period
    and segments show competitor proportions
  - Analyzing survey response distributions where each question's responses are shown
    as percentage breakdowns
  - Comparing budget or resource allocation across departments where each bar shows
    proportional spending by category
  es:
  - Tracking market share evolution over time where each bar represents a time period
    and segments show competitor proportions
  - Analyzing survey response distributions where each question's responses are shown
    as percentage breakdowns
  - Comparing budget or resource allocation across departments where each bar shows
    proportional spending by category
