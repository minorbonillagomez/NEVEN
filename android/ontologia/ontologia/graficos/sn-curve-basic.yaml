notes:
- Both axes should use logarithmic scales for proper visualization of the wide range
  of values
- 'Include horizontal reference lines for key material properties: Ultimate Strength,
  Yield Strength, and Endurance Limit'
- 'The curve typically shows three distinct regions: low-cycle fatigue (plastic),
  high-cycle fatigue (elastic), and infinite life (below endurance limit)'
