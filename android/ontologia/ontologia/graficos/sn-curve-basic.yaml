entity_type: ChartType
id: sn-curve-basic
name:
  en: S-N Curve (Wöhler Curve)
  es: Sn Curve Basic
description:
  en: An S-N curve (also known as a Wöhler curve) visualizes the relationship between
    alternating stress amplitude and the number of cycles to failure for a material
    under fatigue loading. Both axes typically use logarithmic scales, with stress
    on the y-axis and cycle count on the x-axis. This plot is fundamental for predicting
    material fatigue life and identifying key material properties such as ultimate
    strength, yield strength, and endurance limit.
  es: An S-N curve (also known as a Wöhler curve) visualizes the relationship between
    alternating stress amplitude and the number of cycles to failure for a material
    under fatigue loading. Both axes typically use logarithmic scales, with stress
    on the y-axis and cycle count on the x-axis. This plot is fundamental for predicting
    material fatigue life and identifying key material properties such as ultimate
    strength, yield strength, and endurance limit.
