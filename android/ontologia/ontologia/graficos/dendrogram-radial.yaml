applications:
  en:
  - Displaying phylogenetic trees with hundreds of species in a compact circular form
  - Visualizing organizational hierarchies or reporting structures without excessive
    horizontal/vertical scrolling
  - Showing file system or taxonomy structures where many leaf nodes need to be visible
    simultaneously
  - Presenting clustering dendrograms for gene expression data with color-coded cluster
    assignments
