entity_type: ChartType
id: dendrogram-radial
name:
  en: Radial Dendrogram
  es: Dendrograma
description:
  en: A radial dendrogram renders hierarchical clustering in a circular layout where
    the root node sits at the center and branches extend outward, with leaf nodes
    arranged around the circumference. This layout is a space-efficient alternative
    to linear dendrograms for large hierarchies, making it well-suited for datasets
    with hundreds of leaves. Branch lengths are proportional to distance or dissimilarity,
    preserving the quantitative interpretation of cluster merges.
  es: A radial dendrogram renders hierarchical clustering in a circular layout where
    the root node sits at the center and branches extend outward, with leaf nodes
    arranged around the circumference. This layout is a space-efficient alternative
    to linear dendrograms for large hierarchies, making it well-suited for datasets
    with hundreds of leaves. Branch lengths are proportional to distance or dissimilarity,
    preserving the quantitative interpretation of cluster merges.
