entity_type: ChartType
id: curve-dose-response
name:
  en: Pharmacological Dose-Response Curve
  es: Curve Dose Response
description:
  en: A sigmoidal dose-response curve that plots biological response against drug
    concentration on a logarithmic x-axis, fitted using a four-parameter logistic
    (4PL) model. This visualization is essential for determining drug potency metrics
    such as EC50 (half-maximal effective concentration) or IC50 (half-maximal inhibitory
    concentration), Hill slope steepness, and upper/lower response asymptotes. It
    enables rapid visual comparison of compound efficacy and is a standard tool in
    pharmacological analysis.
  es: A sigmoidal dose-response curve that plots biological response against drug
    concentration on a logarithmic x-axis, fitted using a four-parameter logistic
    (4PL) model. This visualization is essential for determining drug potency metrics
    such as EC50 (half-maximal effective concentration) or IC50 (half-maximal inhibitory
    concentration), Hill slope steepness, and upper/lower response asymptotes. It
    enables rapid visual comparison of compound efficacy and is a standard tool in
    pharmacological analysis.
