notes:
- X-axis must use a logarithmic scale (log10 of concentration)
- 'Fit a 4-parameter logistic (4PL) sigmoid: response = Bottom + (Top - Bottom) /
  (1 + (EC50/concentration)^HillSlope)'
- Mark EC50/IC50 with dashed horizontal and vertical reference lines intersecting
  the curve at the half-maximal response
