entity_type: ChartType
id: arc-basic
name:
  en: Basic Arc Diagram
  es: Arc Basic Básico
description:
  en: An arc diagram arranges nodes along a single horizontal line and draws connections
    between them as curved arcs above the line. This layout excels at revealing patterns
    in sequential or ordered data while minimizing visual clutter compared to force-directed
    layouts. Arc height typically indicates the distance between connected nodes,
    making it easy to spot long-range versus short-range connections.
  es: An arc diagram arranges nodes along a single horizontal line and draws connections
    between them as curved arcs above the line. This layout excels at revealing patterns
    in sequential or ordered data while minimizing visual clutter compared to force-directed
    layouts. Arc height typically indicates the distance between connected nodes,
    making it easy to spot long-range versus short-range connections.
