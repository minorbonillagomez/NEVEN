entity_type: ChartType
id: bump-basic
name:
  en: Basic Bump Chart
  es: Bump Basic Básico
description:
  en: A bump chart visualizes how rankings change over time by plotting rank positions
    and connecting them with lines. Unlike line charts that show values, bump charts
    focus specifically on ordinal rankings, making it easy to track position changes,
    overtakes, and rank stability across time periods.
  es: A bump chart visualizes how rankings change over time by plotting rank positions
    and connecting them with lines. Unlike line charts that show values, bump charts
    focus specifically on ordinal rankings, making it easy to track position changes,
    overtakes, and rank stability across time periods.
