entity_type: ChartType
id: network-transport-static
name:
  en: Static Transport Network Diagram
  es: Grafo de Red
description:
  en: A directed network visualization for transportation systems where stations are
    displayed as labeled nodes and train/bus routes as directed edges. Edges display
    departure times, arrival times, and route identifiers. Designed for visualizing
    timetables, route maps, and connection patterns in rail, bus, or flight networks.
    This static version focuses on clear, readable presentation without interactive
    repositioning.
  es: A directed network visualization for transportation systems where stations are
    displayed as labeled nodes and train/bus routes as directed edges. Edges display
    departure times, arrival times, and route identifiers. Designed for visualizing
    timetables, route maps, and connection patterns in rail, bus, or flight networks.
    This static version focuses on clear, readable presentation without interactive
    repositioning.
