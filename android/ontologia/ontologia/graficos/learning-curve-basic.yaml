applications:
  en:
  - Diagnosing underfitting (high bias) when both training and validation scores are
    low
  - Diagnosing overfitting (high variance) when training score is high but validation
    score is low with a large gap
  - Determining if collecting more training data would improve model performance
  - Judging one model's learning behavior, as a base for comparing architectures
