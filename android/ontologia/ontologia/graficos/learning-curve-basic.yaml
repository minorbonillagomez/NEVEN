entity_type: ChartType
id: learning-curve-basic
name:
  en: Model Learning Curve
  es: Learning Curve Basic
description:
  en: A learning curve visualizes model performance (training and validation scores)
    as a function of training set size. It is essential for diagnosing bias vs variance
    tradeoffs, determining whether collecting more data would improve model performance,
    and guiding model selection decisions. The plot typically shows two lines with
    shaded confidence bands representing variability across cross-validation folds.
  es: A learning curve visualizes model performance (training and validation scores)
    as a function of training set size. It is essential for diagnosing bias vs variance
    tradeoffs, determining whether collecting more data would improve model performance,
    and guiding model selection decisions. The plot typically shows two lines with
    shaded confidence bands representing variability across cross-validation folds.
