entity_type: ChartType
id: bubble-map-geographic
name:
  en: Bubble Map with Sized Geographic Markers
  es: Gráfico de Burbujas
description:
  en: A geographic bubble map where markers are sized proportionally to quantitative
    data values at each location. Unlike scatter maps where size is optional, bubble
    maps use marker size as the primary visual encoding to show data magnitude across
    geographic regions. This visualization makes it immediately apparent where high
    and low values occur spatially, enabling intuitive comparison of quantities across
    locations.
  es: A geographic bubble map where markers are sized proportionally to quantitative
    data values at each location. Unlike scatter maps where size is optional, bubble
    maps use marker size as the primary visual encoding to show data magnitude across
    geographic regions. This visualization makes it immediately apparent where high
    and low values occur spatially, enabling intuitive comparison of quantities across
    locations.
