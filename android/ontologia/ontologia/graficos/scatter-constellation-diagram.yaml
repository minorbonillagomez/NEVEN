entity_type: ChartType
id: scatter-constellation-diagram
name:
  en: Digital Modulation Constellation Diagram
  es: Diagrama de Dispersión
description:
  en: An I/Q (In-phase/Quadrature) scatter plot showing symbol positions of a digitally
    modulated signal. Ideal constellation points are displayed as reference markers
    with received symbols scattered around them, revealing modulation quality and
    signal impairments such as noise, phase offset, and amplitude distortion. This
    plot is the standard diagnostic tool for evaluating digital modulation schemes
    like 16-QAM.
  es: An I/Q (In-phase/Quadrature) scatter plot showing symbol positions of a digitally
    modulated signal. Ideal constellation points are displayed as reference markers
    with received symbols scattered around them, revealing modulation quality and
    signal impairments such as noise, phase offset, and amplitude distortion. This
    plot is the standard diagnostic tool for evaluating digital modulation schemes
    like 16-QAM.
aliases:
  en:
  - scatter-constellation-diagram
  - scatter constellation diagram
  - scatter plot
  es:
  - scatter-constellation-diagram
  - scatter constellation diagram
  - diagrama de dispersión
use_when:
  en:
  - Exploring relationship between two continuous variables
  - Detecting correlations (positive, negative, none)
  - Identifying outliers in bivariate data
  es:
  - Explorar relación entre dos variables continuas
  - Detectar correlaciones (positiva, negativa, ninguna)
  - Identificar valores atípicos en datos bivariados
avoid_when:
  en:
  - Categorical variables (use bar chart)
  - Time series (use line chart)
  es:
  - Variables categóricas (usar gráfico de barras)
  - Series temporales (usar gráfico de líneas)
applications:
  en:
  - 'Wireless communications engineering: assessing modulation quality and signal
    integrity for QAM/PSK/APSK schemes'
  - 'Software-defined radio development: debugging demodulator performance and carrier
    recovery'
  - 'Standards compliance testing: verifying transmitter conformance for Wi-Fi, 5G
    NR, and DVB specifications'
  - 'Radar signal processing: analyzing digitally modulated waveform fidelity'
  es:
  - 'Wireless communications engineering: assessing modulation quality and signal
    integrity for QAM/PSK/APSK schemes'
  - 'Software-defined radio development: debugging demodulator performance and carrier
