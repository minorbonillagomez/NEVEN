notes:
- The upper-left triangle contains actual/observed values; the lower-right triangle
  contains projected values
- Use distinct visual styling (e.g., different background colors or hatching) to clearly
  differentiate actual from projected cells
- The diagonal from top-right to bottom-left represents the latest evaluation date
