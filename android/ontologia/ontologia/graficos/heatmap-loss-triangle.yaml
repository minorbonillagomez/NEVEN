entity_type: ChartType
id: heatmap-loss-triangle
name:
  en: Actuarial Loss Development Triangle
  es: Mapa de Calor
description:
  en: A triangular matrix visualization showing cumulative insurance claim payments
    developing over time. Rows represent accident/origin years, columns represent
    development periods (e.g., 1-10 years), with the upper-left triangle displaying
    actual observed cumulative claims and the lower-right triangle showing projected/estimated
    values (IBNR). This plot is essential for actuarial reserving, enabling analysts
    to visualize the chain-ladder method and identify development patterns in loss
    data.
  es: A triangular matrix visualization showing cumulative insurance claim payments
    developing over time. Rows represent accident/origin years, columns represent
    development periods (e.g., 1-10 years), with the upper-left triangle displaying
    actual observed cumulative claims and the lower-right triangle showing projected/estimated
    values (IBNR). This plot is essential for actuarial reserving, enabling analysts
    to visualize the chain-ladder method and identify development patterns in loss
    data.
