notes:
- 'Arrange leads in standard clinical 3x4 grid layout: rows (I, aVR, V1, V4), (II,
  aVL, V2, V5), (III, aVF, V3, V6)'
- Optionally include a full-length Lead II rhythm strip across the bottom
- 'Grid background should use standard ECG paper styling: light lines at 1mm intervals,
  bold lines at 5mm intervals, with a distinct paper-like color (light red/pink or
  light orange); on a dark background keep the ruling red or pink, muted or deepened
  to stay visible yet subordinate, over the theme background or a faintly red-tinted
  panel'
