entity_type: ChartType
id: ecg-twelve-lead
name:
  en: ECG/EKG 12-Lead Waveform Display
  es: Ecg Twelve Lead
description:
  en: A multi-channel electrocardiogram display showing the 12 standard ECG leads
    arranged in clinical format. Each lead displays realistic P-QRS-T wave complexes
    on a medical-standard grid background with calibration markers. This visualization
    replicates the familiar layout used in hospitals and clinics worldwide, making
    it immediately recognizable to healthcare professionals and useful for medical
    education.
  es: A multi-channel electrocardiogram display showing the 12 standard ECG leads
    arranged in clinical format. Each lead displays realistic P-QRS-T wave complexes
    on a medical-standard grid background with calibration markers. This visualization
    replicates the familiar layout used in hospitals and clinics worldwide, making
    it immediately recognizable to healthcare professionals and useful for medical
    education.
