entity_type: ChartType
id: titration-curve
name:
  en: Acid-Base Titration Curve
  es: Titration Curve
description:
  en: A titration curve plotting pH against volume of titrant added, producing the
    characteristic S-shaped (sigmoidal) curve used in analytical chemistry. The plot
    reveals buffer regions, equivalence points, and acid/base strength at a glance.
    Essential for chemistry education and laboratory analysis, it helps identify when
    a reaction reaches completion and which indicators are appropriate.
  es: A titration curve plotting pH against volume of titrant added, producing the
    characteristic S-shaped (sigmoidal) curve used in analytical chemistry. The plot
    reveals buffer regions, equivalence points, and acid/base strength at a glance.
    Essential for chemistry education and laboratory analysis, it helps identify when
    a reaction reaches completion and which indicators are appropriate.
