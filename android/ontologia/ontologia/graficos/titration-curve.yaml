notes:
- Mark the equivalence point with a vertical dashed line and text annotation showing
  the volume and pH
- Include an optional derivative curve (dpH/dV) as a secondary y-axis overlay to precisely
  locate the equivalence point as the maximum of the derivative
- For a weak acid or base titration, shade the buffer region (typically the area around
  pH = pKa ± 1) with a semi-transparent fill; a strong acid/strong base titration
  has none, so leave it unshaded or shade only a region labeled for what it is, never
  called a buffer
