entity_type: ChartType
id: confusion-matrix
name:
  en: Confusion Matrix Heatmap
  es: Matriz de Confusión
description:
  en: A specialized heatmap visualization for evaluating classification model performance,
    displaying the counts or proportions of predicted vs actual class labels. The
    confusion matrix reveals true positives, false positives, true negatives, and
    false negatives at a glance, making it essential for understanding model behavior,
    identifying class imbalances, and diagnosing specific misclassification patterns.
  es: A specialized heatmap visualization for evaluating classification model performance,
    displaying the counts or proportions of predicted vs actual class labels. The
    confusion matrix reveals true positives, false positives, true negatives, and
    false negatives at a glance, making it essential for understanding model behavior,
    identifying class imbalances, and diagnosing specific misclassification patterns.
