entity_type: ChartType
id: pie-basic
name:
  en: Basic Pie Chart
  es: Gráfico Circular Básico
description:
  en: A pie chart showing proportions of categorical data as slices of a circle. Each
    slice represents a category's contribution to the whole, with the angle proportional
    to its value. Essential for visualizing parts-to-whole relationships in a simple,
    intuitive format.
  es: A pie chart showing proportions of categorical data as slices of a circle. Each
    slice represents a category's contribution to the whole, with the angle proportional
    to its value. Essential for visualizing parts-to-whole relationships in a simple,
    intuitive format.
aliases:
  en:
  - pie-basic
  - pie basic
  - basic pie chart
  es:
  - pie-basic
  - pie basic
  - gráfico circular básico
use_when:
  en:
  - Showing part-to-whole relationships
  - Displaying composition with few categories (≤6)
  - Emphasizing proportions
  es:
  - Mostrar relaciones parte-todo
  - Visualizar composición con pocas categorías (≤6)
  - Enfatizar proporciones
avoid_when:
  en:
  - Many categories (>6)
  - Comparing values (use bar)
  es:
  - Muchas categorías (>6)
  - Comparar valores (usar barras)
applications:
  en:
  - Market share distribution across competitors
  - Budget allocation by department
  - Survey response breakdown
  - Resource utilization by category
  es:
  - Market share distribution across competitors
  - Budget allocation by department
  - Survey response breakdown
  - Resource utilization by category
data_requirements:
  min_columns: 2
  max_columns: null
  column_types:
  - categorical
  - numeric
  recommended_rows:
    min: 2
    max: 10
