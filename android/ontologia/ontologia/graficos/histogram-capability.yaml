use_when:
  en:
  - Showing frequency distribution of continuous data
  - Understanding data shape (normal, skewed, bimodal)
  - Identifying common values and outliers
  es:
  - Mostrar distribución de frecuencia de datos continuos
  - Entender la forma de los datos (normal, sesgada, bimodal)
  - Identificar valores comunes y atípicos
avoid_when:
  en: []
  es: []
applications:
  en:
  - 'Manufacturing quality control: evaluating whether machined part dimensions fall
    within engineering tolerances'
  - 'Pharmaceutical batch release: verifying that tablet weights or active ingredient
    concentrations meet regulatory specifications'
  - 'Six Sigma process improvement: measuring baseline process performance (Cp/Cpk)
    before and after optimization'
  - 'Semiconductor fabrication: assessing wafer thickness uniformity against specification
    limits'
  es:
