notes:
- 'Cp and Cpk should be calculated from the data: Cp = (USL - LSL) / (6 * sigma),
  Cpk = min((USL - mean) / (3 * sigma), (mean - LSL) / (3 * sigma))'
- The normal distribution curve should be fitted using the sample mean and standard
  deviation
- LSL and USL lines should be visually distinct (e.g., red dashed) from the target
  line (e.g., green dashed)
