entity_type: ChartType
id: mosaic-categorical
name:
  en: Mosaic Plot for Categorical Association Analysis
  es: Mosaic Categorical
description:
  en: A mosaic plot visualizes contingency tables by dividing a rectangular area into
    smaller rectangles whose areas are proportional to cell frequencies. This statistical
    visualization technique effectively shows relationships and associations between
    two categorical variables, making it easy to identify patterns, dependencies,
    and deviations from expected frequencies in cross-tabulated data.
  es: A mosaic plot visualizes contingency tables by dividing a rectangular area into
    smaller rectangles whose areas are proportional to cell frequencies. This statistical
    visualization technique effectively shows relationships and associations between
    two categorical variables, making it easy to identify patterns, dependencies,
    and deviations from expected frequencies in cross-tabulated data.
