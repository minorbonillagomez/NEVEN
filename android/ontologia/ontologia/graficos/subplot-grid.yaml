entity_type: ChartType
id: subplot-grid
name:
  en: Subplot Grid Layout
  es: Subplot Grid
description:
  en: A customizable grid of multiple subplots allowing different plot types in each
    cell, with shared or independent axes. Unlike faceted plots that repeat the same
    visualization for data subsets, subplot grids enable combining distinct visualizations
    (scatter, line, bar, histogram, etc.) into a cohesive multi-panel figure for comprehensive
    data presentation.
  es: A customizable grid of multiple subplots allowing different plot types in each
    cell, with shared or independent axes. Unlike faceted plots that repeat the same
    visualization for data subsets, subplot grids enable combining distinct visualizations
    (scatter, line, bar, histogram, etc.) into a cohesive multi-panel figure for comprehensive
    data presentation.
