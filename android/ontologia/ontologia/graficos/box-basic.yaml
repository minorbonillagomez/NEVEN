entity_type: ChartType
id: box-basic
name:
  en: Basic Box Plot
  es: Diagrama de Caja Básico
description:
  en: A box plot (box-and-whisker plot) showing the distribution of numerical data
    through quartiles. Displays the median, first and third quartiles as a box, with
    whiskers extending to show the data range. Essential for comparing distributions
    across categories and identifying outliers.
  es: A box plot (box-and-whisker plot) showing the distribution of numerical data
    through quartiles. Displays the median, first and third quartiles as a box, with
    whiskers extending to show the data range. Essential for comparing distributions
    across categories and identifying outliers.
aliases:
  en:
  - box-basic
  - box basic
  - basic box plot
  es:
  - box-basic
  - box basic
  - diagrama de caja básico
use_when:
  en:
  - Comparing distributions across groups
  - Identifying outliers and spread
  - Showing median, quartiles, and range
  es:
  - Comparar distribuciones entre grupos
  - Identificar valores atípicos y dispersión
  - Mostrar mediana, cuartiles y rango
avoid_when:
  en: []
  es: []
applications:
  en:
  - Comparing salary distributions across departments
  - Analyzing test score distributions by class
  - 'Quality control: comparing measurements across production batches'
  - 'Research: comparing experimental groups'
  es:
  - Comparing salary distributions across departments
  - Analyzing test score distributions by class
  - 'Quality control: comparing measurements across production batches'
  - 'Research: comparing experimental groups'
