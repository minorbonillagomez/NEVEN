entity_type: ChartType
id: network-hierarchical
name:
  en: Hierarchical Network Graph with Tree Layout
  es: Grafo de Red
description:
  en: A hierarchical network graph organizes nodes in distinct levels from root to
    leaves, with edges showing parent-child relationships between levels. Unlike force-directed
    layouts that optimize for aesthetic spacing, hierarchical layouts explicitly encode
    tree structure by positioning nodes at fixed vertical or horizontal levels. This
    visualization reveals organizational depth, branching patterns, and the overall
    tree structure at a glance.
  es: A hierarchical network graph organizes nodes in distinct levels from root to
    leaves, with edges showing parent-child relationships between levels. Unlike force-directed
    layouts that optimize for aesthetic spacing, hierarchical layouts explicitly encode
    tree structure by positioning nodes at fixed vertical or horizontal levels. This
    visualization reveals organizational depth, branching patterns, and the overall
    tree structure at a glance.
