notes:
- Each variable should be normalized to a common scale (0-1) before mapping to facial
  features
- 'Common feature mappings: face width, face height, eye size, eye spacing, eyebrow
  slant, nose length, mouth curvature, mouth width'
- Grid layout recommended for comparing multiple faces side by side
