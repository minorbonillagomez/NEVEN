entity_type: ChartType
id: scatter-3d
name:
  en: 3D Scatter Plot
  es: Diagrama de Dispersión 3D
description:
  en: A three-dimensional scatter plot that displays the relationship between three
    numeric variables by plotting points in 3D space. This visualization extends the
    classic 2D scatter plot to reveal patterns, clusters, and correlations across
    three dimensions simultaneously, making it invaluable for multivariate data exploration.
  es: A three-dimensional scatter plot that displays the relationship between three
    numeric variables by plotting points in 3D space. This visualization extends the
    classic 2D scatter plot to reveal patterns, clusters, and correlations across
    three dimensions simultaneously, making it invaluable for multivariate data exploration.
aliases:
  en:
  - scatter-3d
  - scatter 3d
  - 3d scatter plot
  es:
  - scatter-3d
  - scatter 3d
  - diagrama de dispersión 3d
use_when:
  en:
  - Exploring relationship between two continuous variables
  - Detecting correlations (positive, negative, none)
  - Identifying outliers in bivariate data
  es:
  - Explorar relación entre dos variables continuas
  - Detectar correlaciones (positiva, negativa, ninguna)
  - Identificar valores atípicos en datos bivariados
avoid_when:
  en:
  - Categorical variables (use bar chart)
  - Time series (use line chart)
  es:
  - Variables categóricas (usar gráfico de barras)
  - Series temporales (usar gráfico de líneas)
applications:
  en:
  - Exploring relationships in multivariate datasets with three continuous variables
  - Visualizing molecular structures and spatial coordinates in scientific research
  - Identifying clusters in 3D feature spaces for machine learning analysis
  es:
  - Exploring relationships in multivariate datasets with three continuous variables
  - Visualizing molecular structures and spatial coordinates in scientific research
  - Identifying clusters in 3D feature spaces for machine learning analysis
data_requirements:
  min_columns: 2
  max_columns: null
  column_types:
