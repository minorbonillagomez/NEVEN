entity_type: ChartType
id: flowmap-origin-destination
name:
  en: Origin-Destination Flow Map
  es: Flowmap Origin Destination
description:
  en: An origin-destination flow map visualizes movement or transfer between geographic
    locations using curved arcs overlaid on a map. Each arc connects an origin point
    to a destination point, with line thickness proportional to the flow magnitude.
    This visualization excels at revealing spatial patterns in migration, trade, or
    travel data, making it easy to identify major corridors, hub locations, and directional
    imbalances in movement between places.
  es: An origin-destination flow map visualizes movement or transfer between geographic
    locations using curved arcs overlaid on a map. Each arc connects an origin point
    to a destination point, with line thickness proportional to the flow magnitude.
    This visualization excels at revealing spatial patterns in migration, trade, or
    travel data, making it easy to identify major corridors, hub locations, and directional
    imbalances in movement between places.
