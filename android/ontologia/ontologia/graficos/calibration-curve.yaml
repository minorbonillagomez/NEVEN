applications:
  en:
  - Evaluating probability predictions in credit scoring models where accurate risk
    estimates determine loan pricing
  - Assessing diagnostic confidence in medical screening systems where probability
    calibration affects treatment decisions
  - Comparing calibration across multiple classifiers to select models that produce
    reliable probability estimates
  - Validating risk assessment models in insurance and fraud detection where miscalibrated
    probabilities lead to financial losses
