notes:
- Include a diagonal reference line representing perfect calibration (predicted probability
  = observed frequency)
- Use 10 bins by default, with bin edges at equal probability intervals (0.0-0.1,
  0.1-0.2, etc.)
- Display Brier score or Expected Calibration Error (ECE) as a summary metric
