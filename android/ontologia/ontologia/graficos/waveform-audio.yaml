applications:
  en:
  - 'Audio engineering: inspecting recordings in DAWs to identify clipping, silence
    gaps, or dynamic range issues'
  - 'Speech analysis: visualizing spoken utterances for phonetic segmentation and
    timing analysis'
  - 'Seismology: displaying seismogram traces to identify earthquake P-wave and S-wave
    arrivals'
  - 'Biomedical signal processing: reviewing EEG or EMG waveforms for diagnostic patterns'
