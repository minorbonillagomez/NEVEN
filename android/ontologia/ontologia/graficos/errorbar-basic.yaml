entity_type: ChartType
id: errorbar-basic
name:
  en: Basic Error Bar Plot
  es: Errorbar Basic Básico
description:
  en: An error bar plot displays data points with associated uncertainty or variability
    represented by bars extending above and below (or left and right of) each point.
    Error bars commonly represent standard deviation, standard error, confidence intervals,
    or min/max ranges. This visualization is essential for communicating the reliability
    and precision of measurements or statistical estimates.
  es: An error bar plot displays data points with associated uncertainty or variability
    represented by bars extending above and below (or left and right of) each point.
    Error bars commonly represent standard deviation, standard error, confidence intervals,
    or min/max ranges. This visualization is essential for communicating the reliability
    and precision of measurements or statistical estimates.
