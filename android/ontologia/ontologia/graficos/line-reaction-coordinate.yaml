entity_type: ChartType
id: line-reaction-coordinate
name:
  en: Reaction Coordinate Energy Diagram
  es: Gráfico de Líneas
description:
  en: A reaction coordinate diagram plots potential energy against reaction progress,
    showing the energy landscape of a chemical transformation. The smooth curve traces
    the path from reactants through the transition state (energy maximum) to products,
    clearly depicting the activation energy barrier and overall enthalpy change. This
    fundamental chemistry visualization is essential for understanding reaction kinetics
    and thermodynamics.
  es: A reaction coordinate diagram plots potential energy against reaction progress,
    showing the energy landscape of a chemical transformation. The smooth curve traces
    the path from reactants through the transition state (energy maximum) to products,
    clearly depicting the activation energy barrier and overall enthalpy change. This
    fundamental chemistry visualization is essential for understanding reaction kinetics
    and thermodynamics.
