avoid_when:
  en: []
  es: []
applications:
  en:
  - Teaching activation energy and transition state theory in general chemistry courses
  - Comparing catalyzed vs uncatalyzed reaction pathways to illustrate how catalysts
    lower activation energy
  - Illustrating exothermic vs endothermic reactions by showing the relative energy
    levels of reactants and products
  - Visualizing multi-step reaction mechanisms with intermediate species and multiple
    energy barriers
  es:
  - Teaching activation energy and transition state theory in general chemistry courses
  - Comparing catalyzed vs uncatalyzed reaction pathways to illustrate how catalysts
    lower activation energy
  - Illustrating exothermic vs endothermic reactions by showing the relative energy
