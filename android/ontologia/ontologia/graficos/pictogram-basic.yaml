notes:
- Each icon should represent a consistent unit value (e.g., 1 icon = 10 units); display
  a legend indicating this
- Partial icons (e.g., half-filled) should represent fractional remainders
- Icons should be arranged in a grid-like row for each category, aligned left for
  easy comparison
