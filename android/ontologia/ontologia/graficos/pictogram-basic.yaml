applications:
  en:
  - Comparing population counts across countries using person icons, where each icon
    represents 1 million people
  - Showing annual production volumes of different crops using crop-specific symbols
    in an agricultural report
  - Visualizing survey results (e.g., customer satisfaction ratings) with star or
    smiley icons for a marketing dashboard
