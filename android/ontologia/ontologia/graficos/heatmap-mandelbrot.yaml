entity_type: ChartType
id: heatmap-mandelbrot
name:
  en: Mandelbrot Set Fractal Visualization
  es: Mapa de Calor
description:
  en: A visualization of the Mandelbrot set, the most iconic fractal in mathematics.
    Each pixel represents a complex number c on the complex plane, colored by how
    quickly the iteration z(n+1) = z(n)^2 + c diverges. The boundary between convergent
    and divergent regions reveals infinitely complex, self-similar structure including
    the characteristic cardioid and period-2 bulb.
  es: A visualization of the Mandelbrot set, the most iconic fractal in mathematics.
    Each pixel represents a complex number c on the complex plane, colored by how
    quickly the iteration z(n+1) = z(n)^2 + c diverges. The boundary between convergent
    and divergent regions reveals infinitely complex, self-similar structure including
    the characteristic cardioid and period-2 bulb.
