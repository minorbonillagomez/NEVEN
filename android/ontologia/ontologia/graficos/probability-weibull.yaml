entity_type: ChartType
id: probability-weibull
name:
  en: Weibull Probability Plot for Reliability Analysis
  es: Probability Weibull
description:
  en: A Weibull probability plot displays failure or lifetime data on Weibull probability
    paper (logarithmic x-axis for time/cycles, linearized Weibull CDF on y-axis) with
    a fitted straight line. It is the standard tool in reliability engineering for
    estimating Weibull distribution parameters (shape and scale), assessing whether
    data follow a Weibull distribution, and extrapolating failure probabilities. The
    slope of the fitted line gives the shape parameter (beta), while the characteristic
    life (eta) is read at the 63.2% failure probability crossing.
  es: A Weibull probability plot displays failure or lifetime data on Weibull probability
    paper (logarithmic x-axis for time/cycles, linearized Weibull CDF on y-axis) with
    a fitted straight line. It is the standard tool in reliability engineering for
    estimating Weibull distribution parameters (shape and scale), assessing whether
    data follow a Weibull distribution, and extrapolating failure probabilities. The
    slope of the fitted line gives the shape parameter (beta), while the characteristic
    life (eta) is read at the 63.2% failure probability crossing.
