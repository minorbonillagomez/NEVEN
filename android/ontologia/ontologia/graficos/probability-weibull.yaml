notes:
- X-axis should use a logarithmic scale; y-axis should use a linearized Weibull scale
  (ln(-ln(1-F))) so that Weibull-distributed data plots as a straight line
- Display the fitted line with annotated shape parameter (beta) and scale parameter
  (eta)
- Use median rank approximation (i-0.3)/(n+0.4) for plotting positions
