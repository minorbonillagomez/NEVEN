applications:
  en:
  - Predicting product warranty returns by fitting field-failure data and extrapolating
    to future time periods
  - Comparing fatigue-life distributions of two material batches to determine which
    has higher reliability
  - Estimating B10 life (time at which 10% of units fail) for bearing or component
    qualification testing
