entity_type: ChartType
id: qrcode-basic
name:
  en: Basic QR Code Generator
  es: Qrcode Basic Básico
description:
  en: A QR (Quick Response) code visualization that encodes text or URL data into
    a square matrix barcode pattern. QR codes are two-dimensional barcodes that store
    information in a grid of black and white squares, readable by smartphones and
    dedicated scanners. This visualization is useful for generating scannable codes
    for quick data sharing and mobile access.
  es: A QR (Quick Response) code visualization that encodes text or URL data into
    a square matrix barcode pattern. QR codes are two-dimensional barcodes that store
    information in a grid of black and white squares, readable by smartphones and
    dedicated scanners. This visualization is useful for generating scannable codes
    for quick data sharing and mobile access.
