entity_type: ChartType
id: horizon-basic
name:
  en: Horizon Chart
  es: Horizon Basic Básico
description:
  en: A horizon chart displays many time series compactly by folding values into color-coded
    bands, preserving local resolution while minimizing vertical space. It divides
    the y-axis into bands and uses color intensity to encode magnitude, allowing dozens
    of series to be compared in limited space. This technique is particularly effective
    when monitoring many metrics simultaneously where traditional line charts would
    become unreadable.
  es: A horizon chart displays many time series compactly by folding values into color-coded
    bands, preserving local resolution while minimizing vertical space. It divides
    the y-axis into bands and uses color intensity to encode magnitude, allowing dozens
    of series to be compared in limited space. This technique is particularly effective
    when monitoring many metrics simultaneously where traditional line charts would
    become unreadable.
