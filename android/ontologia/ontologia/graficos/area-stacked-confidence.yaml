entity_type: ChartType
id: area-stacked-confidence
name:
  en: Stacked Area Chart with Confidence Bands
  es: Gráfico de Área Apilado
description:
  en: A stacked area chart that displays multiple data series as cumulative areas,
    with each series surrounded by uncertainty or confidence bands. This visualization
    combines the composition insight of stacked areas with the statistical rigor of
    confidence intervals, making it ideal for showing how parts contribute to a whole
    while simultaneously communicating uncertainty in each component. The bands reveal
    where estimates are precise versus uncertain across the stacked series.
  es: A stacked area chart that displays multiple data series as cumulative areas,
    with each series surrounded by uncertainty or confidence bands. This visualization
    combines the composition insight of stacked areas with the statistical rigor of
    confidence intervals, making it ideal for showing how parts contribute to a whole
    while simultaneously communicating uncertainty in each component. The bands reveal
    where estimates are precise versus uncertain across the stacked series.
