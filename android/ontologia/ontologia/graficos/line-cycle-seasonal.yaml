entity_type: ChartType
id: line-cycle-seasonal
name:
  en: Cycle Plot (Seasonal Subseries)
  es: Gráfico de Líneas
description:
  en: A cycle plot, also known as a seasonal subseries plot (introduced by William
    Cleveland), separates the seasonal pattern of a time series from the trend within
    each season. The series is split by seasonal period (e.g. one group per month
    or weekday); within each group the values are drawn in chronological order as
    a small line, and a horizontal reference line marks that group's mean. Comparing
    the mean lines across groups reveals the seasonal effect, while the slope of each
    subseries reveals the trend within that season — two patterns that are entangled
    in a standard time series plot.
  es: A cycle plot, also known as a seasonal subseries plot (introduced by William
    Cleveland), separates the seasonal pattern of a time series from the trend within
    each season. The series is split by seasonal period (e.g. one group per month
    or weekday); within each group the values are drawn in chronological order as
    a small line, and a horizontal reference line marks that group's mean. Comparing
    the mean lines across groups reveals the seasonal effect, while the slope of each
    subseries reveals the trend within that season — two patterns that are entangled
    in a standard time series plot.
