applications:
  en:
  - Analyzing monthly retail sales to see which months are seasonally strongest (mean
    differences) and whether each month is growing or shrinking year over year (within-group
    slope)
  - Examining electricity demand by hour-of-day or day-of-week to isolate recurring
    usage cycles from long-term growth
  - Studying climate records (e.g. average temperature by month across many years)
    to distinguish the annual cycle from warming trends within individual months
  es:
