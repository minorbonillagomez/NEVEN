notes:
- Lay seasonal groups left to right along the x-axis (Jan, Feb, ... or Mon, Tue, ...);
  within each group plot the chronological subseries as a thin connected line
- Draw a horizontal reference line at each group's mean spanning the width of that
  group — these mean lines are the key visual for comparing seasons
- Keep a shared y-axis across all groups so heights are directly comparable; separate
  groups with subtle gaps or light vertical dividers
