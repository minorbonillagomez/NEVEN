entity_type: ChartType
id: violin-swarm
name:
  en: Violin Plot with Overlaid Swarm Points
  es: Diagrama de Violín
description:
  en: A violin plot with individual data points overlaid as a swarm plot, combining
    smooth kernel density estimation with raw data visibility. The violin shape shows
    the distribution density while the swarm points reveal actual observations, enabling
    viewers to see both the overall distribution pattern and individual data values
    simultaneously. This hybrid approach provides maximum transparency, showing exactly
    how many observations exist at each level while maintaining the smooth distribution
    visualization.
  es: A violin plot with individual data points overlaid as a swarm plot, combining
    smooth kernel density estimation with raw data visibility. The violin shape shows
    the distribution density while the swarm points reveal actual observations, enabling
    viewers to see both the overall distribution pattern and individual data values
    simultaneously. This hybrid approach provides maximum transparency, showing exactly
    how many observations exist at each level while maintaining the smooth distribution
    visualization.
