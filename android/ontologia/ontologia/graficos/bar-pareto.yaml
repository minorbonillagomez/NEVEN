entity_type: ChartType
id: bar-pareto
name:
  en: Pareto Chart with Cumulative Line
  es: Gráfico de Barras
description:
  en: A Pareto chart combining descending-sorted bars (by frequency or count) with
    a cumulative percentage line overlay on a secondary y-axis. This visualization
    helps identify the most significant factors in a dataset by applying the Pareto
    principle (80/20 rule), making it one of the "7 Basic Tools of Quality" in Six
    Sigma and quality management. It reveals which categories contribute the most
    to an overall effect, enabling data-driven prioritization.
  es: A Pareto chart combining descending-sorted bars (by frequency or count) with
    a cumulative percentage line overlay on a secondary y-axis. This visualization
    helps identify the most significant factors in a dataset by applying the Pareto
    principle (80/20 rule), making it one of the "7 Basic Tools of Quality" in Six
    Sigma and quality management. It reveals which categories contribute the most
    to an overall effect, enabling data-driven prioritization.
aliases:
  en:
  - bar-pareto
  - bar pareto
  - bar chart
  es:
  - bar-pareto
  - bar pareto
  - gráfico de barras
use_when:
  en:
  - Comparing values across categories
  - Showing rankings or distributions
  - Displaying discrete data
  es:
  - Comparar valores entre categorías
  - Mostrar rankings o distribuciones
  - Visualizar datos discretos
avoid_when:
  en:
  - Continuous data over time (use line chart)
  - Part-to-whole relationships (use pie)
  es:
  - Datos continuos en el tiempo (usar líneas)
  - Relaciones parte-todo (usar circular)
applications:
  en:
  - 'Quality control: identifying the most frequent defect types in a manufacturing
    process to prioritize corrective actions'
  - 'Business operations: analyzing customer complaint categories to focus improvement
    efforts on the highest-impact areas'
  - 'Six Sigma: performing root cause analysis by ranking failure modes by frequency
    during DMAIC projects'
  es:
  - 'Quality control: identifying the most frequent defect types in a manufacturing
    process to prioritize corrective actions'
  - 'Business operations: analyzing customer complaint categories to focus improvement
    efforts on the highest-impact areas'
  - 'Six Sigma: performing root cause analysis by ranking failure modes by frequency
    during DMAIC projects'
