entity_type: ChartType
id: alluvial-basic
name:
  en: Basic Alluvial Diagram
  es: Alluvial Basic Básico
description:
  en: An alluvial diagram visualizes how entities flow or transition between discrete
    categories across multiple time points or ordered stages. Unlike general Sankey
    diagrams, alluvial diagrams enforce strict vertical ordering where each column
    represents a specific time step or category dimension. Bands connect related segments
    to show how proportions shift over time, making it ideal for tracking structural
    changes, migrations, and transitions in categorical data.
  es: An alluvial diagram visualizes how entities flow or transition between discrete
    categories across multiple time points or ordered stages. Unlike general Sankey
    diagrams, alluvial diagrams enforce strict vertical ordering where each column
    represents a specific time step or category dimension. Bands connect related segments
    to show how proportions shift over time, making it ideal for tracking structural
    changes, migrations, and transitions in categorical data.
