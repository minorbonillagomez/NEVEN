entity_type: ChartType
id: contour-decision-boundary
name:
  en: Decision Boundary Classifier Visualization
  es: Gráfico de Contorno
description:
  en: A decision boundary visualization showing how a classifier partitions 2D feature
    space into predicted class regions. Colored regions indicate the predicted class
    at each point in the feature space, with training data points overlaid to show
    how well the classifier separates different classes. This visualization is essential
    for understanding classifier behavior, identifying decision boundaries, and evaluating
    classification accuracy in machine learning.
  es: A decision boundary visualization showing how a classifier partitions 2D feature
    space into predicted class regions. Colored regions indicate the predicted class
    at each point in the feature space, with training data points overlaid to show
    how well the classifier separates different classes. This visualization is essential
    for understanding classifier behavior, identifying decision boundaries, and evaluating
    classification accuracy in machine learning.
