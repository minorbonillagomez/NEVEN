applications:
  en:
  - Evaluating the performance of classification algorithms (SVM, KNN, logistic regression,
    decision trees) on 2D data
  - Teaching machine learning concepts by visualizing how different classifiers create
    decision boundaries
  - Comparing classifier complexity and potential overfitting by examining boundary
    smoothness
  - Debugging classification models by identifying misclassified training samples
