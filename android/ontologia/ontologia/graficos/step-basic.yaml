entity_type: ChartType
id: step-basic
name:
  en: Basic Step Plot
  es: Step Basic Básico
description:
  en: A step plot (also known as a stair plot or stepped line chart) displays data
    using horizontal lines connected by vertical lines, creating a stair-step pattern.
    Unlike line charts that interpolate between points, step plots show values as
    constant until the next change occurs. This makes them ideal for visualizing data
    that changes at discrete intervals, emphasizing the exact moments when values
    change.
  es: A step plot (also known as a stair plot or stepped line chart) displays data
    using horizontal lines connected by vertical lines, creating a stair-step pattern.
    Unlike line charts that interpolate between points, step plots show values as
    constant until the next change occurs. This makes them ideal for visualizing data
    that changes at discrete intervals, emphasizing the exact moments when values
    change.
