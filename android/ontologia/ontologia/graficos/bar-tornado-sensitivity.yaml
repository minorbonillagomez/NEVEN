entity_type: ChartType
id: bar-tornado-sensitivity
name:
  en: Tornado Diagram for Sensitivity Analysis
  es: Gráfico de Barras
description:
  en: A horizontal bar chart where bars are sorted by influence magnitude, extending
    left and right from a base case vertical reference line. Each bar represents one
    input parameter and shows how varying that parameter between its low and high
    values affects the output, creating a characteristic tornado shape (widest bars
    at top, narrowest at bottom). Dual colors distinguish low-input from high-input
    effects, making it immediately clear which parameters drive the most uncertainty.
  es: A horizontal bar chart where bars are sorted by influence magnitude, extending
    left and right from a base case vertical reference line. Each bar represents one
    input parameter and shows how varying that parameter between its low and high
    values affects the output, creating a characteristic tornado shape (widest bars
    at top, narrowest at bottom). Dual colors distinguish low-input from high-input
    effects, making it immediately clear which parameters drive the most uncertainty.
aliases:
  en:
  - bar-tornado-sensitivity
  - bar tornado sensitivity
  - bar chart
  es:
  - bar-tornado-sensitivity
  - bar tornado sensitivity
  - gráfico de barras
use_when:
  en:
  - Comparing values across categories
  - Showing rankings or distributions
  - Displaying discrete data
  es:
  - Comparar valores entre categorías
  - Mostrar rankings o distribuciones
  - Visualizar datos discretos
avoid_when:
  en:
  - Continuous data over time (use line chart)
  - Part-to-whole relationships (use pie)
  es:
  - Datos continuos en el tiempo (usar líneas)
  - Relaciones parte-todo (usar circular)
applications:
  en:
  - 'Financial modeling: identifying which assumptions (discount rate, growth rate,
    costs) most affect net present value'
  - 'Risk analysis: performing one-way sensitivity analysis to rank uncertainty drivers
    in project cost or schedule estimates'
  - 'Engineering design: determining which design parameters have the greatest impact
    on system performance'
  - 'Consulting and stakeholder communication: presenting sensitivity results in an
    intuitive, ranked format'
  es:
  - 'Financial modeling: identifying which assumptions (discount rate, growth rate,
    costs) most affect net present value'
  - 'Risk analysis: performing one-way sensitivity analysis to rank uncertainty drivers
    in project cost or schedule estimates'
  - 'Engineering design: determining which design parameters have the greatest impact
    on system performance'
  - 'Consulting and stakeholder communication: presenting sensitivity results in an
    intuitive, ranked format'
