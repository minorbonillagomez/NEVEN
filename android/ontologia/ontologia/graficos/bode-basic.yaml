notes:
- Dual-panel layout with magnitude plot on top and phase plot on bottom, sharing a
  common logarithmic frequency axis
- Mark gain margin (dB above 0 dB at phase crossover frequency) and phase margin (degrees
  above -180 at gain crossover frequency) with annotations
- Draw reference lines at 0 dB on the magnitude plot and -180 on the phase plot
