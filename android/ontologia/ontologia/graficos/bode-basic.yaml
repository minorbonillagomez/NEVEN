entity_type: ChartType
id: bode-basic
name:
  en: Bode Plot for Frequency Response
  es: Bode Basic Básico
description:
  en: 'A Bode plot displays a system''s frequency response as two vertically aligned
    panels: magnitude (in decibels) on top and phase (in degrees) on the bottom, both
    plotted against frequency on a shared logarithmic scale. This visualization is
    fundamental in control systems engineering and signal processing for analyzing
    how a system responds to sinusoidal inputs across a range of frequencies, revealing
    stability characteristics, bandwidth, and resonance behavior.'
  es: 'A Bode plot displays a system''s frequency response as two vertically aligned
    panels: magnitude (in decibels) on top and phase (in degrees) on the bottom, both
    plotted against frequency on a shared logarithmic scale. This visualization is
    fundamental in control systems engineering and signal processing for analyzing
    how a system responds to sinusoidal inputs across a range of frequencies, revealing
    stability characteristics, bandwidth, and resonance behavior.'
