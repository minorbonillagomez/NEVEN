notes:
- Default lag = 1, but the implementation should support configurable lag values (e.g.,
  1, 7, 12)
- Include a diagonal reference line (y = x) to help assess whether the series is uncorrelated
- Optionally color points by their time index to reveal temporal structure within
  the scatter
