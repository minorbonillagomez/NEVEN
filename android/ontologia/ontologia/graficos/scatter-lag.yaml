entity_type: ChartType
id: scatter-lag
name:
  en: Lag Plot for Time Series Autocorrelation Diagnosis
  es: Diagrama de Dispersión
description:
  en: A lag plot is a scatter plot of a time series against a lagged version of itself,
    plotting y(t) on the x-axis versus y(t+k) on the y-axis for a given lag order
    k. If the data is purely random, points scatter uniformly with no visible structure;
    if autocorrelation is present, distinctive patterns emerge — linear clusters for
    autoregressive processes, elliptical shapes for seasonal data. This provides a
    quick visual diagnostic for time series dependence, complementing numerical tools
    like ACF/PACF.
  es: A lag plot is a scatter plot of a time series against a lagged version of itself,
    plotting y(t) on the x-axis versus y(t+k) on the y-axis for a given lag order
    k. If the data is purely random, points scatter uniformly with no visible structure;
    if autocorrelation is present, distinctive patterns emerge — linear clusters for
    autoregressive processes, elliptical shapes for seasonal data. This provides a
    quick visual diagnostic for time series dependence, complementing numerical tools
    like ACF/PACF.
aliases:
  en:
  - scatter-lag
  - scatter lag
  - scatter plot
  es:
  - scatter-lag
  - scatter lag
  - diagrama de dispersión
use_when:
  en:
  - Exploring relationship between two continuous variables
  - Detecting correlations (positive, negative, none)
  - Identifying outliers in bivariate data
  es:
  - Explorar relación entre dos variables continuas
  - Detectar correlaciones (positiva, negativa, ninguna)
  - Identificar valores atípicos en datos bivariados
avoid_when:
  en:
  - Categorical variables (use bar chart)
  - Time series (use line chart)
  es:
  - Variables categóricas (usar gráfico de barras)
  - Series temporales (usar gráfico de líneas)
applications:
  en:
  - Checking for autocorrelation before applying regression models that assume independent
    residuals
  - Diagnosing stationarity and serial dependence in financial return series
  - Identifying seasonal or cyclical patterns in sensor and environmental monitoring
    data
  - Validating residual independence after fitting ARIMA or other time series models
  es:
  - Checking for autocorrelation before applying regression models that assume independent
    residuals
  - Diagnosing stationarity and serial dependence in financial return series
  - Identifying seasonal or cyclical patterns in sensor and environmental monitoring
    data
  - Validating residual independence after fitting ARIMA or other time series models
