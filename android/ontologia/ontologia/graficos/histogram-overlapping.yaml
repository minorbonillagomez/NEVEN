  es:
  - histogram-overlapping
  - histogram overlapping
  - histograma
use_when:
  en:
  - Showing frequency distribution of continuous data
  - Understanding data shape (normal, skewed, bimodal)
  - Identifying common values and outliers
  es:
  - Mostrar distribución de frecuencia de datos continuos
  - Entender la forma de los datos (normal, sesgada, bimodal)
  - Identificar valores comunes y atípicos
avoid_when:
  en: []
  es: []
applications:
  en:
  - Comparing test score distributions between control and treatment groups in A/B
    testing
  - Analyzing salary distributions across different departments or job levels
  - Visualizing before/after measurement changes in clinical trials or process improvements
  es:
  - Comparing test score distributions between control and treatment groups in A/B
