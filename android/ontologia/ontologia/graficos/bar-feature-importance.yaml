entity_type: ChartType
id: bar-feature-importance
name:
  en: Feature Importance Bar Chart
  es: Gráfico de Barras
description:
  en: A horizontal bar chart displaying feature importances from machine learning
    models, with features sorted by importance value and bars colored by a gradient
    to emphasize relative contribution. This visualization is essential for model
    interpretability, helping data scientists and stakeholders understand which features
    drive model predictions. The horizontal orientation allows for readable feature
    names of varying lengths.
  es: A horizontal bar chart displaying feature importances from machine learning
    models, with features sorted by importance value and bars colored by a gradient
    to emphasize relative contribution. This visualization is essential for model
    interpretability, helping data scientists and stakeholders understand which features
    drive model predictions. The horizontal orientation allows for readable feature
    names of varying lengths.
aliases:
  en:
  - bar-feature-importance
  - bar feature importance
  - bar chart
  es:
  - bar-feature-importance
  - bar feature importance
  - gráfico de barras
use_when:
  en:
  - Comparing values across categories
  - Showing rankings or distributions
  - Displaying discrete data
  es:
  - Comparar valores entre categorías
  - Mostrar rankings o distribuciones
  - Visualizar datos discretos
avoid_when:
  en:
  - Continuous data over time (use line chart)
  - Part-to-whole relationships (use pie)
  es:
  - Datos continuos en el tiempo (usar líneas)
  - Relaciones parte-todo (usar circular)
applications:
  en:
  - Explaining random forest or gradient boosting model decisions to stakeholders
  - Feature selection by identifying low-importance variables for removal
  - Model debugging by detecting unexpected high-importance features that may indicate
    data leakage
  es:
  - Explaining random forest or gradient boosting model decisions to stakeholders
  - Feature selection by identifying low-importance variables for removal
  - Model debugging by detecting unexpected high-importance features that may indicate
    data leakage
