  - histogram-epidemic
  - histogram epidemic
  - histogram
  es:
  - histogram-epidemic
  - histogram epidemic
  - histograma
use_when:
  en:
  - Showing frequency distribution of continuous data
  - Understanding data shape (normal, skewed, bimodal)
  - Identifying common values and outliers
  es:
  - Mostrar distribución de frecuencia de datos continuos
  - Entender la forma de los datos (normal, sesgada, bimodal)
  - Identificar valores comunes y atípicos
avoid_when:
  en: []
  es: []
applications:
  en:
  - Tracking disease outbreaks and identifying transmission patterns (e.g., foodborne
    illness traced to a single event)
  - Monitoring pandemic progression such as COVID-19 or influenza waves across regions
  - Determining outbreak source type and estimating incubation periods from curve
    shape
  - Public health reporting and real-time surveillance dashboards
  es:
  - Tracking disease outbreaks and identifying transmission patterns (e.g., foodborne
    illness traced to a single event)
  - Monitoring pandemic progression such as COVID-19 or influenza waves across regions
  - Determining outbreak source type and estimating incubation periods from curve
    shape
  - Public health reporting and real-time surveillance dashboards
