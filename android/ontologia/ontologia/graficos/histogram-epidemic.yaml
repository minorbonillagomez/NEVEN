entity_type: ChartType
id: histogram-epidemic
name:
  en: Epidemic Curve (Epi Curve)
  es: Histograma
description:
  en: 'An epidemic curve (epi curve) is a histogram showing the number of new disease
    cases over time, plotted by date of symptom onset. The shape of the curve reveals
    the outbreak pattern: a sharp peak indicates a point source, successive waves
    suggest propagated transmission, and a plateau indicates continuous exposure.
    It is fundamental to epidemiological investigation and public health surveillance.'
  es: 'An epidemic curve (epi curve) is a histogram showing the number of new disease
    cases over time, plotted by date of symptom onset. The shape of the curve reveals
    the outbreak pattern: a sharp peak indicates a point source, successive waves
    suggest propagated transmission, and a plateau indicates continuous exposure.
    It is fundamental to epidemiological investigation and public health surveillance.'
aliases:
