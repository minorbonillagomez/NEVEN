notes:
- Use daily bins for short outbreaks (< 3 months) and weekly bins for longer epidemics
- Stack bars by case classification (confirmed, probable, suspect) using distinct
  colors
- Mark key intervention events (e.g., lockdown start, vaccination campaign) with annotated
  vertical lines
