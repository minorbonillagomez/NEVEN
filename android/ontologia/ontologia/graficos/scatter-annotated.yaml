entity_type: ChartType
id: scatter-annotated
name:
  en: Annotated Scatter Plot with Text Labels
  es: Diagrama de Dispersión
description:
  en: A scatter plot where each data point can have a text label annotation, useful
    for identifying specific points of interest. This visualization enhances basic
    scatter plots by adding contextual information directly on the chart, making it
    easy to highlight outliers, named entities, or key data points that deserve special
    attention.
  es: A scatter plot where each data point can have a text label annotation, useful
    for identifying specific points of interest. This visualization enhances basic
    scatter plots by adding contextual information directly on the chart, making it
    easy to highlight outliers, named entities, or key data points that deserve special
    attention.
aliases:
  en:
  - scatter-annotated
  - scatter annotated
  - scatter plot
  es:
  - scatter-annotated
  - scatter annotated
  - diagrama de dispersión
use_when:
  en:
  - Exploring relationship between two continuous variables
  - Detecting correlations (positive, negative, none)
  - Identifying outliers in bivariate data
  es:
  - Explorar relación entre dos variables continuas
  - Detectar correlaciones (positiva, negativa, ninguna)
  - Identificar valores atípicos en datos bivariados
avoid_when:
  en:
  - Categorical variables (use bar chart)
  - Time series (use line chart)
  es:
  - Variables categóricas (usar gráfico de barras)
  - Series temporales (usar gráfico de líneas)
applications:
  en:
  - Labeling company names on a market cap vs. revenue scatter plot
  - Identifying outlier cities in a population vs. area analysis
  - Annotating key experiments in a scientific study comparing two measurements
  - Highlighting top performers in a sales vs. customer satisfaction comparison
  es:
  - Labeling company names on a market cap vs. revenue scatter plot
  - Identifying outlier cities in a population vs. area analysis
  - Annotating key experiments in a scientific study comparing two measurements
  - Highlighting top performers in a sales vs. customer satisfaction comparison
data_requirements:
  min_columns: 2
  max_columns: null
  column_types:
  - numeric
  - numeric
  recommended_rows:
    min: 20
    max: 5000
