entity_type: ChartType
id: mohr-circle
name:
  en: Mohr's Circle for Stress Analysis
  es: Mohr Circle
description:
  en: Mohr's Circle is a graphical method used to determine principal stresses, maximum
    shear stress, and stress transformations from a given 2D stress state. A circle
    is drawn on a normal stress (σ) vs. shear stress (τ) plane, with the center at
    ((σx + σy) / 2, 0) and a radius derived from the stress components. It is an essential
    tool in mechanical and civil engineering for visualizing how stress components
    change under coordinate rotation.
  es: Mohr's Circle is a graphical method used to determine principal stresses, maximum
    shear stress, and stress transformations from a given 2D stress state. A circle
    is drawn on a normal stress (σ) vs. shear stress (τ) plane, with the center at
    ((σx + σy) / 2, 0) and a radius derived from the stress components. It is an essential
    tool in mechanical and civil engineering for visualizing how stress components
    change under coordinate rotation.
