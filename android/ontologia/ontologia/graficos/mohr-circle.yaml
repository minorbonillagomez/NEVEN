notes:
- Draw the circle with center at ((σx + σy) / 2, 0) and radius √(((σx − σy) / 2)²
  + τxy²)
- Mark the principal stresses (σ1, σ2) where the circle intersects the horizontal
  axis
- Show maximum shear stress (τ_max) at the top and bottom of the circle
