notes:
- Use a half-circle (180 degrees) or three-quarter (270 degrees) layout to leave room
  for a legend or title area
- Draw concentric rings with clear boundary lines and label each ring with its time-horizon
  name
- Divide the angular space into equal sectors with labeled sector headers along the
  outer edge
