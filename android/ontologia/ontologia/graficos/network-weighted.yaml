applications:
  en:
  - Analyzing trade flows between countries where thicker edges represent higher export/import
    volumes
  - Visualizing communication patterns in organizations where edge weight shows message
    frequency between teams
  - Mapping collaboration networks in research where thickness indicates number of
    co-authored papers
  - Displaying transportation networks where edge weight represents passenger volume
    or freight capacity
