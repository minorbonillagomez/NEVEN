entity_type: ChartType
id: network-weighted
name:
  en: Weighted Network Graph with Edge Thickness
  es: Grafo de Red
description:
  en: A weighted network graph displays relationships between entities using edge
    thickness to represent connection strength or weight. Unlike basic network graphs
    where edges are uniform, the varying line widths immediately communicate the relative
    importance of each relationship. This visualization makes it easy to identify
    strong vs weak connections, central hubs with many heavy links, and structural
    patterns in weighted relational data.
  es: A weighted network graph displays relationships between entities using edge
    thickness to represent connection strength or weight. Unlike basic network graphs
    where edges are uniform, the varying line widths immediately communicate the relative
    importance of each relationship. This visualization makes it easy to identify
    strong vs weak connections, central hubs with many heavy links, and structural
    patterns in weighted relational data.
