entity_type: ChartType
id: area-cumulative-flow
name:
  en: Cumulative Flow Diagram for Workflow Analytics
  es: Gráfico de Área
description:
  en: A cumulative flow diagram (CFD) displays the cumulative count of items in each
    workflow stage as stacked areas over time. Each band represents a stage (e.g.,
    Backlog, In Progress, Done), and the vertical distance between two adjacent band
    boundaries shows the number of items currently in that stage (work-in-progress).
    This is a key visualization in Lean and Agile project management for identifying
    bottlenecks, monitoring throughput, and assessing flow efficiency across a delivery
    pipeline.
  es: A cumulative flow diagram (CFD) displays the cumulative count of items in each
    workflow stage as stacked areas over time. Each band represents a stage (e.g.,
    Backlog, In Progress, Done), and the vertical distance between two adjacent band
    boundaries shows the number of items currently in that stage (work-in-progress).
    This is a key visualization in Lean and Agile project management for identifying
    bottlenecks, monitoring throughput, and assessing flow efficiency across a delivery
    pipeline.
