notes:
- 'Stages must be stacked in workflow order: earliest stage (e.g., Backlog) on top,
  latest stage (e.g., Done) on bottom'
- The vertical distance between two adjacent band boundaries represents the number
  of items currently in that stage (WIP)
- Cumulative counts are monotonically non-decreasing; each stage's count should always
  be greater than or equal to the count of the next stage in the workflow
