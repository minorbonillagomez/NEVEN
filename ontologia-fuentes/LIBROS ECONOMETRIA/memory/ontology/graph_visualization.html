<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ontología de Econometría & ML — NEVEN</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    :root {
      --bg-main: #141518;
      --bg-panel: #1a1b1f;
      --bg-card: #212328;
      --border-subtle: #2d3037;
      --border-focus: #3e424c;
      --text-primary: #e6e8ec;
      --text-secondary: #9da3af;
      --text-muted: #656a76;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
    }
    #network { flex: 1; height: 100%; }
    #sidebar {
      width: 380px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .sidebar-header h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .search-box {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 8px 12px;
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 13px;
    }
    .stats {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      background: var(--bg-card);
      padding: 4px 8px;
      border-radius: 4px;
    }
    .stat-color {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .stat-label { color: var(--text-secondary); }
    .stat-count { color: var(--text-primary); font-weight: 600; }
    #node-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .node-item {
      padding: 10px 12px;
      margin-bottom: 4px;
      background: var(--bg-card);
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .node-item:hover {
      border-color: var(--border-focus);
    }
    .node-item-name {
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 2px;
    }
    .node-item-type {
      font-size: 10px;
      color: var(--text-muted);
    }
    #detail-panel {
      padding: 16px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-card);
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    #detail-panel h3 {
      font-size: 13px;
      margin-bottom: 8px;
    }
    #detail-panel p {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .controls {
      position: absolute;
      bottom: 20px;
      right: 400px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .control-btn {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .control-btn:hover {
      background: var(--bg-card);
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div id="network"></div>
  
  <div id="sidebar">
    <div class="sidebar-header">
      <h2>🧠 Ontología Econometría & ML</h2>
      <div class="search-box">
        <input type="text" id="search" placeholder="Buscar entidad...">
      </div>
    </div>
    
    <div class="stats">
      <div class="stat-item"><span class="stat-color" style="background:#7ea8be"></span><span class="stat-label">Method</span><span class="stat-count">68</span></div><div class="stat-item"><span class="stat-color" style="background:#d9ab7e"></span><span class="stat-label">Concept</span><span class="stat-count">51</span></div><div class="stat-item"><span class="stat-color" style="background:#78a1a8"></span><span class="stat-label">RFunction</span><span class="stat-count">48</span></div><div class="stat-item"><span class="stat-color" style="background:#e879a9"></span><span class="stat-label">StatisticalTest</span><span class="stat-count">41</span></div><div class="stat-item"><span class="stat-color" style="background:#8eb897"></span><span class="stat-label">RPackage</span><span class="stat-count">38</span></div><div class="stat-item"><span class="stat-color" style="background:#14b8a6"></span><span class="stat-label">Dataset</span><span class="stat-count">19</span></div><div class="stat-item"><span class="stat-color" style="background:#d98e94"></span><span class="stat-label">Assumption</span><span class="stat-count">16</span></div><div class="stat-item"><span class="stat-color" style="background:#aa98b5"></span><span class="stat-label">Framework</span><span class="stat-count">10</span></div>
    </div>
    
    <div id="node-list"></div>
    
    <div id="detail-panel">
      <h3 id="detail-name"></h3>
      <p id="detail-desc"></p>
    </div>
  </div>
  
  <div class="controls">
    <button class="control-btn" onclick="network.fit()">🔍 Fit</button>
    <button class="control-btn" onclick="togglePhysics()">⚡ Physics</button>
    <button class="control-btn" onclick="filterByType()">🏷️ Filter</button>
  </div>

lor": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "RPackage", "fullName": "MASS", "description": ""}, {"id": "rpkg_nnet", "label": "nnet", "title": "<b>nnet</b><br><i>RPackage</i><br>", "color": {"background": "#8eb897", "border": "#8eb897", "highlight": {"background": "#fff", "border": "#8eb897"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "RPackage", "fullName": "nnet", "description": ""}, {"id": "assumption_homoscedasticity", "label": "Homoscedasticity (Gauss-Markov...", "title": "<b>Homoscedasticity (Gauss-Markov)</b><br><i>Assumption</i><br>Supuesto clásico de varianza constante condicional de las perturbaciones: Var(u_i | X_i) = sigma^2.", "color": {"background": "#d98e94", "border": "#d98e94", "highlight": {"background": "#fff", "border": "#d98e94"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Assumption", "fullName": "Homoscedasticity (Gauss-Markov)", "description": "Supuesto clásico de varianza constante condicional de las perturbaciones: Var(u_i | X_i) = sigma^2."}, {"id": "assumption_no_multicollinearity", "label": "No Perfect Multicollinearity (...", "title": "<b>No Perfect Multicollinearity (Gauss-Markov)</b><br><i>Assumption</i><br>Exige que ninguna variable explicativa sea combinación lineal exacta de otras covariables, garantizando rank(X) = k + 1.", "color": {"background": "#d98e94", "border": "#d98e94", "highlight": {"background": "#fff", "border": "#d98e94"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Assumption", "fullName": "No Perfect Multicollinearity (Gauss-Markov)", "description": "Exige que ninguna variable explicativa sea combinación lineal exacta de otras covariables, garantizando rank(X) = k + 1."}, {"id": "assumption_strict_exogeneity", "label": "Strict Exogeneity in Panel Dat...", "title": "<b>Strict Exogeneity in Panel Data</b><br><i>Assumption</i><br>Condición E[u_it | X_i1, ..., X_iT, c_i] = 0 que exige que los errores transitorios sean ortogonales a las covariables en todos los periodos pasados, presentes y futuros.", "color": {"background": "#d98e94", "border": "#d98e94", "highlight": {"background": "#fff", "border": "#d98e94"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Assumption", "fullName": "Strict Exogeneity in Panel Data", "description": "Condición E[u_it | X_i1, ..., X_iT, c_i] = 0 que exige que los errores transitorios sean ortogonales a las covariables en todos los periodos pasados, presentes y futuros."}, {"id": "assumption_parallel_trends", "label": "Parallel Trends (Diferencias-e...", "title": "<b>Parallel Trends (Diferencias-en-Diferencias)</b><br><i>Assumption</i><br>Supuesto contrafáctico de que, en ausencia de intervención, la trayectoria temporal media del resultado en el grupo tratado habría evolucionado en paralelo a la del grupo de control.", "color": {"background": "#d98e94", "border": "#d98e94", "highlight": {"background": "#fff", "border": "#d98e94"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Assumption", "fullName": "Parallel Trends (Diferencias-en-Diferencias)", "description": "Supuesto contrafáctico de que, en ausencia de intervención, la trayectoria temporal media del resultado en el grupo tratado habría evolucionado en paralelo a la del grupo de control."}, {"id": "assumption_positivity", "label": "Positivity / Overlap", "title": "<b>Positivity / Overlap</b><br><i>Assumption</i><br>Condición según la cual todo individuo tiene probabilidad estrictamente positiva y no unitaria de recibir cualquier nivel de tratamiento dado su conjunto de covariables: 0 < P(A=1|X) < 1.", "color": {"background": "#d98e94", "border": "#d98e94", "highlight": {"background": "#fff", "border": "#d98e94"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Assumption", "fullName": "Positivity / Overlap", "description": "Condición según la cual todo individuo tiene probabilidad estrictamente positiva y no unitaria de recibir cualquier nivel de tratamiento dado su conjunto de covariables: 0 < P(A=1|X) < 1."}, {"id": "assumption_ignorability", "label": "Conditional Ignorability / Exc...", "title": "<b>Conditional Ignorability / Exchangeability</b><br><i>Assumption</i><br>Supuesto fundamental de que, condicionado a las covariables medidas X, la asignación del tratamiento es independiente de los resultados potenciales: (Y(1), Y(0)) ⊥ A | X.", "color": {"background": "#d98e94", "border": "#d98e94", "highlight": {"background": "#fff", "border": "#d98e94"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Assumption", "fullName": "Conditional Ignorability / Exchangeability", "description": "Supuesto fundamental de que, condicionado a las covariables medidas X, la asignación del tratamiento es independiente de los resultados potenciales: (Y(1), Y(0)) ⊥ A | X."}, {"id": "assumption_sutva", "label": "SUTVA (Stable Unit Treatment V...", "title": "<b>SUTVA (Stable Unit Treatment Value Assumption)</b><br><i>Assumption</i><br>Supuesto que estipula dos condiciones: 1) No interferencia (el tratamiento de una unidad no afecta los resultados de otras), y 2) No variaciones ocultas en la dosis del tratamiento.", "color": {"background": "#d98e94", "border": "#d98e94", "highlight": {"background": "#fff", "border": "#d98e94"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Assumption", "fullName": "SUTVA (Stable Unit Treatment Value Assumption)", "description": "Supuesto que estipula dos condiciones: 1) No interferencia (el tratamiento de una unidad no afecta los resultados de otras), y 2) No variaciones ocultas en la dosis del tratamiento."}, {"id": "assumption_instrument_relevance", "label": "Instrument Relevance (Relevanc...", "title": "<b>Instrument Relevance (Relevancia del Instrumento)</b><br><i>Assumption</i><br>Condición de primer estadio en Variables Instrumentales que exige Cov(z, x | W) != 0, verificada formalmente con un estadístico F de primer estadio > 10.", "color": {"background": "#d98e94", "border": "#d98e94", "highlight": {"background": "#fff", "border": "#d98e94"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Assumption", "fullName": "Instrument Relevance (Relevancia del Instrumento)", "description": "Condición de primer estadio en Variables Instrumentales que exige Cov(z, x | W) != 0, verificada formalmente con un estadístico F de primer estadio > 10."}, {"id": "assumption_exclusion_restriction", "label": "Exclusion Restriction (Restric...", "title": "<b>Exclusion Restriction (Restricción de Exclusión)</b><br><i>Assumption</i><br>Exige que el instrumento z no tenga efecto directo sobre la variable dependiente y excepto a través de su impacto en el regresor endógeno: Cov(z, u) = 0.", "color": {"background": "#d98e94", "border": "#d98e94", "highlight": {"background": "#fff", "border": "#d98e94"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Assumption", "fullName": "Exclusion Restriction (Restricción de Exclusión)", "description": "Exige que el instrumento z no tenga efecto directo sobre la variable dependiente y excepto a través de su impacto en el regresor endógeno: Cov(z, u) = 0."}, {"id": "assumption_unit_root_absence", "label": "Stationarity & Absence of Unit...", "title": "<b>Stationarity & Absence of Unit Roots</b><br><i>Assumption</i><br>Condición de que las raíces de la ecuación característica autorregresiva se encuentren estrictamente fuera del círculo unitario (|z| > 1).", "color": {"background": "#d98e94", "border": "#d98e94", "highlight": {"background": "#fff", "border": "#d98e94"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Assumption", "fullName": "Stationarity & Absence of Unit Roots", "description": "Condición de que las raíces de la ecuación característica autorregresiva se encuentren estrictamente fuera del círculo unitario (|z| > 1)."}, {"id": "concept_multicollinearity", "label": "Multicollinearity (Multicoline...", "title": "<b>Multicollinearity (Multicolinealidad)</b><br><i>Concept</i><br>Fuerte correlación lineal entre variables explicativas que infla la varianza muestral de los estimadores MCO: Var(beta_j) = sigma^2 / [SST_j * (1 - R_j^2)].", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Multicollinearity (Multicolinealidad)", "description": "Fuerte correlación lineal entre variables explicativas que infla la varianza muestral de los estimadores MCO: Var(beta_j) = sigma^2 / [SST_j * (1 - R_j^2)]."}, {"id": "concept_endogeneity", "label": "Endogeneity (Endogeneidad)", "title": "<b>Endogeneity (Endogeneidad)</b><br><i>Concept</i><br>Situación en la cual un regresor está correlacionado con el término de error Cov(X, u) != 0 por variables omitidas, causalidad simultánea o error de medición.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Endogeneity (Endogeneidad)", "description": "Situación en la cual un regresor está correlacionado con el término de error Cov(X, u) != 0 por variables omitidas, causalidad simultánea o error de medición."}, {"id": "concept_confounder", "label": "Confounder (Confusor)", "title": "<b>Confounder (Confusor)</b><br><i>Concept</i><br>Causa común del tratamiento y del resultado que induce una correlación no causal entre ambos si no es ajustada.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Confounder (Confusor)", "description": "Causa común del tratamiento y del resultado que induce una correlación no causal entre ambos si no es ajustada."}, {"id": "concept_collider", "label": "Collider (Colisionador)", "title": "<b>Collider (Colisionador)</b><br><i>Concept</i><br>Variable que es efecto común directo de dos variables en un DAG causal. Ajustar por un colisionador abre un camino espurio y genera sesgo de selección.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Collider (Colisionador)", "description": "Variable que es efecto común directo de dos variables en un DAG causal. Ajustar por un colisionador abre un camino espurio y genera sesgo de selección."}, {"id": "concept_mediator", "label": "Mediator (Mediador)", "title": "<b>Mediator (Mediador)</b><br><i>Concept</i><br>Variable situada en la trayectoria causal intermedia entre el tratamiento y el resultado (X -> M -> Y) que transmite parte del efecto causal.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Mediator (Mediador)", "description": "Variable situada en la trayectoria causal intermedia entre el tratamiento y el resultado (X -> M -> Y) que transmite parte del efecto causal."}, {"id": "concept_selection_bias", "label": "Selection Bias (Sesgo de Selec...", "title": "<b>Selection Bias (Sesgo de Selección)</b><br><i>Concept</i><br>Distorsión que surge cuando la muestra disponible no es una muestra aleatoria de la población objetivo debido a mecanismos de autoselección o truncamiento incidental.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Selection Bias (Sesgo de Selección)", "description": "Distorsión que surge cuando la muestra disponible no es una muestra aleatoria de la población objetivo debido a mecanismos de autoselección o truncamiento incidental."}, {"id": "concept_ovb", "label": "Omitted Variable Bias (Sesgo d...", "title": "<b>Omitted Variable Bias (Sesgo de Variable Omitida)</b><br><i>Concept</i><br>Sesgo que surge cuando una variable relevante correlacionada con los regresores es excluida del modelo, absorbiendo su efecto en el término de error.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Omitted Variable Bias (Sesgo de Variable Omitida)", "description": "Sesgo que surge cuando una variable relevante correlacionada con los regresores es excluida del modelo, absorbiendo su efecto en el término de error."}, {"id": "concept_heteroscedasticity", "label": "Heteroscedasticity (Heteroceda...", "title": "<b>Heteroscedasticity (Heterocedasticidad)</b><br><i>Concept</i><br>Violación del supuesto clásico donde la varianza de los errores no es constante condicional a las covariables Var(u_i | X_i) != sigma^2.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Heteroscedasticity (Heterocedasticidad)", "description": "Violación del supuesto clásico donde la varianza de los errores no es constante condicional a las covariables Var(u_i | X_i) != sigma^2."}, {"id": "concept_serial_correlation", "label": "Serial Correlation (Autocorrel...", "title": "<b>Serial Correlation (Autocorrelación de Errores)</b><br><i>Concept</i><br>Dependencia lineal temporal entre perturbaciones de distintos periodos Cov(u_t, u_s) != 0, que subestima los errores estándar OLS.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Serial Correlation (Autocorrelación de Errores)", "description": "Dependencia lineal temporal entre perturbaciones de distintos periodos Cov(u_t, u_s) != 0, que subestima los errores estándar OLS."}, {"id": "concept_stationarity", "label": "Stationarity (Estacionariedad)", "title": "<b>Stationarity (Estacionariedad)</b><br><i>Concept</i><br>Propiedad estocástica donde la media, varianza y estructura de autocovarianzas son invariantes ante desplazamientos en el tiempo.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Stationarity (Estacionariedad)", "description": "Propiedad estocástica donde la media, varianza y estructura de autocovarianzas son invariantes ante desplazamientos en el tiempo."}, {"id": "concept_unit_root", "label": "Unit Root (Raíz Unitaria / I(1...", "title": "<b>Unit Root (Raíz Unitaria / I(1))</b><br><i>Concept</i><br>Proceso no estacionario con memoria infinita donde los shocks pasados tienen efectos permanentes en el nivel de la serie.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Unit Root (Raíz Unitaria / I(1))", "description": "Proceso no estacionario con memoria infinita donde los shocks pasados tienen efectos permanentes en el nivel de la serie."}, {"id": "concept_cointegration", "label": "Cointegration (Cointegración)", "title": "<b>Cointegration (Cointegración)</b><br><i>Concept</i><br>Existencia de una combinación lineal estacionaria I(0) entre dos o más series integradas de orden I(1), reflejando equilibrio a largo plazo.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Cointegration (Cointegración)", "description": "Existencia de una combinación lineal estacionaria I(0) entre dos o más series integradas de orden I(1), reflejando equilibrio a largo plazo."}, {"id": "concept_spatial_autocorrelation", "label": "Spatial Autocorrelation", "title": "<b>Spatial Autocorrelation</b><br><i>Concept</i><br>Dependencia geográfica donde el valor de una variable en una ubicación se asemeja sistemáticamente a los valores en ubicaciones vecinas.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Spatial Autocorrelation", "description": "Dependencia geográfica donde el valor de una variable en una ubicación se asemeja sistemáticamente a los valores en ubicaciones vecinas."}, {"id": "concept_spatial_spillover", "label": "Spatial Spillover (Desbordamie...", "title": "<b>Spatial Spillover (Desbordamiento Espacial)</b><br><i>Concept</i><br>Impacto donde una política o choque en una unidad geográfica vecina altera el resultado de la unidad local a través de la matriz W.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Spatial Spillover (Desbordamiento Espacial)", "description": "Impacto donde una política o choque en una unidad geográfica vecina altera el resultado de la unidad local a través de la matriz W."}, {"id": "concept_time_invariant_confounding", "label": "Time-Invariant Confounding", "title": "<b>Time-Invariant Confounding</b><br><i>Concept</i><br>Heterogeneidad no observada específica de cada entidad individual que se mantiene constante a lo largo del tiempo (ej. habilidad innata).", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Time-Invariant Confounding", "description": "Heterogeneidad no observada específica de cada entidad individual que se mantiene constante a lo largo del tiempo (ej. habilidad innata)."}, {"id": "concept_sequential_exogeneity", "label": "Sequential Exogeneity", "title": "<b>Sequential Exogeneity</b><br><i>Concept</i><br>Supuesto en paneles dinámicos donde el error contemporáneo es ortogonal a covariables pasadas y presentes, pero puede estar correlacionado con valores futuros (feedback).", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Sequential Exogeneity", "description": "Supuesto en paneles dinámicos donde el error contemporáneo es ortogonal a covariables pasadas y presentes, pero puede estar correlacionado con valores futuros (feedback)."}, {"id": "concept_overdispersion", "label": "Overdispersion (Sobredispersió...", "title": "<b>Overdispersion (Sobredispersión)</b><br><i>Concept</i><br>Fenómeno en datos de conteo donde la varianza empírica supera la media teórica, violando el supuesto de equidispersión de Poisson.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Overdispersion (Sobredispersión)", "description": "Fenómeno en datos de conteo donde la varianza empírica supera la media teórica, violando el supuesto de equidispersión de Poisson."}, {"id": "concept_binary_outcome", "label": "Binary Outcome (Respuesta Dico...", "title": "<b>Binary Outcome (Respuesta Dicotómica)</b><br><i>Concept</i><br>Variable cualitativa que toma valores 0 o 1, requiriendo modelos no lineales de probabilidad acumulada (Logit/Probit).", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Binary Outcome (Respuesta Dicotómica)", "description": "Variable cualitativa que toma valores 0 o 1, requiriendo modelos no lineales de probabilidad acumulada (Logit/Probit)."}, {"id": "concept_ordered_categories", "label": "Ordered Categorical Scale", "title": "<b>Ordered Categorical Scale</b><br><i>Concept</i><br>Variable cualitativa discreta con orden jerárquico inherente (escalas Likert: Bajo, Medio, Alto) sin distancias métricas uniformes.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Ordered Categorical Scale", "description": "Variable cualitativa discreta con orden jerárquico inherente (escalas Likert: Bajo, Medio, Alto) sin distancias métricas uniformes."}, {"id": "concept_nominal_categories", "label": "Nominal Multi-Category", "title": "<b>Nominal Multi-Category</b><br><i>Concept</i><br>Variable cualitativa discreta con más de dos categorías sin orden de prelación (ej. elección de carrera o transporte).", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Nominal Multi-Category", "description": "Variable cualitativa discreta con más de dos categorías sin orden de prelación (ej. elección de carrera o transporte)."}, {"id": "concept_effect_modification", "label": "Effect-Measure Modification & ...", "title": "<b>Effect-Measure Modification & Causal Interaction</b><br><i>Concept</i><br>Situación donde la magnitud o dirección del efecto causal de A sobre Y varía a través de los estratos de una tercera variable modificadora M.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Effect-Measure Modification & Causal Interaction", "description": "Situación donde la magnitud o dirección del efecto causal de A sobre Y varía a través de los estratos de una tercera variable modificadora M."}, {"id": "concept_precision_variable", "label": "Precision Variable (Ganancia d...", "title": "<b>Precision Variable (Ganancia de Eficiencia)</b><br><i>Concept</i><br>Variable que predice fuertemente el resultado Y pero no está correlacionada con el tratamiento A; incluirla no reduce sesgo pero reduce la varianza del estimador causal.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Precision Variable (Ganancia de Eficiencia)", "description": "Variable que predice fuertemente el resultado Y pero no está correlacionada con el tratamiento A; incluirla no reduce sesgo pero reduce la varianza del estimador causal."}, {"id": "method_ols", "label": "Ordinary Least Squares (OLS)", "title": "<b>Ordinary Least Squares (OLS)</b><br><i>Method</i><br>Estimador lineal clásico que minimiza la suma de residuos cuadráticos, siendo BLUE bajo los supuestos clásicos de Gauss-Markov.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Ordinary Least Squares (OLS)", "description": "Estimador lineal clásico que minimiza la suma de residuos cuadráticos, siendo BLUE bajo los supuestos clásicos de Gauss-Markov."}, {"id": "method_iv", "label": "Instrumental Variables / 2SLS", "title": "<b>Instrumental Variables / 2SLS</b><br><i>Method</i><br>Estimación bietápica que explota la variación exógena de un instrumento z que afecta la variable endógena x pero no tiene efecto directo sobre y.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Instrumental Variables / 2SLS", "description": "Estimación bietápica que explota la variación exógena de un instrumento z que afecta la variable endógena x pero no tiene efecto directo sobre y."}, {"id": "method_fixed_effects", "label": "Fixed Effects (Within Panel Es...", "title": "<b>Fixed Effects (Within Panel Estimator)</b><br><i>Method</i><br>Transformación intragrupos que resta la media temporal de cada entidad para eliminar la heterogeneidad individual no observable constante en el tiempo c_i.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Fixed Effects (Within Panel Estimator)", "description": "Transformación intragrupos que resta la media temporal de cada entidad para eliminar la heterogeneidad individual no observable constante en el tiempo c_i."}, {"id": "method_random_effects", "label": "Random Effects (GLS Panel)", "title": "<b>Random Effects (GLS Panel)</b><br><i>Method</i><br>Estimador por Mínimos Cuadrados Generalizados Factibles (FGLS) que asume que c_i es puramente aleatorio y ortogonal a las covariables.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Random Effects (GLS Panel)", "description": "Estimador por Mínimos Cuadrados Generalizados Factibles (FGLS) que asume que c_i es puramente aleatorio y ortogonal a las covariables."}, {"id": "method_dynamic_panel", "label": "Dynamic Panel GMM (Arellano-Bo...", "title": "<b>Dynamic Panel GMM (Arellano-Bond)</b><br><i>Method</i><br>Estimador GMM en diferencias y sistema que utiliza rezagos temporales de variables en niveles y diferencias como instrumentos para modelos autorregresivos.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Dynamic Panel GMM (Arellano-Bond)", "description": "Estimador GMM en diferencias y sistema que utiliza rezagos temporales de variables en niveles y diferencias como instrumentos para modelos autorregresivos."}, {"id": "method_did", "label": "Differences-in-Differences (Di...", "title": "<b>Differences-in-Differences (DiD)</b><br><i>Method</i><br>Diseño cuasiexperimental que compara la evolución temporal del resultado entre un grupo tratado y un control antes y después de una intervención.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Differences-in-Differences (DiD)", "description": "Diseño cuasiexperimental que compara la evolución temporal del resultado entre un grupo tratado y un control antes y después de una intervención."}, {"id": "method_rdd", "label": "Regression Discontinuity Desig...", "title": "<b>Regression Discontinuity Design (RDD)</b><br><i>Method</i><br>Diseño cuasiexperimental de asignación basada en un umbral de corte exógeno en una variable continua de asignación.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Regression Discontinuity Design (RDD)", "description": "Diseño cuasiexperimental de asignación basada en un umbral de corte exógeno en una variable continua de asignación."}, {"id": "method_heckman", "label": "Heckman Selection Model (Hecki...", "title": "<b>Heckman Selection Model (Heckit)</b><br><i>Method</i><br>Estimador en dos etapas que calcula la Razón Inversa de Mills (lambda) en una ecuación probit de selección y la incluye como regresor de control en la ecuación salarial.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Heckman Selection Model (Heckit)", "description": "Estimador en dos etapas que calcula la Razón Inversa de Mills (lambda) en una ecuación probit de selección y la incluye como regresor de control en la ecuación salarial."}, {"id": "method_tobit", "label": "Tobit Regression (Censored Reg...", "title": "<b>Tobit Regression (Censored Regression)</b><br><i>Method</i><br>Modelo econométrico de máxima verosimilitud para variables dependientes continuas censuradas a la izquierda (ej. gastos no negativos).", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Tobit Regression (Censored Regression)", "description": "Modelo econométrico de máxima verosimilitud para variables dependientes continuas censuradas a la izquierda (ej. gastos no negativos)."}, {"id": "method_poisson", "label": "Poisson Regression (GLM Count)", "title": "<b>Poisson Regression (GLM Count)</b><br><i>Method</i><br>Modelo lineal generalizado con enlace logarítmico para variables dependientes de conteo de eventos discretos.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Poisson Regression (GLM Count)", "description": "Modelo lineal generalizado con enlace logarítmico para variables dependientes de conteo de eventos discretos."}, {"id": "method_logit", "label": "Logit Regression", "title": "<b>Logit Regression</b><br><i>Method</i><br>Modelo de elección discreta binaria que mapea combinaciones lineales a probabilidades mediante la función logística acumulada.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Logit Regression", "description": "Modelo de elección discreta binaria que mapea combinaciones lineales a probabilidades mediante la función logística acumulada."}, {"id": "method_probit", "label": "Probit Regression", "title": "<b>Probit Regression</b><br><i>Method</i><br>Modelo de elección discreta binaria que utiliza la función de distribución acumulada normal estándar Phi(z).", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Probit Regression", "description": "Modelo de elección discreta binaria que utiliza la función de distribución acumulada normal estándar Phi(z)."}, {"id": "method_ordinal_logit", "label": "Ordinal Logit (POLR)", "title": "<b>Ordinal Logit (POLR)</b><br><i>Method</i><br>Modelo logit acumulativo que estima umbrales de corte latentes para respuestas ordenadas bajo el supuesto de líneas paralelas.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Ordinal Logit (POLR)", "description": "Modelo logit acumulativo que estima umbrales de corte latentes para respuestas ordenadas bajo el supuesto de líneas paralelas."}, {"id": "method_multinomial_logit", "label": "Multinomial Logit", "title": "<b>Multinomial Logit</b><br><i>Method</i><br>Modelo de elección discreta para variables dependientes cualitativas con más de dos alternativas nominales no ordenadas.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Multinomial Logit", "description": "Modelo de elección discreta para variables dependientes cualitativas con más de dos alternativas nominales no ordenadas."}, {"id": "method_iptw", "label": "Inverse Probability of Treatme...", "title": "<b>Inverse Probability of Treatment Weighting (IPTW)</b><br><i>Method</i><br>Pondera a cada individuo por el inverso de su propensión estimada de recibir el tratamiento observado, creando una pseudopoblación sintética balanceada.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Inverse Probability of Treatment Weighting (IPTW)", "description": "Pondera a cada individuo por el inverso de su propensión estimada de recibir el tratamiento observado, creando una pseudopoblación sintética balanceada."}, {"id": "method_aipw", "label": "Augmented IPTW / AIPW (Doubly ...", "title": "<b>Augmented IPTW / AIPW (Doubly Robust)</b><br><i>Method</i><br>Estimador causal semiparamétrico que combina el modelo de propensión con el de resultados; es consistente si al menos uno está bien especificado.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Augmented IPTW / AIPW (Doubly Robust)", "description": "Estimador causal se verage the K test errors for final estimate."}, {"id": "method_loocv", "label": "Leave-One-Out Cross-Validation...", "title": "<b>Leave-One-Out Cross-Validation (LOOCV)</b><br><i>Method</i><br>Special case of K-fold CV where K=n. Each observation is used once as test set.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Leave-One-Out Cross-Validation (LOOCV)", "description": "Special case of K-fold CV where K=n. Each observation is used once as test set."}, {"id": "method_bootstrap", "label": "Bootstrap", "title": "<b>Bootstrap</b><br><i>Method</i><br>Resampling method that draws samples with replacement from the original data. Used to estimate standard errors and confidence intervals.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Bootstrap", "description": "Resampling method that draws samples with replacement from the original data. Used to estimate standard errors and confidence intervals."}, {"id": "method_subset_selection", "label": "Best Subset Selection", "title": "<b>Best Subset Selection</b><br><i>Method</i><br>Fit all possible models with subsets of predictors, select best by criterion (AIC, BIC, Cp, adjusted R²). Computationally expensive for p > 40.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Best Subset Selection", "description": "Fit all possible models with subsets of predictors, select best by criterion (AIC, BIC, Cp, adjusted R²). Computationally expensive for p > 40."}, {"id": "method_forward_selection", "label": "Forward Stepwise Selection", "title": "<b>Forward Stepwise Selection</b><br><i>Method</i><br>Start with null model, add predictor that most improves fit at each step. Less computationally expensive than best subset.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Forward Stepwise Selection", "description": "Start with null model, add predictor that most improves fit at each step. Less computationally expensive than best subset."}, {"id": "method_backward_selection", "label": "Backward Stepwise Selection", "title": "<b>Backward Stepwise Selection</b><br><i>Method</i><br>Start with full model, remove least significant predictor at each step until stopping criterion is met.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Backward Stepwise Selection", "description": "Start with full model, remove least significant predictor at each step until stopping criterion is met."}, {"id": "method_ridge_regression", "label": "Ridge Regression (L2 Regulariz...", "title": "<b>Ridge Regression (L2 Regularization)</b><br><i>Method</i><br>Adds penalty λΣβⱼ² to RSS. Shrinks coefficients toward zero but never exactly zero. Good for multicollinearity.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Ridge Regression (L2 Regularization)", "description": "Adds penalty λΣβⱼ² to RSS. Shrinks coefficients toward zero but never exactly zero. Good for multicollinearity."}, {"id": "method_lasso", "label": "Lasso (L1 Regularization)", "title": "<b>Lasso (L1 Regularization)</b><br><i>Method</i><br>Adds penalty λΣ|βⱼ| to RSS. Can shrink coefficients exactly to zero, performing variable selection.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Lasso (L1 Regularization)", "description": "Adds penalty λΣ|βⱼ| to RSS. Can shrink coefficients exactly to zero, performing variable selection."}, {"id": "method_elastic_net", "label": "Elastic Net", "title": "<b>Elastic Net</b><br><i>Method</i><br>Combines L1 and L2 penalties: λ[(1-α)Σβⱼ²/2 + αΣ|βⱼ|]. α controls mix (0=ridge, 1=lasso).", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Elastic Net", "description": "Combines L1 and L2 penalties: λ[(1-α)Σβⱼ²/2 + αΣ|βⱼ|]. α controls mix (0=ridge, 1=lasso)."}, {"id": "method_pcr", "label": "Principal Components Regressio...", "title": "<b>Principal Components Regression (PCR)</b><br><i>Method</i><br>Reduce predictors to M principal components, then regress Y on those components. Unsupervised dimension reduction followed by regression.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Principal Components Regression (PCR)", "description": "Reduce predictors to M principal components, then regress Y on those components. Unsupervised dimension reduction followed by regression."}, {"id": "method_pls", "label": "Partial Least Squares (PLS)", "title": "<b>Partial Least Squares (PLS)</b><br><i>Method</i><br>Similar to PCR but components are chosen to maximize covariance with Y. Supervised dimension reduction.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Partial Least Squares (PLS)", "description": "Similar to PCR but components are chosen to maximize covariance with Y. Supervised dimension reduction."}, {"id": "method_logistic_regression", "label": "Logistic Regression", "title": "<b>Logistic Regression</b><br><i>Method</i><br>Classification method modeling P(Y=1|X) using logistic function. Coefficients interpreted as log-odds ratios.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Logistic Regression", "description": "Classification method modeling P(Y=1|X) using logistic function. Coefficients interpreted as log-odds ratios."}, {"id": "method_lda", "label": "Linear Discriminant Analysis (...", "title": "<b>Linear Discriminant Analysis (LDA)</b><br><i>Method</i><br>Classification assuming each class has Gaussian distribution with shared covariance matrix. Estimates class priors and means.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Linear Discriminant Analysis (LDA)", "description": "Classification assuming each class has Gaussian distribution with shared covariance matrix. Estimates class priors and means."}, {"id": "method_qda", "label": "Quadratic Discriminant Analysi...", "title": "<b>Quadratic Discriminant Analysis (QDA)</b><br><i>Method</i><br>Like LDA but allows each class to have its own covariance matrix. More flexible but more parameters to estimate.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Quadratic Discriminant Analysis (QDA)", "description": "Like LDA but allows each class to have its own covariance matrix. More flexible but more parameters to estimate."}, {"id": "method_naive_bayes", "label": "Naive Bayes Classifier", "title": "<b>Naive Bayes Classifier</b><br><i>Method</i><br>Assumes conditional independence of predictors given class. Despite naive assumption, often works well in practice.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Naive Bayes Classifier", "description": "Assumes conditional independence of predictors given class. Despite naive assumption, often works well in practice."}, {"id": "method_knn", "label": "K-Nearest Neighbors (KNN)", "title": "<b>K-Nearest Neighbors (KNN)</b><br><i>Method</i><br>Non-parametric method: classify based on majority vote of K nearest neighbors. Can also be used for regression (average of neighbors).", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "K-Nearest Neighbors (KNN)", "description": "Non-parametric method: classify based on majority vote of K nearest neighbors. Can also be used for regression (average of neighbors)."}, {"id": "method_decision_tree", "label": "Decision Tree (CART)", "title": "<b>Decision Tree (CART)</b><br><i>Method</i><br>Recursive binary splitting of predictor space. Interpretable but prone to overfitting. Basis for ensemble methods.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Decision Tree (CART)", "description": "Recursive binary splitting of predictor space. Interpretable but prone to overfitting. Basis for ensemble methods."}, {"id": "method_bagging", "label": "Bagging (Bootstrap Aggregating...", "title": "<b>Bagging (Bootstrap Aggregating)</b><br><i>Method</i><br>Average predictions from many trees, each trained on bootstrap sample. Reduces variance of decision trees.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Bagging (Bootstrap Aggregating)", "description": "Average predictions from many trees, each trained on bootstrap sample. Reduces variance of decision trees."}, {"id": "method_random_forest", "label": "Random Forest", "title": "<b>Random Forest</b><br><i>Method</i><br>Bagging with random feature selection at each split. Decorrelates trees, reducing variance further.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Random Forest", "description": "Bagging with random feature selection at each split. Decorrelates trees, reducing variance further."}, {"id": "method_boosting", "label": "Gradient Boosting", "title": "<b>Gradient Boosting</b><br><i>Method</i><br>Sequentially fit trees to residuals, slowly learning. Each tree is small (weak learner). Powerful but can overfit.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Gradient Boosting", "description": "Sequentially fit trees to residuals, slowly learning. Each tree is small (weak learner). Powerful but can overfit."}, {"id": "method_xgboost", "label": "XGBoost", "title": "<b>XGBoost</b><br><i>Method</i><br>Optimized gradient boosting with regularization, parallel processing, and handling of missing values. State-of-the-art for tabular data.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "XGBoost", "description": "Optimized gradient boosting with regularization, parallel processing, and handling of missing values. State-of-the-art for tabular data."}, {"id": "method_svm", "label": "Support Vector Machine (SVM)", "title": "<b>Support Vector Machine (SVM)</b><br><i>Method</i><br>Find hyperplane that maximizes margin between classes. Kernel trick allows non-linear boundaries.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Support Vector Machine (SVM)", "description": "Find hyperplane that maximizes margin between classes. Kernel trick allows non-linear boundaries."}, {"id": "method_svm_kernel", "label": "Kernel Functions", "title": "<b>Kernel Functions</b><br><i>Concept</i><br>Functions that compute inner products in high-dimensional feature space without explicit transformation. Common kernels: linear, polynomial, radial basis function (RBF).", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Kernel Functions", "description": "Functions that compute inner products in high-dimensional feature space without explicit transformation. Common kernels: linear, polynomial, radial basis function (RBF)."}, {"id": "method_kmeans", "label": "K-Means Clustering", "title": "<b>K-Means Clustering</b><br><i>Method</i><br>Partition n observations into K clusters by minimizing within-cluster sum of squares. Iteratively assigns points and updates centroids.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "K-Means Clustering", "description": "Partition n observations into K clusters by minimizing within-cluster sum of squares. Iteratively assigns points and updates centroids."}, {"id": "method_hierarchical_clustering", "label": "Hierarchical Clustering", "title": "<b>Hierarchical Clustering</b><br><i>Method</i><br>Build tree of clusters by iteratively merging (agglomerative) or splitting (divisive). No need to specify K in advance.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Hierarchical Clustering", "description": "Build tree of clusters by iteratively merging (agglomerative) or splitting (divisive). No need to specify K in advance."}, {"id": "concept_linkage_methods", "label": "Linkage Methods for Hierarchic...", "title": "<b>Linkage Methods for Hierarchical Clustering</b><br><i>Concept</i><br>Methods to measure distance between clusters: Complete (maximum pairwise), Single (minimum), Average, Ward (minimize within-cluster variance).", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Linkage Methods for Hierarchical Clustering", "description": "Methods to measure distance between clusters: Complete (maximum pairwise), Single (minimum), Average, Ward (minimize within-cluster variance)."}, {"id": "method_pca", "label": "Principal Component Analysis (...", "title": "<b>Principal Component Analysis (PCA)</b><br><i>Method</i><br>Linear dimensionality reduction finding orthogonal directions of maximum variance. First PC explains most variance, second is orthogonal and explains next most, etc.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Principal Component Analysis (PCA)", "description": "Linear dimensionality reduction finding orthogonal directions of maximum variance. First PC explains most variance, second is orthogonal and explains next most, etc."}, {"id": "concept_scree_plot", "label": "Scree Plot", "title": "<b>Scree Plot</b><br><i>Concept</i><br>Plot of variance explained vs. number of principal components. Used to choose number of components by looking for elbow.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Scree Plot", "description": "Plot of variance explained vs. number of principal components. Used to choose number of components by looking for elbow."}, {"id": "concept_confusion_matrix", "label": "Confusion Matrix", "title": "<b>Confusion Matrix</b><br><i>Concept</i><br>Table showing True Positives, False Positives, True Negatives, False Negatives for a classifier.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Confusion Matrix", "description": "Table showing True Positives, False Positives, True Negatives, False Negatives for a classifier."}, {"id": "concept_roc_curve", "label": "ROC Curve and AUC", "title": "<b>ROC Curve and AUC</b><br><i>Concept</i><br>Receiver Operating Characteristic curve plots True Positive Rate vs False Positive Rate at various thresholds. AUC (Area Under Curve) summarizes overall performance.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "ROC Curve and AUC", "description": "Receiver Operating Characteristic curve plots True Positive Rate vs False Positive Rate at various thresholds. AUC (Area Under Curve) summarizes overall performance."}, {"id": "concept_mse", "label": "Mean Squared Error (MSE)", "title": "<b>Mean Squared Error (MSE)</b><br><i>Concept</i><br>Average of squared differences between predicted and actual values: MSE = Σ(yᵢ - ŷᵢ)²/n", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Mean Squared Error (MSE)", "description": "Average of squared differences between predicted and actual values: MSE = Σ(yᵢ - ŷᵢ)²/n"}, {"id": "concept_r_squared", "label": "R-Squared (Coefficient of Dete...", "title": "<b>R-Squared (Coefficient of Determination)</b><br><i>Concept</i><br>Proportion of variance in Y explained by the model: R² = 1 - RSS/TSS", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "R-Squared (Coefficient of Determination)", "description": "Proportion of variance in Y explained by the model: R² = 1 - RSS/TSS"}, {"id": "concept_aic_bic", "label": "AIC and BIC", "title": "<b>AIC and BIC</b><br><i>Concept</i><br>Model selection criteria balancing fit and complexity. AIC = -2logL + 2p. BIC = -2logL + p*log(n). Lower is better.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "AIC and BIC", "description": "Model selection criteria balancing fit and complexity. AIC = -2logL + 2p. BIC = -2logL + p*log(n). Lower is better."}, {"id": "concept_cp_mallows", "label": "Mallows' Cp", "title": "<b>Mallows' Cp</b><br><i>Concept</i><br>Model selection criterion: Cp = (RSS + 2dσ̂²)/n where d is number of predictors. Estimates test MSE.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Mallows' Cp", "description": "Model selection criterion: Cp = (RSS + 2dσ̂²)/n where d is number of predictors. Estimates test MSE."}, {"id": "method_splines", "label": "Splines (Regression Splines)", "title": "<b>Splines (Regression Splines)</b><br><i>Method</i><br>Piecewise polynomial functions with continuity constraints at knots. More flexible than polynomials, less prone to boundary issues.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Splines (Regression Splines)", "description": "Piecewise polynomial functions with continuity constraints at knots. More flexible than polynomials, less prone to boundary issues."}, {"id": "method_gam", "label": "Generalized Additive Models (G...", "title": "<b>Generalized Additive Models (GAM)</b><br><i>Method</i><br>Extend linear models allowing non-linear functions of each predictor while maintaining additivity: Y = α + f₁(X₁) + f₂(X₂) + ...", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Generalized Additive Models (GAM)", "description": "Extend linear models allowing non-linear functions of each predictor while maintaining additivity: Y = α + f₁(X₁) + f₂(X₂) + ..."}, {"id": "method_local_regression", "label": "Local Regression (LOESS/LOWESS...", "title": "<b>Local Regression (LOESS/LOWESS)</b><br><i>Method</i><br>Fit weighted regression at each point using nearby observations. Span parameter controls smoothness.", "color": {"background": "#7ea8be", "border": "#7ea8be", "highlight": {"background": "#fff", "border": "#7ea8be"}}, "font": {"color": "#fff", "size": 11}, "shape": "box", "size": 10, "type": "Method", "fullName": "Local Regression (LOESS/LOWESS)", "description": "Fit weighted regression at each point using nearby observations. Span parameter controls smoothness."}, {"id": "concept_curse_dimensionality", "label": "Curse of Dimensionality", "title": "<b>Curse of Dimensionality</b><br><i>Concept</i><br>As dimensions increase, data becomes increasingly sparse. Distance-based methods suffer because all points become equidistant in high dimensions.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Curse of Dimensionality", "description": "As dimensions increase, data becomes increasingly sparse. Distance-based methods suffer because all points become equidistant in high dimensions."}, {"id": "concept_overfitting", "label": "Overfitting", "title": "<b>Overfitting</b><br><i>Concept</i><br>Model fits training data too closely, capturing noise rather than signal. Results in poor generalization to new data.", "color": {"background": "#d9ab7e", "border": "#d9ab7e", "highlight": {"background": "#fff", "border": "#d9ab7e"}}, "font": {"color": "#fff", "size": 11}, "shape": "dot", "size": 10, "type": "Concept", "fullName": "Overfitting", "description": "Model fits training data too closely, capturing noise rather than signal. Results in poor generalization to new data."}, {"id": "concept_underfitting", "label": "Underfitting", "title": "<b>Underfitting</b><br><i>Concept</i><br>Model is too simple to capture underlying patterns. Both training and test error are high.", "color": const nodes = new vis.DataSet(nodesData);
const edges = new vis.DataSet(edgesData);

const container = document.getElementById('network');
const data = { nodes, edges };
const options = {
  physics: {
    enabled: true,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -50,
      centralGravity: 0.01,
      springLength: 100,
      springConstant: 0.08
    },
    stabilization: { iterations: 150 }
  },
  interaction: {
    hover: true,
    tooltipDelay: 100,
    zoomView: true,
    dragView: true
  },
  nodes: {
    borderWidth: 2,
    shadow: true
  },
  edges: {
    width: 1,
    shadow: false
  }
};

const network = new vis.Network(container, data, options);

// Render node list
const nodeList = document.getElementById('node-list');
const sortedNodes = [...nodesData].sort((a, b) => a.fullName.localeCompare(b.fullName));

sortedNodes.forEach(node => {
  const div = document.createElement('div');
  div.className = 'node-item';
  div.innerHTML = `
    <div class="node-item-name" style="color:${node.color.background}">${node.fullName}</div>
    <div class="node-item-type">${node.type}</div>
  `;
  div.onclick = () => {
    network.focus(node.id, { scale: 1.5, animation: true });
    network.selectNodes([node.id]);
    showDetail(node);
  };
  nodeList.appendChild(div);
});

// Search
document.getElementById('search').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase();
  document.querySelectorAll('.node-item').forEach(item => {
    const name = item.querySelector('.node-item-name').textContent.toLowerCase();
    item.style.display = name.includes(query) ? '' : 'none';
  });
});

// Show detail
function showDetail(node) {
  document.getElementById('detail-panel').style.display = 'block';
  document.getElementById('detail-name').textContent = node.fullName;
  document.getElementById('detail-name').style.color = node.color.background;
  document.getElementById('detail-desc').textContent = node.description || 'Sin descripción';
}

network.on('click', (params) => {
  if (params.nodes.length > 0) {
    const node = nodesData.find(n => n.id === params.nodes[0]);
    if (node) showDetail(node);
  }
});

let physicsEnabled = true;
function togglePhysics() {
  physicsEnabled = !physicsEnabled;
  network.setOptions({ physics: { enabled: physicsEnabled } });
}

let currentTypeFilter = null;
const types = [...new Set(nodesData.map(n => n.type))];
function filterByType() {
  const idx = currentTypeFilter === null ? 0 : (types.indexOf(currentTypeFilter) + 1) % (types.length + 1);
  currentTypeFilter = idx === types.length ? null : types[idx];
  
  if (currentTypeFilter === null) {
    nodes.update(nodesData.map(n => ({ id: n.id, hidden: false })));
  } else {
    nodes.update(nodesData.map(n => ({ id: n.id, hidden: n.type !== currentTypeFilter })));
  }
}
